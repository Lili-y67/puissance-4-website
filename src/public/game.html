<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — Partie</title>
<link rel="icon" type="image/png" href="/assets/site-logo-small.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg:       #06060e;
  --surface:  #0d0d1c;
  --surface2: #13132a;
  --border:   rgba(255,255,255,0.06);
  --p1:       #ff2d55;
  --p1-glow:  rgba(255,45,85,0.45);
  --p1-dim:   rgba(255,45,85,0.15);
  --p2:       #ffd60a;
  --p2-glow:  rgba(255,214,10,0.45);
  --p2-dim:   rgba(255,214,10,0.12);
  --text:     #eeeef5;
  --muted:    rgba(238,238,245,0.38);
  --accent:   #4c6ef5;
  --grid:     #0a0a18;
  --cell:     #07071a;
  --glass:    rgba(18,18,36,0.72);
  --glass2:   rgba(255,255,255,0.035);
  --cyan:     #85EBFF;
  --violet:   #9b7cff;
  --shadow:   0 28px 90px rgba(0,0,0,0.42);
  --board-a:  #ff4f35;
  --board-b:  #32c4ff;
  --board-c:  #9b7cff;
  --board-a-soft: rgba(255,79,53,.34);
  --board-b-soft: rgba(50,196,255,.32);
  --board-c-soft: rgba(155,124,255,.16);
}
html, body { height: 100%; background: var(--bg); background-attachment: fixed; color: var(--text); font-family: 'Barlow', sans-serif; overflow-x: hidden; }
img,canvas,svg{max-width:100%}
body {
  background:
    radial-gradient(circle at 18% 12%, rgba(255,45,85,0.14), transparent 32%),
    radial-gradient(circle at 82% 18%, rgba(133,235,255,0.11), transparent 34%),
    radial-gradient(circle at 50% 95%, rgba(255,214,10,0.08), transparent 30%),
    linear-gradient(180deg, #070713 0%, #05050d 58%, #080812 100%);
}

.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(circle at center, black 0%, black 58%, transparent 96%);
}
.scanlines {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
}

.page { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; gap: 16px; }

/* ── Header ── */
.top-bar {
  width: 100%;
  max-width: 880px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.10);
  background:
    linear-gradient(135deg, rgba(255,255,255,0.08), transparent 42%),
    linear-gradient(180deg, rgba(18,18,38,0.88), rgba(8,8,20,0.82));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
}
.logo-sm { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display:inline-flex; align-items:center; gap:10px; }
.logo-sm::before{content:"";width:40px;height:40px;border-radius:12px;background:url('/assets/site-logo-small.png') center/cover no-repeat;border:1px solid rgba(255,255,255,.1)}
.logo-sm span { color: var(--p1); text-shadow: 0 0 20px var(--p1-glow); }
.btn-quit {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; padding: 10px 16px; border-radius: 14px;
  background: rgba(255,45,85,0.06); border: 1px solid rgba(255,45,85,0.22); color: #ff8198; cursor: pointer; transition: all 0.2s;
}
.btn-quit:hover { border-color: var(--p1); color: #fff; background: rgba(255,45,85,0.18); transform: translateY(-1px); }

/* ── Lobby overlay ── */
.lobby-overlay {
  position: fixed; inset: 0; z-index: 100;
  background:
    radial-gradient(circle at 30% 35%, rgba(255,45,85,0.18), transparent 32%),
    radial-gradient(circle at 72% 38%, rgba(255,214,10,0.12), transparent 30%),
    rgba(6,6,14,0.96);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 28px; backdrop-filter: blur(4px);
}
.lobby-overlay.hidden { display: none; }

.lobby-players { display: grid; grid-template-columns: 1fr 92px 1fr; gap: 20px; align-items: center; width: 100%; max-width: 680px; }
.lobby-player {
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025)); border: 1px solid var(--border); border-radius: 26px;
  padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: all 0.4s; position:relative; overflow:hidden;
  box-shadow: 0 26px 70px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.08);
  animation: lobby-card-in .55s cubic-bezier(.22,1,.36,1) both;
}
.lobby-player::before{content:"";position:absolute;inset:-1px;opacity:.55;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 36%,rgba(255,255,255,.04))}
.lobby-player.p1 { border-color: rgba(255,45,85,.46); box-shadow: 0 0 32px var(--p1-dim), 0 26px 70px rgba(0,0,0,0.40); }
.lobby-player.p2 { border-color: rgba(255,214,10,.42); box-shadow: 0 0 32px var(--p2-dim), 0 26px 70px rgba(0,0,0,0.40); animation-delay:.08s; }
@keyframes lobby-card-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.lobby-avatar-wrap{position:relative;width:68px;height:68px}
.lobby-avatar-decoration{position:absolute;inset:-10px;z-index:3;pointer-events:none;display:none}
.lobby-avatar-decoration img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 10px rgba(255,255,255,.18))}
.lobby-avatar-wrap.has-decoration .lobby-avatar-decoration{display:block}
.lobby-avatar {
  width: 68px; height: 68px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900;
  transition: all 0.3s; position:relative; z-index:1; overflow:hidden;
}
.lobby-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.lobby-player.p1 .lobby-avatar { background: var(--p1-dim); color: var(--p1); border: 2px solid var(--p1); }
.lobby-player.p2 .lobby-avatar { background: var(--p2-dim); color: var(--p2); border: 2px solid var(--p2); }

.lobby-info{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px 0}
.lobby-pseudo { position:relative;z-index:1;font-family:'Barlow Condensed',sans-serif;font-weight: 900; font-size: 22px; letter-spacing:1px; text-align: center; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 10px; }
.lobby-elo { position:relative;z-index:1;font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
.lobby-you { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; border-radius: 4px; }
.lobby-player.p1 .lobby-you { background: var(--p1-dim); color: var(--p1); }
.lobby-player.p2 .lobby-you { background: var(--p2-dim); color: var(--p2); }

.vs-col { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vs-text { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; color: var(--muted); letter-spacing: 4px; }
.countdown {
  font-family: 'Barlow Condensed', sans-serif; font-size: 72px; font-weight: 900; letter-spacing: 2px; line-height: 1;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: pulse-c 1s ease-in-out infinite;
  filter: drop-shadow(0 0 24px rgba(255,45,85,.22));
}
@keyframes pulse-c { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* ── Player cards ── */
.players-row {
  width: 100%;
  max-width: 880px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 12px;
  align-items: stretch;
}
.player-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)); border: 1.5px solid var(--border); border-radius: 22px;
  padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  transition: all 0.3s; position: relative; overflow: hidden;
  min-height: 96px;
  box-shadow: 0 20px 54px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.06);
}
.player-card::before{content:"";position:absolute;inset:0;opacity:.65;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 42%)}
.player-card::after { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.player-card.p1::after { background: radial-gradient(circle at 14% 50%, var(--p1-dim), transparent 55%); }
.player-card.p2::after { background: radial-gradient(circle at 86% 50%, var(--p2-dim), transparent 55%); }
.player-card.active::after { opacity: 1; }
.player-card.active{transform:translateY(-2px)}
.player-card.p1.active { border-color: rgba(255,45,85,.58); box-shadow: 0 0 0 1px rgba(255,45,85,.16), 0 24px 70px rgba(255,45,85,.12), 0 20px 54px rgba(0,0,0,0.34); }
.player-card.p2.active { border-color: rgba(255,214,10,.54); box-shadow: 0 0 0 1px rgba(255,214,10,.14), 0 24px 70px rgba(255,214,10,.10), 0 20px 54px rgba(0,0,0,0.34); }

.pc-avatar-wrap{position:relative;width:46px;height:46px;flex-shrink:0;z-index:1}
.pc-avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;position:relative;z-index:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.pc-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pc-avatar-decoration{position:absolute;inset:-7px;z-index:3;pointer-events:none;display:none}
.pc-avatar-decoration img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 8px rgba(255,255,255,.16))}
.pc-avatar-wrap.has-decoration .pc-avatar-decoration{display:block}
.pc-dot { position:relative;z-index:1;width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; transition: all 0.3s; }
.player-card.active .pc-dot{animation:turn-dot 1.1s ease-in-out infinite}
@keyframes turn-dot{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.35);filter:brightness(1.3)}}
.player-card.p1 .pc-dot { background: var(--p1); box-shadow: 0 0 8px var(--p1-glow); }
.player-card.p2 .pc-dot { background: var(--p2); box-shadow: 0 0 8px var(--p2-glow); }

.pc-info { position:relative; flex: 1; min-width: 0; display:flex; flex-direction:column; justify-content:center; padding:0 8px 0 0; }
.pc-name { position:relative; z-index:1; font-family:'Barlow Condensed',sans-serif; font-weight: 900; font-size: 22px; letter-spacing:1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding:0 10px; }
.pc-elo  { position:relative; z-index:1; font-size: 12px; font-weight:600; color: var(--muted); padding:0 10px; }
.turn-mid {
  text-align: center;
  min-width: 132px;
  padding: 12px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.10);
  background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018));
  box-shadow: 0 18px 48px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.vs-sm { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; color: var(--text); letter-spacing: 2px; }
.turn-lbl { font-size: 11px; color: var(--cyan); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; font-weight:800; }
.turn-timer { margin-top: 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--accent); display: none; }
.turn-timer.show { display: block; }
.turn-timer.danger { color: var(--p1); }
.turn-badge {
  margin-top: 6px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid rgba(76,110,245,0.28);
  background: rgba(76,110,245,0.1);
  color: #8b9cf4;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.turn-badge.show { display: inline-flex; }

/* ── Status ── */
.status-bar {
  width: 100%;
  max-width: 880px;
  min-height: 42px;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.035);
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.game-id-badge { font-size: 11px; letter-spacing: 1px; color: var(--muted); font-family: monospace; padding: 6px 10px; background: rgba(255,255,255,0.045); border: 1px solid var(--border); border-radius: 999px; cursor: default; }
.disconnect-banner { display: none; position: fixed; top: 12px; left: 50%; right: auto; transform:translateX(-50%); z-index: 999; background: rgba(255,159,10,0.95); color: #110900; text-align: center; padding: 10px 16px; border-radius:999px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 1px; box-shadow:0 18px 44px rgba(255,159,10,.20); }
.disconnect-banner.show { display: flex; align-items: center; justify-content: center; gap: 10px; }
.disconnect-timer { font-size: 20px; font-weight: 900; min-width: 24px; }
.status-bar.thinking { color: var(--accent); }
.dots span { animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

/* ── Tchat & actions ── */
.game-social {
  width: 100%;
  max-width: 880px ;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr);
  gap: 12px;
}
.game-panel {
  min-width: 0;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.09);
  background:
    linear-gradient(145deg, rgba(255,255,255,.06), transparent 36%),
    rgba(12,12,28,.72);
  box-shadow: 0 18px 52px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter: blur(16px);
}
.game-chat { display: grid; grid-template-rows: auto minmax(110px, 150px) auto; overflow: hidden; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
}
.panel-chip {
  font-size: 10px; letter-spacing: 1px; color: var(--cyan);
  border: 1px solid rgba(133,235,255,.22); background: rgba(133,235,255,.08);
  border-radius: 999px; padding: 4px 8px;
}
.chat-log {
  padding: 6px 14px 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
  scrollbar-width: thin;
}
.chat-line {
  display: grid;
  gap: 2px;
  padding: 8px 10px;
  border-radius: 14px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.055);
}
.chat-line.mine { background: color-mix(in srgb, var(--p1-dim) 72%, rgba(255,255,255,.035)); border-color: color-mix(in srgb, var(--p1) 24%, transparent); }
.chat-line.system { background: rgba(133,235,255,.06); border-color: rgba(133,235,255,.14); }
.chat-author {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--cyan);
  text-transform: uppercase;
}
.chat-text { color: rgba(238,238,245,.84); font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.chat-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.chat-form input {
  min-width: 0;
  border: 1px solid rgba(255,255,255,.09);
  background: rgba(255,255,255,.04);
  color: var(--text);
  border-radius: 14px;
  padding: 11px 12px;
  outline: none;
  font: inherit;
}
.chat-form input:focus { border-color: rgba(133,235,255,.34); box-shadow: 0 0 0 3px rgba(133,235,255,.07); }
.mini-btn {
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.045);
  color: var(--text);
  border-radius: 14px;
  padding: 10px 12px;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  transition: transform .16s, border-color .16s, background .16s;
}
.mini-btn:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(133,235,255,.32); background: rgba(133,235,255,.08); }
.mini-btn:disabled { opacity: .42; cursor: not-allowed; }
.game-actions { padding: 12px; display: grid; gap: 10px; align-content: start; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-btn {
  min-height: 48px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.09);
  background: rgba(255,255,255,.04);
  color: var(--text);
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  transition: transform .16s, border-color .16s, background .16s, opacity .16s;
}
.action-btn:hover:not(:disabled) { transform: translateY(-1px); }
.action-btn.draw { color: #ffd60a; border-color: rgba(255,214,10,.20); }
.action-btn.draw:hover:not(:disabled) { background: rgba(255,214,10,.08); }
.action-btn.resign { color: #ff8198; border-color: rgba(255,45,85,.22); }
.action-btn.resign:hover:not(:disabled) { background: rgba(255,45,85,.09); }
.action-btn.rematch { color: var(--cyan); border-color: rgba(133,235,255,.22); }
.action-btn.rematch:hover:not(:disabled) { background: rgba(133,235,255,.08); }
.action-btn:disabled { opacity: .38; cursor: not-allowed; }
.action-offer {
  display: none;
  gap: 8px;
  padding: 10px;
  border-radius: 16px;
  background: rgba(255,214,10,.07);
  border: 1px solid rgba(255,214,10,.18);
}
.action-offer.show { display: grid; }
.offer-text { font-size: 13px; color: rgba(238,238,245,.82); line-height: 1.25; }
.offer-buttons { display: flex; gap: 8px; }
.offer-buttons .mini-btn { flex: 1; }
@media (max-width: 760px) {
  .game-social { grid-template-columns: 1fr; }
  .game-chat { grid-template-rows: auto minmax(90px, 130px) auto; }
}

/* ── Board ── */
.board-wrap { position: relative; width:100%; display:flex; flex-direction:column; align-items:center; --board-max:620px; --board-gap:clamp(4px,1.35vw,8px); --board-pad:clamp(8px,2vw,14px); }
.col-buttons { display: grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap: var(--board-gap); margin: 0 auto 8px; width:min(100%, var(--board-max)); padding:0 var(--board-pad); }
.col-btn {
  width:100%; min-width:0; height: 32px; border: 1px solid transparent; background: rgba(255,255,255,0.025); cursor: pointer;
  border-radius: 12px; transition: all 0.15s; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.col-btn::after { content: '▼'; font-size: 13px; color: var(--muted); opacity: 0; transition: all 0.15s; }
.col-btn:not(:disabled):hover::after { opacity: 1; color: var(--text); transform: translateY(2px); }
.col-btn:not(:disabled):hover { background: rgba(255,255,255,0.08); border-color:rgba(255,255,255,.14); }
.col-btn:disabled { cursor: not-allowed; }
.board.locked .cell { pointer-events: none; }
.board.locked .col-btn { pointer-events: none; }

.board {
  width:min(100%, var(--board-max));
  aspect-ratio:7/6;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.07), transparent 28%),
    linear-gradient(180deg, #11112a, #070716);
  border-radius: 28px; padding: 14px;
  border: 1px solid rgba(255,255,255,0.10);

.cell {
  border-radius: 50%;

    radial-gradient(circle at 35% 35%, rgba(255,255,255,0.08), rgba(7,7,26,0.96) 70%);
  cursor: pointer;
  box-shadow:
    inset 0 3px 10px rgba(0,0,0,0.7),
    inset 0 1px 3px rgba(0,0,0,0.5),
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 0 0 1px rgba(255,255,255,0.08);
  position: relative; overflow: hidden; transition: box-shadow 0.15s, transform .15s, filter .15s;
}
.cell::after {
  content: '';
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  border: 0 solid transparent;
  box-shadow: none;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 3;
}
.cell:hover {
  transform:translateY(-1px);
  box-shadow:
    inset 0 3px 10px rgba(0,0,0,0.7),
    inset 0 1px 3px rgba(0,0,0,0.5),
    inset 0 0 0 1px rgba(255,255,255,0.1),
    0 0 0 2px rgba(255,255,255,0.14);
}
.cell .token {
  position: absolute; inset: 5px; border-radius: 50%;
  transform: scale(0); transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1), filter .2s;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(18px, 5.2vw, 34px);
  line-height: 1;
}
.cell.drop .token { transform: scale(1); animation: token-land .38s cubic-bezier(.22,1,.36,1); }
@keyframes token-land{0%{transform:translateY(-38%) scale(.72);filter:brightness(1.25)}70%{transform:translateY(4%) scale(1.08)}100%{transform:translateY(0) scale(1)}}

/* Formes via clip-path + border-radius */
.cell.p1 .token {
  background: linear-gradient(135deg, var(--p1-secondary, var(--p1-light, #ff6b85)), var(--p1, #ff2d55));
  box-shadow: 0 0 20px var(--p1-glow), inset 0 -5px 10px rgba(0,0,0,0.32), inset 0 3px 7px rgba(255,255,255,.20);
}
.cell.p2 .token {

/* Shapes — appliquées en inline style via JS pour éviter les conflits de spécificité */

.token .token-rgb-soft-base{position:relative;z-index:1}
.token .token-rgb-soft-layer{
  position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;
  pointer-events:none;opacity:.20;mix-blend-mode:color;

.cell.winning {

const SFX = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }
  function beep(freq, dur, vol = 0.15, shape = 'sine', attack = 0.005) {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = shape;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      osc.start(c.currentTime); osc.stop(c.currentTime + dur);
    } catch(e) {}
  }
  return {
    drop()        { beep(300, 0.07, 0.14, 'triangle'); setTimeout(() => beep(200, 0.09, 0.07, 'triangle'), 55); },
    opponentDrop(){ beep(230, 0.07, 0.09, 'triangle'); setTimeout(() => beep(160, 0.09, 0.05, 'triangle'), 55); },
    tick()        { beep(900, 0.04, 0.07, 'square'); },
    go()          { [523,659,784].forEach((f,i) => setTimeout(() => beep(f, 0.25, 0.13), i*70)); },
    matchFound()  { [440,554,659].forEach((f,i) => setTimeout(() => beep(f, 0.35, 0.13), i*90)); },
    win()         { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.45, 0.14), i*110)); },
    lose()        { [392,349,311,261].forEach((f,i) => setTimeout(() => beep(f, 0.45, 0.12, 'sawtooth'), i*120)); },
    draw()        { beep(350, 0.18, 0.1, 'triangle'); setTimeout(() => beep(350, 0.18, 0.08, 'triangle'), 240); },
  };
})();

const BOARD_THEMES = [
  { name: 'flamme', hues: [8, 32, 48], sat: 90, light: 58 },
  { name: 'ocean', hues: [196, 214, 178], sat: 84, light: 58 },
  { name: 'terre', hues: [138, 92, 38], sat: 68, light: 52 },
  { name: 'cristal', hues: [188, 226, 272], sat: 82, light: 64 },
  { name: 'orage', hues: [226, 252, 198], sat: 74, light: 58 },

];

function hashSeed(seed) {
  const str = String(seed || `${Date.now()}-${Math.random()}`);
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function hslColor(h, s = 82, l = 58) {
  return `hsl(${Math.round(h % 360)} ${s}% ${l}%)`;
}

function hslSoft(h, s = 88, l = 60, a = .26) {
  return `hsl(${Math.round(h % 360)} ${s}% ${l}% / ${a})`;
}

function applyBoardPalette(seed = '') {
  const hash = hashSeed(seed);
  const theme = BOARD_THEMES[hash % BOARD_THEMES.length];
  const drift = ((hash >>> 8) % 17) - 8;
  const root = document.documentElement;
  const hues = theme.hues.map((h, i) => (h + drift + i * ((hash >>> (12 + i * 3)) % 7 - 3) + 360) % 360);
  root.style.setProperty('--board-theme', theme.name);
  root.style.setProperty('--board-a', hslColor(hues[0], theme.sat, theme.light));
  root.style.setProperty('--board-b', hslColor(hues[1], theme.sat, theme.light));
  root.style.setProperty('--board-c', hslColor(hues[2], theme.sat, Math.min(68, theme.light + 4)));
  root.style.setProperty('--board-a-soft', hslSoft(hues[0], Math.min(92, theme.sat + 6), Math.min(66, theme.light + 4), .32));
  root.style.setProperty('--board-b-soft', hslSoft(hues[1], Math.min(92, theme.sat + 6), Math.min(66, theme.light + 4), .30));
  root.style.setProperty('--board-c-soft', hslSoft(hues[2], Math.min(92, theme.sat + 6), Math.min(68, theme.light + 6), .18));
  root.style.setProperty('--board-spin', `${190 + (hash % 80)}deg`);
}

applyBoardPalette();

function animateNumber(from, to, onFrame, duration = 900) {
  const start = performance.now();
  const delta = to - from;
  function frame(now) {
    const progress = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = Math.round(from + delta * eased);
    onFrame(value, progress);
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function animateCardElo(side, from, to) {
  const el = document.getElementById('elo-p' + side);
  if (!el || !Number.isFinite(from) || !Number.isFinite(to)) return;
  animateNumber(from, to, (value) => {
    el.dataset.elo = String(value);
    el.textContent = `${value} ELO`;
  });
}

function animateDeltaText(el, delta, suffix = ' ELO', duration = 950) {
  if (!el) return;
  const finalDelta = Number(delta) || 0;
  animateNumber(0, finalDelta, (value) => {
    const sign = value >= 0 ? '+' : '';
    el.textContent = `${sign}${value}${suffix}`;
  }, duration);
}

function animateBotSummary(before, after, delta) {
  const beforeEl = document.getElementById('bot-elo-before');
  const afterEl = document.getElementById('bot-elo-after');
  const totalEl = document.getElementById('bot-elo-total');
  const deltaEl = document.getElementById('bot-elo-delta');
  if (!beforeEl || !afterEl || !totalEl || !deltaEl) return;

  const safeBefore = Number.isFinite(Number(before)) ? Number(before) : 0;
  const safeAfter = Number.isFinite(Number(after)) ? Number(after) : safeBefore;
  const safeDelta = Number.isFinite(Number(delta)) ? Number(delta) : safeAfter - safeBefore;
  const sign = safeDelta >= 0 ? '+' : '';

  totalEl.classList.remove('is-positive', 'is-negative', 'is-neutral');
  totalEl.classList.add(safeDelta > 0 ? 'is-positive' : safeDelta < 0 ? 'is-negative' : 'is-neutral');

  beforeEl.textContent = String(safeBefore);
  afterEl.textContent = String(safeBefore);
  totalEl.textContent = String(safeBefore);
  deltaEl.textContent = `${sign}0`;

  animateNumber(safeBefore, safeAfter, (value) => {
    afterEl.textContent = String(value);
    totalEl.textContent = String(value);
  }, 1200);
  animateNumber(0, safeDelta, (value) => {
    const currentSign = value >= 0 ? '+' : '';
    deltaEl.textContent = `${currentSign}${value}`;
  }, 1200);
}

function animateResultPlayerSummary(prefix, before, after, delta) {

  const safeAfter = Number.isFinite(Number(after)) ? Number(after) : safeBefore;
  const safeDelta = Number.isFinite(Number(delta)) ? Number(delta) : safeAfter - safeBefore;

  mainEl.classList.remove('is-positive', 'is-negative', 'is-neutral');
  mainEl.classList.add(safeDelta > 0 ? 'is-positive' : safeDelta < 0 ? 'is-negative' : 'is-neutral');

  beforeEl.textContent = String(safeBefore);
  afterEl.textContent = String(safeBefore);
  mainEl.textContent = String(safeBefore);
  deltaEl.textContent = `${safeDelta >= 0 ? '+' : ''}0`;

  animateNumber(safeBefore, safeAfter, (value) => {
    mainEl.textContent = String(value);
    afterEl.textContent = String(value);
  }, 1200);
  animateNumber(0, safeDelta, (value) => {

}

    stopTurnTimer();
    return;
  }
  stopTurnTimer();
  const el = document.getElementById('turn-timer');
  if (!el) return;
  turnDeadline = Date.now() + activeMoveTimeSeconds * 1000;
  const paint = () => {
    const remaining = Math.max(0, Math.ceil((turnDeadline - Date.now()) / 1000));
    el.textContent = `${String(remaining).padStart(2, '0')}s`;
    el.classList.add('show');
    el.classList.toggle('danger', remaining <= 5);
  };
  paint();
  turnTimerInterval = setInterval(() => {
    paint();
    if (Date.now() >= turnDeadline) {
      clearInterval(turnTimerInterval);
      turnTimerInterval = null;
    }
  }, 250);
}

// ── Helpers couleur ───────────────────────────────────────────────────────────
function colorDistance(h1, h2) {
  // Distance de teinte en degrés
  const hue = hex => {
    const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    if(d===0) return 0;
    let h = max===r ? ((g-b)/d+(g<b?6:0))*60 : max===g ? ((b-r)/d+2)*60 : ((r-g)/d+4)*60;
    return h;
  };
  const diff = Math.abs(hue(h1)-hue(h2));
  return Math.min(diff, 360-diff);
}
function shiftHue(hex, deg) {
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), l=(max+min)/2;
  const d=max-min, s=d===0?0:d/(1-Math.abs(2*l-1));
  let h = d===0?0 : max===r?((g-b)/d+(g<b?6:0))*60 : max===g?((b-r)/d+2)*60 : ((r-g)/d+4)*60;
  h = (h+deg+360)%360;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12; return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0');};
  return `#${f(0)}${f(8)}${f(4)}`;
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function lightenHex(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyColors(c1, c2, s1 = '', s2 = '') {
  const root = document.documentElement;
  root.style.setProperty('--p1',       c1);
  root.style.setProperty('--p1-light', lightenHex(c1, 45));
  root.style.setProperty('--p1-secondary', s1 || '');
  root.style.setProperty('--p1-glow',  hexToRgba(c1, 0.45));
  root.style.setProperty('--p1-dim',   hexToRgba(c1, 0.15));
  root.style.setProperty('--p2',       c2);
  root.style.setProperty('--p2-light', lightenHex(c2, 45));
  root.style.setProperty('--p2-secondary', s2 || '');
  root.style.setProperty('--p2-glow',  hexToRgba(c2, 0.45));
  root.style.setProperty('--p2-dim',   hexToRgba(c2, 0.15));
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Lire depuis sessionStorage OU localStorage
  const pData = sessionStorage.getItem('player') || sessionStorage.getItem('duel_guest_player') || localStorage.getItem('player');
  const mData = sessionStorage.getItem('match');

  if (!pData) return location.href = '/';
  myPlayer = JSON.parse(pData);
  // S'assurer que sessionStorage est à jour
  sessionStorage.setItem('player', pData);

  const iaData = sessionStorage.getItem('vs_ia');
  if (iaData) {
    sessionStorage.removeItem('vs_ia');
    if (history.replaceState) history.replaceState(null, '', '/game/bot');
    startVsIA(JSON.parse(iaData));
  } else {
    // Récupérer le gameId depuis l'URL /game/:id ou depuis sessionStorage
    const urlGameId = location.pathname.split('/').pop();
    // /game/bot → pas de rejoin réseau possible, rediriger
    if (urlGameId === 'bot') {
      location.href = '/';
      return;
    }
    const urlId = urlGameId && urlGameId !== 'game' ? Number(urlGameId) : null;

    if (mData) {
      const match = JSON.parse(mData);
      if (urlId && match.gameId !== urlId) {
        connectSocket({ gameId: urlId, players: match.players });
      } else {
        connectSocket(match);
      }
    } else if (urlId) {
      connectSocket({ gameId: urlId });
    } else {
      location.href = '/';
    }
  }
});

// ── Socket ────────────────────────────────────────────────────────────────────
function connectSocket(pendingMatch) {
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    localStorage.setItem('last_active', Date.now());
    socket.emit('identify', { playerId: myPlayer.id, token: localStorage.getItem('token') || sessionStorage.getItem('duel_guest_token') || sessionStorage.getItem('token') });
  });

  socket.on('identified', (p) => {
    myPlayer = p;
    if (pendingMatch) {
      socket.emit('rejoin_game', { gameId: pendingMatch.gameId });
      // isRejoin = true si la partie était déjà en cours (pas de startsIn, ou URL /game/:id)
      const urlPart = location.pathname.split('/').pop();
      const isRejoin = pendingMatch._rejoin === true || (urlPart && !isNaN(Number(urlPart)) && Number(urlPart) > 0 && !pendingMatch._fresh);
      if (!isRejoin) {
        setupLobby(pendingMatch);
      }
      // sinon : game_rejoined va gérer l'affichage directement sans countdown
    }
  });

  socket.on('game_rejoined', (data) => {
    // Si le countdown d'une nouvelle partie est en cours, ignorer ce rejoined
    // (il arrive parce qu'on a émis rejoin_game dans identified, mais c'est une nouvelle partie)
    if (inCountdown) return;

    data.yourSide = data.side;
    data.startsIn = 0;
    gameId = data.gameId;
    mySide = data.side;
    applyBoardPalette(`game-${data.gameId || ''}-${data.players?.[1]?.id || ''}-${data.players?.[2]?.id || ''}`);

    // Appliquer couleurs et shapes
    applyColors(
      data.players[1].color || '#ff2d55',
      data.players[2].color || '#ffd60a',
      data.players[1].color_secondary || '',
      data.players[2].color_secondary || ''
    );
    const rawS1 = data.players[1].shape || 'circle';
    const rawS2 = data.players[2].shape || 'circle';
    p1TokenRgb = data.players[1].token_rgb === true || Number(data.players[1].pseudo_rgb || 0) === 1;
    p2TokenRgb = data.players[2].token_rgb === true || Number(data.players[2].pseudo_rgb || 0) === 1;
    if (rawS1.startsWith('emoji:')) { p1Shape='emoji'; p1Emoji=rawS1.slice(6)||'⭐'; }
    else p1Shape = rawS1;
    if (rawS2.startsWith('emoji:')) { p2Shape='emoji'; p2Emoji=rawS2.slice(6)||'💎'; }
    else p2Shape = rawS2;

    // Démarrer directement (sans lobby si rejoin)
    if (rawS1 === 'emoji_image') {
      p1Shape = 'emoji_image';
      p1EmojiImage = data.players[1].token_emoji_image || '';
    } else if (p1Shape !== 'emoji') {
      p1EmojiImage = '';
    }
    if (rawS2 === 'emoji_image') {
      p2Shape = 'emoji_image';
      p2EmojiImage = data.players[2].token_emoji_image || '';
    } else if (p2Shape !== 'emoji') {
      p2EmojiImage = '';
    }
    document.getElementById('lobby-overlay').classList.add('hidden');
    resetGameComms();
    document.getElementById('name-p1').textContent = data.players[1].pseudo;
    setCardElo(1, data.players[1].elo);
    document.getElementById('name-p2').textContent = data.players[2].pseudo;
    setCardElo(2, data.players[2].elo);
    setGameMode(data.tournament ? 'tournament' : String(data.gameType || '').toLowerCase() === 'friendly' ? 'friendly' : 'ranked');
    applyTournamentMeta(data.tournament || null, data.moveTimeSeconds || 0);
    applyPlayerCardVisual(1, data.players[1]);
    applyPlayerCardVisual(2, data.players[2]);
    currentTurn = data.current;
    updateTurnUI();

    // Reconstruire le plateau depuis la grille reçue
    renderBoard(); // s'assurer que les cellules existent
    const grid = data.grid;
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 7; c++) {
        const v = grid[r]?.[c] ?? 0;
        if (v) applyToken(r, c, v);
      }
    }

    // Fermer le banner de déconnexion + stopper le chrono s'il tourne
    const banner = document.getElementById('disconnect-banner');
    if (banner) {
      if (banner._interval) { clearInterval(banner._interval); banner._interval = null; }
      banner.classList.remove('show');
    }

    // Initialiser lobbyData pour que opponent_reconnected etc. fonctionnent
    lobbyData = data;

    setStatus(currentTurn === mySide ? 'Ton tour' : 'Tour adversaire');
  });
  socket.on('game_not_found', () => { sessionStorage.setItem('no_auto_queue','1'); location.href = '/'; });

  // match_found depuis la queue (cas où on arrive sans pendingMatch)
  socket.on('match_found', (d) => { d._fresh = true; setupLobby(d); });

  socket.on('move_played', onMovePlayed);
  socket.on('game_over',   onGameOver);
  socket.on('game_chat_message', (msg) => appendChatMessage(msg));
  socket.on('game_action_offer', (offer) => {
    if (!offer || offer.fromSide === mySide || Number(offer.fromId) === Number(myPlayer?.id)) return;
    showActionOffer(offer);
    appendChatMessage({ system: true, message: offer.message || 'Nouvelle proposition recue.' });
  });
  socket.on('game_action_notice', ({ message } = {}) => {
    if (message) appendChatMessage({ system: true, message });
  });
  socket.on('game_action_error', ({ message } = {}) => {
    if (message) appendChatMessage({ system: true, message });
  });
  socket.on('color_updated', ({ playerId, color }) => {
    // Adversaire a changé sa couleur en cours de partie
    if (!lobbyData) return;
    const side = lobbyData.players[1].id === playerId ? 1 : 2;
    lobbyData.players[side].color = color;
    applyColors(
      lobbyData.players[1].color,
      lobbyData.players[2].color,
      lobbyData.players[1].color_secondary || '',
      lobbyData.players[2].color_secondary || ''
    );
  });
  socket.on('opponent_disconnected', ({ pseudo, timeout }) => {
    const banner = document.getElementById('disconnect-banner');
    const msg    = document.getElementById('disconnect-msg');
    const timer  = document.getElementById('disconnect-timer');
    if (!banner) return;
    if (msg)   msg.textContent   = `${pseudo} s'est déconnecté...`;
    if (timer) timer.textContent = timeout;
    banner.classList.add('show');
    // Countdown
    let t = timeout;
    const iv = setInterval(() => {
      t--;
      if (timer) timer.textContent = t;
      if (t <= 0) clearInterval(iv);
    }, 1000);
    banner._interval = iv;
  });

  socket.on('opponent_reconnected', ({ pseudo }) => {
    const banner = document.getElementById('disconnect-banner');
    if (banner) {
      if (banner._interval) clearInterval(banner._interval);
      banner.classList.remove('show');
    }
    setStatus(`✅ ${pseudo} a reconnecté !`);
    setTimeout(() => setStatus(''), 2500);
  });

  socket.on('error', ({ message }) => {
    console.error('[Socket]', message);
    if (message === 'Aucune partie en cours.' || message === 'Partie inactive.') {
      sessionStorage.removeItem('match');
      alert('La partie a expiré (serveur redémarré). Retour à l\'accueil.');
      location.href = '/';
    }
  });
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
function setupLobby(data) {
  // Mettre à jour l'URL avec le gameId pour permettre le reload (pas en mode IA)
  if (data.gameId && !iaMode && history.replaceState) {
    history.replaceState(null, '', '/game/' + data.gameId);
    // Mettre à jour le match en sessionStorage avec le gameId
    const stored = sessionStorage.getItem('match');
    if (stored) {
      const m = JSON.parse(stored);
      m.gameId = data.gameId;
      sessionStorage.setItem('match', JSON.stringify(m));
    }
  }
  SFX.matchFound();
  lobbyData = data;
  gameId    = data.gameId;
  mySide    = data.yourSide;
  applyBoardPalette(`game-${data.gameId || ''}-${data.players?.[1]?.id || ''}-${data.players?.[2]?.id || ''}`);
  setGameMode(String(data.gameType || '').toLowerCase() === 'friendly' ? 'friendly' : 'ranked');
  applyTournamentMeta(data.tournament || null, data.moveTimeSeconds || 0);

  // Fix couleur similaire : si les deux couleurs sont trop proches, décaler celle du p2
  let c1 = data.players[1].color || '#ff2d55';
  let c2 = data.players[2].color || '#ffd60a';
  if (colorDistance(c1, c2) < 60) {
    c2 = shiftHue(c2, 150);
    data.players[2]._colorOverride = c2;
  }
  applyColors(c1, c2, data.players[1].color_secondary || '', data.players[2].color_secondary || '');

  // Stocker les shapes (format 'circle' ou 'emoji:⭐')
  const rawS1 = data.players[1].shape || 'circle';
  const rawS2 = data.players[2].shape || 'circle';
  p1TokenRgb = data.players[1].token_rgb === true || Number(data.players[1].pseudo_rgb || 0) === 1;
  p2TokenRgb = data.players[2].token_rgb === true || Number(data.players[2].pseudo_rgb || 0) === 1;
  if (rawS1.startsWith('emoji:')) { p1Shape='emoji'; p1Emoji=rawS1.slice(6)||'⭐'; }
  else p1Shape = rawS1;
  if (rawS2.startsWith('emoji:')) { p2Shape='emoji'; p2Emoji=rawS2.slice(6)||'💎'; }
  else p2Shape = rawS2;

  if (rawS1 === 'emoji_image') {
    p1Shape = 'emoji_image';
    p1EmojiImage = data.players[1].token_emoji_image || '';
  } else if (p1Shape !== 'emoji') {
    p1EmojiImage = '';
  }
  if (rawS2 === 'emoji_image') {
    p2Shape = 'emoji_image';
    p2EmojiImage = data.players[2].token_emoji_image || '';
  } else if (p2Shape !== 'emoji') {
    p2EmojiImage = '';
  }

  [1,2].forEach(s => {
    const p = data.players[s];
    applyLobbyPlayerVisual(s, p);
    document.getElementById('lpseudo'+ s).textContent = p.pseudo;
    document.getElementById('lelo'   + s).textContent = p.elo + ' ELO';
    if (s === mySide) {
      const badge = document.createElement('div');
      badge.className  = 'lobby-you';
      badge.textContent = 'TOI';
      document.getElementById('lp' + s).appendChild(badge);
    }
  });

  // Countdown — on affiche n, attend 1s, affiche n-1, etc.
  let n = data.startsIn || 3;
  const cdEl = document.getElementById('countdown');
  cdEl.textContent = n;
  inCountdown = true;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      inCountdown = false;
      SFX.go();
      startGame(data);
    } else {
      cdEl.textContent = n;
      SFX.tick();
    }
  }, 1000);
}

// ── Game start ────────────────────────────────────────────────────────────────
function startGame(data) {
  document.getElementById('lobby-overlay').classList.add('hidden');
  setGameMode(data.tournament ? 'tournament' : String(data.gameType || '').toLowerCase() === 'friendly' ? 'friendly' : currentGameMode);
  resetGameComms();

  document.getElementById('name-p1').textContent = data.players[1].pseudo;
  setCardElo(1, data.players[1].elo);
  document.getElementById('name-p2').textContent = data.players[2].pseudo;
  setCardElo(2, data.players[2].elo);
  applyPlayerCardVisual(1, data.players[1]);
  applyPlayerCardVisual(2, data.players[2]);

  currentTurn = 1;
  gameOver    = false;
  renderBoard();
  // Locker la board 400ms pour éviter les clics parasites au démarrage
  const boardEl = document.getElementById('board');
  boardEl.classList.add('locked');
  setTimeout(() => boardEl.classList.remove('locked'), 400);
  applyTournamentMeta(data.tournament || null, data.moveTimeSeconds || 0);
  updateTurnUI();
}

// ── Board ─────────────────────────────────────────────────────────────────────
function renderBoard() {
  const boardEl = document.getElementById('board');
  const colsEl  = document.getElementById('col-btns');
  boardEl.innerHTML = colsEl.innerHTML = '';

  for (let c = 0; c < COLS; c++) {
    const btn = document.createElement('button');
    btn.className = 'col-btn';
    btn.id        = 'cb' + c;
    btn.onclick   = () => playMove(c);
    colsEl.appendChild(btn);
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell  = document.createElement('div');
      cell.className    = 'cell';
      cell.dataset.row  = r;
      cell.dataset.col  = c;
      cell.onclick      = () => playMove(c);
      cell.appendChild(Object.assign(document.createElement('div'), { className: 'token' }));
      boardEl.appendChild(cell);
    }
  }
}

// ── Gameplay ──────────────────────────────────────────────────────────────────
function playMove(col) {
  if (gameOver || currentTurn !== mySide) return;
  if (document.getElementById('board')?.classList.contains('locked')) return;
  if (iaMode) { iaPlayHuman(col); return; }
  SFX.drop();
  socket.emit('play_move', { col });
}

function onMovePlayed(data) {
  if (data.player === mySide) SFX.drop();
  else SFX.opponentDrop();
  applyToken(data.row, data.col, data.player);
  currentTurn = data.next;
  updateTurnUI();
}

// ── Emoji → pion teinté ──────────────────────────────────────────────────────
// Garde les détails de l'emoji original, puis ajoute un dégradé joueur léger.
function makeEmojiToken(tokenEl, emoji, color, glowColor, tintColor = '', rgbEnabled = false) {
  tokenEl.textContent = '';
  tokenEl.className = 'token s-emoji';
  // Forcer via setAttribute pour surpasser .cell.p1 .token { background: ... }
  tokenEl.setAttribute('style',
    'border-radius:0!important;clip-path:none!important;' +
    'background:transparent!important;box-shadow:none!important;' +
    'inset:4px;position:absolute;display:flex;align-items:center;justify-content:center;'
  );

  // Calculer la taille depuis --cell-size (fiable même si token pas encore visible)
  const cssCell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-size')) || 68;
  const size = cssCell - 8; // inset: 4px de chaque côté
  const DPR = window.devicePixelRatio || 1;
  const canvas = document.createElement('canvas');
  canvas.width  = size * DPR;
  canvas.height = size * DPR;
  canvas.style.width  = '100%';
  canvas.style.height = '100%';
  canvas.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,.35))';

  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.clearRect(0, 0, size, size);

  // Trouver la bonne fontSize par dichotomie sur canvas temporaire
  const tmp = document.createElement('canvas');
  tmp.width = size * 2; tmp.height = size * 2;
  const tc = tmp.getContext('2d');
  let lo = 4, hi = size * 1.5, fontSize = size * 0.75;
  for (let i = 0; i < 8; i++) {
    const mid = (lo + hi) / 2;
    tc.font = `${mid}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
    const m = tc.measureText(emoji);
    const w = m.actualBoundingBoxRight - m.actualBoundingBoxLeft || m.width;
    const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent || mid;
    if (Math.max(w, h) < size * 0.82) lo = mid;
    else hi = mid;
    fontSize = lo;
  }

  const emojiFont = `"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
  ctx.font = `${fontSize}px ${emojiFont}`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  // Rendu hybride: on garde les details/couleurs de l'emoji, puis on applique
  // une teinte en transparence. Ca evite l'effet "emoji entierement jaune".
  ctx.fillText(emoji, size / 2, size / 2);

  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  ctx.globalAlpha = 0.46;
  const grad = ctx.createLinearGradient(size * 0.12, size * 0.05, size * 0.92, size * 0.95);
  grad.addColorStop(0, lightenHex(color, 0.62));
  grad.addColorStop(0.48, color);
  grad.addColorStop(1, tintColor || color);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.34;
  ctx.fillText(emoji, size / 2, size / 2);
  ctx.restore();

  // Glow via shadow sur le canvas
  tokenEl.style.filter = `drop-shadow(0 0 ${size*0.1}px ${glowColor})`;

  canvas.className = 'token-rgb-soft-base';
  tokenEl.appendChild(canvas);
  if (rgbEnabled) {
    const rgbLayer = document.createElement('canvas');
    rgbLayer.width = canvas.width;
    rgbLayer.height = canvas.height;
    rgbLayer.className = 'token-rgb-soft-layer';
    rgbLayer.setAttribute('aria-hidden', 'true');
    rgbLayer.getContext('2d')?.drawImage(canvas, 0, 0);
    tokenEl.appendChild(rgbLayer);
  }
}

function lightenHex(hex, amount) {
  // Mélange hex avec blanc selon amount (0-1)
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lr = Math.round(r + (255-r)*amount), lg = Math.round(g + (255-g)*amount), lb = Math.round(b + (255-b)*amount);
  return `rgb(${lr},${lg},${lb})`;
}

function makeImageToken(tokenEl, imageSrc, glowColor, rgbEnabled = false) {
  tokenEl.textContent = '';
  tokenEl.className = 'token s-emoji';
  tokenEl.style.background = 'transparent';
  tokenEl.style.boxShadow = 'none';
  tokenEl.style.clipPath = 'none';
  tokenEl.style.borderRadius = '0';
  tokenEl.style.filter = `drop-shadow(0 0 8px ${glowColor})`;
  tokenEl.innerHTML = `<img class="token-rgb-soft-base" src="${imageSrc}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:18%;display:block;">`;
  if (rgbEnabled) {
    const rgbLayer = document.createElement('img');
    rgbLayer.src = imageSrc;
    rgbLayer.alt = '';
    rgbLayer.className = 'token-rgb-soft-layer';
    rgbLayer.style.borderRadius = '18%';
    rgbLayer.setAttribute('aria-hidden', 'true');
    tokenEl.appendChild(rgbLayer);
  }
}

const SHAPE_CLIPS = {
  circle:   { borderRadius: '50%',   clipPath: '' },
  triangle: { borderRadius: '0',     clipPath: 'polygon(50% 8%, 95% 92%, 5% 92%)' },
  diamond:  { borderRadius: '0',     clipPath: 'polygon(50% 5%, 95% 50%, 50% 95%, 5% 50%)' },
  star:     { borderRadius: '0',     clipPath: 'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)' },
  heart:    { borderRadius: '0',     clipPath: 'polygon(50% 85%,15% 45%,5% 30%,15% 10%,35% 8%,50% 25%,65% 8%,85% 10%,95% 30%,85% 45%)' },
  emoji:    { borderRadius: '50%',   clipPath: '' },
};

function applyToken(row, col, player) {
  const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
  if (!cell) return;
  cell.classList.add('p' + player);
  const token = cell.querySelector('.token');
  if (token) {
    const shape = player === 1 ? p1Shape : p2Shape;
    const rgbEnabled = player === 1 ? p1TokenRgb : p2TokenRgb;
    if (shape === 'emoji_image') {
      const imgSrc = player === 1 ? p1EmojiImage : p2EmojiImage;
      const glow = getComputedStyle(document.documentElement).getPropertyValue(player === 1 ? '--p1-glow' : '--p2-glow').trim();
      if (imgSrc) makeImageToken(token, imgSrc, glow, rgbEnabled);
    } else if (shape === 'emoji') {
      const root = document.documentElement;
      const cs   = getComputedStyle(root);
      const col  = cs.getPropertyValue(player === 1 ? '--p1' : '--p2').trim();
      const glow = cs.getPropertyValue(player === 1 ? '--p1-glow' : '--p2-glow').trim();
      const tint = cs.getPropertyValue(player === 1 ? '--p1-secondary' : '--p2-secondary').trim();
      const em   = player === 1 ? p1Emoji : p2Emoji;
      // Dessiner le canvas AVANT l'animation drop
      makeEmojiToken(token, em, col, glow, tint, rgbEnabled);
    } else {
      const clip = SHAPE_CLIPS[shape] || SHAPE_CLIPS.circle;
      token.style.borderRadius = clip.borderRadius;
      token.style.clipPath     = clip.clipPath;
      token.className = 'token';
    }
    token.style.setProperty('--token-rgb-delay', `${-((row * 0.32) + (col * 0.18)).toFixed(2)}s`);
  }
  // Déclencher l'animation drop après avoir préparé le token
  void cell.offsetWidth;
  cell.classList.add('drop');
}

function updateTurnUI() {
  const isMe = currentTurn === mySide;
  document.getElementById('card-p1').classList.toggle('active', currentTurn === 1);
  document.getElementById('card-p2').classList.toggle('active', currentTurn === 2);

  for (let c = 0; c < COLS; c++) {
    const b = document.getElementById('cb' + c);
    if (b) b.disabled = !isMe || gameOver;
  }

  if (isMe) {
    document.getElementById('turn-lbl').textContent = '← TON TOUR';
    setStatus('');
  } else {
    document.getElementById('turn-lbl').textContent = 'ADVERSAIRE...';
    setStatus('<span class="dots">En attente<span>.</span><span>.</span><span>.</span></span>', true);
    // Afficher l'ID de la partie
    const badge = document.getElementById('game-id-badge');
    if (badge && gameId) badge.textContent = '#' + gameId;
  }
  if (activeMoveTimeSeconds > 0) startTurnTimer();
  else stopTurnTimer();
}

function setCardElo(side, value) {
  const el = document.getElementById('elo-p' + side);
  if (!el) return;
  const numeric = Number(value);
  if (Number.isFinite(numeric)) {
    const rounded = Math.round(numeric);
    el.dataset.elo = String(rounded);
    el.textContent = `${rounded} ELO`;
    return;
  }
  el.dataset.elo = '';
  el.textContent = String(value || '— ELO');
}

function getCardElo(side) {
  const el = document.getElementById('elo-p' + side);
  if (!el) return null;
  const numeric = Number(el.dataset.elo);
  return Number.isFinite(numeric) ? numeric : null;
}

function onGameOver(data) {
  gameOver = true;
  stopTurnTimer();
  setGameActionState('ended');
  closeActionOffer();

  const dcBanner = document.getElementById('disconnect-banner');
  if (dcBanner) {
    if (dcBanner._interval) {
      clearInterval(dcBanner._interval);
      dcBanner._interval = null;
    }
    dcBanner.classList.remove('show');
  }

  if (data?.lastMove && Number.isInteger(data.lastMove.row) && Number.isInteger(data.lastMove.col) && Number.isInteger(data.lastMove.player)) {
    const finalCell = document.querySelector(`.cell[data-row="${data.lastMove.row}"][data-col="${data.lastMove.col}"]`);
    if (finalCell && !finalCell.classList.contains('p1') && !finalCell.classList.contains('p2')) {
      applyToken(data.lastMove.row, data.lastMove.col, data.lastMove.player);
    }
  }

  if (data.winCells?.length) {
    data.winCells.forEach(([r, c]) => {
      const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      if (cell) cell.classList.add('winning');
    });
  }

  for (let c = 0; c < COLS; c++) {
    const b = document.getElementById('cb' + c);
    if (b) b.disabled = true;
  }
  setStatus('');

  const isWinner = data.winner === mySide;
  const isDraw = data.reason === 'draw';
  setTimeout(() => {
    if (isDraw) SFX.draw();
    else if (isWinner) SFX.win();
    else SFX.lose();
  }, 300);

  const myId = data.players?.[mySide]?.id ?? myPlayer?.id;
  const oppSide = mySide === 1 ? 2 : 1;
  const oppId = data.players?.[oppSide]?.id;
  const myDelta = myId !== undefined ? Number(data.eloChanges?.[myId] ?? data.eloChanges?.[String(myId)] ?? 0) : 0;
  const oppDelta = oppId !== undefined ? Number(data.eloChanges?.[oppId] ?? data.eloChanges?.[String(oppId)] ?? 0) : 0;
  const myAfter = myId !== undefined ? Number(data.eloNow?.[myId] ?? data.eloNow?.[String(myId)] ?? getCardElo(mySide)) : getCardElo(mySide);
  const oppAfter = oppId !== undefined ? Number(data.eloNow?.[oppId] ?? data.eloNow?.[String(oppId)] ?? getCardElo(oppSide)) : getCardElo(oppSide);
  const myBefore = Number.isFinite(myAfter) ? myAfter - myDelta : null;
  const oppBefore = Number.isFinite(oppAfter) ? oppAfter - oppDelta : null;
  const winnerLabelText = data.players?.[data.winner]?.pseudo || (isWinner ? 'Tu' : 'L adversaire');

  const titleEl = document.getElementById('result-title');
  if (isDraw) {
    titleEl.textContent = 'EGALITE';
    titleEl.style.background = 'linear-gradient(135deg, var(--muted), var(--text))';
  } else if (isWinner) {
    titleEl.textContent = 'VICTOIRE';
    titleEl.style.background = 'linear-gradient(135deg, var(--p1), var(--p2))';
  } else {
    titleEl.textContent = 'DEFAITE';
    titleEl.style.background = 'linear-gradient(135deg, #8d8d99, #d7d7df)';
  }
  titleEl.style.webkitBackgroundClip = 'text';
  titleEl.style.webkitTextFillColor = 'transparent';

  const vipBoostApplied = Number(data.boostInfo?.vipAppliedTo) === Number(myId) && myDelta > 0;
  const premiumBoostTier = vipBoostApplied ? String(data.boostInfo?.vipTier || 'vip') : null;
  const eloEl = document.getElementById('result-elo');
  eloEl.textContent = '0 ELO';
  eloEl.style.color = vipBoostApplied
    ? (premiumBoostTier === 'vip_plus' ? '#85EBFF' : premiumBoostTier === 'perso' ? '#ff7a45' : 'var(--yellow)')
    : (myDelta >= 0 ? '#30d158' : 'var(--red)');
  animateDeltaText(eloEl, myDelta, ' ELO', 1200);

  const reasonEl = document.getElementById('result-reason');
  if (data.reason === 'resign') {
    reasonEl.textContent = isWinner ? 'Victoire par abandon adverse.' : 'Defaite par abandon.';
  } else if (data.reason === 'agreement_draw') {
    reasonEl.textContent = 'Nulle par accord entre les deux joueurs.';
  } else if (data.reason === 'position_draw') {
    reasonEl.textContent = 'Nulle par position.';
  } else if (data.reason === 'disconnect') {
    reasonEl.textContent = isWinner ? 'Victoire par deconnexion adverse.' : 'Defaite apres deconnexion.';
  } else if (isDraw) {
    reasonEl.textContent = 'Position nulle. Les ELO restent visibles et animes juste dessous.';
  } else if (vipBoostApplied) {
    reasonEl.textContent = premiumBoostTier === 'vip_plus'
      ? 'Boost VIP+ applique sur ton gain Elo.'
      : premiumBoostTier === 'perso'
        ? 'Boost Perso applique sur ton gain Elo.'
        : 'Boost VIP applique sur ton gain Elo.';
  } else {
    reasonEl.textContent = `${winnerLabelText} remporte la partie, Elo ajuste en direct.`;
  }

  const deltaText = (delta) => `${delta >= 0 ? '+' : ''}${delta} Elo`;
  const formatDuration = (seconds) => {
    const total = Math.max(0, Number(seconds) || 0);
    const min = Math.floor(total / 60);
    const sec = total % 60;
    return min > 0 ? `${min}m ${String(sec).padStart(2, '0')}s` : `${sec}s`;
  };

  const metaEl = document.getElementById('result-meta');
  if (metaEl) {
    const winnerLabel = isDraw ? 'Nul' : winnerLabelText;
    const myTransition = Number.isFinite(myBefore) && Number.isFinite(myAfter) ? `${myBefore} → ${myAfter}` : deltaText(myDelta);
    const resultKind = data.reason === 'resign' ? 'Abandon'
      : data.reason === 'agreement_draw' ? 'Nulle par accord'
        : data.reason === 'draw' || data.reason === 'position_draw' ? 'Position nulle'
          : 'Alignement';
    metaEl.innerHTML = `
      <div class="result-meta-chip">Resultat<strong>${resultKind}</strong></div>
      <div class="result-meta-chip">Vainqueur<strong>${winnerLabel}</strong></div>
      <div class="result-meta-chip">Temps<strong>${formatDuration(data.duration)}</strong></div>
      <div class="result-meta-chip">Mon Elo<strong>${myTransition}</strong></div>
    `;
  }

  const summaryEl = document.getElementById('result-summary');
  if (summaryEl) {
    summaryEl.innerHTML = `
      <div class="result-player-box">
        <div class="result-player-name">${data.players?.[mySide]?.pseudo || 'Moi'}</div>
        <div class="result-player-elo" id="result-my-elo-main">${Number.isFinite(myBefore) ? myBefore : '--'}</div>
        <div class="result-player-elo bot-elo">
          <span class="result-player-before" id="result-my-elo-before">${Number.isFinite(myBefore) ? myBefore : '--'}</span>
          <span class="result-player-arrow">→</span>
          <span class="result-player-after" id="result-my-elo-after">${Number.isFinite(myBefore) ? myBefore : '--'}</span>
        </div>
        <div class="result-player-delta"><strong><span class="delta-value" id="result-my-elo-delta">${myDelta >= 0 ? '+' : ''}0</span> ELO</strong></div>
      </div>
      <div class="result-player-box">
        <div class="result-player-name">${data.players?.[oppSide]?.pseudo || 'Adversaire'}</div>
        <div class="result-player-elo" id="result-opp-elo-main">${Number.isFinite(oppBefore) ? oppBefore : '--'}</div>
        <div class="result-player-elo bot-elo">
          <span class="result-player-before" id="result-opp-elo-before">${Number.isFinite(oppBefore) ? oppBefore : '--'}</span>
          <span class="result-player-arrow">→</span>
          <span class="result-player-after" id="result-opp-elo-after">${Number.isFinite(oppBefore) ? oppBefore : '--'}</span>
        </div>
        <div class="result-player-delta"><strong><span class="delta-value" id="result-opp-elo-delta">${oppDelta >= 0 ? '+' : ''}0</span> ELO</strong></div>
      </div>
    `;
  }

  if (Number.isFinite(myBefore) && Number.isFinite(myAfter)) {
    animateResultPlayerSummary('result-my', myBefore, myAfter, myDelta);
    animateCardElo(mySide, myBefore, myAfter);
  }
  if (Number.isFinite(oppBefore) && Number.isFinite(oppAfter)) {
    animateResultPlayerSummary('result-opp', oppBefore, oppAfter, oppDelta);
    animateCardElo(oppSide, oppBefore, oppAfter);
  }

  const replayBtn = document.getElementById('btn-replay');
  if (replayBtn) {
    if (data.allowReplay === false || Number(data.gameId) <= 0) {
      replayBtn.style.display = 'none';
      replayBtn.removeAttribute('href');
    } else {
      replayBtn.style.display = '';
      replayBtn.href = '/replay/' + data.gameId;
    }
  }
  document.getElementById('result-overlay').classList.add('show');
  sessionStorage.removeItem('match');
  if (history.replaceState) history.replaceState(null, '', '/game/' + data.gameId);
}

function iaPlayHuman(col) {
  const row = iaGetRow(col);
  if (row === -1 || gameOver) return;
  iaGrid[row][col] = 1;
  iaMoves.push(col);
  SFX.drop();
  applyToken(row, col, 1);
  const win = iaCheckWin(row, col, 1);
  if (win) { iaEnd(1, win); return; }
  if (iaIsDraw()) { iaEnd(null, []); return; }
  currentTurn = 2;
  updateTurnUI();
  setTimeout(iaPlayBot, 400 + Math.random() * 300);
}

function iaPlayBot() {
  if (gameOver) return;
  const col = iaChoose();
  const row = iaGetRow(col);
  if (row === -1) return;
  iaGrid[row][col] = 2;
  iaMoves.push(col);
  SFX.opponentDrop();
  applyToken(row, col, 2);
  const win = iaCheckWin(row, col, 2);
  if (win) { iaEnd(2, win); return; }
  if (iaIsDraw()) { iaEnd(null, []); return; }
  currentTurn = 1;
  updateTurnUI();
}

function iaGetRow(col) {
  for (let r = IA_R-1; r >= 0; r--) if (iaGrid[r][col] === 0) return r;
  return -1;
}
function iaSimulate(col, p) {
  const row = iaGetRow(col);
  if (row === -1) return false;
  iaGrid[row][col] = p;
  const w = iaCheckWin(row, col, p);
  iaGrid[row][col] = 0;
  return !!w;
}

// ── IA Facile : aléatoire sauf victoire immédiate ─────────────────────────────

// ── IA Moyen : victoire + blocage + centre ────────────────────────────────────

// ── IA Difficile : Minimax Alpha-Beta ────────────────────────────────────────
function iaScoreWindow(w, p) {
  const o = p===1?2:1;
  const mine=w.filter(c=>c===p).length, opp=w.filter(c=>c===o).length, emp=w.filter(c=>c===0).length;
  if(mine===4)return 1000; if(opp===4)return-1000;
  if(mine===3&&emp===1)return 50; if(opp===3&&emp===1)return-50;
  if(mine===2&&emp===2)return 5; return 0;
}
function iaEvaluate(b) {
  let s=0;
  for(let r=0;r<IA_R;r++){if(b[r][3]===2)s+=8;if(b[r][3]===1)s-=8;}
  for(let r=0;r<IA_R;r++)for(let c=0;c<=IA_C-4;c++)s+=iaScoreWindow([b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]],2);
  for(let c=0;c<IA_C;c++)for(let r=0;r<=IA_R-4;r++)s+=iaScoreWindow([b[r][c],b[r+1][c],b[r+2][c],b[r+3][c]],2);
  for(let r=3;r<IA_R;r++)for(let c=0;c<=IA_C-4;c++)s+=iaScoreWindow([b[r][c],b[r-1][c+1],b[r-2][c+2],b[r-3][c+3]],2);
  for(let r=0;r<=IA_R-4;r++)for(let c=0;c<=IA_C-4;c++)s+=iaScoreWindow([b[r][c],b[r+1][c+1],b[r+2][c+2],b[r+3][c+3]],2);
  return s;
}
function iaMinimax(b, depth, alpha, beta, maximizing) {
  const checkW = (p) => {
    for(let r=0;r<IA_R;r++)for(let c=0;c<=IA_C-4;c++)if(b[r][c]===p&&b[r][c+1]===p&&b[r][c+2]===p&&b[r][c+3]===p)return true;
    for(let c=0;c<IA_C;c++)for(let r=0;r<=IA_R-4;r++)if(b[r][c]===p&&b[r+1][c]===p&&b[r+2][c]===p&&b[r+3][c]===p)return true;
    for(let r=3;r<IA_R;r++)for(let c=0;c<=IA_C-4;c++)if(b[r][c]===p&&b[r-1][c+1]===p&&b[r-2][c+2]===p&&b[r-3][c+3]===p)return true;
    for(let r=0;r<=IA_R-4;r++)for(let c=0;c<=IA_C-4;c++)if(b[r][c]===p&&b[r+1][c+1]===p&&b[r+2][c+2]===p&&b[r+3][c+3]===p)return true;
    return false;
  };
  if(checkW(2))return 100000+depth; if(checkW(1))return-100000-depth;
  if(b[0].every(c=>c!==0)||depth===0)return iaEvaluate(b);
  const cols=[3,2,4,1,5,0,6].filter(c=>b[0][c]===0);
  if(maximizing){
    let best=-Infinity;
    for(const col of cols){
      for(let r=IA_R-1;r>=0;r--)if(b[r][col]===0){b[r][col]=2;break;}
      best=Math.max(best,iaMinimax(b,depth-1,alpha,beta,false));
      for(let r=0;r<IA_R;r++)if(b[r][col]!==0){b[r][col]=0;break;}
      alpha=Math.max(alpha,best); if(beta<=alpha)break;
    }
    return best;
  } else {
    let best=Infinity;
    for(const col of cols){
      for(let r=IA_R-1;r>=0;r--)if(b[r][col]===0){b[r][col]=1;break;}
      best=Math.min(best,iaMinimax(b,depth-1,alpha,beta,true));
      for(let r=0;r<IA_R;r++)if(b[r][col]!==0){b[r][col]=0;break;}
      beta=Math.min(beta,best); if(beta<=alpha)break;
    }
    return best;
  }
}

// Mapping ELO → profondeur Minimax + erreur intentionnelle
function eloToParams(elo) {
  if (elo < 700)  return { depth: 0, blunderRate: 0.7,  missWinRate: 0.6  }; // ~500
  if (elo < 1300) return { depth: 1, blunderRate: 0.25, missWinRate: 0.15 }; // ~1000
  if (elo < 1800) return { depth: 3, blunderRate: 0.12, missWinRate: 0.0  }; // ~1500
  if (elo < 2300) return { depth: 5, blunderRate: 0.05, missWinRate: 0.0  }; // ~2000
  if (elo < 2800) return { depth: 7, blunderRate: 0.01, missWinRate: 0.0  }; // ~2500
  return           { depth: 9, blunderRate: 0.0,  missWinRate: 0.0  };       // ~3200
}

function iaChoose() {
  const valid = Array.from({length:IA_C},(_,i)=>i).filter(c=>iaGetRow(c)!==-1);
  if (!valid.length) return 0;

  // Pour easy/medium/hard on garde la logique d'origine MAIS on utilise targetElo
  const params = eloToParams(iaTargetElo);

  // Peut-on gagner immédiatement ?
  for (const c of valid) if (iaSimulate(c, 2)) {
    // missWinRate : chance de rater la victoire (niveaux très bas)
    if (Math.random() < params.missWinRate) break;
    return c;
  }

  // Doit-on bloquer ?
  const mustBlock = valid.filter(c => iaSimulate(c, 1));

  // blunderRate : chance de jouer n'importe où au lieu de bloquer
  if (mustBlock.length > 0 && Math.random() >= params.blunderRate) {
    return mustBlock[0];
  }

  // Depth 0 → aléatoire avec légère préférence centre
  if (params.depth === 0) {
    const pref = [3,2,4,1,5,0,6].filter(c => iaGetRow(c) !== -1);
    // 50% aléatoire, 50% centre
    return Math.random() < 0.5 ? valid[Math.floor(Math.random()*valid.length)] : pref[0];
  }

  // Depth 1 → juste victoire + blocage + centre
  if (params.depth === 1) {
    const pref = [3,2,4,1,5,0,6].filter(c => iaGetRow(c) !== -1);
    return pref[0];
  }

  // Depth >= 3 → Minimax avec profondeur adaptée + bruit intentionnel
  const b = iaGrid.map(r=>[...r]);
  let bestCol = valid[0], bestScore = -Infinity;
  for (const col of valid) {
    for(let r=IA_R-1;r>=0;r--)if(b[r][col]===0){b[r][col]=2;break;}
    const score = iaMinimax(b, params.depth - 1, -Infinity, Infinity, false);
    for(let r=0;r<IA_R;r++)if(b[r][col]!==0){b[r][col]=0;break;}
    if (score > bestScore) { bestScore = score; bestCol = col; }
  }

  // Bruit : parfois jouer le 2e meilleur coup (simule les erreurs humaines)
  if (params.blunderRate > 0 && Math.random() < params.blunderRate && valid.length > 1) {
    const others = valid.filter(c => c !== bestCol);
    return others[Math.floor(Math.random() * others.length)];
  }

  return bestCol;
}

function iaCheckWin(r, c, p) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr,dc] of dirs) {
    const cells = [[r,c]];
    for (let i=1;i<4;i++) { const nr=r+dr*i,nc=c+dc*i; if(iaGrid[nr]?.[nc]===p) cells.push([nr,nc]); else break; }
    for (let i=1;i<4;i++) { const nr=r-dr*i,nc=c-dc*i; if(iaGrid[nr]?.[nc]===p) cells.push([nr,nc]); else break; }
    if (cells.length >= 4) return cells;
  }
  return null;
}
function iaIsDraw() { return iaGrid[0].every(v=>v!==0); }

function iaEnd(winner, winCells) {
  gameOver = true;
  winCells?.forEach(([r,c]) => document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`)?.classList.add('winning'));
  for (let c=0;c<IA_C;c++) { const b=document.getElementById('cb'+c); if(b) b.disabled=true; }
  const isDraw = winner===null, isWin = winner===1;
  setTimeout(() => { isDraw ? SFX.draw() : isWin ? SFX.win() : SFX.lose(); }, 300);
  const titleEl = document.getElementById('result-title');
  if (isDraw) {
    titleEl.textContent='⚖️ ÉGALITÉ'; titleEl.style.background='linear-gradient(135deg,var(--muted),var(--text))';
  } else if (isWin) {
    titleEl.textContent='🏆 VICTOIRE !'; titleEl.style.background='linear-gradient(135deg,var(--p1),var(--p2))';
  } else {
    titleEl.textContent='💀 DÉFAITE'; titleEl.style.background='linear-gradient(135deg,#555,#888)';
  }
  titleEl.style.webkitBackgroundClip='text'; titleEl.style.webkitTextFillColor='transparent';
  document.getElementById('result-elo').textContent = '';
  const diffLabel = { easy:'Facile', medium:'Moyen', hard:'Difficile' }[iaDifficulty] || '';
  document.getElementById('result-reason').textContent = isDraw ? 'Partie nulle' : isWin ? `Tu as battu l'IA (${diffLabel}) !` : `L'IA (${diffLabel}) a gagné cette fois...`;

  saveBotReplay(winner, Math.round((Date.now() - iaStartTime) / 1000));

async function saveBotReplay(winner, duration = 0) {
  try {
    const p1Color = myPlayer.color || '#ff2d55';
    const response = await fetch('/api/bot-replay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: localStorage.getItem('token'),
        moves: iaMoves,
        winner,
        duration,
        p1Color,
        p2Color: iaBotColor,
        botName: iaBotName,
        difficulty: iaDifficulty,
      })
    });
    if (!response.ok) return;

    const { gameId, botDelta, newBotElo } = await response.json();
    const btn = document.getElementById('btn-replay');
    if (btn && gameId) {
      btn.style.display = '';
      btn.href = '/replay-bot/' + gameId;
      btn.textContent = 'Replay & Analyse';
    }

    if (typeof botDelta === 'number') {
      const eloEl = document.getElementById('result-elo');
      if (eloEl) {
        eloEl.textContent = '';
      }
      const summaryEl = document.getElementById('result-summary');
      if (summaryEl) {
        const currentBotElo = Number.isFinite(Number(newBotElo)) ? Number(newBotElo) - Number(botDelta) : null;
        const beforeValue = Number.isFinite(currentBotElo) ? Number(currentBotElo) : 0;
        const afterValue = Number.isFinite(Number(newBotElo)) ? Number(newBotElo) : beforeValue;
        summaryEl.className = 'result-summary single';
        summaryEl.innerHTML = `
          <div class="result-player-box bot-only">
            <div class="result-player-name">MODE BOT</div>
            <div class="result-player-elo bot-elo bot-total" id="bot-elo-total">${beforeValue}</div>
            <div class="result-player-transition">
              <span class="result-player-before" id="bot-elo-before">${beforeValue}</span>
              <span class="result-player-arrow">→</span>
              <span class="result-player-after" id="bot-elo-after">${beforeValue}</span>
            </div>
            <div class="result-player-delta bot-delta centered"><strong><span id="bot-elo-delta">+0</span> ELO BOT</strong></div>
          </div>
        `;
        setTimeout(() => {
          animateBotSummary(beforeValue, afterValue, botDelta);
        }, 180);
      }
    }
  } catch (e) {}
}
