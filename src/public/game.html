<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — Partie</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/w9nwQxm.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg:       #06060e;
  --surface:  #0d0d1c;
  --surface2: #13132a;
  --border:   rgba(255,255,255,0.06);
  --p1:       #ff2d55;
  --p1-glow:  rgba(255,45,85,0.45);
  --p1-dim:   rgba(255,45,85,0.15);
  --p2:       #ffd60a;
  --p2-glow:  rgba(255,214,10,0.45);
  --p2-dim:   rgba(255,214,10,0.12);
  --text:     #eeeef5;
  --muted:    rgba(238,238,245,0.38);
  --accent:   #4c6ef5;
  --grid:     #0a0a18;
  --cell:     #07071a;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; overflow-x: hidden; }

.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
}
.scanlines {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
}

.page { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; gap: 16px; }

/* ── Header ── */
.top-bar { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; }
.logo-sm { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
.logo-sm span { color: var(--p1); text-shadow: 0 0 20px var(--p1-glow); }
.btn-quit {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; padding: 7px 16px; border-radius: 8px;
  background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.2s;
}
.btn-quit:hover { border-color: var(--p1); color: var(--p1); }

/* ── Lobby overlay ── */
.lobby-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(6,6,14,0.96); display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 28px; backdrop-filter: blur(4px);
}
.lobby-overlay.hidden { display: none; }

.lobby-players { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 20px; align-items: center; width: 100%; max-width: 520px; }
.lobby-player {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: all 0.4s;
}
.lobby-player.p1 { border-color: var(--p1); box-shadow: 0 0 32px var(--p1-dim); }
.lobby-player.p2 { border-color: var(--p2); box-shadow: 0 0 32px var(--p2-dim); }

.lobby-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900;
  transition: all 0.3s;
}
.lobby-player.p1 .lobby-avatar { background: var(--p1-dim); color: var(--p1); border: 2px solid var(--p1); }
.lobby-player.p2 .lobby-avatar { background: var(--p2-dim); color: var(--p2); border: 2px solid var(--p2); }

.lobby-pseudo { font-weight: 600; font-size: 15px; text-align: center; }
.lobby-elo { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }
.lobby-you { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; border-radius: 4px; }
.lobby-player.p1 .lobby-you { background: var(--p1-dim); color: var(--p1); }
.lobby-player.p2 .lobby-you { background: var(--p2-dim); color: var(--p2); }

.vs-col { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vs-text { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900; color: var(--muted); letter-spacing: 4px; }
.countdown {
  font-family: 'Barlow Condensed', sans-serif; font-size: 72px; font-weight: 900; letter-spacing: 2px; line-height: 1;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: pulse-c 1s ease-in-out infinite;
}
@keyframes pulse-c { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* ── Player cards ── */
.players-row { width: 100%; max-width: 560px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.player-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.player-card::after { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.player-card.p1::after { background: linear-gradient(135deg, var(--p1-dim), transparent); }
.player-card.p2::after { background: linear-gradient(225deg, var(--p2-dim), transparent); }
.player-card.active::after { opacity: 1; }
.player-card.p1.active { border-color: var(--p1); box-shadow: 0 0 18px var(--p1-dim); }
.player-card.p2.active { border-color: var(--p2); box-shadow: 0 0 18px var(--p2-dim); }

.pc-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; transition: all 0.3s; }
.player-card.p1 .pc-dot { background: var(--p1); box-shadow: 0 0 8px var(--p1-glow); }
.player-card.p2 .pc-dot { background: var(--p2); box-shadow: 0 0 8px var(--p2-glow); }

.pc-info { flex: 1; min-width: 0; }
.pc-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-elo  { font-size: 11px; color: var(--muted); }
.turn-mid { text-align: center; }
.vs-sm { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--muted); letter-spacing: 2px; }
.turn-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

/* ── Status ── */
.status-bar { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
.status-bar.thinking { color: var(--accent); }
.dots span { animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

/* ── Board ── */
.board-wrap { position: relative; }
.col-buttons { display: flex; gap: 6px; margin-bottom: 4px; }
.col-btn {
  width: 68px; height: 26px; border: none; background: transparent; cursor: pointer;
  border-radius: 6px; transition: all 0.15s; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.col-btn::after { content: '▼'; font-size: 11px; color: var(--muted); opacity: 0; transition: all 0.15s; }
.col-btn:not(:disabled):hover::after { opacity: 1; color: var(--text); transform: translateY(2px); }
.col-btn:not(:disabled):hover { background: rgba(255,255,255,0.04); }
.col-btn:disabled { cursor: not-allowed; }

.board {
  background: var(--grid); border-radius: 18px; padding: 10px;
  border: 1px solid var(--border);
  box-shadow: 0 24px 64px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  display: grid; grid-template-columns: repeat(7, 68px); grid-template-rows: repeat(6, 68px); gap: 6px;
}
.cell {
  border-radius: 50%; background: var(--cell); cursor: pointer;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
  position: relative; overflow: hidden; transition: box-shadow 0.15s;
}
.cell:hover { box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.06); }
.cell .token {
  position: absolute; inset: 4px; border-radius: 50%;
  transform: scale(0); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cell.drop .token { transform: scale(1); }

/* token colors driven by CSS variables set dynamically */
.cell.p1 .token {
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--p1) 60%, white), var(--p1));
  box-shadow: 0 0 18px var(--p1-glow), inset 0 -3px 6px rgba(0,0,0,0.3);
}
.cell.p2 .token {
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--p2) 60%, white), var(--p2));
  box-shadow: 0 0 18px var(--p2-glow), inset 0 -3px 6px rgba(0,0,0,0.3);
}
.cell.winning .token { animation: win-pulse 0.7s ease-in-out infinite alternate; }
@keyframes win-pulse { from { transform: scale(1); } to { transform: scale(1.1); filter: brightness(1.3); } }

/* ── Result overlay ── */
.result-overlay {
  position: absolute; inset: 0; background: rgba(6,6,14,0.88);
  border-radius: 18px; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(10px);
}
.result-overlay.show { display: flex; }
.result-title { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(42px,8vw,64px); font-weight: 900; letter-spacing: 4px; text-align: center; line-height: 1; }
.result-elo { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 3px; }
.result-reason { font-size: 13px; color: var(--muted); }
.result-btns { display: flex; gap: 10px; margin-top: 4px; }
.btn-action {
  font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; padding: 12px 24px; border-radius: 10px;
  border: none; cursor: pointer; transition: all 0.2s; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-action.primary { background: var(--p1); color: #fff; box-shadow: 0 4px 20px var(--p1-glow); }
.btn-action.primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-action.ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
.btn-action.ghost:hover { border-color: var(--muted); color: var(--text); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanlines"></div>

<!-- Lobby overlay -->
<div class="lobby-overlay" id="lobby-overlay">
  <div class="lobby-players">
    <div class="lobby-player p1" id="lp1">
      <div class="lobby-avatar" id="lav1">?</div>
      <div class="lobby-pseudo" id="lpseudo1">—</div>
      <div class="lobby-elo"    id="lelo1">— ELO</div>
    </div>
    <div class="vs-col">
      <div class="vs-text">VS</div>
      <div class="countdown" id="countdown">3</div>
    </div>
    <div class="lobby-player p2" id="lp2">
      <div class="lobby-avatar" id="lav2">?</div>
      <div class="lobby-pseudo" id="lpseudo2">—</div>
      <div class="lobby-elo"    id="lelo2">— ELO</div>
    </div>
  </div>
</div>

<div class="page">
  <div class="top-bar">
    <div class="logo-sm">Puissance <span>4</span></div>
    <button class="btn-quit" onclick="quit()">✕ Quitter</button>
  </div>

  <div class="players-row">
    <div class="player-card p1" id="card-p1">
      <div class="pc-dot"></div>
      <div class="pc-info">
        <div class="pc-name" id="name-p1">Joueur 1</div>
        <div class="pc-elo"  id="elo-p1">— ELO</div>
      </div>
    </div>
    <div class="turn-mid">
      <div class="vs-sm">VS</div>
      <div class="turn-lbl" id="turn-lbl">—</div>
    </div>
    <div class="player-card p2" id="card-p2">
      <div class="pc-dot"></div>
      <div class="pc-info">
        <div class="pc-name" id="name-p2">Joueur 2</div>
        <div class="pc-elo"  id="elo-p2">— ELO</div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status"></div>

  <div class="board-wrap">
    <div class="col-buttons" id="col-btns"></div>
    <div class="board" id="board"></div>
    <div class="result-overlay" id="result-overlay">
      <div class="result-title"  id="result-title">VICTOIRE !</div>
      <div class="result-elo"    id="result-elo"></div>
      <div class="result-reason" id="result-reason"></div>
      <div class="result-btns">
        <button class="btn-action primary" onclick="sessionStorage.setItem('no_auto_queue','1');location.href='/'">⚡ Rejouer</button>
        <a class="btn-action ghost" id="btn-replay" href="#">📽️ Replay</a>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  SOUNDS — Web Audio API, aucun fichier externe
// ═══════════════════════════════════════════════════════════════════
const SFX = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }
  function beep(freq, dur, vol = 0.15, shape = 'sine', attack = 0.005) {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = shape;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      osc.start(c.currentTime); osc.stop(c.currentTime + dur);
    } catch(e) {}
  }
  return {
    drop()        { beep(300, 0.07, 0.14, 'triangle'); setTimeout(() => beep(200, 0.09, 0.07, 'triangle'), 55); },
    opponentDrop(){ beep(230, 0.07, 0.09, 'triangle'); setTimeout(() => beep(160, 0.09, 0.05, 'triangle'), 55); },
    tick()        { beep(900, 0.04, 0.07, 'square'); },
    go()          { [523,659,784].forEach((f,i) => setTimeout(() => beep(f, 0.25, 0.13), i*70)); },
    matchFound()  { [440,554,659].forEach((f,i) => setTimeout(() => beep(f, 0.35, 0.13), i*90)); },
    win()         { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.45, 0.14), i*110)); },
    lose()        { [392,349,311,261].forEach((f,i) => setTimeout(() => beep(f, 0.45, 0.12, 'sawtooth'), i*120)); },
    draw()        { beep(350, 0.18, 0.1, 'triangle'); setTimeout(() => beep(350, 0.18, 0.08, 'triangle'), 240); },
  };
})();

const ROWS = 6, COLS = 7;
let socket, myPlayer, mySide, gameId, currentTurn;
let gameOver  = false;
let lobbyData = null; // stocke le match_found pour startGame

// ── Helpers couleur ───────────────────────────────────────────────────────────
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function applyColors(c1, c2) {
  const root = document.documentElement;
  root.style.setProperty('--p1',      c1);
  root.style.setProperty('--p1-glow', hexToRgba(c1, 0.45));
  root.style.setProperty('--p1-dim',  hexToRgba(c1, 0.15));
  root.style.setProperty('--p2',      c2);
  root.style.setProperty('--p2-glow', hexToRgba(c2, 0.45));
  root.style.setProperty('--p2-dim',  hexToRgba(c2, 0.15));
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Lire depuis sessionStorage OU localStorage
  const pData = sessionStorage.getItem('player') || localStorage.getItem('player');
  const mData = sessionStorage.getItem('match');

  if (!pData) return location.href = '/';
  myPlayer = JSON.parse(pData);
  // S'assurer que sessionStorage est à jour
  sessionStorage.setItem('player', pData);

  if (mData) {
    const match = JSON.parse(mData);
    sessionStorage.removeItem('match');
    connectSocket(match);
  } else {
    // Pas de match en session → retour accueil SANS marquer de flag
    location.href = '/';
  }
});

// ── Socket ────────────────────────────────────────────────────────────────────
function connectSocket(pendingMatch) {
  socket = io({ transports: ['polling'] });

  socket.on('connect', () => {
    socket.emit('identify', { playerId: myPlayer.id });
  });

  socket.on('identified', (p) => {
    myPlayer = p;
    if (pendingMatch) {
      // Rejoindre la room côté serveur
      socket.emit('rejoin_game', { gameId: pendingMatch.gameId });
      // On setup le lobby côté client directement avec les données déjà connues
      // Sans attendre le serveur — on a déjà tout dans pendingMatch
      setupLobby(pendingMatch);
    }
  });

  // Serveur confirme le rejoin (optionnel, on l'ignore si lobby déjà setup)
  socket.on('game_rejoined', () => { /* déjà géré via setupLobby */ });
  socket.on('game_not_found', () => { sessionStorage.setItem('no_auto_queue','1'); location.href = '/'; });

  // match_found depuis la queue (cas où on arrive sans pendingMatch)
  socket.on('match_found', (d) => setupLobby(d));

  socket.on('move_played', onMovePlayed);
  socket.on('game_over',   onGameOver);
  socket.on('color_updated', ({ playerId, color }) => {
    // Adversaire a changé sa couleur en cours de partie
    if (!lobbyData) return;
    const side = lobbyData.players[1].id === playerId ? 1 : 2;
    lobbyData.players[side].color = color;
    applyColors(lobbyData.players[1].color, lobbyData.players[2].color);
  });
  socket.on('error', ({ message }) => {
    console.error('[Socket]', message);
    if (message === 'Aucune partie en cours.' || message === 'Partie inactive.') {
      sessionStorage.removeItem('match');
      alert('La partie a expiré (serveur redémarré). Retour à l\'accueil.');
      location.href = '/';
    }
  });
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
function setupLobby(data) {
  SFX.matchFound();
  lobbyData = data;
  gameId    = data.gameId;
  mySide    = data.yourSide;

  // Applique les couleurs des joueurs
  applyColors(data.players[1].color || '#ff2d55', data.players[2].color || '#ffd60a');

  [1,2].forEach(s => {
    const p = data.players[s];
    const lavEl = document.getElementById('lav' + s);
    if (p.avatar) {
      lavEl.innerHTML = `<img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else {
      lavEl.textContent = p.pseudo[0].toUpperCase();
    }
    document.getElementById('lpseudo'+ s).textContent = p.pseudo;
    document.getElementById('lelo'   + s).textContent = p.elo + ' ELO';
    if (s === mySide) {
      const badge = document.createElement('div');
      badge.className  = 'lobby-you';
      badge.textContent = 'TOI';
      document.getElementById('lp' + s).appendChild(badge);
    }
  });

  // Countdown — on affiche n, attend 1s, affiche n-1, etc.
  let n = data.startsIn || 3;
  const cdEl = document.getElementById('countdown');
  cdEl.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      SFX.go();
      startGame(data);
    } else {
      cdEl.textContent = n;
      SFX.tick();
    }
  }, 1000);
}

// ── Game start ────────────────────────────────────────────────────────────────
function startGame(data) {
  document.getElementById('lobby-overlay').classList.add('hidden');

  document.getElementById('name-p1').textContent = data.players[1].pseudo;
  document.getElementById('elo-p1').textContent  = data.players[1].elo + ' ELO';
  document.getElementById('name-p2').textContent = data.players[2].pseudo;
  document.getElementById('elo-p2').textContent  = data.players[2].elo + ' ELO';

  currentTurn = 1;
  gameOver    = false;
  renderBoard();
  updateTurnUI();
}

// ── Board ─────────────────────────────────────────────────────────────────────
function renderBoard() {
  const boardEl = document.getElementById('board');
  const colsEl  = document.getElementById('col-btns');
  boardEl.innerHTML = colsEl.innerHTML = '';

  for (let c = 0; c < COLS; c++) {
    const btn = document.createElement('button');
    btn.className = 'col-btn';
    btn.id        = 'cb' + c;
    btn.onclick   = () => playMove(c);
    colsEl.appendChild(btn);
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell  = document.createElement('div');
      cell.className    = 'cell';
      cell.dataset.row  = r;
      cell.dataset.col  = c;
      cell.onclick      = () => playMove(c);
      cell.appendChild(Object.assign(document.createElement('div'), { className: 'token' }));
      boardEl.appendChild(cell);
    }
  }
}

// ── Gameplay ──────────────────────────────────────────────────────────────────
function playMove(col) {
  if (gameOver || currentTurn !== mySide) return;
  SFX.drop();
  socket.emit('play_move', { col });
}

function onMovePlayed(data) {
  if (data.player === mySide) SFX.drop();
  else SFX.opponentDrop();
  applyToken(data.row, data.col, data.player);
  currentTurn = data.next;
  updateTurnUI();
}

function applyToken(row, col, player) {
  const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
  if (!cell) return;
  cell.classList.add('p' + player);
  void cell.offsetWidth;
  cell.classList.add('drop');
}

function updateTurnUI() {
  const isMe = currentTurn === mySide;
  document.getElementById('card-p1').classList.toggle('active', currentTurn === 1);
  document.getElementById('card-p2').classList.toggle('active', currentTurn === 2);

  for (let c = 0; c < COLS; c++) {
    const b = document.getElementById('cb' + c);
    if (b) b.disabled = !isMe || gameOver;
  }

  if (isMe) {
    document.getElementById('turn-lbl').textContent = '← TON TOUR';
    setStatus('');
  } else {
    document.getElementById('turn-lbl').textContent = 'ADVERSAIRE...';
    setStatus('<span class="dots">En attente<span>.</span><span>.</span><span>.</span></span>', true);
  }
}

// ── Game over ─────────────────────────────────────────────────────────────────
function onGameOver(data) {
  gameOver = true;

  if (data.winCells?.length) {
    data.winCells.forEach(([r,c]) => {
      const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      if (cell) cell.classList.add('winning');
    });
  }

  for (let c = 0; c < COLS; c++) {
    const b = document.getElementById('cb' + c);
    if (b) b.disabled = true;
  }
  setStatus('');

  const isWinner = data.winner === mySide;
  const isDraw   = data.reason === 'draw';
  setTimeout(() => { if (isDraw) SFX.draw(); else if (isWinner) SFX.win(); else SFX.lose(); }, 300);
  const eloD     = data.eloChanges?.[myPlayer.id] ?? 0;

  const titleEl = document.getElementById('result-title');
  if (isDraw) {
    titleEl.textContent = '⚖️ ÉGALITÉ';
    titleEl.style.background = 'linear-gradient(135deg, var(--muted), var(--text))';
  } else if (isWinner) {
    titleEl.textContent = '🏆 VICTOIRE !';
    titleEl.style.background = 'linear-gradient(135deg, var(--p1), var(--p2))';
  } else {
    titleEl.textContent = '💀 DÉFAITE';
    titleEl.style.background = 'linear-gradient(135deg, #555, #888)';
  }
  titleEl.style.webkitBackgroundClip = 'text';
  titleEl.style.webkitTextFillColor  = 'transparent';

  const eloEl = document.getElementById('result-elo');
  eloEl.textContent = (eloD >= 0 ? '+' : '') + eloD + ' ELO';
  eloEl.style.color = eloD >= 0 ? 'var(--p2)' : 'var(--muted)';

  if (data.reason === 'disconnect') {
    document.getElementById('result-reason').textContent = isWinner
      ? 'Adversaire déconnecté' : 'Déconnexion détectée';
  }

  document.getElementById('btn-replay').href = '/replay/' + data.gameId;
  document.getElementById('result-overlay').classList.add('show');
}

function setStatus(html, thinking = false) {
  const s = document.getElementById('status');
  s.innerHTML   = html;
  s.className   = 'status-bar' + (thinking ? ' thinking' : '');
}

function quit() {
  if (socket) socket.disconnect();
  sessionStorage.setItem('no_auto_queue', '1');
  location.href = '/';
}
</script>
