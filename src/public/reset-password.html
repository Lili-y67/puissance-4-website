<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — Nouveau mot de passe</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/w9nwQxm.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);--text:#eeeef5;--muted:rgba(238,238,245,0.38);--red:#ff2d55;--green:#30d158}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;display:flex;align-items:center;justify-content:center}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}
.card{position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;margin:20px}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:28px;text-decoration:none;color:var(--text);display:block}
.logo span{color:var(--red)}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.5}
.code-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.code-digit{width:48px;height:60px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;text-align:center;font-size:26px;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--text);outline:none;transition:border-color 0.2s}
.code-digit:focus{border-color:rgba(255,255,255,0.3)}
.field{margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color 0.2s}
input[type=password]:focus{border-color:rgba(255,255,255,0.2)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:var(--red);color:#fff;transition:opacity 0.2s;margin-top:8px}
.btn:hover{opacity:0.85}
.error{background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.3);color:#ff2d55;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center}
.success{background:rgba(48,209,88,0.1);border:1px solid rgba(48,209,88,0.3);color:var(--green);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center}
.back{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:1px}
.back:hover{color:var(--text)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanlines"></div>
<div class="card">
  <a class="logo" href="/">Puissance <span>4</span></a>
  <h1>Nouveau mot de passe</h1>
  <p class="sub">Entre le code à 6 chiffres reçu par DM Discord,<br>puis choisis ton nouveau mot de passe.</p>

  <div id="msg-box" style="display:none"></div>

  <div class="code-inputs">
    <input class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
  </div>

  <div class="field">
    <label>Nouveau mot de passe</label>
    <input type="password" id="pwd1" placeholder="Nouveau mot de passe...">
  </div>
  <div class="field">
    <label>Confirmer</label>
    <input type="password" id="pwd2" placeholder="Confirmer...">
  </div>

  <button class="btn" onclick="submit()">Réinitialiser</button>
  <a class="back" href="/forgot-password">← Recommencer</a>
</div>

<script>
const playerId = new URLSearchParams(location.search).get('playerId');
if (!playerId) location.href = '/forgot-password';

// Navigation entre les chiffres
const digits = document.querySelectorAll('.code-digit');
digits.forEach((el, i) => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(-1);
    if (el.value && i < 5) digits[i + 1].focus();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !el.value && i > 0) digits[i - 1].focus();
  });
  el.addEventListener('paste', e => {
    const text = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
    if (text.length === 6) {
      digits.forEach((d, j) => d.value = text[j] || '');
      digits[5].focus();
    }
    e.preventDefault();
  });
});

function showMsg(text, type) {
  const box = document.getElementById('msg-box');
  box.className = type;
  box.textContent = text;
  box.style.display = 'block';
}

async function submit() {
  const code = [...digits].map(d => d.value).join('');
  if (code.length < 6) return showMsg('Entre les 6 chiffres du code.', 'error');
  const pwd1 = document.getElementById('pwd1').value;
  const pwd2 = document.getElementById('pwd2').value;
  if (!pwd1 || pwd1.length < 4) return showMsg('Mot de passe trop court (4 caractères min).', 'error');
  if (pwd1 !== pwd2) return showMsg('Les mots de passe ne correspondent pas.', 'error');

  const res  = await fetch('/api/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ playerId, code, newPassword: pwd1 }),
  });
  const data = await res.json();
  if (data.ok) {
    showMsg('✅ Mot de passe changé ! Redirection...', 'success');
    setTimeout(() => location.href = '/', 2000);
  } else {
    showMsg(data.error || 'Erreur.', 'error');
  }
}
</script>
</body>
</html>
