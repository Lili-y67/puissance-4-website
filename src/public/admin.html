<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — Admin</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/gjrLtaU.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);--text:#eeeef5;--muted:rgba(238,238,245,0.38);--red:#ff2d55;--green:#30d158;--yellow:#ffd60a;--orange:#ff9f0a;--blue:#4c6ef5}
html,body{min-height:100%;background:var(--bg); background-attachment: fixed;color:var(--text);font-family:'Barlow',sans-serif}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}
.page{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:28px 20px 60px}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;z-index:2}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:380px}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:24px;color:var(--text)}
.logo span{color:var(--red)}
h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:20px}
input[type=password],input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color 0.2s;margin-bottom:12px}
input:focus{border-color:rgba(255,255,255,0.2)}
.btn{width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:opacity 0.2s}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{opacity:0.85}
.btn-sm{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:1px;border-radius:7px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;white-space:nowrap;transition:opacity 0.2s}
.btn-sm:hover{opacity:0.8}
.error-msg{background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.3);color:var(--red);border-radius:8px;padding:10px;font-size:13px;text-align:center;margin-bottom:12px}

/* Panel */
#panel{display:none}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px}
.nav-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;letter-spacing:3px;text-transform:uppercase}
.nav-title span{color:var(--red)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900}
.stat-lbl{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* Search */
.search-wrap{margin-bottom:16px}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;color:var(--text);font-size:14px;font-family:'Barlow',sans-serif;outline:none}
.search-input:focus{border-color:rgba(255,255,255,0.15)}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border)}
th{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 14px;text-align:left}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}

.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.badge-user{background:rgba(255,255,255,0.06);color:var(--muted)}
.badge-moderator{background:rgba(76,110,245,0.15);color:#8b9cf4;border:1px solid rgba(76,110,245,0.3)}
.badge-admin{background:rgba(255,45,85,0.15);color:var(--red);border:1px solid rgba(255,45,85,0.3)}
.badge-banned{background:rgba(255,45,85,0.15);color:var(--red)}
.badge-muted{background:rgba(255,159,10,0.15);color:var(--orange)}
.badge-suspect{background:rgba(255,159,10,0.1);color:var(--orange)}

.actions{display:flex;gap:6px;flex-wrap:wrap}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:380px}
.modal h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
.modal-btns{display:flex;gap:8px;margin-top:16px}

/* ── Mobile ── */
@media(max-width:640px){
  .table-wrap table { display: none; }
  .mobile-list { display: flex !important; }
  .search-input { width: 100% !important; }
  .page { padding: 16px 12px 60px; }
}
@media(min-width:641px){
  .mobile-list { display: none !important; }
}
.mobile-list {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
}
.mobile-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.mobile-card-info { flex: 1; min-width: 0; }
.mobile-card-pseudo {
  font-weight: 700; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mobile-card-sub {
  font-size: 11px; color: var(--muted); margin-top: 2px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.mobile-card-elo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 900; color: var(--yellow);
  flex-shrink: 0;
}
</style>
<script src="/themes.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanlines"></div>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">Puissance <span>4</span></div>
    <h2>🔐 Admin</h2>
    <div id="login-error" class="error-msg" style="display:none"></div>
    <input type="password" id="pwd-input" placeholder="Mot de passe admin..." onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-red" onclick="login()">Connexion</button>
  </div>
</div>

<!-- Panel -->
<div id="panel" class="page">
  <div class="nav">
    <div class="nav-title">⚡ <span>Admin</span> Panel</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="my-role-badge" style="padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:0.5px"></span>
      <input class="search-input" style="width:220px" id="search" placeholder="🔍 Rechercher un joueur..." oninput="filterPlayers()">
      <button class="btn-sm btn-red" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <!-- Onglets Joueurs / Parties -->
  <div style="display:flex;gap:6px;margin-bottom:14px;">
    <button id="tab-players-btn" onclick="switchAdminTab('players')"
      style="padding:8px 16px;border-radius:8px;border:none;background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;">
      👥 JOUEURS
    </button>
    <button id="tab-games-btn" onclick="switchAdminTab('games')"
      style="padding:8px 16px;border-radius:8px;border:none;background:rgba(255,255,255,0.05);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;">
      🎮 PARTIES
    </button>
  </div>

  <!-- Section Parties -->
  <div id="admin-games-section" style="display:none;margin-bottom:20px;">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
      <input class="search-input" id="games-search" placeholder="🔍 Rechercher par pseudo..." style="flex:1;"
        oninput="loadAdminGames()">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>J1</th><th>J2</th><th>Résultat</th><th>ELO</th>
          <th>Coups</th><th>Date</th><th>Actions</th>
        </tr></thead>
        <tbody id="games-body"></tbody>
      </table>
    </div>
    <div id="games-pagination-admin" style="display:flex;justify-content:center;gap:8px;margin-top:10px;"></div>
  </div>

  <div id="admin-players-section">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Joueur</th>
          <th>ELO</th>
          <th>W/L/D</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="players-body"></tbody>
    </table>
  </div>
  <div class="mobile-list" id="mobile-list"></div>
  </div><!-- /admin-players-section -->
</div>

<script>
let adminToken = sessionStorage.getItem('adminToken');
let myRole     = sessionStorage.getItem('adminRole') || 'admin'; // 'admin' ou 'moderator'
let allPlayers = [];

if (adminToken) showPanel();

async function login() {
  const pwd = document.getElementById('pwd-input').value;
  // Passer le token joueur pour détecter le rôle (moderator vs admin)
  const playerToken = localStorage.getItem('token') || null;
  const res  = await fetch('/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pwd, playerToken }),
  });
  const data = await res.json();
  if (data.token) {
    adminToken = data.token;
    myRole     = data.role || 'admin';
    sessionStorage.setItem('adminToken', adminToken);
    sessionStorage.setItem('adminRole', myRole);
    showPanel();
  } else {
    const err = document.getElementById('login-error');
    err.textContent = data.error || 'Erreur.';
    err.style.display = 'block';
  }
}

function logout() {
  sessionStorage.removeItem('adminToken');
  sessionStorage.removeItem('adminRole');
  location.reload();
}

async function showPanel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  // Récupérer le rôle depuis /api/admin/me si déjà connecté
  try {
    const me = await api('GET', '/api/admin/me');
    if (me.role) { myRole = me.role; sessionStorage.setItem('adminRole', myRole); }
  } catch(e) {}
  // Afficher badge rôle dans le header
  const roleEl = document.getElementById('my-role-badge');
  if (roleEl) {
    roleEl.textContent = myRole === 'admin' ? '🔴 Admin' : '🛡️ Modérateur';
    roleEl.style.background = myRole === 'admin' ? 'rgba(255,45,85,0.15)' : 'rgba(76,110,245,0.15)';
    roleEl.style.color      = myRole === 'admin' ? '#ff2d55' : '#8b9cf4';
  }
  await loadPlayers();
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

async function loadPlayers() {
  const data = await api('GET', '/api/admin/players');
  if (!Array.isArray(data)) { logout(); return; }
  allPlayers = data;
  renderStats();
  renderPlayers(allPlayers);
}

function renderStats() {
  const total    = allPlayers.length;
  const banned   = allPlayers.filter(p => p.banned).length;
  const muted    = allPlayers.filter(p => p.muted_until && p.muted_until > Date.now()).length;
  const suspect  = allPlayers.filter(p => p.suspicious).length;
  const mods     = allPlayers.filter(p => p.role === 'moderator' || p.role === 'admin').length;

  document.getElementById('stats-row').innerHTML = [
    { val: total,   lbl: 'Joueurs',   color: 'var(--text)' },
    { val: mods,    lbl: 'Staff',     color: '#8b9cf4' },
    { val: suspect, lbl: 'Suspects',  color: 'var(--orange)' },
    { val: muted,   lbl: 'Mutés',     color: 'var(--yellow)' },
    { val: banned,  lbl: 'Bannis',    color: 'var(--red)' },
  ].map(s => `
    <div class="stat-card">
      <div class="stat-val" style="color:${s.color}">${s.val}</div>
      <div class="stat-lbl">${s.lbl}</div>
    </div>
  `).join('');
}

function filterPlayers() {
  const q = document.getElementById('search').value.toLowerCase();
  renderPlayers(q ? allPlayers.filter(p => p.pseudo.toLowerCase().includes(q)) : allPlayers);
}

function onlineDot(online) {
  return online
    ? `<span title="En ligne" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 5px #30d158;margin-right:3px;vertical-align:middle"></span>`
    : `<span title="Hors ligne" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#636366;margin-right:3px;vertical-align:middle"></span>`;
}
function discordBadge(linked) {
  return linked
    ? `<span title="Discord lié" style="font-size:13px">🔗</span>`
    : `<span title="Discord non lié" style="font-size:13px;opacity:0.3">🔗</span>`;
}

function renderPlayers(players) {
  const now = Date.now();

  // ── Rendu mobile (cartes) ──
  document.getElementById('mobile-list').innerHTML = players.map((p) => {
    const isMuted  = p.muted_until && p.muted_until > now;
    const flags = [
      p.banned     ? '<span class="badge badge-banned">🚫</span>' : '',
      isMuted      ? '<span class="badge badge-muted">🔇</span>' : '',
      p.suspicious ? '<span class="badge badge-suspect">⚠️</span>' : '',
    ].filter(Boolean).join('');
    return `<div class="mobile-card">
      <div class="mobile-card-info">
        <div class="mobile-card-pseudo">
          ${onlineDot(p.online)}${p.pseudo}
          <span class="badge badge-${p.role}" style="font-size:10px">${p.role}</span>
          ${discordBadge(p.discord_linked)} ${flags}
        </div>
        <div class="mobile-card-sub">
          <span>ID ${p.id}</span>
          <span style="color:var(--muted)">·</span>
          <span>${p.wins}V ${p.losses}D ${p.draws}N</span>
        </div>
      </div>
      <div class="mobile-card-elo">${p.elo}</div>
      <button class="btn-sm" style="background:rgba(76,110,245,0.15);color:#8b9cf4;flex-shrink:0" onclick="openModal(${p.id},'${p.pseudo.replace(/'/g,"\\'")}','${p.role}',${p.banned},${isMuted?p.muted_until:0},${p.suspicious})">✏️</button>
    </div>`;
  }).join('');

  document.getElementById('players-body').innerHTML = players.map((p, i) => {
    const isMuted  = p.muted_until && p.muted_until > now;
    const muteLeft = isMuted ? Math.ceil((p.muted_until - now) / 60000) + 'min' : '';
    const statusBadges = [
      p.banned     ? `<span class="badge badge-banned">🚫 Banni</span>` : '',
      isMuted      ? `<span class="badge badge-muted">🔇 Muté ${muteLeft}</span>` : '',
      p.suspicious ? `<span class="badge badge-suspect">⚠️ Suspect</span>` : '',
    ].filter(Boolean).join(' ') || '<span style="color:var(--muted);font-size:12px">—</span>';

    return `<tr>
      <td style="color:var(--muted)">#${i+1}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          ${onlineDot(p.online)}
          <div>
            <a href="/profil?id=${p.id}" target="_blank" style="color:var(--text);text-decoration:none;font-weight:600">${p.pseudo}</a>
            <div style="font-size:11px;color:var(--muted)">ID ${p.id}</div>
          </div>
          ${discordBadge(p.discord_linked)}
        </div>
      </td>
      <td><strong>${p.elo}</strong></td>
      <td style="color:var(--muted)">${p.wins}/${p.losses}/${p.draws}</td>
      <td><span class="badge badge-${p.role}">${p.role}</span></td>
      <td>${statusBadges}</td>
      <td>
        <div class="actions">
          <button class="btn-sm" style="background:rgba(76,110,245,0.15);color:#8b9cf4" onclick="openModal(${p.id},'${p.pseudo.replace(/'/g,"\\'")}','${p.role}',${p.banned},${isMuted?p.muted_until:0},${p.suspicious})">✏️ Gérer</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openModal(id, pseudo, role, banned, mutedUntil, suspicious) {
  const now    = Date.now();
  const isMuted = mutedUntil > now;

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'admin-modal';
  modal.innerHTML = `
    <div class="modal">
      <h3>✏️ ${pseudo}</h3>

      <div style="margin-bottom:14px">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Pseudo</div>
        <div style="display:flex;gap:8px">
          <input type="text" id="new-pseudo" value="${pseudo}" style="flex:1;margin-bottom:0;padding:9px 12px;font-size:13px">
          <button class="btn-sm" style="background:rgba(76,110,245,0.15);color:#8b9cf4" onclick="changePseudo(${id})">OK</button>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Rôle</div>
        <div style="display:flex;gap:6px">
          ${['user','moderator','admin'].map(r => `
            <button class="btn-sm" style="flex:1;background:${r===role?'rgba(76,110,245,0.25)':'rgba(255,255,255,0.05)'};color:${r===role?'#8b9cf4':'var(--muted)'}" onclick="changeRole(${id},'${r}')">${r}</button>
          `).join('')}
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Reset ELO</div>
        <div style="display:flex;gap:8px">
          <input type="number" id="new-elo" value="1000" min="0" max="9999" style="flex:1;margin-bottom:0;padding:9px 12px;font-size:13px">
          <button class="btn-sm" style="background:rgba(255,214,10,0.15);color:var(--yellow)" onclick="resetElo(${id})">Reset</button>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Mute (heures)</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${[1,6,24,72].map(h => `<button class="btn-sm" style="background:rgba(255,159,10,0.12);color:var(--orange)" onclick="mute(${id},${h})">${h}h</button>`).join('')}
          ${isMuted ? `<button class="btn-sm" style="background:rgba(48,209,88,0.12);color:var(--green)" onclick="mute(${id},0)">Unmute</button>` : ''}
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn-sm" style="flex:1;background:${banned?'rgba(48,209,88,0.12)':'rgba(255,45,85,0.12)'};color:${banned?'var(--green)':'var(--red)'}" onclick="toggleBan(${id},${banned})">
          ${banned ? '✅ Débannir' : '🚫 Bannir'}
        </button>
        ${suspicious ? `<button class="btn-sm" style="flex:1;background:rgba(48,209,88,0.12);color:var(--green)" onclick="clearSuspicious(${id})">✅ Retirer suspect</button>` : ''}
      </div>

      <button class="btn-sm" style="width:100%;background:rgba(255,255,255,0.04);color:var(--muted)" onclick="document.getElementById('admin-modal').remove()">Fermer</button>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

async function changePseudo(id) {
  const pseudo = document.getElementById('new-pseudo').value.trim();
  if (!pseudo) return;
  const data = await api('PATCH', `/api/admin/players/${id}/pseudo`, { pseudo });
  if (data.ok) { closeAndReload(); } else alert(data.error);
}

async function changeRole(id, role) {
  await api('PATCH', `/api/admin/players/${id}/role`, { role });
  closeAndReload();
}

async function resetElo(id) {
  const elo = Number(document.getElementById('new-elo').value);
  await api('PATCH', `/api/admin/players/${id}/elo`, { elo });
  closeAndReload();
}

async function mute(id, hours) {
  await api('PATCH', `/api/admin/players/${id}/mute`, { hours });
  closeAndReload();
}

async function toggleBan(id, banned) {
  await api('PATCH', `/api/admin/players/${id}/ban`, { banned: !banned });
  closeAndReload();
}

async function clearSuspicious(id) {
  await api('PATCH', `/api/admin/players/${id}/suspicious`, {});
  closeAndReload();
}

function closeAndReload() {
  document.getElementById('admin-modal')?.remove();
  loadPlayers();
}

// ── Onglets Admin ──────────────────────────────────────────────────────────────
let currentAdminTab = 'players';
function switchAdminTab(tab) {
  currentAdminTab = tab;
  const isPlayers = tab === 'players';
  document.getElementById('admin-players-section').style.display = isPlayers ? 'block' : 'none';
  document.getElementById('admin-games-section').style.display   = isPlayers ? 'none'  : 'block';
  document.getElementById('tab-players-btn').style.background    = isPlayers ? 'var(--red)' : 'rgba(255,255,255,0.05)';
  document.getElementById('tab-players-btn').style.color         = isPlayers ? '#fff' : 'var(--muted)';
  document.getElementById('tab-games-btn').style.background      = isPlayers ? 'rgba(255,255,255,0.05)' : 'rgba(76,110,245,0.2)';
  document.getElementById('tab-games-btn').style.color           = isPlayers ? 'var(--muted)' : '#8b9cf4';
  if (tab === 'games') loadAdminGames();
}

// ── Gestion des parties ────────────────────────────────────────────────────────
let adminGamesOffset = 0;
const ADMIN_GAMES_LIMIT = 25;

async function loadAdminGames() {
  adminGamesOffset = 0;
  await fetchAdminGames(0);
}

async function fetchAdminGames(offset) {
  const q = document.getElementById('games-search')?.value?.trim() || '';
  let url  = `/api/admin/games?limit=${ADMIN_GAMES_LIMIT}&offset=${offset}`;
  if (q) url += '&search=' + encodeURIComponent(q);
  const games = await api('GET', url);
  renderAdminGames(games, offset);
}

function renderAdminGames(games, offset) {
  const tbody = document.getElementById('games-body');
  if (!games.length && offset === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">Aucune partie trouvée</td></tr>';
    document.getElementById('games-pagination-admin').innerHTML = '';
    return;
  }

  tbody.innerHTML = games.map(g => {
    const isP1Win  = g.winner_id === g.player1_id;
    const isP2Win  = g.winner_id === g.player2_id;
    const isDraw   = g.winner_id === null;
    const res      = isDraw ? '⚖️ Nul' : (isP1Win ? `✅ ${g.p1_pseudo}` : `✅ ${g.p2_pseudo}`);
    const d1       = g.elo_p1 != null ? (g.elo_p1 >= 0 ? '+' : '') + g.elo_p1 : '—';
    const d2       = g.elo_p2 != null ? (g.elo_p2 >= 0 ? '+' : '') + g.elo_p2 : '—';
    const date     = g.finished_at ? new Date(g.finished_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    const canRevert= !g.reverted && g.elo_before_p1 != null;
    const revertedBadge = g.reverted ? '<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(255,159,10,0.15);color:#ff9f0a;border:1px solid rgba(255,159,10,0.3)">REVERT</span> ' : '';
    const suspBadge= g.suspicious ? '<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(255,214,10,0.1);color:#ffd60a;">⚠️</span> ' : '';
    return `<tr>
      <td style="color:var(--muted);font-size:11px">${revertedBadge}${suspBadge}#${g.id}</td>
      <td><strong>${g.p1_pseudo}</strong></td>
      <td><strong>${g.p2_pseudo}</strong></td>
      <td style="font-size:12px">${res}</td>
      <td style="font-size:11px;color:var(--muted)">${d1} / ${d2}</td>
      <td>${g.move_count || 0}</td>
      <td style="font-size:11px;color:var(--muted)">${date}</td>
      <td style="display:flex;gap:4px;">
        <a href="/replay/${g.id}" target="_blank" class="btn-sm" style="background:rgba(76,110,245,0.15);color:#8b9cf4;text-decoration:none">▶</a>
        ${canRevert ? `<button class="btn-sm" style="background:rgba(255,159,10,0.15);color:#ff9f0a;border:1px solid rgba(255,159,10,0.3)" onclick="confirmRevert(${g.id},'${g.p1_pseudo}','${g.p2_pseudo}',${g.elo_before_p1},${g.elo_before_p2})">↩ Revert</button>` : ''}
      </td>
    </tr>`;
  }).join('');

  // Pagination
  const pgEl = document.getElementById('games-pagination-admin');
  const hasPrev = offset > 0;
  const hasNext = games.length === ADMIN_GAMES_LIMIT;
  pgEl.innerHTML = [
    hasPrev ? `<button class="btn-sm" onclick="fetchAdminGames(${offset - ADMIN_GAMES_LIMIT})" style="background:rgba(255,255,255,0.05);color:var(--muted)">◀ Précédent</button>` : '',
    hasNext ? `<button class="btn-sm" onclick="fetchAdminGames(${offset + ADMIN_GAMES_LIMIT})" style="background:rgba(255,255,255,0.05);color:var(--muted)">Suivant ▶</button>` : '',
  ].join('');
}

function confirmRevert(gameId, p1, p2, eloBefore1, eloBefore2) {
  if (!confirm(`Revert la partie #${gameId} ?

${p1} → ${eloBefore1} ELO
${p2} → ${eloBefore2} ELO

Cette action est irréversible.`)) return;
  doRevert(gameId);
}

async function doRevert(gameId) {
  try {
    const res = await api('POST', `/api/admin/games/${gameId}/revert`, {});
    alert(`✅ Revert effectué !
${res.p1.pseudo} → ${res.p1.eloBefore} ELO
${res.p2.pseudo} → ${res.p2.eloBefore} ELO`);
    loadAdminGames();
  } catch(e) {
    alert('❌ Erreur : ' + (e.message || 'Inconnue'));
  }
}

// ── Boost ELO Global ──────────────────────────────────────────────────────────
function switchBoostTab(tab) {
  const isGlobal = tab === 'global';
  document.getElementById('boost-panel-global').style.display = isGlobal ? 'block' : 'none';
  document.getElementById('boost-panel-vip').style.display    = isGlobal ? 'none'  : 'block';
  document.getElementById('boost-tab-global').style.background = isGlobal ? 'var(--yellow)' : 'rgba(255,255,255,0.05)';
  document.getElementById('boost-tab-global').style.color      = isGlobal ? '#000' : 'var(--muted)';
  document.getElementById('boost-tab-vip').style.background    = isGlobal ? 'rgba(255,255,255,0.05)' : 'rgba(255,214,10,0.2)';
  document.getElementById('boost-tab-vip').style.color         = isGlobal ? 'var(--muted)' : 'var(--yellow)';
  if (!isGlobal) loadVipBoosts();
}

async function loadVipBoosts() {
  try {
    const boosts = await api('GET', '/api/admin/vip-boosts');
    const el = document.getElementById('vip-boosts-list');
    if (!boosts.length) {
      el.innerHTML = '<div style="color:var(--muted);font-size:13px;">Aucun boost VIP actif en ce moment.</div>';
      return;
    }
    el.innerHTML = boosts.map(b => {
      const color = b.color || '#ffd60a';
      const av = b.avatar && b.avatar.startsWith('http')
        ? `<img src="${b.avatar}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">`
        : `<div style="width:28px;height:28px;border-radius:50%;background:${color}22;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:${color};">${(b.pseudo||'?')[0].toUpperCase()}</div>`;
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,214,10,0.05);border:1px solid rgba(255,214,10,0.15);border-radius:10px;">
        ${av}
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px;">${b.pseudo}</div>
          <div style="font-size:11px;color:var(--muted);">${b.elo} ELO</div>
        </div>
        <div style="text-align:right;">
          <div style="color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;">⚡ x1.2</div>
          <div style="font-size:10px;color:var(--muted);">${b.remainingMin} min restantes</div>
        </div>
      </div>`;
    }).join('');
  } catch(e) { document.getElementById('vip-boosts-list').innerHTML = '<div style="color:var(--red)">Erreur chargement</div>'; }
}

async function loadBoostStatus() {
  try {
    const data = await api('GET', '/api/admin/boost');
    const el = document.getElementById('boost-status');
    if (!el) return;
    if (data.multiplier > 1) {
      el.innerHTML = `<span style="color:var(--yellow)">⚡ Boost actif : <strong>${data.multiplier}x</strong></span>`;
      document.getElementById('boost-slider').value = data.multiplier;
      document.getElementById('boost-val').textContent = parseFloat(data.multiplier).toFixed(1) + 'x';
    } else {
      el.innerHTML = '<span style="color:var(--muted)">Aucun boost actif (x1.0)</span>';
    }
  } catch(e) {}
}
async function setBoost(mult) {
  try {
    await api('POST', '/api/admin/boost', { multiplier: mult });
    await loadBoostStatus();
    const t = document.createElement('div');
    t.textContent = mult > 1 ? `⚡ Boost x${mult} activé !` : '✕ Boost désactivé';
    Object.assign(t.style, {position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',background:'#1a1a2e',border:'1px solid rgba(255,255,255,0.1)',color:'#eeeef5',padding:'10px 20px',borderRadius:'10px',fontSize:'13px',zIndex:'9999'});
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
  } catch(e) {}
}

</script>
</body>
