<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 - Replay</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/gjrLtaU.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);
  --red:#ff2d55;--red-dim:rgba(255,45,85,0.12);--red-glow:rgba(255,45,85,0.4);
  --yellow:#ffd60a;--yel-dim:rgba(255,214,10,0.1);--yel-glow:rgba(255,214,10,0.4);
  --text:#eeeef5;--muted:rgba(238,238,245,0.38);--accent:#4c6ef5;
  --grid:#0a0a18;--cell:#07071a;
  /* Couleurs dynamiques des joueurs (injectÃ©es par JS) */
  --p1-color:#ff2d55;--p1-glow:rgba(255,45,85,0.4);
  --p2-color:#ffd60a;--p2-glow:rgba(255,214,10,0.4);
}
html,body{min-height:100%;background:var(--bg); background-attachment: fixed;color:var(--text);font-family:'Barlow',sans-serif;overflow-x:hidden;}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);}

.page{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;}

/* â”€â”€ Nav â”€â”€ */
.nav{width:100%;display:flex;align-items:center;justify-content:space-between;}
.logo-sm{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;text-decoration:none;color:var(--text);}
.logo-sm span{color:var(--red);}
.btn-back{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:7px 16px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;text-decoration:none;transition:all 0.2s;}
.btn-back:hover{border-color:var(--muted);color:var(--text);}

/* â”€â”€ Replay header â”€â”€ */
.replay-header{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;
  display:flex;flex-direction:column;gap:10px;
  animation:slide-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes slide-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.replay-vs{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.rp{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.rp-dot{width:14px;height:14px;border-radius:50%;}
.rp.p1 .rp-dot{background:var(--p1-color);box-shadow:0 0 8px var(--p1-glow);}
.rp.p2 .rp-dot{background:var(--p2-color);box-shadow:0 0 8px var(--p2-glow);}
.rp-name{font-weight:600;font-size:14px;}
.rp-elo{font-size:11px;color:var(--muted);}
.rp-result{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;padding:4px 10px;border-radius:6px;margin-top:2px;}
.rp.winner .rp-result{background:rgba(255,214,10,0.1);color:var(--yellow);border:1px solid rgba(255,214,10,0.3);}
.rp.loser  .rp-result{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,45,85,0.2);}
.rp.draw   .rp-result{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}

.vs-mid{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--muted);letter-spacing:3px;flex-shrink:0;}

.replay-meta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.rmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.rmeta strong{color:var(--text);font-weight:600;}

/* â”€â”€ Progress bar â”€â”€ */
.progress-wrap{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.progress-top{display:flex;justify-content:space-between;align-items:center;}
.progress-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.progress-count{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;}
.progress-bar-bg{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--yellow));transition:width 0.3s ease;}

/* â”€â”€ Think timer â”€â”€ */
.think-box{
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px;
  min-height:44px;width:100%;
}
.think-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:all 0.3s;}
.think-dot.p1{background:var(--p1-color);box-shadow:0 0 8px var(--p1-glow);}
.think-dot.p2{background:var(--p2-color);box-shadow:0 0 8px var(--p2-glow);}
.think-text{font-size:13px;color:var(--muted);}
.think-timer{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;color:var(--text);min-width:48px;text-align:right;}

/* â”€â”€ Board â”€â”€ */
.board-wrap{position:relative;}
.board{
  background:var(--grid);border-radius:18px;padding:10px;
  border:1px solid var(--border);
  box-shadow:0 24px 64px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.04);
  display:grid;
  grid-template-columns:repeat(7,68px);
  grid-template-rows:repeat(6,68px);
  gap:6px;
}
.cell{
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.06), rgba(7,7,26,0.96) 72%);
  box-shadow:
    inset 0 3px 10px rgba(0,0,0,0.7),
    inset 0 1px 3px rgba(0,0,0,0.5),
    inset 0 0 0 1px rgba(255,255,255,0.07),
    0 0 0 1px rgba(255,255,255,0.08);
  position:relative;
  overflow:hidden;
}
.cell .token{position:absolute;inset:4px;border-radius:50%;transform:scale(0);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.cell.drop .token{transform:scale(1);}
.cell.p1 .token{background:linear-gradient(135deg,var(--p1-secondary,var(--p1-light,#ff6b85)),var(--p1-color,#ff2d55));box-shadow:0 0 18px var(--p1-glow),inset 0 -3px 6px rgba(0,0,0,0.3);}
.cell.p2 .token{background:linear-gradient(135deg,var(--p2-secondary,var(--p2-light,#ffe566)),var(--p2-color,#ffd60a));box-shadow:0 0 18px var(--p2-glow),inset 0 -3px 6px rgba(0,0,0,0.3);}
.cell.highlight{box-shadow:inset 0 3px 8px rgba(0,0,0,0.6),inset 0 0 0 1px rgba(255,255,255,0.12),0 0 0 2px rgba(255,255,255,0.15);}
.cell.winning .token{animation:win-pulse 0.7s ease-in-out infinite alternate;}
@keyframes win-pulse{from{transform:scale(1)}to{transform:scale(1.1);filter:brightness(1.4);}}

/* â”€â”€ End screen â”€â”€ */
.end-card{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
  display:none;flex-direction:column;align-items:center;gap:12px;text-align:center;
}
.end-card.show{display:flex;}
.end-title{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:900;letter-spacing:4px;line-height:1;}
.end-sub{font-size:13px;color:var(--muted);}
.end-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.btn-action{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:11px 22px;border-radius:10px;border:none;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-action.primary{background:var(--red);color:#fff;box-shadow:0 4px 20px var(--red-glow);}
.btn-action.primary:hover{background:#ff4567;transform:translateY(-1px);}
.btn-action.ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);}
.btn-action.ghost:hover{border-color:var(--muted);color:var(--text);}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;}

/* â•â• ANALYSE â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
/* Overlay sÃ©quence optimale sur le plateau */
.cell.seq-highlight::after {
  content: attr(data-seq-num);
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 900; color: #fff;
  border-radius: inherit;
  pointer-events: none; z-index: 5;
}
.cell.seq-played { outline: 3px solid rgba(255,255,255,0.5); outline-offset: -3px; }
.cell.play-focus .token{animation:inspect-pop 0.5s cubic-bezier(0.22,1,0.36,1);}
.cell.seq-current{animation:seq-cell-pulse .72s ease-in-out infinite alternate;}
.cell.seq-current::before{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid rgba(48,209,88,.75);box-shadow:0 0 18px rgba(48,209,88,.45);z-index:4;pointer-events:none;}
.cell.seq-opt-0  { background: rgba(48,209,88,0.45) !important; box-shadow: inset 0 0 12px rgba(48,209,88,0.6); }
.cell.seq-opt-1  { background: rgba(48,209,88,0.30) !important; }
.cell.seq-opt-2  { background: rgba(48,209,88,0.20) !important; }
.cell.seq-opt-3  { background: rgba(48,209,88,0.13) !important; }
.cell.seq-opt-4  { background: rgba(48,209,88,0.08) !important; }
@keyframes inspect-pop{
  0%{transform:scale(0.86);filter:brightness(0.95);}
  55%{transform:scale(1.18);filter:brightness(1.18);}
  100%{transform:scale(1);filter:brightness(1);}
}
@keyframes seq-cell-pulse{
  from{filter:brightness(1);transform:scale(1);}
  to{filter:brightness(1.25);transform:scale(1.035);}
}
/* Badge info au-dessus du plateau quand on inspecte un coup */
.board-inspect-bar {
  width: 100%; padding: 8px 14px;
  background: rgba(76,110,245,0.1); border: 1px solid rgba(76,110,245,0.25);
  border-radius: 10px; font-size: 12px; color: #8b9cf4;
  display: none; align-items: center; justify-content: space-between; gap: 8px;
}
.board-inspect-bar.show { display: flex; }
.analyse-btn{width:100%;padding:12px;border-radius:12px;background:rgba(76,110,245,0.1);border:1px solid rgba(76,110,245,0.25);color:#8b9cf4;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.analyse-btn:hover{background:rgba(76,110,245,0.2);border-color:rgba(76,110,245,0.45);}
.analyse-btn:disabled{opacity:0.4;cursor:not-allowed;}
.analyse-controls{display:none;width:100%;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;}
.analyse-controls.show{display:grid;}
.analyse-depth-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.analyse-depth-select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.analyse-mini-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35;}

.analyse-progress-wrap{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:none;}
.analyse-progress-wrap.show{display:block;}
.analyse-progress-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.analyse-progress-bar-bg{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.analyse-progress-bar-fill{height:100%;background:linear-gradient(90deg,#4c6ef5,#8b9cf4);border-radius:2px;width:0%;transition:width 0.3s;}
.analyse-progress-text{font-size:11px;color:var(--muted);text-align:right;}

.analyse-panel{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;display:none;flex-direction:column;gap:16px;}
.analyse-panel.show{display:flex;}

/* PrÃ©cision globale */
.accuracy-row{display:flex;gap:12px;}
.accuracy-card{flex:1;padding:14px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;text-align:center;}
.accuracy-pct{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;letter-spacing:1px;line-height:1;}
.accuracy-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.accuracy-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}

/* RÃ©sumÃ© des coups */
.move-summary{display:flex;gap:6px;flex-wrap:wrap;}
.summary-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px;}
.summary-stat{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);}
.summary-stat-k{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.summary-stat-v{margin-top:4px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;}

/* Liste des coups analysÃ©s */
.analyse-moves{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow-y:auto;}
.analyse-move{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid transparent;cursor:pointer;transition:all 0.15s;}
.analyse-move:hover{background:rgba(255,255,255,0.05);border-color:var(--border);}
.analyse-move.highlighted{background:rgba(76,110,245,0.1);border-color:rgba(76,110,245,0.3);}
.am-num{font-size:11px;color:var(--muted);width:24px;flex-shrink:0;text-align:center;}
.am-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.am-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.am-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.am-col{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;}
.am-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;flex-shrink:0;}
.am-metrics{display:flex;flex-wrap:wrap;gap:6px;}
.am-metric{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);font-size:10px;letter-spacing:0.4px;color:var(--muted);}
.am-metric strong{color:var(--text);font-weight:700;}
.eval-score{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.5px;min-width:54px;text-align:right;flex-shrink:0;}
.eval-score.pos{color:#30d158;}
.eval-score.neg{color:#ff2d55;}
.eval-score.neu{color:var(--muted);}
.am-comment{font-size:11px;color:var(--muted);line-height:1.45;}
.variant-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.variant-chip{padding:5px 8px;border-radius:999px;background:rgba(133,235,255,.06);border:1px solid rgba(133,235,255,.14);font-size:10px;color:rgba(238,238,245,.72);}
.variant-chip strong{color:#85ebff;}

/* Couleurs des classifications */
.cls-best      {background:rgba(48,209,88,0.15);color:#30d158;border:1px solid rgba(48,209,88,0.3);}
.cls-excellent {background:rgba(100,210,120,0.12);color:#64d278;border:1px solid rgba(100,210,120,0.25);}
.cls-good      {background:rgba(76,110,245,0.15);color:#8b9cf4;border:1px solid rgba(76,110,245,0.3);}
.cls-forced{background:rgba(150,150,150,0.12);color:#aaaaaa;border:1px solid rgba(150,150,150,0.25);}
.cls-inaccuracy{background:rgba(255,214,10,0.12);color:#ffd60a;border:1px solid rgba(255,214,10,0.25);}
.cls-mistake   {background:rgba(255,159,10,0.12);color:#ff9f0a;border:1px solid rgba(255,159,10,0.25);}
.cls-blunder   {background:rgba(255,45,85,0.15);color:#ff2d55;border:1px solid rgba(255,45,85,0.3);}

@media (max-width: 760px){
  .page{max-width:100%;padding:16px 10px 30px;gap:12px}
  .nav{flex-direction:column;align-items:stretch;gap:10px}
  .logo-sm{text-align:center}
  .btn-back{width:100%;text-align:center}
  .replay-header{padding:14px 12px}
  .replay-vs{flex-direction:column;gap:10px}
  .vs-mid{font-size:18px}
  .replay-meta{justify-content:flex-start;gap:8px 14px}
  .progress-wrap,.think-box,.end-card,.analyse-panel{padding:14px 12px}
  .analyse-controls{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));width:min(100vw - 20px,560px);aspect-ratio:7/6;gap:5px;padding:8px}
  .cell .token{inset:3px}
  .accuracy-row{flex-direction:column}
  .analyse-moves{max-height:none}
  .end-btns{width:100%;flex-direction:column}
  .end-btns > *{width:100%;justify-content:center}
}
@media (max-width: 480px){
  .page{padding:12px 8px 24px}
  .rp-name{font-size:13px}
  .rmeta{font-size:11px}
  .progress-top{flex-direction:column;align-items:flex-start;gap:4px}
  .think-box{flex-wrap:wrap;justify-content:flex-start}
  .board{width:min(100vw - 16px,420px);gap:4px;padding:6px;border-radius:14px}
  .analyse-move{padding:10px}
  .am-head{gap:6px}
  .am-metrics{gap:4px}
  .analyse-move{flex-wrap:wrap}
  .am-num{width:auto}
  .eval-score{min-width:0;width:100%;text-align:left}
  .board-inspect-bar{align-items:flex-start;flex-direction:column}
}

</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanlines"></div>

<div class="page">
  <nav class="nav">
    <a class="logo-sm" href="/">Puissance <span>4</span></a>
    <a class="btn-back" id="back-btn" href="/profil">&#8592; Profil</a>
  </nav>

  <div id="content"><div class="loading">Chargement du replay...</div></div>
</div>

<script>
const ROWS = 6, COLS = 7;
let moves = [], gameData = null;
let moveIndex = 0;
let replayTimeout = null;
// Cap think time for replay: min 400ms, max 3000ms (to not bore the viewer)
const MIN_THINK = 400;
const MAX_THINK = 3000;
let replaySpeed = 1; // multiplicateur de vitesse

// â”€â”€ Board state â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let board = Array.from({length:ROWS}, () => Array(COLS).fill(0));

function getGameId() {
  const parts = location.pathname.split('/');
  return parts[parts.length - 1];
}

async function init() {
  const id = getGameId();
  try {
    const res = await fetch(`/api/games/${id}/moves`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    gameData = data.game;
    moves    = data.moves;

    // DÃ©tecter si c'est une partie bot
    const botRes = await fetch('/api/bot-id').catch(() => null);
    const botData = botRes?.ok ? await botRes.json() : null;
    const botId   = botData?.id;
    const isBot   = botId && (gameData.player2_id === botId || gameData.player1_id === botId);

    // Adapter le pseudo du bot pour l'affichage
    if (isBot) {
      if (gameData.player2_id === botId) {
        gameData.p2_pseudo = 'Bot ' + (gameData.p2_pseudo || 'Puissance4-AI');
        gameData.p2_elo_display = 'IA';
      } else {
        gameData.p1_pseudo = 'Bot ' + (gameData.p1_pseudo || 'Puissance4-AI');
        gameData.p1_elo_display = 'IA';
      }
    }

    // Update back link if player in session
    const saved = sessionStorage.getItem('player');
    if (saved) {
      const p = JSON.parse(saved);
      document.getElementById('back-btn').href = '/profil?id=' + p.id;
    }

    renderShell();
    setTimeout(startReplay, 800);
    // Charger l'analyse existante si dispo
    loadExistingAnalysis();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading">Partie introuvable.</div>';
  }
}

async function loadExistingAnalysis() {
  try {
    const id  = getGameId();
    const res = await fetch(`/api/games/${id}/analysis`);
    const { analysis } = await res.json();
    if (!analysis) return;
    // Restaurer les donnÃ©es
    analysisResults = analysis.results || [];
    evalHistory     = analysis.evalHistory || [];
    analysisMeta     = analysis.meta || {};
    // Afficher le panel dÃ¨s que le DOM est prÃªt (aprÃ¨s renderShell)
    setTimeout(() => {
      renderAnalysis(analysisResults, analysis.accuracy);
    }, 900); // aprÃ¨s startReplay
  } catch(e) {}
}

// â”€â”€ Inject player colors â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function lightenHexR(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyPlayerColors() {
  const c1 = gameData.p1_color || '#ff2d55';
  const c2 = gameData.p2_color || '#ffd60a';
  const root = document.documentElement;
  root.style.setProperty('--p1-color', c1);
  root.style.setProperty('--p1-light', lightenHexR(c1, 45));
  root.style.setProperty('--p1-secondary', gameData.p1_color_secondary || '');
  root.style.setProperty('--p1-glow',  hexToRgba(c1, 0.4));
  root.style.setProperty('--p2-color', c2);
  root.style.setProperty('--p2-light', lightenHexR(c2, 45));
  root.style.setProperty('--p2-secondary', gameData.p2_color_secondary || '');
  root.style.setProperty('--p2-glow',  hexToRgba(c2, 0.4));
}

// â”€â”€ Shapes â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let p1Shape = 'circle', p2Shape = 'circle';
let p1EmojiImage = '', p2EmojiImage = '';
let p1Emoji = '★',    p2Emoji = '◆';

function initShapes() {
  const raw1 = gameData.p1_shape || 'circle';
  const raw2 = gameData.p2_shape || 'circle';
  if (raw1.startsWith('emoji:')) { p1Shape = 'emoji'; p1Emoji = raw1.slice(6) || '★'; }
  else p1Shape = raw1;
  if (raw2.startsWith('emoji:')) { p2Shape = 'emoji'; p2Emoji = raw2.slice(6) || '◆'; }
  else p2Shape = raw2;
  if (raw1 === 'emoji_image') p1EmojiImage = gameData.p1_token_emoji_image || '';
  if (raw2 === 'emoji_image') p2EmojiImage = gameData.p2_token_emoji_image || '';
}

function lightenHex(hex, amount) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lr=Math.round(r+(255-r)*amount), lg=Math.round(g+(255-g)*amount), lb=Math.round(b+(255-b)*amount);
  return `rgb(${lr},${lg},${lb})`;
}

function makeEmojiToken(tokenEl, emoji, color, glowColor) {
  tokenEl.textContent = '';
  tokenEl.setAttribute('style',
    'border-radius:0!important;clip-path:none!important;' +
    'background:transparent!important;box-shadow:none!important;' +
    'inset:4px;position:absolute;display:flex;align-items:center;justify-content:center;'
  );
  const cssCell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-size')) || 60;
  const size = cssCell - 8;
  const DPR = window.devicePixelRatio || 1;
  const canvas = document.createElement('canvas');
  canvas.width = size * DPR; canvas.height = size * DPR;
  canvas.style.width = '100%'; canvas.style.height = '100%';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.clearRect(0, 0, size, size);
  const tmp = document.createElement('canvas');
  tmp.width = size*2; tmp.height = size*2;
  const tc = tmp.getContext('2d');
  let lo=4, hi=size*1.5, fontSize=size*0.75;
  for (let i=0; i<8; i++) {
    const mid=(lo+hi)/2; tc.font=`${mid}px serif`;
    const m=tc.measureText(emoji);
    const w=m.actualBoundingBoxRight-m.actualBoundingBoxLeft||m.width;
    const h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent||mid;
    if (Math.max(w,h)<size*0.82) lo=mid; else hi=mid; fontSize=lo;
  }
  ctx.font=`${fontSize}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(emoji, size/2, size/2);
  ctx.globalCompositeOperation='source-in';
  const grad=ctx.createRadialGradient(canvas.width*0.38,canvas.height*0.32,0,canvas.width*0.5,canvas.height*0.5,canvas.width*0.55);
  grad.addColorStop(0, lightenHex(color, 0.55)); grad.addColorStop(1, color);
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
  tokenEl.style.filter=`drop-shadow(0 0 ${size*0.1}px ${glowColor})`;
  tokenEl.appendChild(canvas);
}

function makeImageToken(tokenEl, imageSrc, glowColor) {
  tokenEl.textContent = '';
  tokenEl.className = 'token s-emoji';
  tokenEl.style.background = 'transparent';
  tokenEl.style.boxShadow = 'none';
  tokenEl.style.clipPath = 'none';
  tokenEl.style.borderRadius = '0';
  tokenEl.style.filter = `drop-shadow(0 0 8px ${glowColor})`;
  tokenEl.innerHTML = `<img src="${imageSrc}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:18%;display:block;">`;
}

// â”€â”€ Board rendering â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderBoard() {
  const el = document.getElementById('board');
  if (!el) return;
  el.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      cell.appendChild(Object.assign(document.createElement('div'), {className:'token'}));
      el.appendChild(cell);
    }
  }
}

function getCell(r, c) { return document.getElementById(`cell-${r}-${c}`); }

function placeToken(row, col, player) {
  board[row][col] = player;
  const cell = getCell(row, col);
  if (!cell) return;
  cell.classList.add('p' + player);
  const token = cell.querySelector('.token');
  if (token) {
    const shape = player === 1 ? p1Shape : p2Shape;
    if (shape === 'emoji_image') {
      const imgSrc = player === 1 ? p1EmojiImage : p2EmojiImage;
      const glow = getComputedStyle(document.documentElement).getPropertyValue(player === 1 ? '--p1-glow' : '--p2-glow').trim();
      if (imgSrc) makeImageToken(token, imgSrc, glow);
    } else if (shape === 'emoji') {
      const cs = getComputedStyle(document.documentElement);
      const col = cs.getPropertyValue(player === 1 ? '--p1-color' : '--p2-color').trim();
      const glow = cs.getPropertyValue(player === 1 ? '--p1-glow' : '--p2-glow').trim();
      const em = player === 1 ? p1Emoji : p2Emoji;
      makeEmojiToken(token, em, col, glow);
    } else {
      const clip = SHAPE_CLIPS[shape] || SHAPE_CLIPS.circle;
      token.style.borderRadius = clip.borderRadius;
      token.style.clipPath     = clip.clipPath;
    }
  }
  void cell.offsetWidth;
  cell.classList.add('drop');
}

// â”€â”€ Replay engine â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function startReplay() {
  board      = Array.from({length:ROWS}, () => Array(COLS).fill(0));
  moveIndex  = 0;
  renderBoard();
  scheduleNextMove();
}

function restartReplay() {
  clearTimeout(replayTimeout);

  setSpeed(1);
  startReplay();
}

function setSpeed(s) {
  replaySpeed = s;
  [1,2,4].forEach(v => {
    const btn = document.getElementById('speed-btn-' + v);
    if (!btn) return;
    const active = v === s;
    btn.style.background    = active ? 'rgba(76,110,245,0.2)' : 'transparent';

    btn.style.color         = active ? '#8b9cf4' : 'var(--muted)';
  });
}

function scheduleNextMove() {
  if (moveIndex >= moves.length) {
    finishReplay();
    return;
  }

  const move      = moves[moveIndex];
  const player    = move.player_id === gameData.player1_id ? 1 : 2;
  const pseudo    = player === 1 ? gameData.p1_pseudo : gameData.p2_pseudo;
  const rawThink  = move.think_ms || 500;

  // Cap think time for watchability
  const thinkMs   = Math.round(Math.min(Math.max(rawThink, MIN_THINK), MAX_THINK) / replaySpeed);

  // Update think indicator
  const dot  = document.getElementById('think-dot');
  const txt  = document.getElementById('think-text');
  const tmr  = document.getElementById('think-timer');
  if (dot) { dot.className = 'think-dot p' + player; }
      if (txt) { txt.textContent = `${pseudo} reflechit...`; }

  // Countdown display
  let elapsed = 0;
  const tickMs = 50;
  const countInterval = setInterval(() => {
    elapsed += tickMs;
    const remaining = ((thinkMs - elapsed) / 1000).toFixed(1);
    if (tmr) tmr.textContent = remaining + 's';
    if (elapsed >= thinkMs) clearInterval(countInterval);
  }, tickMs);

  replayTimeout = setTimeout(() => {
    clearInterval(countInterval);
    playMoveInReplay(move, player);
  }, thinkMs);
}

function playMoveInReplay(move, player) {
  SFX.drop();
  placeToken(move.row, move.col, player);
  moveIndex++;

  // Update progress
  const pct = (moveIndex / moves.length) * 100;
  const progBar   = document.getElementById('prog-bar');
  const progCount = document.getElementById('prog-count');
  if (progBar)   progBar.style.width = pct + '%';
  if (progCount) progCount.textContent = moveIndex + ' / ' + moves.length;

  // Small pause then next move
  replayTimeout = setTimeout(scheduleNextMove, Math.round(200 / replaySpeed));
}

function finishReplay() {
  // Son de fin
  if (gameData.winner_id === null) SFX.draw();
  else SFX.win();

  // Highlight winning cells
  if (gameData.winner_id) {
    highlightWinner();
  }

  // Update think box
  const dot = document.getElementById('think-dot');
  const txt = document.getElementById('think-text');
  const tmr = document.getElementById('think-timer');
  if (dot) dot.style.opacity = '0';
  if (txt) txt.textContent   = 'Partie terminee';
  if (tmr) tmr.textContent   = '';

  // Show end card
  const isDraw   = gameData.winner_id === null;
  const winnerPs = isDraw ? null : (gameData.winner_id === gameData.player1_id ? gameData.p1_pseudo : gameData.p2_pseudo);

  const titleEl = document.getElementById('end-title');
  const subEl   = document.getElementById('end-sub');

  if (isDraw) {
    SFX.draw();
    titleEl.textContent = 'ÉGALITÉ';
    titleEl.style.background = 'linear-gradient(135deg, var(--muted), var(--text))';
  } else {
    SFX.win();
    titleEl.textContent = `VICTOIRE ${winnerPs.toUpperCase()}`;
    titleEl.style.background = 'linear-gradient(135deg, var(--red), var(--yellow))';
  }
  titleEl.style.webkitBackgroundClip = 'text';
  titleEl.style.webkitTextFillColor  = 'transparent';

  subEl.textContent = `${gameData.move_count} coups · ${gameData.duration}s`;

  setTimeout(() => {
    document.getElementById('end-card').classList.add('show');
    // N'afficher le bouton que si l'analyse n'a pas encore ete faite
    const btn = document.getElementById('analyse-btn');
    const controls = document.getElementById('analyse-controls');
    if (btn && controls && analysisResults.length === 0) {
      btn.style.display = 'flex';
      controls.classList.add('show');
    }
  }, 600);
}

function highlightWinner() {
  // Recompute winning cells from board state
  const winnerId = gameData.winner_id;
  const player   = winnerId === gameData.player1_id ? 1 : 2;
  const dirs     = [[0,1],[1,0],[1,1],[1,-1]];

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== player) continue;
      for (const [dr, dc] of dirs) {
        const line = getWinLine(r, c, player, dr, dc);
        if (line.length >= 4) {
          line.forEach(([lr, lc]) => {
            const cell = getCell(lr, lc);
            if (cell) cell.classList.add('winning');
          });
          return;
        }
      }
    }
  }
}

function getWinLine(row, col, player, dr, dc) {
  const pos = [], neg = [];
  for (let s = 1; s < 4; s++) {
    const r = row+dr*s, c = col+dc*s;
    if (r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]===player) pos.push([r,c]); else break;
  }
  for (let s = 1; s < 4; s++) {
    const r = row-dr*s, c = col-dc*s;
    if (r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]===player) neg.push([r,c]); else break;
  }
  const all = [...neg.reverse(), [row,col], ...pos];
  return all.length >= 4 ? all.slice(0, 4) : [];
}

const SFX = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }
  function beep(freq, dur, vol = 0.15, shape = 'sine', attack = 0.005) {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = shape;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      osc.start(c.currentTime); osc.stop(c.currentTime + dur);
    } catch(e) {}
  }
  return {
    drop()  { beep(300, 0.07, 0.14, 'triangle'); setTimeout(() => beep(200, 0.09, 0.07, 'triangle'), 55); },
    win()   { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.45, 0.14), i*110)); },
    lose()  { [392,349,311,261].forEach((f,i) => setTimeout(() => beep(f, 0.45, 0.12, 'sawtooth'), i*120)); },
    draw()  { beep(350, 0.18, 0.1, 'triangle'); setTimeout(() => beep(350, 0.18, 0.08, 'triangle'), 240); },
  };
})();

function accColor(pct) {

function startAnalysis() {
  const btn      = document.getElementById('analyse-btn');
  const controls = document.getElementById('analyse-controls');
  const progWrap = document.getElementById('analyse-progress');
  const depthSel = document.getElementById('analyse-depth');
  const depth    = Math.max(1, Math.min(14, Number(depthSel?.value || 10)));
  const variantCount = 3;
  btn.style.display = 'none';
  controls?.classList.remove('show');
  progWrap.classList.add('show');
  document.getElementById('analyse-progress-text').textContent = `Preparation profondeur ${depth}...`;
  document.getElementById('analyse-bar').style.width = '0%';
  analysisResults = [];
  evalHistory     = [];
  analysisMeta     = { depth, variantCount };

  const moveCols = moves.map(m => m.col ?? m.column ?? m);
  if (analysisWorker) analysisWorker.terminate();
  analysisWorker = new Worker('/analyse-worker.js');
  const _analyseStart = Date.now();

  analysisWorker.onmessage = (e) => {
    const { type } = e.data;
    if (type === 'progress') {
      const { moveIndex, total } = e.data;
      const pct      = Math.round(((moveIndex + 1) / total) * 100);
      const elapsed  = (Date.now() - _analyseStart) / 1000;
      const avgPerMove = elapsed / (moveIndex + 1);
      const remaining  = Math.round(avgPerMove * (total - moveIndex - 1));

      let timeStr = '';
      if (moveIndex === 0) {
        // Premier coup : estimer basÃ© sur ~2.5s par coup
        const est = Math.round(2.5 * total);
        timeStr = ` · ~${est > 60 ? Math.ceil(est/60) + ' min' : est + 's'} estimées`;
      } else if (remaining > 0) {
        timeStr = ` · ~${remaining > 60 ? Math.ceil(remaining/60) + ' min' : remaining + 's'} restantes`;
      }

      document.getElementById('analyse-bar').style.width = pct + '%';
      document.getElementById('analyse-progress-text').textContent =
        `Coup ${moveIndex + 1} / ${total} - ${pct}%${timeStr}`;
      analysisResults.push(e.data.result);
    }
    if (type === 'done') {
      evalHistory = e.data.evalHistory || [];
      progWrap.classList.remove('show');
      analysisMeta = e.data.meta || { depth, variantCount };
      renderAnalysis(analysisResults, e.data.accuracy);
      analysisWorker.terminate();
      const gameId = getGameId();
      fetch(`/api/games/${gameId}/analysis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ results: analysisResults, evalHistory, accuracy: e.data.accuracy, meta: analysisMeta }),
      }).catch(() => {});
    }
  };
  analysisWorker.postMessage({ moves: moveCols, depth, variantCount });
}

function renderAnalysis(results, accuracy) {
  const panel = document.getElementById('analyse-panel');
  if (!panel) return;
  const g = gameData;
  const cs = getComputedStyle(document.documentElement);
  const p1Color = cs.getPropertyValue('--p1-color').trim() || '#ff2d55';

  const classLabels = {
    best: 'Meilleur',

    good: 'Bon',

    blunder: 'Gaffe',
  };

  function counts(player) {
    const rows = results.filter(r => r.player === player);
    const bucket = { best: 0, excellent: 0, good: 0, forced: 0, inaccuracy: 0, mistake: 0, blunder: 0 };
    rows.forEach(row => { if (bucket[row.classification] !== undefined) bucket[row.classification]++; });

  function summaryChips(bucket) {

    const rows = results.filter(r => r.player === player);
    const averageSwing = rows.length ? Math.round(rows.reduce((sum, row) => sum + (row.swing || 0), 0) / rows.length) : 0;
    const strongMoves = rows.filter(row => ['best', 'excellent'].includes(row.classification)).length;
    const worstMove = rows.reduce((worst, row) => {

            ? `<div style="padding:6px 10px;background:rgba(48,209,88,0.06);border:1px solid rgba(48,209,88,0.15);border-radius:8px;font-size:11px;color:var(--muted)">
                 <span style="color:#30d158;font-weight:700;margin-right:4px">Ligne ideale :</span>
                 ${r.optimalSeq.map((c, idx) => `<span style="color:#30d158;font-weight:700">col.${c + 1}</span>${idx < r.optimalSeq.length - 1 ? ' <span style="color:var(--muted)">></span> ' : ''}`).join('')}
               </div>`
            : '';
          const variantsHtml = Array.isArray(r.variants) && r.variants.length
            ? `<div class="variant-row">
                ${r.variants.slice(0, 3).map((v, idx) => {
                  const win = Number.isFinite(Number(v.winPct)) ? `${Math.round(Number(v.winPct))}%` : '--';
                  const ev = v.eval || '';
                  return `<span class="variant-chip"><strong>#${idx + 1}</strong> col.${Number(v.col) + 1}${ev ? ` · ${ev}` : ''} · ${win}</span>`;
                }).join('')}
              </div>`
            : '';
          const evalScore = fmtCp(r.evalCP);
          const evalCls = (r.evalScore || 0) > 4 ? 'pos' : (r.evalScore || 0) < -4 ? 'neg' : 'neu';
          return `<div class="analyse-move" id="am-${i}" onclick="jumpToMove(${r.moveIndex})">
            <span class="am-num">${i + 1}</span>
            <span class="am-dot" style="background:${color}"></span>
            <div class="am-main">
              <div class="am-head">
                <span class="am-col">${pseudo} - col.${r.playedCol + 1}</span>
                ${evalBar}
                <span class="am-badge cls-${r.classification}">${classLabels[r.classification] || r.classification}</span>
                ${evalScore ? `<span class="eval-score ${evalCls}" title="Lecture rapide de la position">${evalScore}</span>` : ''}
              </div>
              <div class="am-metrics">
                ${r.playedWinPct !== undefined ? `<span class="am-metric"><strong>${fmtPct(r.playedWinPct)}</strong> pour ${pseudo}</span>` : ''}
                ${r.bestWinPct !== undefined ? `<span class="am-metric">meilleur coup: <strong>${fmtPct(r.bestWinPct)}</strong></span>` : ''}
                ${r.swing !== undefined ? `<span class="am-metric" title="Perte de chances entre le meilleur coup et le coup joué">impact: <strong>-${fmtPct(r.swing)}</strong> de chances</span>` : ''}
                <span class="am-metric">avantage: <strong style="color:${ownerColor(r.evalScore || 0)}">${ownerName(r.evalScore || 0)}</strong></span>
                ${r.bestCol !== undefined && r.bestCol !== r.playedCol ? `<span class="am-metric">meilleur choix: <strong>col.${r.bestCol + 1}</strong></span>` : ''}
              </div>
              ${variantsHtml}
              ${seqHtml}
              ${r.comment ? `<div class="am-comment">${r.comment}</div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// â”€â”€ Tooltip graphique d'Ã©valuation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function showEvalTooltip(rectEl, moveIdx, score, pseudo, color) {
  const tip  = document.getElementById('eval-tooltip');
  const line = document.getElementById('eval-hover-line');
  const svg  = document.getElementById('eval-svg');
  if (!tip || !svg) return;

  // Positionner la ligne verticale dans le SVG
  const vb   = svg.viewBox.baseVal;
  const step = vb.width / Math.max(evalHistory.length, 1);
  const xSvg = (moveIdx + 0.5) * step;
  if (line) { line.setAttribute('x1', xSvg); line.setAttribute('x2', xSvg); }

  // Positionner le tooltip en px
  const wrap   = document.getElementById('eval-graph-wrap');
  const wrapW  = wrap.offsetWidth;
  const xPct   = (moveIdx + 0.5) / evalHistory.length;
  const xPx    = xPct * wrapW;

  tip.style.display = 'block';
  tip.style.left    = xPx + 'px';
  tip.style.color   = color;
  tip.textContent   = `${score} · coup ${moveIdx + 1}`;
}

function hideEvalTooltip() {
  const tip  = document.getElementById('eval-tooltip');
  const line = document.getElementById('eval-hover-line');
  if (tip)  tip.style.display = 'none';
  if (line) { line.setAttribute('x1', '-1'); line.setAttribute('x2', '-1'); }
}

function showEvalTooltip(rectEl, moveIdx) {
  const tip  = document.getElementById('eval-tooltip');
  const line = document.getElementById('eval-hover-line');
  const svg  = document.getElementById('eval-svg');
  const point = evalHistory[moveIdx];
  if (!tip || !svg || !point) return;

  const vb   = svg.viewBox.baseVal;
  const step = vb.width / Math.max(evalHistory.length, 1);
  const xSvg = (moveIdx + 0.5) * step;
  if (line) { line.setAttribute('x1', xSvg); line.setAttribute('x2', xSvg); }

  const wrap   = document.getElementById('eval-graph-wrap');
  const wrapW  = wrap.offsetWidth;
  const xPct   = (moveIdx + 0.5) / evalHistory.length;
  const xPx    = xPct * wrapW;
  const rootStyles = getComputedStyle(document.documentElement);
  const p1Color = rootStyles.getPropertyValue('--p1-color').trim() || '#ff2d55';
  const p2Color = rootStyles.getPropertyValue('--p2-color').trim() || '#ffd60a';
  const pseudo = point.score > 4 ? gameData.p1_pseudo : point.score < -4 ? gameData.p2_pseudo : 'Équilibre';
  const color = point.score > 4 ? p1Color : point.score < -4 ? p2Color : 'rgba(238,238,245,0.75)';
  const chance = Math.round((point.score + 100) / 2);
  const cp = point.cp !== undefined && point.cp !== null
    ? (Math.abs(point.cp) >= 99 ? `${point.cp > 0 ? '+' : '-'}mat` : `${point.cp > 0 ? '+' : point.cp < 0 ? '-' : ''}${Math.abs(point.cp).toFixed(1)}`)
    : '--';

  tip.style.display = 'block';
  tip.style.left    = xPx + 'px';
  tip.style.color   = color;
  tip.innerHTML = `<div style="font-weight:700;color:${color}">${pseudo}</div><div>coup ${moveIdx + 1} · ${chance}% de controle</div><div style="color:rgba(238,238,245,0.72)">lecture: ${cp}</div>`;
}

// â”€â”€ Inspection du plateau depuis l'analyse â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let inspectMode = false;

function jumpToMove(moveIdx) {
  // Surligner la ligne dans la liste
  document.querySelectorAll('.analyse-move').forEach(el => el.classList.remove('highlighted'));
  const listIdx = analysisResults.findIndex(r => r.moveIndex === moveIdx);
  const el = document.getElementById('am-' + listIdx);
  if (el) { el.classList.add('highlighted'); el.scrollIntoView({ block: 'nearest' }); }

  const result = analysisResults[listIdx];
  if (!result) return;

  // ArrÃªter le replay en cours
  clearTimeout(replayTimeout);
  inspectMode = true;

  // Reconstruire le plateau jusqu'Ã  CE coup (inclus)
  rebuildBoardAt(moveIdx);

  // Afficher la barre d'inspection
  const bar  = document.getElementById('board-inspect-bar');
  const txt  = document.getElementById('board-inspect-text');
  const p    = result.player === 1 ? gameData.p1_pseudo : gameData.p2_pseudo;
  const cls  = { best:'Meilleur', excellent:'Excellent', good:'Bon',
                 forced:'Forcé', inaccuracy:'Imprécision', mistake:'Erreur', blunder:'Gaffe' };
  if (txt) txt.textContent = `Coup ${moveIdx + 1} · ${p} · ${cls[result.classification] || ''}`;
  if (bar) bar.classList.add('show');

  // Surligner le coup jouÃ©
  clearSeqHighlights();
  if (result.playedCol !== undefined) {
    const row = getTopRow(result.playedCol);
    if (row >= 0) {
      const c = getCell(row, result.playedCol);
      if (c) {
        c.classList.add('seq-played');
        c.classList.remove('play-focus');
        void c.offsetWidth;
        c.classList.add('play-focus');
      }
    }
  }

  // Afficher la sÃ©quence optimale si erreur/gaffe/imprÃ©cision
  if (['inaccuracy','mistake','blunder'].includes(result.classification) && result.optimalSeq?.length) {
    showOptimalSeq(result.optimalSeq, moveIdx);
  }

  // Scroll vers le plateau
  document.getElementById('board')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function rebuildBoardAt(upToMoveIdx) {
  // Reset visuel
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  renderBoard();
  // Rejouer tous les coups jusqu'Ã  upToMoveIdx inclus
  for (let i = 0; i <= upToMoveIdx && i < moves.length; i++) {
    const m      = moves[i];
    const player = m.player_id === gameData.player1_id ? 1 : 2;
    placeToken(m.row, m.col, player);
  }
}

function showOptimalSeq(seq, afterMoveIdx) {
  // Simuler le plateau AVANT le coup analysÃ© pour trouver les bonnes rangÃ©es
  const simBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  for (let i = 0; i < afterMoveIdx && i < moves.length; i++) {
    const m = moves[i];
    const player = m.player_id === gameData.player1_id ? 1 : 2;
    // Trouver la rangÃ©e
    for (let r = ROWS - 1; r >= 0; r--) {
      if (simBoard[r][m.col] === 0) { simBoard[r][m.col] = player; break; }
    }
  }
  // Afficher chaque coup de la sÃ©quence
  let sb = simBoard.map(r => [...r]);
  let player = (afterMoveIdx % 2 === 0) ? 1 : 2;
  const seqCells = [];
  seq.forEach((col, i) => {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (sb[r][col] === 0) {
        const c = getCell(r, col);
        if (c) {
          c.classList.add('seq-opt-' + Math.min(i, 4));
          c.setAttribute('data-seq-num', i + 1);
          c.classList.add('seq-highlight');
          seqCells.push(c);
        }
        sb[r][col] = player;
        break;
      }
    }
    player = player === 1 ? 2 : 1;
  });
  animateSeqCells(seqCells);
}

function stopSeqAnimation() {
  if (seqAnimationTimer) {
    clearInterval(seqAnimationTimer);
    seqAnimationTimer = null;
  }
  document.querySelectorAll('.seq-current').forEach(c => c.classList.remove('seq-current'));
}

function animateSeqCells(cells) {
  stopSeqAnimation();
  if (!cells.length) return;
  let idx = 0;
  const tick = () => {
    cells.forEach(c => c.classList.remove('seq-current'));
    cells[idx % cells.length]?.classList.add('seq-current');
    idx++;
  };
  tick();
  seqAnimationTimer = setInterval(tick, 620);
}

function getTopRow(col) {
  for (let r = 0; r < ROWS; r++) {
    if (board[r][col] !== 0) return r;
  }
  return ROWS - 1;
}

function clearSeqHighlights() {
  stopSeqAnimation();
  document.querySelectorAll('.seq-highlight, .seq-played, .play-focus, .seq-current').forEach(c => {
    c.classList.remove('seq-highlight','seq-played','play-focus','seq-current','seq-opt-0','seq-opt-1','seq-opt-2','seq-opt-3','seq-opt-4');
    c.removeAttribute('data-seq-num');
  });
}

function clearInspect() {
  inspectMode = false;
  clearSeqHighlights();
  document.getElementById('board-inspect-bar')?.classList.remove('show');
  document.querySelectorAll('.analyse-move').forEach(el => el.classList.remove('highlighted'));
  // Reprendre le replay lÃ  oÃ¹ il en Ã©tait
  scheduleNextMove();
}
</script>
