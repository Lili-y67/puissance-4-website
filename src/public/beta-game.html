<title>Puissance 4 — Laboratoire bêta</title>
<link rel="icon" type="image/png" href="/assets/site-logo-small.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Barlow,sans-serif;color:#f3f3f8;background:#06060e}body{background:radial-gradient(circle at 15% 12%,rgba(155,124,255,.18),transparent 32%),radial-gradient(circle at 85% 18%,rgba(133,235,255,.13),transparent 30%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),#06060e;background-size:auto,auto,48px 48px,48px 48px}.hidden{display:none!important}button,input{font:inherit}.page{width:min(1180px,calc(100% - 24px));margin:auto;padding:22px 0 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:900 28px "Barlow Condensed";letter-spacing:2px;text-transform:uppercase}.brand img{width:42px;height:42px}.beta-tag,.pill{border:1px solid rgba(155,124,255,.3);background:rgba(155,124,255,.1);color:#c9baff;border-radius:999px;padding:7px 11px;font:900 11px "Barlow Condensed";letter-spacing:2px;text-transform:uppercase}.panel{border:1px solid rgba(255,255,255,.08);border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:0 28px 80px rgba(0,0,0,.35)}.gate{width:min(470px,calc(100% - 24px));margin:12vh auto;padding:32px}.eyebrow{color:#9b7cff;font:900 12px "Barlow Condensed";letter-spacing:4px;text-transform:uppercase}.gate h1,.intro h1{font:900 clamp(42px,7vw,74px) "Barlow Condensed";line-height:.9;text-transform:uppercase;margin:12px 0}.muted{color:rgba(243,243,248,.55);line-height:1.55}.gate-form{display:flex;gap:9px;margin-top:22px}.input{min-width:0;flex:1;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:13px 14px;background:#0d0d1c;color:#fff;outline:none}.input:focus{border-color:#9b7cff;box-shadow:0 0 0 3px rgba(155,124,255,.12)}.btn{border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:12px 15px;background:rgba(255,255,255,.055);color:#fff;cursor:pointer;font:900 13px "Barlow Condensed";letter-spacing:1.3px;text-transform:uppercase}.btn.primary{border-color:transparent;background:linear-gradient(135deg,#7c5cff,#a98dff);box-shadow:0 12px 28px rgba(124,92,255,.24)}.error{min-height:20px;color:#ff6b84;margin:10px 0 0;font-size:13px}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}.intro{padding:24px;position:sticky;top:18px}.intro h1{font-size:58px}.modes{display:grid;gap:9px;margin:20px 0}.mode{padding:15px;text-align:left}.mode.active{border-color:rgba(133,235,255,.42);background:linear-gradient(135deg,rgba(133,235,255,.13),rgba(155,124,255,.1));box-shadow:0 0 24px rgba(133,235,255,.06)}.mode strong{display:block;font:900 18px "Barlow Condensed";text-transform:uppercase}.mode span{display:block;color:rgba(243,243,248,.5);font-size:12px;margin-top:4px;line-height:1.35}.rules{border-top:1px solid rgba(255,255,255,.08);padding-top:16px}.rules h2{font:900 15px "Barlow Condensed";letter-spacing:2px;text-transform:uppercase}.rules ul{padding-left:19px;color:rgba(243,243,248,.6);font-size:13px;line-height:1.5}.game{padding:18px}.players{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:14px}.player{padding:12px 14px;border:1px solid rgba(255,255,255,.07);border-radius:17px;background:rgba(255,255,255,.035)}.player:last-child{text-align:right}.player.active{border-color:var(--color);box-shadow:0 0 22px color-mix(in srgb,var(--color) 20%,transparent)}.player small{display:block;color:rgba(243,243,248,.45);font:900 10px "Barlow Condensed";letter-spacing:1.7px;text-transform:uppercase}.player strong{font:900 21px "Barlow Condensed";text-transform:uppercase}.score{color:var(--color);margin-left:7px}.versus{color:rgba(243,243,248,.35);font:900 13px "Barlow Condensed"}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.035)}.status strong{font:900 18px "Barlow Condensed";text-transform:uppercase}.status small{display:block;color:rgba(243,243,248,.45);margin-top:2px}.board-shell{padding:clamp(9px,2vw,17px);border-radius:25px;background:linear-gradient(145deg,#171735,#0b0b1c);border:1px solid rgba(255,255,255,.1);overflow:hidden}.board{display:grid;gap:clamp(4px,1vw,9px);max-width:720px;margin:auto;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s}.board.rotating{transform:rotate(90deg) scale(.87);filter:brightness(1.3)}.cell{aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.055),#070719 68%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),inset 0 8px 18px rgba(0,0,0,.45)}.cell:hover{box-shadow:inset 0 0 0 2px rgba(133,235,255,.36),0 0 17px rgba(133,235,255,.12)}.cell.filled::after{content:"";position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.42),transparent 20%),linear-gradient(135deg,var(--piece),var(--piece2));box-shadow:inset 0 -12px 18px rgba(0,0,0,.22),0 0 19px var(--piece);animation:drop .25s cubic-bezier(.2,1.35,.45,1)}.cell.forced{box-shadow:inset 0 0 0 3px #ff9f0a,0 0 18px rgba(255,159,10,.32)}.cell.new-line::after{animation:pulse .6s ease-in-out infinite alternate}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:rgba(243,243,248,.44);font-size:12px}.rotate-count{color:#85ebff;font-weight:800}.flash{animation:flash .55s ease}@keyframes drop{from{transform:translateY(-65%) scale(.82);opacity:.2}}@keyframes pulse{to{transform:scale(1.08);filter:brightness(1.25)}}@keyframes flash{50%{box-shadow:0 0 60px rgba(133,235,255,.3)}}
.cell.filled.falling::after{animation:gravity-fall calc(.3s + var(--fall-rows)*.09s) cubic-bezier(.18,.72,.24,1.15) both;z-index:3}.status-actions{display:flex;gap:8px}.btn:disabled{opacity:.42;cursor:not-allowed}.cell.bomb-target{box-shadow:inset 0 0 0 3px #ff453a,0 0 22px rgba(255,69,58,.42)}.lab-modal{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:18px;background:rgba(3,3,12,.86);backdrop-filter:blur(12px)}.lab-modal-card{width:min(650px,100%);padding:25px;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:linear-gradient(160deg,#1b1b39,#0c0c1b);box-shadow:0 35px 100px rgba(0,0,0,.55)}.lab-modal-card h2{margin:8px 0;font:900 34px "Barlow Condensed";text-transform:uppercase}.mission-options{display:grid;gap:10px;margin:18px 0}.mission-choice{text-align:left;padding:15px}.mission-choice strong{display:block;font:900 18px "Barlow Condensed";text-transform:uppercase}.mission-choice span{display:block;margin-top:4px;color:rgba(243,243,248,.55);font-size:13px}.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.reveal-card{padding:15px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04)}.reveal-card strong{display:block;color:#85ebff;margin-top:5px}.privacy-icon{font-size:46px;margin-bottom:4px}@keyframes gravity-fall{0%{transform:translateY(calc(var(--fall-rows)*-116%));filter:brightness(1.18)}75%{transform:translateY(3%)}88%{transform:translateY(-2%)}100%{transform:translateY(0);filter:brightness(1)}}
.board.rotating{transition:transform 1.45s cubic-bezier(.42,0,.22,1),filter .5s;transform:rotate(90deg)}.board.rotating.ccw{transform:rotate(-90deg)}.board.rotation-reset{transition:none!important}.board.no-token-animation .cell.filled::after{animation:none}.cell.filled.falling::after{animation-duration:calc(.55s + var(--fall-rows)*.11s)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.intro{position:static}.intro h1{font-size:46px}.modes{grid-template-columns:1fr 1fr}.rules{display:none}}@media(max-width:520px){.gate-form,.footer{flex-direction:column;align-items:stretch}.players{grid-template-columns:1fr 1fr}.versus{display:none}.player strong{font-size:16px}.status{align-items:flex-start;flex-direction:column}.modes{grid-template-columns:1fr}.page{width:calc(100% - 12px)}}
</style>
</head>
<body>
<section class="gate panel" id="gate">
  <div class="eyebrow">Zone expérimentale</div><h1>Laboratoire<br>bêta</h1>
  <p class="muted">Ces variantes ne touchent ni aux comptes, ni au classement. Entre le mot de passe pour ouvrir le laboratoire.</p>
  <form class="gate-form" id="gate-form"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="btn primary">Entrer</button></form>
  <p class="error" id="gate-error"></p>
</section>
<main class="page hidden" id="app">
  <header class="top"><a class="brand" href="/"><img src="/assets/site-logo-small.png" alt="">Puissance 4</a><span class="beta-tag">Bêta privée</span></header>
  <div class="layout">
    <aside class="panel intro"><div class="eyebrow">Modes expérimentaux</div><h1>Game<br><span style="color:#85ebff">Lab</span></h1><p class="muted">Deux joueurs anonymes, un même écran, aucun résultat enregistré.</p>
      <div class="modes"><button class="btn mode active" data-mode="rotate"><strong>Plateau rotatif</strong><span>7×7 · sens imprévisible tous les 4 coups</span></button><button class="btn mode" data-mode="anti"><strong>Anti-Puissance 4</strong><span>9×9 · le moins de lignes gagne</span></button><button class="btn mode" data-mode="bomb"><strong>Puissance Bombe</strong><span>7×6 · une explosion par joueur</span></button><button class="btn mode" data-mode="mission"><strong>Mission personnelle</strong><span>7×7 · objectifs révélés avant la partie</span></button><button class="btn mode" data-mode="simultaneous"><strong>Placement simultané</strong><span>7×6 · deux choix cachés par round</span></button></div>
      <div class="rules" id="rules"></div>
    </aside>
    <section class="panel game" id="game-panel">
      <div class="players"><div class="player" id="p1" style="--color:#ff2d55"><small>Joueur rouge <span class="score" id="p1-score"></span></small><strong id="p1-name"></strong></div><span class="versus">VS</span><div class="player" id="p2" style="--color:#ffd60a"><small>Joueur jaune <span class="score" id="p2-score"></span></small><strong id="p2-name"></strong></div></div>
      <div class="status"><div><strong id="status-title"></strong><small id="status-detail"></small></div><div class="status-actions"><button class="btn hidden" id="bomb-button">💣 Bombe</button><button class="btn primary" id="restart">Nouvelle manche</button></div></div>
      <div class="board-shell" id="board-shell"><div class="board" id="board"></div></div>
      <div class="footer"><span id="hint"></span><span class="rotate-count" id="counter"></span></div>
    </section>
  </div>
</main>
<div class="lab-modal hidden" id="lab-modal"><div class="lab-modal-card" id="lab-modal-card"></div></div>
<script>
const COLORS={1:['#ff2d55','#ff8fab'],2:['#ffd60a','#ff9f0a']};
const ADJECTIVES=['Cosmique','Furtif','Solaire','Pixel','Turbo','Lunaire','Givré','Mystique','Néon','Vortex'];
const CREATURES=['Renard','Panda','Axolotl','Dragon','Hibou','Gecko','Lynx','Koala','Corbeau','Blob'];
const $=id=>document.getElementById(id); let mode='rotate',rows=7,cols=7,grid=[],turn=1,ended=false,moves=0,scores={1:0,2:0},counted={1:new Set(),2:new Set()},names={},fallingPieces=new Map(),bombs={1:true,2:true},bombArmed=false,playerMissions={1:null,2:null},missionSetup=false,simChoices={1:null,2:null},simChooser=1,initiative=1;
const MISSIONS=[{id:'square',name:'Carré parfait',description:'Former un carré complet de 2×2.'},{id:'double3',name:'Double menace',description:'Créer deux alignements distincts de 3 simultanément.'},{id:'center',name:'Domination centrale',description:'Contrôler au moins 4 cases de la zone centrale 3×3.'},{id:'high4',name:'Haute altitude',description:'Aligner 4 jetons sans utiliser la rangée du bas.'},{id:'directions',name:'Trois directions',description:'Former une paire horizontale, verticale et diagonale.'}];
function randomName(){return ADJECTIVES[Math.floor(Math.random()*ADJECTIVES.length)]+' '+CREATURES[Math.floor(Math.random()*CREATURES.length)]+' '+(10+Math.floor(Math.random()*90))}
async function validateSession(){const token=sessionStorage.getItem('p4_beta_token');if(!token)return false;try{return (await fetch('/api/beta-game/session',{headers:{Authorization:'Bearer '+token}})).ok}catch{return false}}
async function openApp(){names={1:randomName(),2:randomName()};while(names[2]===names[1])names[2]=randomName();$('p1-name').textContent=names[1];$('p2-name').textContent=names[2];$('gate').classList.add('hidden');$('app').classList.remove('hidden');newGame()}
$('gate-form').addEventListener('submit',async e=>{e.preventDefault();$('gate-error').textContent='Vérification…';try{const res=await fetch('/api/beta-game/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const data=await res.json();if(!res.ok)throw Error(data.error||'Accès refusé.');sessionStorage.setItem('p4_beta_token',data.token);openApp()}catch(err){$('gate-error').textContent=err.message}});
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));newGame()});$('restart').onclick=newGame;$('bomb-button').onclick=()=>{if(mode!=='bomb'||ended||!bombs[turn])return;bombArmed=!bombArmed;render();updateInfo()};
function newGame(){rows=mode==='anti'?9:(mode==='bomb'||mode==='simultaneous')?6:7;cols=mode==='anti'?9:7;grid=Array.from({length:rows},()=>Array(cols).fill(0));turn=mode==='simultaneous'?1:(Math.random()<.5?1:2);ended=false;moves=0;scores={1:0,2:0};counted={1:new Set(),2:new Set()};fallingPieces.clear();bombs={1:true,2:true};bombArmed=false;playerMissions={1:null,2:null};missionSetup=false;simChoices={1:null,2:null};simChooser=1;initiative=Math.random()<.5?1:2;$('lab-modal').classList.add('hidden');$('board').style.gridTemplateColumns=`repeat(${cols},1fr)`;render();updateInfo();if(mode==='mission')startMissionSetup()}
function legalRow(col,g=grid){for(let r=rows-1;r>=0;r--)if(!g[r][col])return r;return-1}
function cloneGrid(){return grid.map(row=>[...row])}
function segmentsFor(player,g=grid){const out=[];const dirs=[[0,1],[1,0],[1,1],[1,-1]];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)for(const[dr,dc]of dirs){const cells=[];for(let i=0;i<4;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=rows||cc<0||cc>=cols||g[rr][cc]!==player){cells.length=0;break}cells.push([rr,cc])}if(cells.length)out.push({key:cells.map(x=>x.join(':')).join('|'),cells})}return out}
function winningPlayers(){return[1,2].filter(p=>segmentsFor(p).length)}
function forcedColumns(){if(mode!=='anti'||ended)return[];const forced=[];for(let c=0;c<cols;c++){const r=legalRow(c);if(r<0)continue;const copy=cloneGrid();copy[r][c]=turn;if(segmentsFor(turn,copy).some(s=>!counted[turn].has(s.key)))forced.push(c)}return forced}
function shuffledMissions(excludedId=''){return MISSIONS.filter(m=>m.id!==excludedId).map(value=>({value,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).slice(0,3).map(x=>x.value)}
function showLabModal(html){$('lab-modal-card').innerHTML=html;$('lab-modal').classList.remove('hidden')}
function hideLabModal(){$('lab-modal').classList.add('hidden')}
function startMissionSetup(){missionSetup=true;showMissionChoices(1,shuffledMissions())}
function showMissionChoices(player,options){showLabModal(`<div class="eyebrow">Choix confidentiel · ${names[player]}</div><h2>Choisis ta mission</h2><p class="muted">L’adversaire la découvrira seulement quand les deux choix seront terminés.</p><div class="mission-options">${options.map(m=>`<button class="btn mission-choice" data-mission="${m.id}"><strong>${m.name}</strong><span>${m.description}</span></button>`).join('')}</div>`);document.querySelectorAll('[data-mission]').forEach(btn=>btn.onclick=()=>selectMission(player,btn.dataset.mission))}
function selectMission(player,id){playerMissions[player]=MISSIONS.find(m=>m.id===id);if(player===1){showLabModal(`<div class="privacy-icon">🙈</div><div class="eyebrow">Choix enregistré</div><h2>Passe l’écran à ${names[2]}</h2><p class="muted">La mission de ${names[1]} est maintenant masquée.</p><button class="btn primary" id="mission-next">Je suis ${names[2]}</button>`);$('mission-next').onclick=()=>showMissionChoices(2,shuffledMissions(id))}else revealMissions()}
function revealMissions(){showLabModal(`<div class="eyebrow">Missions verrouillées</div><h2>Objectifs révélés</h2><div class="reveal-grid"><div class="reveal-card">${names[1]}<strong>${playerMissions[1].name}</strong><span>${playerMissions[1].description}</span></div><div class="reveal-card">${names[2]}<strong>${playerMissions[2].name}</strong><span>${playerMissions[2].description}</span></div></div><button class="btn primary" id="mission-start">Commencer la partie</button>`);$('mission-start').onclick=()=>{missionSetup=false;hideLabModal();render();updateInfo()}}
function missionProgress(player,mission=playerMissions[player]){if(!mission)return{done:false,label:'Choix en cours'};if(mission.id==='square'){let best=0;for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){let n=0;for(const[dr,dc]of[[0,0],[0,1],[1,0],[1,1]])if(grid[r+dr][c+dc]===player)n++;best=Math.max(best,n)}return{done:best===4,label:`${best}/4 cases`}}if(mission.id==='double3'){const found=new Set();for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[];for(let i=0;i<3;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=rows||cc<0||cc>=cols||grid[rr][cc]!==player){cells.length=0;break}cells.push(`${rr}:${cc}`)}if(cells.length)found.add(cells.join('|'))}return{done:found.size>=2,label:`${Math.min(found.size,2)}/2 alignements`}}if(mission.id==='center'){const start=Math.floor(rows/2)-1;let n=0;for(let r=start;r<start+3;r++)for(let c=start;c<start+3;c++)if(grid[r][c]===player)n++;return{done:n>=4,label:`${Math.min(n,4)}/4 centres`}}if(mission.id==='high4'){const done=segmentsFor(player).some(s=>s.cells.every(([r])=>r!==rows-1));const best=done?4:Math.min(3,longestLine(player,true));return{done,label:`${best}/4 jetons`}}const dirs=[[0,1],[1,0],[1,1],[1,-1]],has=dirs.map(([dr,dc])=>{for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<rows&&cc>=0&&cc<cols&&grid[r][c]===player&&grid[rr][cc]===player)return true}return false}),n=(has[0]?1:0)+(has[1]?1:0)+(has[2]||has[3]?1:0);return{done:n===3,label:`${n}/3 directions`}}
function longestLine(player,excludeBottom=false){let best=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let n=0;for(let i=0;i<4;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=rows||cc<0||cc>=cols||(excludeBottom&&rr===rows-1)||grid[rr][cc]!==player)break;n++}best=Math.max(best,n)}return best}
function play(col){if(ended||bombArmed||missionSetup)return;if(mode==='simultaneous')return chooseSimultaneous(col);const forced=forcedColumns();if(forced.length&&!forced.includes(col))return;const row=legalRow(col);if(row<0)return;grid[row][col]=turn;moves++;render();if(mode==='rotate')playRotate();else if(mode==='anti')playAnti();else if(mode==='mission')playMission();else playBombClassic()}
function playMission(){const progress=missionProgress(turn);if(progress.done){finish(turn,`${names[turn]} accomplit « ${playerMissions[turn].name} ».`);return}if(moves===rows*cols)finish(0,'La grille est pleine.');else nextTurn()}
function playBombClassic(){const wins=winningPlayers();if(wins.length){finish(wins.length===2?0:wins[0],wins.length===2?'Double alignement : manche nulle.':`${names[wins[0]]} aligne 4 jetons.`);return}if(moves===rows*cols)finish(0,'La grille est pleine.');else nextTurn()}
function detonate(centerR,centerC){if(mode!=='bomb'||ended||!bombArmed||!bombs[turn]||!grid[centerR][centerC])return;bombArmed=false;bombs[turn]=false;ended=true;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const r=centerR+dr,c=centerC+dc;if(r>=0&&r<rows&&c>=0&&c<cols)grid[r][c]=0}fallingPieces=applyGravity();render();$('status-title').textContent='Explosion !';$('status-detail').textContent='Le pion central résiste, les autres retombent.';$('game-panel').classList.add('flash');setTimeout(()=>{fallingPieces.clear();$('game-panel').classList.remove('flash');ended=false;render();const wins=winningPlayers();if(wins.length)finish(wins.length===2?0:wins[0],wins.length===2?'L’explosion crée deux alignements.':`${names[wins[0]]} gagne après l’explosion.`);else nextTurn()},850)}
function chooseSimultaneous(col){if(legalRow(col)<0)return;simChoices[simChooser]=col;if(simChooser===1){showLabModal(`<div class="privacy-icon">🤫</div><div class="eyebrow">Colonne verrouillée</div><h2>Passe l’écran à ${names[2]}</h2><p class="muted">Le choix de ${names[1]} reste caché.</p><button class="btn primary" id="sim-next">Je suis ${names[2]}</button>`);$('sim-next').onclick=()=>{hideLabModal();simChooser=2;updateInfo()}}else resolveSimultaneousRound()}
function placeSimToken(player,col){const row=legalRow(col);if(row<0)return false;grid[row][col]=player;moves++;return true}
function resolveSimultaneousRound(){ended=true;const c1=simChoices[1],c2=simChoices[2];if(c1===c2){placeSimToken(initiative,c1);placeSimToken(initiative===1?2:1,c1)}else{placeSimToken(1,c1);placeSimToken(2,c2)}hideLabModal();render();$('status-title').textContent='Choix révélés';$('status-detail').textContent=c1===c2?`Même colonne : ${names[initiative]} avait l’initiative.`:`Colonnes ${c1+1} et ${c2+1}.`;setTimeout(()=>{const wins=winningPlayers();ended=false;if(wins.length){finish(wins.length===2?0:wins[0],wins.length===2?'Les deux alignements apparaissent au même round.':`${names[wins[0]]} aligne 4 jetons.`);return}if(moves===rows*cols){finish(0,'La grille est pleine.');return}initiative=initiative===1?2:1;simChoices={1:null,2:null};simChooser=1;render();updateInfo();showLabModal(`<div class="privacy-icon">🔄</div><div class="eyebrow">Nouveau round</div><h2>Passe l’écran à ${names[1]}</h2><p class="muted">${names[initiative]} aura l’initiative en cas de collision.</p><button class="btn primary" id="sim-round">Continuer</button>`);$('sim-round').onclick=hideLabModal},700)}
function playRotate(){const wins=winningPlayers();if(wins.length){finish(wins.length===2?0:wins[0],wins.length===2?'Double alignement : manche nulle.':`${names[wins[0]]} aligne 4 jetons.`);return}if(moves%4===0){ended=true;$('status-title').textContent='Rotation en cours…';$('status-detail').textContent='Le plateau tourne et les jetons suivent la gravité.';animateRotationAndGravity().then(()=>{ended=false;const after=winningPlayers();if(after.length)finish(after.length===2?0:after[0],after.length===2?'La rotation offre une ligne aux deux joueurs.':`${names[after[0]]} gagne après la rotation.`);else if(moves===rows*cols)finish(0,'La grille est pleine.');else nextTurn()})}else if(moves===rows*cols)finish(0,'La grille est pleine.');else nextTurn()}
function animateRotationAndGravity(){const direction=Math.random()<.5?1:-1,board=$('board');if(direction<0)board.classList.add('ccw');requestAnimationFrame(()=>board.classList.add('rotating'));return new Promise(resolve=>setTimeout(()=>{board.classList.add('rotation-reset','no-token-animation');board.classList.remove('rotating','ccw');rotateGrid(direction);render();void board.offsetWidth;fallingPieces=applyGravity();board.classList.remove('no-token-animation');render();requestAnimationFrame(()=>board.classList.remove('rotation-reset'));$('status-title').textContent='Les jetons retombent…';$('game-panel').classList.add('flash');setTimeout(()=>{fallingPieces.clear();$('game-panel').classList.remove('flash');render();resolve()},820)},1460))}
function rotateGrid(direction){const next=Array.from({length:rows},()=>Array(cols).fill(0));for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(direction>0)next[c][rows-1-r]=grid[r][c];else next[rows-1-c][r]=grid[r][c]}grid=next}
function applyGravity(){const falls=new Map();for(let c=0;c<cols;c++){const pieces=[];for(let r=rows-1;r>=0;r--)if(grid[r][c])pieces.push({player:grid[r][c],from:r});for(let r=rows-1,i=0;r>=0;r--){if(i<pieces.length){const piece=pieces[i++];grid[r][c]=piece.player;if(r>piece.from)falls.set(`${r}:${c}`,r-piece.from)}else grid[r][c]=0}}return falls}
function playAnti(){const fresh=segmentsFor(turn).filter(s=>!counted[turn].has(s.key));fresh.forEach(s=>counted[turn].add(s.key));scores[turn]+=fresh.length;render(fresh.flatMap(s=>s.cells));if(moves===rows*cols){const winner=scores[1]===scores[2]?0:(scores[1]<scores[2]?1:2);finish(winner,winner?`${names[winner]} gagne avec le moins de lignes.`:'Même nombre de lignes : égalité.');return}nextTurn()}
function nextTurn(){bombArmed=false;turn=turn===1?2:1;render();updateInfo()}
function finish(winner,detail){ended=true;$('status-title').textContent=winner?`${names[winner]} gagne !`:'Manche nulle';$('status-detail').textContent=detail;$('p1').classList.remove('active');$('p2').classList.remove('active');$('counter').textContent='Partie terminée'}
function render(highlights=[]){const high=new Set(highlights.map(x=>x.join(':'))),forcedCols=new Set(forcedColumns()),forcedCells=new Set([...forcedCols].map(c=>`${legalRow(c)}:${c}`));$('board').innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const fall=fallingPieces.get(`${r}:${c}`)||0,isBombTarget=mode==='bomb'&&bombArmed&&grid[r][c];const cell=document.createElement('button');cell.className='cell'+(grid[r][c]?' filled':'')+(fall?' falling':'')+(forcedCells.has(`${r}:${c}`)?' forced':'')+(isBombTarget?' bomb-target':'')+(high.has(`${r}:${c}`)?' new-line':'');cell.setAttribute('aria-label',isBombTarget?`Faire exploser le pion ligne ${r+1}, colonne ${c+1}`:`Colonne ${c+1}`);if(fall)cell.style.setProperty('--fall-rows',fall);if(grid[r][c]){cell.style.setProperty('--piece',COLORS[grid[r][c]][0]);cell.style.setProperty('--piece2',COLORS[grid[r][c]][1])}cell.onclick=()=>bombArmed?detonate(r,c):play(c);$('board').appendChild(cell)}$('p1-score').textContent=mode==='anti'?`· ${scores[1]} ligne${scores[1]!==1?'s':''}`:mode==='bomb'?`· bombe ${bombs[1]?'prête':'utilisée'}`:mode==='mission'?`· ${playerMissions[1]?.name||'Mission'} : ${missionProgress(1).label}`:'';$('p2-score').textContent=mode==='anti'?`· ${scores[2]} ligne${scores[2]!==1?'s':''}`:mode==='bomb'?`· bombe ${bombs[2]?'prête':'utilisée'}`:mode==='mission'?`· ${playerMissions[2]?.name||'Mission'} : ${missionProgress(2).label}`:''}
function updateInfo(){if(ended)return;$('p1').classList.toggle('active',mode==='simultaneous'?simChooser===1:turn===1);$('p2').classList.toggle('active',mode==='simultaneous'?simChooser===2:turn===2);const forced=forcedColumns(),bombButton=$('bomb-button');bombButton.classList.toggle('hidden',mode!=='bomb');bombButton.disabled=mode!=='bomb'||!bombs[turn];bombButton.textContent=bombArmed?'Annuler la bombe':'💣 Bombe';if(mode==='simultaneous'){$('status-title').textContent=`${names[simChooser]} choisit sa colonne`;$('status-detail').textContent='Le choix ne sera révélé qu’après celui de l’autre joueur.'}else{$('status-title').textContent=bombArmed?'Choisis le pion central':`À ${names[turn]} de jouer`;$('status-detail').textContent=bombArmed?'Les pions rouges entourés peuvent être visés.':mode==='anti'&&forced.length?`Complétion obligatoire : ${forced.length} case${forced.length>1?'s':''} possible${forced.length>1?'s':''}.`:'Clique sur une colonne pour poser un jeton.'}if(mode==='rotate'){$('hint').textContent='Une ligne est vérifiée avant et après chaque rotation.';$('counter').textContent=`Rotation dans ${4-(moves%4)} coup${4-(moves%4)>1?'s':''}`}else if(mode==='anti'){$('hint').textContent='Une ligne de 5 compte comme 2 segments distincts.';$('counter').textContent=`${moves} / ${rows*cols} cases`}else if(mode==='bomb'){$('hint').textContent='La bombe détruit les huit voisins, jamais le pion central.';$('counter').textContent=bombs[turn]?'Bombe disponible':'Bombe déjà utilisée'}else if(mode==='mission'){$('hint').textContent='Les deux missions et leur progression sont publiques.';$('counter').textContent=`${moves} / ${rows*cols} cases`}else{$('hint').textContent='Les deux jetons sont résolus après les choix cachés.';$('counter').textContent=`Initiative : ${names[initiative]}`}
let rules='';if(mode==='rotate')rules='<h2>Règles du plateau rotatif</h2><ul><li>Grille carrée de 7×7.</li><li>Rotation après 4 coups, dans un sens imprévisible.</li><li>Les jetons retombent après la rotation.</li><li>Alignement vérifié avant et après rotation.</li></ul>';else if(mode==='anti')rules='<h2>Règles de l’Anti-Puissance 4</h2><ul><li>Grille agrandie à 9×9.</li><li>Chaque segment de 4 vaut un point négatif.</li><li>Une complétion possible est obligatoire.</li><li>Le plus petit score gagne.</li></ul>';else if(mode==='bomb')rules='<h2>Règles de Puissance Bombe</h2><ul><li>Grille classique de 7×6.</li><li>Le premier alignement de 4 gagne.</li><li>Une bombe par joueur.</li><li>Les huit voisins explosent, puis les jetons retombent.</li></ul>';else if(mode==='mission')rules='<h2>Règles de Mission personnelle</h2><ul><li>Chaque joueur choisit parmi 3 missions.</li><li>Les missions sont révélées avant le premier coup.</li><li>La progression reste publique.</li><li>Le premier objectif accompli gagne.</li></ul>';else rules='<h2>Règles du Placement simultané</h2><ul><li>Chaque joueur choisit une colonne en secret.</li><li>Les deux jetons tombent au même round.</li><li>Même colonne : le joueur avec l’initiative tombe en premier.</li><li>L’initiative alterne à chaque round.</li><li>Deux alignements simultanés donnent une égalité.</li></ul>';$('rules').innerHTML=rules}
(async()=>{if(await validateSession())openApp()})();
</script>
