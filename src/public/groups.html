<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groupes — Puissance 4</title>
<link rel="stylesheet" href="/theme.css"><style>
@font-face{font-family:Barlow;src:url('/assets/fonts/Barlow-Regular.ttf')}@font-face{font-family:BarlowC;src:url('/assets/fonts/BarlowCondensed-Bold.ttf')}*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f6f8ff;font-family:Barlow,Arial;min-height:100vh;background-image:radial-gradient(circle at 15% 0,rgba(124,92,255,.18),transparent 35%),radial-gradient(circle at 90% 15%,rgba(0,220,255,.1),transparent 28%)}button,input{font:inherit}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5vw);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(7,11,20,.82);backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brand{font:900 24px BarlowC;color:#fff;text-decoration:none;letter-spacing:1px}.brand b{color:#85ebff}.back{color:#aeb8d4;text-decoration:none}.layout{max-width:1200px;margin:0 auto;padding:34px 22px;display:grid;grid-template-columns:280px 1fr;gap:20px}.eyebrow{color:#85ebff;text-transform:uppercase;letter-spacing:2px;font:800 12px BarlowC}.intro h1{font:900 clamp(36px,6vw,64px)/.95 BarlowC;margin:8px 0 12px;text-transform:uppercase}.intro p{color:#aeb8d4;max-width:620px;line-height:1.55}.intro{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:10px}.btn{border:1px solid rgba(133,235,255,.3);border-radius:12px;background:rgba(133,235,255,.1);color:#bff6ff;padding:11px 15px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#7758ff,#3ebee8);border:0;color:white;box-shadow:0 10px 28px rgba(104,79,255,.25)}.panel{border:1px solid rgba(255,255,255,.09);border-radius:22px;background:rgba(16,22,39,.8);padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.groups-list{display:flex;flex-direction:column;gap:8px}.group-row{width:100%;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid transparent;background:transparent;color:white;text-align:left;cursor:pointer}.group-row:hover,.group-row.active{background:rgba(133,235,255,.08);border-color:rgba(133,235,255,.2)}.group-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:21px}.group-row small{display:block;color:#7f8aa8;margin-top:2px}.workspace{min-height:570px}.empty{display:grid;place-items:center;text-align:center;color:#8993ae;min-height:350px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08)}.head h2{margin:0;font:900 30px BarlowC;text-transform:uppercase}.head p{margin:4px 0 0;color:#8993ae}.member-stack{display:flex}.avatar{width:35px;height:35px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#202a42;border:2px solid #101627;margin-left:-8px;font-weight:800}.avatar:first-child{margin-left:0}.tabs{display:flex;gap:7px;margin:16px 0}.tab{padding:8px 12px;border:0;border-radius:9px;background:transparent;color:#8f99b5;cursor:pointer}.tab.active{background:rgba(119,88,255,.17);color:#cfc5ff}.view{display:none}.view.active{display:block}.chat{height:310px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px}.msg{display:flex;gap:9px}.bubble{background:rgba(255,255,255,.055);border-radius:5px 14px 14px 14px;padding:9px 12px;max-width:78%}.bubble strong{display:block;font-size:12px;color:#85ebff}.bubble span{font-size:14px}.composer,.invite-box,.create-form{display:flex;gap:8px;margin-top:12px}.field{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#0b1020;color:white;padding:11px 13px;outline:none}.field:focus{border-color:#7758ff}.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.event-card{padding:18px;border-radius:16px;background:linear-gradient(145deg,rgba(119,88,255,.15),rgba(255,255,255,.03));border:1px solid rgba(119,88,255,.24)}.event-card h3{margin:6px 0;font:800 22px BarlowC}.event-card p{color:#8993ae;font-size:13px;min-height:40px}.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.member{display:flex;align-items:center;gap:9px;padding:11px;border-radius:13px;background:rgba(255,255,255,.045)}.member small{display:block;color:#8993ae}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:10}.modal.open{display:grid}.dialog{width:min(440px,calc(100% - 30px));background:#11182a;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px}.dialog h2{font:900 30px BarlowC;margin:0 0 8px}.notice{padding:10px;color:#ff9caf;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:#16213a;border:1px solid rgba(133,235,255,.25);padding:12px 16px;border-radius:12px;display:none}.toast.show{display:block}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:22px 14px}.intro{align-items:start;flex-direction:column}.workspace{min-height:440px}.event-grid{grid-template-columns:1fr}.top{padding:0 16px}.composer,.invite-box{flex-wrap:wrap}.composer .field,.invite-box .field{min-width:100%}}
</style></head><body>
<header class="top"><a class="brand" href="/">PUISSANCE <b>4</b></a><a class="back" href="/">← Accueil</a></header>
<main class="layout"><section class="intro"><div><div class="eyebrow">Ton cercle de jeu</div><h1>Groupes privés</h1><p>Invite tes amis, discutez ensemble et organisez vos propres duels ou mini-tournois.</p></div><button class="btn primary" onclick="openCreate()">＋ Créer un groupe</button></section>
<aside class="panel"><div class="eyebrow" style="margin-bottom:12px">Mes groupes</div><div id="groups-list" class="groups-list"></div></aside>
<section id="workspace" class="panel workspace"><div class="empty"><div><div style="font-size:48px">🎮</div><h2>Choisis un groupe</h2><p>Ou crée ton premier cercle d'amis.</p></div></div></section></main>
<div id="create-modal" class="modal" onclick="if(event.target===this)closeCreate()"><div class="dialog"><div class="eyebrow">Nouveau groupe</div><h2>Rassemble ton équipe</h2><div class="create-form"><input id="group-emoji" class="field" style="max-width:65px" value="🎮" maxlength="4"><input id="group-name" class="field" placeholder="Les Stratèges" maxlength="28"></div><div id="create-error" class="notice"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeCreate()">Annuler</button><button class="btn primary" onclick="createGroup()">Créer</button></div></div></div><div id="toast" class="toast"></div>
<script>
const token=localStorage.getItem('token')||sessionStorage.getItem('token')||'';const me=JSON.parse(localStorage.getItem('player')||sessionStorage.getItem('player')||'{}');let groups=[],activeId=0,activeTab='chat';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const avatar=p=>p.avatar?`<img class="avatar" src="${esc(p.avatar)}" alt="">`:`<div class="avatar" style="color:${esc(p.color||'#85ebff')}">${esc((p.pseudo||'?')[0])}</div>`;
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
async function api(url,opt={}){const sep=url.includes('?')?'&':'?';const res=await fetch(url+(opt.method?'' : sep+'token='+encodeURIComponent(token)),opt);const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Une erreur est survenue.');return data}
async function load(){if(!token){document.getElementById('workspace').innerHTML='<div class="empty"><div><h2>Connexion requise</h2><p>Connecte-toi pour retrouver tes groupes.</p><a class="btn primary" href="/">Se connecter</a></div></div>';return}try{groups=(await api('/api/groups')).groups||[];renderList();if(groups.length){selectGroup(activeId||groups[0].id);const params=new URLSearchParams(location.search),target=Number(params.get('invite'));if(target){activeTab='members';renderGroup();setTimeout(()=>{const input=document.getElementById('invite-search');if(input){input.value=params.get('pseudo')||'';findInvite()}},30)}}}catch(e){toast(e.message)}}
function renderList(){document.getElementById('groups-list').innerHTML=groups.length?groups.map(g=>`<button class="group-row ${g.id===activeId?'active':''}" onclick="selectGroup(${g.id})"><span class="group-icon">${esc(g.emoji)}</span><span><b>${esc(g.name)}</b><small>${g.members.length} membre${g.members.length>1?'s':''}</small></span></button>`).join(''):'<div style="color:#7f8aa8;font-size:13px">Aucun groupe pour le moment.</div>'}
function selectGroup(id){activeId=Number(id);renderList();renderGroup()}
function renderGroup(){const g=groups.find(x=>x.id===activeId);if(!g)return;document.getElementById('workspace').innerHTML=`<div class="head"><div><h2>${esc(g.emoji)} ${esc(g.name)}</h2><p>Créé par ${esc(g.owner_pseudo)} · ${g.members.length} membres</p></div><div class="member-stack">${g.members.slice(0,6).map(avatar).join('')}</div></div><div class="tabs"><button class="tab ${activeTab==='chat'?'active':''}" onclick="tab('chat')">Discussion</button><button class="tab ${activeTab==='play'?'active':''}" onclick="tab('play')">Jouer</button><button class="tab ${activeTab==='members'?'active':''}" onclick="tab('members')">Membres</button></div><div id="view-chat" class="view ${activeTab==='chat'?'active':''}"><div id="chat" class="chat"></div><form class="composer" onsubmit="sendMessage(event)"><input id="message" class="field" maxlength="300" placeholder="Écrire au groupe…"><button class="btn primary">Envoyer</button></form></div><div id="view-play" class="view ${activeTab==='play'?'active':''}"><div class="event-grid"><article class="event-card"><div class="eyebrow">Partie rapide</div><h3>⚔️ Duel amical</h3><p>Annonce un duel au groupe et choisis ton adversaire.</p><button class="btn" onclick="createEvent('duel')">Lancer un duel</button></article><article class="event-card"><div class="eyebrow">Soirée privée</div><h3>🏆 Mini-tournoi</h3><p>Crée un rendez-vous compétitif réservé aux membres.</p><button class="btn" onclick="createEvent('tournament')">Créer un tournoi</button></article></div><div id="events" style="margin-top:16px"></div></div><div id="view-members" class="view ${activeTab==='members'?'active':''}"><div class="members">${g.members.map(m=>`<div class="member">${avatar(m)}<div><b>${esc(m.pseudo)}</b><small>${m.role==='owner'?'Créateur':m.elo+' ELO'}</small></div></div>`).join('')}</div><div class="invite-box"><input id="invite-search" class="field" placeholder="Pseudo à inviter…" minlength="3"><button class="btn primary" onclick="findInvite()">Ajouter au groupe</button></div><div id="invite-results"></div></div>`;loadMessages();renderEvents()}
function tab(t){activeTab=t;document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('active',['chat','play','members'][i]===t));document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+t).classList.add('active')}
async function loadMessages(){try{const d=await api(`/api/groups/${activeId}/messages`);document.getElementById('chat').innerHTML=d.messages.length?d.messages.map(m=>`<div class="msg">${avatar(m)}<div class="bubble"><strong>${esc(m.pseudo)}</strong><span>${esc(m.message)}</span></div></div>`).join(''):'<div class="empty" style="min-height:240px">Commencez la discussion 👋</div>';document.getElementById('chat').scrollTop=99999}catch(e){}}
async function sendMessage(e){e.preventDefault();const input=document.getElementById('message'),message=input.value.trim();if(!message)return;await api(`/api/groups/${activeId}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,message})});input.value='';loadMessages()}
async function findInvite(){const q=document.getElementById('invite-search').value.trim();if(q.length<3)return toast('Entre au moins 3 caractères.');const players=await fetch('/api/players/search?q='+encodeURIComponent(q)).then(r=>r.json());document.getElementById('invite-results').innerHTML=players.filter(p=>p.id!==me.id).map(p=>`<div class="member" style="margin-top:8px">${avatar(p)}<div style="flex:1"><b>${esc(p.pseudo)}</b><small>${p.elo} ELO</small></div><button class="btn" onclick="invite(${p.id})">Inviter</button></div>`).join('')||'<div class="notice">Aucun joueur trouvé.</div>'}
async function invite(targetId){try{await api(`/api/groups/${activeId}/invites`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,targetId})});toast('Invitation envoyée 🔔')}catch(e){toast(e.message)}}
async function createEvent(type){await api(`/api/groups/${activeId}/events`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,type})});toast(type==='duel'?'Duel annoncé au groupe ⚔️':'Tournoi créé 🏆');await load()}
function renderEvents(){const g=groups.find(x=>x.id===activeId),el=document.getElementById('events');if(!el)return;el.innerHTML=g.events.length?'<div class="eyebrow" style="margin-bottom:8px">Activités du groupe</div>'+g.events.map(e=>`<div class="member"><span style="font-size:22px">${e.type==='tournament'?'🏆':'⚔️'}</span><div><b>${esc(e.title)}</b><small>par ${esc(e.creator_pseudo)} · ouvert</small></div></div>`).join(''):''}
function openCreate(){document.getElementById('create-modal').classList.add('open');setTimeout(()=>document.getElementById('group-name').focus(),50)}function closeCreate(){document.getElementById('create-modal').classList.remove('open')}
async function createGroup(){try{const name=document.getElementById('group-name').value,emoji=document.getElementById('group-emoji').value;const d=await api('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,name,emoji})});closeCreate();activeId=d.group.id;await load();toast('Groupe créé !')}catch(e){document.getElementById('create-error').textContent=e.message}}
load();setInterval(()=>{if(activeId&&activeTab==='chat')loadMessages()},5000);
</script></body></html>
