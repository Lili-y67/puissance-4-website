        owner: ownerId ? undefined : ownerValue || undefined,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Impossible de basculer en mode bot.');
    lastBotToken = data.botToken || '';
    lastBotActivationCurl = data.activationCurl || '';
    syncStoredPlayerPatch({ is_bot: 1, bot_token_preview: lastBotToken.slice(-8), bot_owner_id: data.owner?.id || null });
    if (currentPlayer) {
      currentPlayer.is_bot = 1;
      currentPlayer.bot_token_preview = lastBotToken.slice(-8);
      currentPlayer.bot_owner_id = data.owner?.id || null;
    }
    const box = document.getElementById('bot-token-box');
    const val = document.getElementById('bot-token-value');
    if (val) val.textContent = lastBotToken;
    if (box) box.classList.add('show');
    if (btn) btn.textContent = 'Mode bot actif';

  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Basculer en mode bot'; }
    alert(e.message);
  }
}

async function copyTextToClipboard(text) {
  if (!text) return;
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  const input = document.createElement('textarea');
  input.value = text;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  input.remove();
}

function formatHostMetricValue(value, unit, digits = 0) {
  const n = Number(value || 0);
  if (!Number.isFinite(n) || n <= 0) return `0 ${unit}`;
  return `${n.toFixed(digits)} ${unit}`;
}

function drawHostMetricChart(botId, metrics = [], limits = {}) {
  const canvas = document.getElementById(`bot-host-chart-${botId}`);
  const line = document.getElementById(`bot-host-metric-line-${botId}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.025)';
  ctx.fillRect(0, 0, w, h);
  const rows = Array.isArray(metrics) ? metrics.slice(-80) : [];
  if (!rows.length) {
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText('Aucune mesure encore. Les courbes arrivent apres le demarrage du host.', 16, 68);
    if (line) line.textContent = 'CPU - · RAM - · Reseau -';
    return;
  }
  const latest = rows[rows.length - 1];
  if (line) {
    line.textContent = `CPU ${formatHostMetricValue(latest.cpuPct, '%', 1)} · RAM ${formatHostMetricValue(latest.rssMb, 'MB', 1)} · Reseau ${formatHostMetricValue(latest.netKb, 'KB', 1)}`;
  }
  const pad = 14;
  const graphW = w - pad * 2;
  const graphH = h - pad * 2;
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const y = pad + (graphH / 3) * i;
    ctx.beginPath();
    ctx.moveTo(pad, y);
    ctx.lineTo(w - pad, y);
    ctx.stroke();
  }
  const series = [
    { key: 'cpuPct', color: '#ff6b81', max: Math.max(100, ...rows.map(r => Number(r.cpuPct || 0))) },
    { key: 'rssMb', color: '#85ebff', max: Math.max(Number(limits.maxRssMb || 128), ...rows.map(r => Number(r.rssMb || 0))) },
    { key: 'netKb', color: '#ffd60a', max: Math.max(16, ...rows.map(r => Number(r.netKb || 0))) },
  ];
  for (const s of series) {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    rows.forEach((r, i) => {
      const x = pad + (rows.length === 1 ? graphW : (i / (rows.length - 1)) * graphW);
      const y = pad + graphH - Math.min(1, Number(r[s.key] || 0) / s.max) * graphH;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#ff6b81';
  ctx.fillText('CPU', pad, 15);
  ctx.fillStyle = '#85ebff';
  ctx.fillText('RAM', pad + 42, 15);
  ctx.fillStyle = '#ffd60a';
  ctx.fillText('NET', pad + 84, 15);
}

async function saveBotHostCode(botId) {
  const token = getStoredSessionToken();
  const code = document.getElementById(`bot-host-code-${botId}`)?.value || '';
  if (!code.trim()) return alert('Colle du code avant d envoyer.');
  const btn = document.getElementById(`bot-host-transfer-${botId}`);
  const previous = btn?.textContent || 'Transférer le code';
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Transfert...';
  }
  try {
    const res = await fetch(`/api/bot-host/${botId}/code`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': token },
      body: JSON.stringify({ token, code }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return alert(data.error || 'Transfert impossible.');
    if (btn) btn.textContent = 'Transféré ✓';
    await loadBotHostLogs(botId);
    setTimeout(() => {
      const freshBtn = document.getElementById(`bot-host-transfer-${botId}`);
      if (freshBtn) freshBtn.textContent = previous;
    }, 1200);
  } catch (e) {
    alert('Erreur réseau pendant le transfert.');
  } finally {
    if (btn) {
      setTimeout(() => {
        const freshBtn = document.getElementById(`bot-host-transfer-${botId}`);
        if (freshBtn) {
          freshBtn.disabled = false;
          if (freshBtn.textContent === 'Transfert...') freshBtn.textContent = previous;
        }
      }, 250);
    }
  }
}

async function importBotHostCodeFile(botId, input) {
  const file = input?.files?.[0];
  if (!file) return;
  const fileBtn = document.getElementById(`bot-host-file-btn-${botId}`);
  const previous = fileBtn?.textContent || 'Choisir un fichier';
  try {
    if (file.size > 256 * 1024) {
      alert('Fichier trop lourd pour ce panel.');
      return;
    }
    if (fileBtn) {
      fileBtn.disabled = true;
      fileBtn.textContent = 'Lecture...';
    }
    const code = await file.text();
    const area = document.getElementById(`bot-host-code-${botId}`);
    if (area) area.value = code;
    if (fileBtn) fileBtn.textContent = 'Fichier charge';
    await saveBotHostCode(botId);
  } catch (e) {
    alert('Impossible de lire ce fichier.');
  } finally {
    if (input) input.value = '';
    if (fileBtn) {
      fileBtn.disabled = false;
      setTimeout(() => {
        const freshBtn = document.getElementById(`bot-host-file-btn-${botId}`);
        if (freshBtn) freshBtn.textContent = previous;

  }
}

const DISCORD_RANK_ROLE_RE = /^(Malachite|Quartz|Ambre|Jade|Saphir|Améthyste|Amethyste) (I|II|III|IV|V)$/i;
const DISCORD_CONNECTED_ROLE_RE = /^connect[eé]e$/i;

function normalizeDiscordRoleName(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

function discordServerRoleChip(role) {
  const name = String(role?.name || role?.id || '').trim();
  const col = role?.color && role.color !== '#000000' ? role.color : '#99aab5';
  const normalizedName = normalizeDiscordRoleName(name);
  const isConnected = DISCORD_CONNECTED_ROLE_RE.test(normalizedName);
  const rankMatch = name.match(DISCORD_RANK_ROLE_RE);
  const classes = ['discord-role-chip'];
  if (rankMatch || role?.isSiteRank) classes.push('rank-role');
  if (isConnected) classes.push('connected-role');
  const dotStyle = isConnected ? '' : `style="background:${col}"`;
  const style = isConnected ? '' : `style="background:${col}22;color:${col};border:1px solid ${col}55"`;
  return `<span class="${classes.join(' ')}" ${style}>
    <span class="discord-role-dot" ${dotStyle}></span>
    ${escapeHtml(name)}
  </span>`;
}

async function requestUnlink() {
  const btn = document.getElementById('btn-unlink');
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi en cours...'; }

  try {
    const token = localStorage.getItem('token');
    const res   = await fetch('/api/discord/unlink/request', {
      method: 'POST',
      headers: { 'x-session-token': token, 'Content-Type': 'application/json' },
    });
    const data = await res.json();

    if (data.ok) {
      // Afficher le modal
      const modal = document.getElementById('unlink-modal-bg');
      if (modal) { modal.style.display = 'flex'; }
      document.getElementById('unlink-code-input')?.focus();
    } else {
      PROFIL_SFX.error();
      alert('Erreur : ' + (data.error || 'Impossible d\'envoyer le code'));
    }
  } catch(e) {
    PROFIL_SFX.error();
    alert('Erreur réseau');
  } finally {
  if (btn) { btn.disabled = false; btn.textContent = '\uD83D\uDD17 Délier Discord'; }
  }
}

function closeUnlinkModal() {
  PROFIL_SFX.popupClose();
  const modal = document.getElementById('unlink-modal-bg');
  if (modal) modal.style.display = 'none';
  const input = document.getElementById('unlink-code-input');
  if (input) input.value = '';
  const err = document.getElementById('unlink-error');
  if (err) err.textContent = '';
}

async function confirmUnlink() {
  const code  = document.getElementById('unlink-code-input')?.value?.trim();
  const errEl = document.getElementById('unlink-error');
  if (!code || code.length !== 6) {
    if (errEl) errEl.textContent = 'Entre un code à 6 chiffres';
    return;
  }

  try {
    const token = localStorage.getItem('token');
    const res   = await fetch('/api/discord/unlink/confirm', {
      method: 'POST',
      headers: { 'x-session-token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();

    if (data.ok) {
      PROFIL_SFX.success();
      closeUnlinkModal();
      // Recharger le profil pour refléter la déliaison
      setTimeout(() => location.reload(), 800);
    } else {
      PROFIL_SFX.error();
      if (errEl) errEl.textContent = data.error || 'Code invalide ou expiré';
    }
  } catch(e) {
    if (errEl) errEl.textContent = 'Erreur réseau';
  }
}

  if (!me.id) return;
  const input = document.getElementById('profile-pseudo-input');
  const btn = document.getElementById('btn-save-pseudo');
  const pseudo = String(input?.value || '').trim();
  if (!pseudo) {
    PROFIL_SFX.error();
    return alert('Entre un pseudo.');
  }
  PROFIL_SFX.click();
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`/api/players/${me.id}/pseudo`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pseudo, token: localStorage.getItem('token') }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      PROFIL_SFX.error();
      alert(data.error || 'Pseudo invalide.');
      return;
    }
    me.pseudo = data.pseudo || pseudo;
    if (currentPlayer) currentPlayer.pseudo = me.pseudo;
    localStorage.setItem('player', JSON.stringify(me));
    sessionStorage.setItem('player', JSON.stringify(me));
    const pseudoEl = document.querySelector('.profile-pseudo');
    if (pseudoEl) pseudoEl.textContent = me.pseudo;
    const confirm = document.getElementById('pseudo-confirm');
    if (confirm) {
      confirm.style.opacity = '1';
      setTimeout(() => confirm.style.opacity = '0', 2000);
    }
    PROFIL_SFX.success();
  } finally {
    btn.disabled = false;
    btn.textContent = '✏️ Enregistrer';
  }
}

function selectPseudoFont(font) {
  const input = document.getElementById('pseudo-style-font-input');
  if (input) input.value = String(font || 'barlow');
  document.querySelectorAll('.pseudo-font-option').forEach(btn => {
    btn.classList.toggle('active', String(btn.dataset.pseudoFont || '') === String(font || 'barlow'));
  });
  refreshPseudoFontPreviews();
  closePseudoFontPicker();
}

function openPseudoFontPicker() {
  refreshPseudoFontPreviews();
  document.getElementById('pseudo-font-modal-bg')?.classList.add('show');
}

function closePseudoFontPicker() {
  document.getElementById('pseudo-font-modal-bg')?.classList.remove('show');
}

function filterPseudoFonts(rarity = 'all') {
  const key = String(rarity || 'all');
  document.querySelectorAll('.pseudo-font-filter').forEach(btn => {
    btn.classList.toggle('active', String(btn.dataset.fontFilter || 'all') === key);
  });
  document.querySelectorAll('.pseudo-font-option').forEach(btn => {
    const show = key === 'all' || String(btn.dataset.fontRarity || 'common') === key;
    btn.style.display = show ? '' : 'none';
  });
}

function refreshPseudoFontPreviews() {
  const pseudo = String(document.getElementById('profile-pseudo-input')?.value || currentPlayer?.pseudo || 'Pseudo').trim() || 'Pseudo';
  updateProfilePseudoInputSize();
  const currentFont = document.getElementById('pseudo-style-font-input')?.value || 'barlow';
  document.querySelectorAll('.pseudo-font-option strong').forEach(el => {
    el.textContent = pseudo.slice(0, 16);
  });
  const current = document.getElementById('pseudo-font-current');
  if (current) {
    const strong = current.querySelector('strong');
    const label = current.querySelector('span');
    if (strong) {
      strong.textContent = pseudo.slice(0, 16);
      strong.style.fontFamily = getPseudoFontFamily(currentFont);
    }
    if (label) label.textContent = getPseudoFontLabel(currentFont);
  }
  refreshPseudoStylePreview();
}

function updateProfilePseudoInputSize() {
  const input = document.getElementById('profile-pseudo-input');
  if (!input) return;
  const length = [...String(input.value || '')].length;
  const widthCh = Math.max(18, Math.min(27, length + 9));
  input.style.width = `${widthCh}ch`;
  input.style.fontSize = length <= 6 ? '19px' : length <= 10 ? '17px' : length <= 13 ? '16px' : '15px';
}

function getSelectedPseudoFormats() {
  return [...document.querySelectorAll('#pseudo-format-row input[type="checkbox"][value]:checked')]
    .map(input => input.value)
    .filter(Boolean);
}

function onPseudoFormatChange(input) {
  if (input?.checked && (input.value === 'lowercase' || input.value === 'uppercase')) {
    const opposite = input.value === 'lowercase' ? 'uppercase' : 'lowercase';
    const oppositeInput = document.querySelector(`#pseudo-format-row input[value="${opposite}"]`);
    if (oppositeInput) oppositeInput.checked = false;
  }
  refreshPseudoStylePreview();
}

function refreshPseudoStylePreview() {
  const pseudoEl = document.querySelector('.profile-pseudo');
  if (!pseudoEl || !currentPlayer) return;
  const preview = {
    ...currentPlayer,
    pseudo_color: document.getElementById('pseudo-style-color-input')?.value || currentPlayer.pseudo_color,
    pseudo_color_secondary: document.getElementById('pseudo-style-color-secondary-input')?.value || '',
    pseudo_font: document.getElementById('pseudo-style-font-input')?.value || currentPlayer.pseudo_font,

  applyPseudoDisplay(document.querySelector('#pseudo-font-current strong'), preview);
  syncPseudoRgbPreviews(Number(preview.pseudo_rgb) === 1);

function initProfileInteractionSounds() {
  const hoverSelectors = [
    '.btn-nav', '.btn-follow', '.search-btn', '.search-result', '.social-card',
    '.tab', '.game-row', '.player-row', '.color-preset', '.color-custom-wrap',
    '.shape-btn', '.avatar-decoration-option', '.avatar-decoration-btn',
    '.upload-chooser-btn', '.image-editor-btn', '.pg-btn'
  ];
  const clickSelectors = [
    '.btn-nav', '.btn-follow', '.search-btn', '.social-card', '.tab',
    '.color-preset', '.color-custom-wrap', '.shape-btn', '.avatar-decoration-option',
    '.avatar-decoration-btn', '.upload-chooser-btn', '.pg-btn',
    '#profile-banner-btn', '#avatar-decoration-btn', '#admin-pwd-btn', '#btn-close-account'
  ];
  const hovered = new WeakSet();

  document.addEventListener('mouseover', (event) => {
    const target = event.target.closest(hoverSelectors.join(','));
    if (!target || hovered.has(target) || target.disabled || target.classList?.contains('locked')) return;
    hovered.add(target);
    PROFIL_SFX.hover();
  });

  document.addEventListener('mouseout', (event) => {
    const target = event.target.closest(hoverSelectors.join(','));
    if (target) hovered.delete(target);
  });

  document.addEventListener('click', (event) => {
    const target = event.target.closest(clickSelectors.join(','));
    if (!target || target.disabled || target.classList?.contains('locked')) return;
    PROFIL_SFX.click();
  });
}

function readProfileWallpaperSettings() {
  const wallpaper =
    (currentPlayer && String(currentPlayer.profile_wallpaper || '').trim()) ||
    String(localStorage.getItem('p4_profile_wallpaper') || '').trim();
  const opacityRaw = Number(localStorage.getItem('p4_profile_wallpaper_opacity') || currentPlayer?.profile_wallpaper_opacity || 0.48);
  const dimRaw = Number(localStorage.getItem('p4_profile_wallpaper_dim') || currentPlayer?.profile_wallpaper_dim || 0.28);
  return {
    wallpaper,
    opacity: Math.min(1, Math.max(0.08, Number.isFinite(opacityRaw) ? opacityRaw : 0.48)),
    dim: Math.min(0.85, Math.max(0, Number.isFinite(dimRaw) ? dimRaw : 0.28)),
  };
}

function applyProfileWallpaperMode(settings = readProfileWallpaperSettings()) {
  const wallpaper = String(settings.wallpaper || '').trim();
  document.body.classList.toggle('profile-wallpaper-mode', Boolean(wallpaper));
  if (!wallpaper) {
    document.body.style.removeProperty('--profile-wallpaper-image');
    document.body.style.removeProperty('--profile-wallpaper-opacity');
    document.body.style.removeProperty('--profile-wallpaper-dim');
  } else {
    document.body.style.setProperty('--profile-wallpaper-image', `url("${wallpaper.replace(/["\\]/g, '\\$&')}")`);
    document.body.style.setProperty('--profile-wallpaper-opacity', String(settings.opacity));
    document.body.style.setProperty('--profile-wallpaper-dim', String(settings.dim));
  }
  window.P4Wallpaper?.refresh?.();
}

function refreshProfileWallpaperControls() {
  const settings = readProfileWallpaperSettings();
  const preview = document.getElementById('profile-wallpaper-preview');
  const opacity = document.getElementById('profile-wallpaper-opacity');
  const dim = document.getElementById('profile-wallpaper-dim');
  if (opacity) opacity.value = String(Math.round(settings.opacity * 100));
  if (dim) dim.value = String(Math.round(settings.dim * 100));
  if (preview) {
    preview.classList.toggle('empty', !settings.wallpaper);
    preview.style.backgroundImage = settings.wallpaper ? `url("${settings.wallpaper.replace(/["\\]/g, '\\$&')}")` : '';
    preview.style.setProperty('--wallpaper-preview-dim', String(settings.dim));
    preview.innerHTML = settings.wallpaper ? '' : '<span>Aucune image</span>';
  }
  const opacityValue = document.getElementById('profile-wallpaper-opacity-value');
  const dimValue = document.getElementById('profile-wallpaper-dim-value');
  if (opacityValue) opacityValue.textContent = `${Math.round(settings.opacity * 100)}%`;
  if (dimValue) dimValue.textContent = `${Math.round(settings.dim * 100)}%`;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error('Impossible de lire cette image.'));
    reader.readAsDataURL(file);
  });
}

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error('Image invalide.'));
    image.src = src;
  });
}

async function prepareProfileWallpaperData(file) {
  const raw = await readFileAsDataUrl(file);
  const image = await loadImageElement(raw);
  const maxSide = 1920;
  const scale = Math.min(1, maxSide / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
  const width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
  const height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', 0.84);
}

async function handleProfileWallpaperUpload(input) {
  const file = input?.files?.[0];
  if (!file) return;
  if (!/^image\/(png|jpeg|jpg|webp)$/i.test(file.type)) {
    input.value = '';
    return alert('Image PNG, JPG ou WebP uniquement.');
  }
  if (file.size > 8 * 1024 * 1024) {
    input.value = '';
    return alert('Fond trop lourd (max 8 Mo).');
  }
  try {
    const wallpaper = await prepareProfileWallpaperData(file);
    const current = readProfileWallpaperSettings();
    const settings = {
      wallpaper,
      opacity: current.opacity,
      dim: current.dim,
    };
    window.P4Wallpaper?.apply?.(settings);
    if (!window.P4Wallpaper) {
      localStorage.setItem('p4_profile_wallpaper', settings.wallpaper);
      localStorage.setItem('p4_profile_wallpaper_opacity', String(settings.opacity));
      localStorage.setItem('p4_profile_wallpaper_dim', String(settings.dim));
      applyProfileWallpaperMode(settings);
    }
    refreshProfileWallpaperControls();
    PROFIL_SFX.success();
  } catch (error) {
    alert(error.message || 'Impossible de préparer cette image.');
  } finally {
    input.value = '';
  }
}

initProfileInteractionSounds();
const searchBotsToggle = document.getElementById('search-include-bots');
if (searchBotsToggle) searchBotsToggle.checked = localStorage.getItem('profile_search_bots') === '1';
applyProfileWallpaperMode();
load();
</script>
