<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 - Profil</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/gjrLtaU.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);
  --red:#ff2d55;--red-dim:rgba(255,45,85,0.12);--red-glow:rgba(255,45,85,0.4);
  --yellow:#ffd60a;--yel-dim:rgba(255,214,10,0.1);--yel-glow:rgba(255,214,10,0.4);
  --green:#30d158;--green-dim:rgba(48,209,88,0.1);--green-glow:rgba(48,209,88,0.3);
  --text:#eeeef5;--muted:rgba(238,238,245,0.38);--accent:#4c6ef5;
}
html,body{min-height:100%;background:var(--bg); background-attachment: fixed;color:var(--text);font-family:'Barlow',sans-serif;}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);}
.page{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:20px;}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo-sm{font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;text-decoration:none;color:var(--text);}
.logo-sm span{color:var(--red);}
.nav-btns{display:flex;gap:8px;}
.btn-nav{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;text-decoration:none;transition:all 0.2s;}
.btn-nav:hover{border-color:var(--muted);color:var(--text);}
.btn-nav.danger:hover{border-color:var(--red);color:var(--red);}

@keyframes slide-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* â”€â”€ Profile header â”€â”€ */
.profile-header{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.4);
  animation:slide-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
.profile-banner{
  width:100%;height:200px;object-fit:cover;display:block;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  position:relative;cursor:pointer;
}
.profile-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-banner-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.2s;font-size:24px;
}
.profile-banner:hover .profile-banner-overlay{opacity:1;}
.profile-header-inner{
  display:flex;align-items:center;gap:20px;padding:20px 24px 24px;
}
.avatar-wrap{position:relative;flex-shrink:0;cursor:pointer;}
.avatar-wrap:hover .avatar-overlay{opacity:1;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--player-color-dim,var(--red-dim));border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:900;color:var(--player-color,var(--red));overflow:hidden;transition:border-color 0.4s,background 0.4s,color 0.4s;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-decoration{position:absolute;inset:-16px;pointer-events:none;z-index:2}
.avatar-decoration img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 16px rgba(255,255,255,0.12))}
.avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:opacity 0.2s;}
/* Cercle statut autour de l'avatar */
.avatar-ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid transparent;pointer-events:none;transition:border-color 0.4s,box-shadow 0.4s;}
.avatar-ring.online{border-color:#30d158;box-shadow:0 0 10px rgba(48,209,88,0.5);}
.avatar-ring.offline{border-color:#636366;box-shadow:none;}
/* Badges statut */
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;margin-top:5px;}
.status-badge.online{background:rgba(48,209,88,0.12);border:1px solid rgba(48,209,88,0.3);color:#30d158;}
.status-badge.offline{background:rgba(99,99,102,0.15);border:1px solid rgba(99,99,102,0.3);color:#8e8e93;}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status-dot.online{background:#30d158;animation:pulse-online 1.5s ease-in-out infinite;}
.status-dot.offline{background:#636366;}
.status-lastseen{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:0.3px;}
@keyframes pulse-online{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(48,209,88,0.4);}50%{opacity:0.8;box-shadow:0 0 0 4px rgba(48,209,88,0);}}
/* Toggle auto-rejoin */
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color 0.2s;}
.toggle-wrap:hover{border-color:rgba(255,255,255,0.15);}
.toggle-label{font-size:12px;font-weight:600;color:var(--text);}
.toggle-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.toggle-switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,0.1);border-radius:22px;transition:background 0.25s;}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform 0.25s;}
.toggle-switch input:checked + .toggle-slider{background:var(--green);}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(16px);}
/* Popup simulateur ELO */
.elo-sim-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.elo-sim-bg.show{display:flex;}
.elo-sim-modal{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:28px 24px;width:100%;max-width:420px;position:relative;}
.elo-sim-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.elo-sim-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
.elo-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline:none;cursor:pointer;margin:8px 0 4px;}
.elo-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff;transition:transform 0.15s;}
.elo-slider::-webkit-slider-thumb:hover{transform:scale(1.2);}
.elo-sim-badge{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;background:rgba(255,255,255,0.03);border-radius:16px;border:1px solid rgba(255,255,255,0.06);margin-top:16px;}
.elo-sim-badge img{width:64px;height:64px;object-fit:contain;transition:all 0.3s;}
.elo-sim-rank-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;transition:color 0.3s;}
.elo-sim-progress-wrap{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin-top:4px;}
.elo-sim-progress-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;}
input[type="file"]{display:none;}
.profile-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.profile-pseudo{font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;line-height:1;text-align:center;}
.profile-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.profile-since{font-size:12px;color:var(--muted);margin-top:6px;text-align:center;}
.profile-media-note{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;}
.rank-badge{display:flex;align-items:center;gap:8px;margin-top:6px;}
.rank-badge img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,0.2));}
.rank-badge-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.rank-progress{width:100%;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:4px;overflow:hidden;}
.rank-progress-fill{height:100%;border-radius:2px;transition:width 0.6s ease;}

/* Follow button */
.btn-follow{
  font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:9px 18px;border-radius:10px;
  border:none;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.btn-follow.not-following{background:var(--green-dim);border:1.5px solid rgba(48,209,88,0.3);color:var(--green);}
.btn-follow.not-following:hover{background:rgba(48,209,88,0.25);box-shadow:0 0 16px var(--green-glow);}
.btn-follow.following{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-follow.following:hover{border-color:var(--red);color:var(--red);}

.profile-elo{font-family:Barlow Condensed,sans-serif;font-size:42px;font-weight:900;letter-spacing:2px;color:var(--yellow);text-shadow:0 0 20px var(--yel-glow);text-align:right;flex-shrink:0;}
.profile-elo-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-align:right;}

/* â”€â”€ Social counts â”€â”€ */
.social-row{
  display:flex;gap:8px;
  animation:slide-in 0.5s 0.05s cubic-bezier(0.22,1,0.36,1) both;
}
.social-card{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;
}
.social-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);}
.social-card.active{border-color:var(--accent);}
.social-val{font-family:Barlow Condensed,sans-serif;font-size:26px;font-weight:900;letter-spacing:1px;}
.social-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:2px;}

/* â”€â”€ Stats â”€â”€ */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;animation:slide-in 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:4px;transition:all 0.2s;}
.stat-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);}
.stat-val{font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;}
.stat-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.stat-card.wins     .stat-val{color:var(--green);}
.stat-card.losses   .stat-val{color:var(--red);}
.stat-card.draws    .stat-val{color:var(--muted);}
.stat-card.accuracy .stat-val{color:#8b9cf4;}
.stat-card.accuracy{background:linear-gradient(135deg,rgba(76,110,245,0.06),rgba(139,156,244,0.04));border-color:rgba(76,110,245,0.2);}

.winrate-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;animation:slide-in 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both;}
.winrate-header{display:flex;justify-content:space-between;align-items:center;}
.wr-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.wr-pct{font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:800;color:var(--green);}
.wr-bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.wr-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width 1s cubic-bezier(0.22,1,0.36,1);}

/* â”€â”€ Tabs â”€â”€ */
.tabs-row{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;animation:slide-in 0.5s 0.2s cubic-bezier(0.22,1,0.36,1) both;}
.tab{flex:1;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px;border-radius:7px;background:transparent;border:none;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.3);}

/* â”€â”€ Tab panels â”€â”€ */
.tab-panel{display:none;animation:slide-in 0.3s cubic-bezier(0.22,1,0.36,1) both;}
.tab-panel.show{display:flex;flex-direction:column;gap:6px;}

/* â”€â”€ History rows â”€â”€ */
.game-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--text);transition:all 0.2s;}
.game-row:hover{border-color:rgba(255,255,255,0.12);transform:translateX(4px);}
.game-result{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
.game-result.win{background:var(--green-dim);}
.game-result.loss{background:var(--red-dim);}
.game-result.draw{background:var(--surface2);}
.game-vs{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.game-vs span{color:var(--muted);}
.game-meta{text-align:right;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:1px;}
.game-elo-change{font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;}
.game-elo-change.pos{color:var(--green);}
.game-elo-change.neg{color:var(--red);}
.game-elo-change.neu{color:var(--muted);}
.replay-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);flex-shrink:0;}
.game-row:hover .replay-badge{border-color:var(--accent);color:var(--accent);}
.pg-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.pg-btn:hover{border-color:var(--accent);color:var(--accent);}
.pg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pg-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* â”€â”€ Player rows (following/followers) â”€â”€ */
.player-row{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  text-decoration:none;color:var(--text);transition:all 0.2s;position:relative;overflow:hidden;isolation:isolate;
}
.player-row:hover{border-color:rgba(255,255,255,0.12);transform:translateX(4px);}
.player-row-content,.search-result-content{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%}
.pseudo-banner-strip{
  position:absolute;left:54px;right:52px;top:9px;bottom:9px;border-radius:10px;
  background-size:cover;background-position:center;pointer-events:none;z-index:0;opacity:.98;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);
}
.pseudo-banner-strip::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(14,14,24,0.9) 0%,rgba(14,14,24,0.46) 34%,rgba(14,14,24,0.46) 66%,rgba(14,14,24,0.9) 100%);
}
.player-mini-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:900;}
.player-mini-avatar img{width:100%;height:100%;object-fit:cover;}
.player-mini-info{flex:1;min-width:0;}
.player-mini-pseudo{font-weight:600;font-size:14px;}
.player-mini-stats{font-size:11px;color:var(--muted);margin-top:1px;}
.player-mini-elo{font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:800;color:var(--yellow);flex-shrink:0;}

/* Badges wins streak */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
.badge.online{background:rgba(48,209,88,0.12);color:var(--green);border:1px solid rgba(48,209,88,0.2);}

.empty-state{text-align:center;padding:32px 20px;color:var(--muted);font-size:14px;}

/* â”€â”€ Color picker card â”€â”€ */
.color-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;
  animation:slide-in 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both;
}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.color-picker-inline{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;min-width:118px}
.color-picker-inline input[type="color"]{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:none;background:transparent;padding:0;cursor:pointer;opacity:1;position:static;pointer-events:auto}
.color-picker-inline input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.color-picker-inline input[type="color"]::-webkit-color-swatch{border:none;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,0.14)}
.color-picker-inline span{font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase}
.color-preset{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;flex-shrink:0;}
.color-preset:hover{transform:scale(1.2);}
.color-preset.active{border-color:var(--text);transform:scale(1.15);}
.color-custom-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;transition:border-color 0.2s;flex:1;min-width:120px;}
.color-custom-wrap:hover{border-color:rgba(255,255,255,0.15);}
.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;transition:background 0.2s, box-shadow 0.2s;}
.color-hex{font-size:12px;color:var(--muted);}
.color-editor{display:grid;grid-template-columns:minmax(190px,220px) 1fr auto;gap:12px;align-items:center}
.color-preview-card{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px 14px;min-height:70px}
.color-preview-big{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,0.18);flex-shrink:0;transition:background .2s,box-shadow .2s}
.color-preview-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.color-preview-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.color-preview-value{font-size:13px;color:var(--text);font-weight:600}
.color-inputs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type="color"]{width:0;height:0;opacity:0;position:absolute;pointer-events:none;}
.btn-save-color{
  font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:10px 20px;border-radius:10px;
  background:var(--green-dim);border:1.5px solid rgba(48,209,88,0.3);color:var(--green);
  cursor:pointer;transition:all 0.2s;align-self:flex-end;
}
.btn-save-color:hover{background:rgba(48,209,88,0.25);}
.btn-save-color:disabled{opacity:0.5;cursor:not-allowed;}
.save-confirm{font-size:12px;color:var(--green);opacity:0;transition:opacity 0.3s;}

/* â”€â”€ Shape picker â”€â”€ */
.shape-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;

<script>
// â”€â”€ Audio Profil â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const PROFIL_SFX = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function play(fn) { try { fn(getCtx()); } catch(e) {} }

  return {
    success() {
      play(ctx => {
        const t = ctx.currentTime;
        [523, 659, 784].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t + i*0.08);
          g.gain.linearRampToValueAtTime(0.18, t + i*0.08 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + i*0.08 + 0.25);
          o.start(t + i*0.08); o.stop(t + i*0.08 + 0.25);
        });
      });
    },
    color(hex) {
      play(ctx => {
        const t = ctx.currentTime;
        const hue = parseInt((hex||'#ff0000').slice(1), 16) % 360;
        const freq = 300 + (hue / 360) * 500;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.1);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.start(t); o.stop(t + 0.2);
      });
    },
    shape() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(440, t);
        o.frequency.exponentialRampToValueAtTime(880, t + 0.15);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.3);
      });
    },
    upload() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        o.connect(f); f.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 800;
        o.frequency.setValueAtTime(200, t);
        o.frequency.exponentialRampToValueAtTime(600, t + 0.2);
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.3);
      });
    },
    discord() {
      play(ctx => {
        const t = ctx.currentTime;
        [880, 1109].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t + i*0.1);
          g.gain.linearRampToValueAtTime(0.15, t + i*0.1 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, t + i*0.1 + 0.4);
          o.start(t + i*0.1); o.stop(t + i*0.1 + 0.4);
        });
      });
    },
    error() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'square'; o.frequency.value = 120;
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.start(t); o.stop(t + 0.15);
      });
    },
  };
})();

let currentPlayer = null;

let uploadChooserTarget = null;
const GIF_URL_CACHE = new Map();
let avatarDecorationLibrary = [];
let profileBannerLibrary = [];
let profileShopInventory = {};

function getRenderableMediaSrc(src) {
  if (!src || typeof src !== 'string') return '';
  if (!/^data:image\/gif;base64,/i.test(src)) return src;
  if (GIF_URL_CACHE.has(src)) return GIF_URL_CACHE.get(src);
  try {
    const match = src.match(/^data:([^;]+);base64,(.+)$/i);
    if (!match) return src;
    const mime = match[1] || 'image/gif';
    const binary = atob(match[2]);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    GIF_URL_CACHE.set(src, url);
    return url;
  } catch {
    return src;
  }
}

  try {
    const res = await fetch('/api/decorations');

    avatarDecorationLibrary = Array.isArray(data?.decorations) ? data.decorations : [];

}

async function loadProfileBannerLibrary() {

    const data = await res.json();
    profileBannerLibrary = Array.isArray(data?.banners) ? data.banners : [];
  } catch {

  }
}

async function loadProfileShopInventory() {
  const token = localStorage.getItem('token');
  if (!token || !isOwnProfile) {
    profileShopInventory = {};
    return;
  }
  try {
    const res = await fetch('/api/shop/me', { headers: { 'x-session-token': token } });
    const data = await res.json();
    profileShopInventory = data?.inventory && typeof data.inventory === 'object' ? data.inventory : {};
  } catch {
    profileShopInventory = {};
  }
}

function getProfileBoosterCounts() {
  const elo = Number(profileShopInventory.elo_mini || 0)
    + Number(profileShopInventory.elo_classic || 0)
    + Number(profileShopInventory.elo_max || 0)
    + Number(profileShopInventory.elo_princess || 0);
  const coins = Number(profileShopInventory.coin_boost || 0)
    + Number(profileShopInventory.coin_boost_plus || 0);
  return { elo, coins };
}

function getVipMediaRemainingMs() {
  if (String(currentPlayer?.role || '') === 'admin') return 0;
  const lastChanged = Number(currentPlayer?.vip_media_changed_at || 0);
  if (!lastChanged) return 0;
  const cooldown = Number(currentPlayer?.is_vip_plus) === 1 ? (12 * 60 * 60 * 1000) : (24 * 60 * 60 * 1000);
  const remaining = lastChanged + cooldown - Date.now();
  return remaining > 0 ? remaining : 0;
}

function getAvatarDecorationRemainingMs(player = currentPlayer) {
  if (String(player?.role || '') === 'admin') return 0;
  const lastChanged = Number(player?.avatar_decoration_changed_at || 0);
  if (!lastChanged) return 0;
  const remaining = lastChanged + (24 * 60 * 60 * 1000) - Date.now();
  return remaining > 0 ? remaining : 0;
}

function isVipPlus(player = currentPlayer) {
  return Number(player?.is_vip_plus) === 1 || String(player?.role || '') === 'admin';
}

function isVip(player = currentPlayer) {
  return Number(player?.is_vip) === 1 || Number(player?.is_vip_plus) === 1 || String(player?.role || '') === 'admin';
}

function isPerso(player = currentPlayer) {
  return Number(player?.is_perso) === 1;
}

function canUseGradient(player = currentPlayer) {
  return isVipPlus(player) || isPerso(player);
}

function getPremiumTier(player = currentPlayer) {
  if (isVipPlus(player)) return 'vip_plus';
  if (isPerso(player)) return 'perso';
  if (Number(player?.is_vip) === 1) return 'vip';
  return null;
}

function getVipAccent(player = currentPlayer) {
  return isVipPlus(player)
    ? { color: '#85EBFF', bg: 'rgba(133,235,255,0.14)', border: 'rgba(133,235,255,0.42)', label: 'VIP+' }
    : { color: '#ffd60a', bg: 'rgba(255,214,10,0.14)', border: 'rgba(255,214,10,0.32)', label: 'VIP' };
}

function getPersoAccent() {
  return { color: '#ff7a45', bg: 'rgba(255,122,69,0.14)', border: 'rgba(255,122,69,0.36)', label: 'PERSO' };
}

function getPersoRoleAccent(player = currentPlayer) {
  const defaultAccent = getPersoAccent();
  const rawColor = String(player?.custom_role_color || '').trim();
  const color = /^#[0-9a-fA-F]{6}$/.test(rawColor) ? rawColor.toUpperCase() : defaultAccent.color;
  return {
    color,
    bg: `${color}18`,
    border: `${color}66`,
    label: String(player?.custom_role_text || '').trim().toUpperCase() || defaultAccent.label,
    emoji: String(player?.custom_role_emoji || '').trim(),
  };
}

function hasCustomPersoRole(player = currentPlayer) {
  return isPerso(player) && !!String(player?.custom_role_text || '').trim() && !!String(player?.custom_role_color || '').trim();
}

function getVipExpiryLabel(player = currentPlayer) {
  if (!player?.is_vip || player?.is_vip_plus || !player?.vip_expires_at) return '';
  try {
    return `VIP jusqu'au ${new Date(player.vip_expires_at).toLocaleDateString('fr-FR')}`;
  } catch(e) {
    return '';
  }
}

function formatRemainingTime(ms) {
  const totalMinutes = Math.ceil(ms / 60000);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours > 0 && minutes > 0) return `${hours}h ${minutes}m`;
  if (hours > 0) return `${hours}h`;
  return `${minutes}m`;
}

async function load() {
  await loadAvatarDecorationLibrary();
  await loadProfileBannerLibrary();
  await loadProfileShopInventory();
  const saved    = localStorage.getItem('player') || sessionStorage.getItem('player');
  const urlId    = new URLSearchParams(location.search).get('id');
  viewerPlayer   = saved ? JSON.parse(saved) : null;
  const playerId = urlId || (viewerPlayer?.id ?? null);
  isOwnProfile   = viewerPlayer && (!urlId || String(urlId) === String(viewerPlayer.id));

  if (isOwnProfile) {
    document.getElementById('btn-logout').style.display = 'block';
    document.getElementById('btn-close-account').style.display = 'block';
  }
  if (!playerId) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Aucun joueur. <a href="/" style="color:var(--red)">← Retour</a></div>';
    return;
  }

  try {
    const [profileRes, followRes] = await Promise.all([
      fetch(`/api/players/${playerId}`),
      viewerPlayer ? fetch(`/api/players/${playerId}/follow-status?viewerId=${viewerPlayer.id}`) : Promise.resolve(null),
    ]);
    if (profileRes.status === 404) {
      document.getElementById('content').innerHTML = `
        <div style="text-align:center;padding:80px 20px">
          <div style="font-size:48px;margin-bottom:16px">Profil</div>
          <div style="font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color: var(--muted)">Compte supprimé</div>
          <div style="font-size:13px;color: var(--muted);margin-top:8px">Ce joueur a fermé son compte.</div>
        </div>`;
      return;
    }
    if (!profileRes.ok) throw new Error();
    const { player, games, following, followers } = await profileRes.json();
    const followStatus = followRes ? await followRes.json() : { isFollowing: false, followers: 0, following: 0 };
    const freshPlayer = (isOwnProfile && player.discord_id)
      ? await refreshDiscordState(player)
      : player;
    currentPlayer = freshPlayer;
    pendingAvatarDecoration = null;
    pendingProfileBanner = null;

    render(freshPlayer, games, following || [], followers || [], followStatus);

    // Charger le statut en ligne (tous les profils)
    // Exposer pour que presence.js rappelle aprÃ¨s identified
    window._reloadStatus = () => loadStatus(freshPlayer.id);
    loadStatus(freshPlayer.id);

    // Charger les infos Discord si profil own + discord liÃ©
    if (isOwnProfile && freshPlayer.discord_id) {
      loadDiscordInfo();
    }

    // Notif discord_linked
    const params = new URLSearchParams(location.search);
    if (params.get('discord_linked') === '1') {
      history.replaceState({}, '', '/profil');
      setTimeout(() => loadDiscordInfo(), 500);
    }
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Erreur de chargement.</div>';
  }
}

async function toggleFollow(targetId) {
  if (!viewerPlayer) return location.href = '/';
  const btn = document.getElementById('btn-follow');
  const isFollowing = btn.classList.contains('following');
  const method = isFollowing ? 'DELETE' : 'POST';

  btn.disabled = true;
  try {
    const res = await fetch(`/api/players/${targetId}/follow`, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ followerId: viewerPlayer.id }),
    });
    const data = await res.json();
    if (res.ok) {
      btn.classList.toggle('following',     data.following);
      btn.classList.toggle('not-following', !data.following);
      btn.textContent = data.following ? '✓ Suivi' : '+ Suivre';
    }
  } finally {
    btn.disabled = false;
  }
}

const GAMES_PER_PAGE = 10;
let _gamesData = [];
let _gamesPlayer = null;
let _gamesPage = 1;

function initGames(games, me) {
  _gamesData   = games;
  _gamesPlayer = me;
  _gamesPage   = 1;
  renderGamesPage();
}

function renderGamesPage() {
  const container = document.getElementById('games-list-container');
  const pagination = document.getElementById('games-pagination');
  if (!container) return;

  const total = _gamesData.length;
  const totalPages = Math.ceil(total / GAMES_PER_PAGE);
  const start = (_gamesPage - 1) * GAMES_PER_PAGE;
  const slice = _gamesData.slice(start, start + GAMES_PER_PAGE);

  container.innerHTML = total === 0
    ? '<div class="empty-state">Aucune partie jouée pour l\'instant.</div>'
    : slice.map(g => renderGameRow(g, _gamesPlayer)).join('');

  // Pagination
  if (totalPages <= 1) { pagination.style.display = 'none'; return; }
  pagination.style.display = 'flex';

  let html = '';
  // Bouton précédent
  html += `<button class="pg-btn" onclick="gotoPage(${_gamesPage - 1})" ${_gamesPage === 1 ? 'disabled' : ''}><</button>`;

  // Pages
  for (let p = 1; p <= totalPages; p++) {
    if (totalPages > 7 && p > 2 && p < totalPages - 1 && Math.abs(p - _gamesPage) > 1) {
      if (p === 3 || p === totalPages - 2) html += `<span style="color:var(--muted);padding:0 2px">...</span>`;
      continue;
    }
    html += `<button class="pg-btn ${p === _gamesPage ? 'active' : ''}" onclick="gotoPage(${p})">${p}</button>`;
  }

  // Bouton suivant
  html += `<button class="pg-btn" onclick="gotoPage(${_gamesPage + 1})" ${_gamesPage === totalPages ? 'disabled' : ''}>></button>`;

  pagination.innerHTML = html;
}

function gotoPage(p) {
  const totalPages = Math.ceil(_gamesData.length / GAMES_PER_PAGE);
  if (p < 1 || p > totalPages) return;
  _gamesPage = p;
  renderGamesPage();
  document.getElementById('panel-history').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderGameRow(g, me) {
    const isP1      = g.player1_id === me.id;
    const opponent  = isP1 ? g.p2_pseudo : g.p1_pseudo;
    const won       = g.winner_id === me.id;
    const isDraw    = g.winner_id === null;
    const rc        = isDraw ? 'draw' : (won ? 'win' : 'loss');
    const ri        = isDraw ? '=' : (won ? 'V' : 'D');
    const eloChange = isP1 ? g.elo_p1 : g.elo_p2;
    const eloClass  = isDraw ? 'neu' : (eloChange >= 0 ? 'pos' : 'neg');
    const eloStr    = (eloChange >= 0 ? '+' : '') + eloChange + ' ELO';
    const date      = g.finished_at
      ? new Date(g.finished_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '-';
    const suspBadge = g.suspicious ? `<div title="Double compte détecté — ELO non comptabilisé" style="font-size:10px;letter-spacing:1px;background:rgba(255,159,10,0.12);border:1px solid rgba(255,159,10,0.3);color:#ff9f0a;padding:2px 7px;border-radius:5px;white-space:nowrap;">Double compte</div>` : '';
  const archiveBadge = g.archived ? `<div style="font-size:10px;letter-spacing:1px;background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.25);color:#ff2d55;padding:2px 7px;border-radius:5px;white-space:nowrap;">Archivée</div>` : '';
  return `<a class="game-row" href="/replay/${g.id}">
      <div class="game-result ${rc}">${ri}</div>
      <div class="game-vs">vs <span>${opponent}</span></div>
      <div class="game-meta">
        <div class="game-elo-change ${eloClass}">${g.suspicious ? '±0 ELO' : eloStr}</div>
        <div>${g.move_count} coups · ${g.duration}s</div>
        <div>${date}</div>
        ${suspBadge}
        ${archiveBadge}
      </div>
      <div class="replay-badge">Replay</div>
    </a>`;
}

function renderGames(games, me) {
  // Compatibilité — redirige vers le système paginé
  initGames(games, me);
}

function renderPlayers(players, emptyMsg) {
  if (!players.length) return `<div class="empty-state">${emptyMsg}</div>`;
  return players.map(p => {
    const avatarSrc = getRenderableMediaSrc(p.avatar);
    const plaqueSrc = getRenderableMediaSrc(p.profile_banner || '');
    const avatarHtml = avatarSrc
      ? `<img src="${avatarSrc}" alt="${p.pseudo}">`
      : p.pseudo[0].toUpperCase();
    const color  = p.color || '#ff2d55';
    const total  = (p.wins||0) + (p.losses||0) + (p.draws||0);
    const wr     = total > 0 ? Math.round(((p.wins||0)/total)*100) : 0;
    return `<a class="player-row" href="/profil?id=${p.id}">
      ${plaqueSrc ? `<div class="pseudo-banner-strip" style="background-image:url('${plaqueSrc}')"></div>` : ''}
      <div class="player-row-content">
        <div class="player-mini-avatar" style="background:${color}22;border:2px solid ${color}">${avatarHtml}</div>
        <div class="player-mini-info">
          <div class="player-mini-pseudo">${p.pseudo}</div>
          <div class="player-mini-stats">${p.wins||0}V · ${p.losses||0}D · ${wr}% WR</div>
        </div>
        <div class="player-mini-elo">${p.elo}</div>
      </div>
    </a>`;
  }).join('');
}

const IMAGE_EDITOR = {
  mode: null,
  file: null,
  dataUrl: '',
  isGif: false,
  img: null,
  zoom: 1,
  minZoom: 1,
  maxZoom: 3.2,
  coverZoom: 1,
  maxActualZoom: 1,
  offsetX: 0,
  offsetY: 0,
  cropWidth: 0,
  cropHeight: 0,
  outputWidth: 0,
  outputHeight: 0,
  dragging: false,
  dragStartX: 0,
  dragStartY: 0,
  startOffsetX: 0,
  startOffsetY: 0,
};

function getImageEditorElements() {
  return {
    bg: document.getElementById('image-editor-bg'),
    title: document.getElementById('image-editor-title'),
    sub: document.getElementById('image-editor-sub'),
    canvas: document.getElementById('image-editor-canvas'),
    stage: document.getElementById('image-editor-stage'),
    frame: document.getElementById('image-editor-frame'),
    zoom: document.getElementById('image-editor-zoom'),
    zoomVal: document.getElementById('image-editor-zoom-val'),
  };
}

function getStageMetrics(mode) {
  if (mode === 'avatar') {
    return { width: 640, height: 420, cropWidth: 280, cropHeight: 280, outputWidth: 500, outputHeight: 500 };
  }
  if (mode === 'decoration') {
    return { width: 640, height: 420, cropWidth: 260, cropHeight: 260, outputWidth: 512, outputHeight: 512 };
  }
  if (mode === 'token') {
    return { width: 640, height: 420, cropWidth: 220, cropHeight: 220, outputWidth: 128, outputHeight: 128 };
  }
  return { width: 640, height: 420, cropWidth: 560, cropHeight: 186, outputWidth: 1500, outputHeight: 500 };
}

function clampImageEditorOffsets() {
  if (!IMAGE_EDITOR.img) return;
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  const drawWidth = IMAGE_EDITOR.img.width * IMAGE_EDITOR.zoom;
  const drawHeight = IMAGE_EDITOR.img.height * IMAGE_EDITOR.zoom;
  const cropLeft = (metrics.width - IMAGE_EDITOR.cropWidth) / 2;
  const cropTop = (metrics.height - IMAGE_EDITOR.cropHeight) / 2;
  const cropRight = cropLeft + IMAGE_EDITOR.cropWidth;
  const cropBottom = cropTop + IMAGE_EDITOR.cropHeight;

  if (drawWidth <= IMAGE_EDITOR.cropWidth) {
    IMAGE_EDITOR.offsetX = cropLeft + (IMAGE_EDITOR.cropWidth - drawWidth) / 2;
  } else {
    const minX = cropRight - drawWidth;
    const maxX = cropLeft;
    IMAGE_EDITOR.offsetX = Math.max(minX, Math.min(maxX, IMAGE_EDITOR.offsetX));
  }

  if (drawHeight <= IMAGE_EDITOR.cropHeight) {
    IMAGE_EDITOR.offsetY = cropTop + (IMAGE_EDITOR.cropHeight - drawHeight) / 2;
  } else {
    const minY = cropBottom - drawHeight;
    const maxY = cropTop;
    IMAGE_EDITOR.offsetY = Math.max(minY, Math.min(maxY, IMAGE_EDITOR.offsetY));
  }
}

function syncImageEditorZoomLabel() {
  const { zoom, zoomVal } = getImageEditorElements();
  if (zoomVal && zoom) zoomVal.textContent = `${Math.round(Number(zoom.value || 0))}%`;
}

function drawImageEditor() {
  const { canvas, frame } = getImageEditorElements();
  if (!canvas || !IMAGE_EDITOR.img) return;
  const ctx = canvas.getContext('2d');
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  canvas.width = metrics.width;
  canvas.height = metrics.height;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0b0b18';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cropLeft = (canvas.width - IMAGE_EDITOR.cropWidth) / 2;
  const cropTop = (canvas.height - IMAGE_EDITOR.cropHeight) / 2;
  const drawWidth = IMAGE_EDITOR.img.width * IMAGE_EDITOR.zoom;
  const drawHeight = IMAGE_EDITOR.img.height * IMAGE_EDITOR.zoom;
  ctx.drawImage(IMAGE_EDITOR.img, IMAGE_EDITOR.offsetX, IMAGE_EDITOR.offsetY, drawWidth, drawHeight);

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.rect(0, 0, canvas.width, canvas.height);
  if (IMAGE_EDITOR.mode === 'avatar' || IMAGE_EDITOR.mode === 'decoration') {
    ctx.moveTo(cropLeft + IMAGE_EDITOR.cropWidth, cropTop + IMAGE_EDITOR.cropHeight / 2);
    ctx.arc(cropLeft + IMAGE_EDITOR.cropWidth / 2, cropTop + IMAGE_EDITOR.cropHeight / 2, IMAGE_EDITOR.cropWidth / 2, 0, Math.PI * 2, true);
  } else {
    ctx.roundRect(cropLeft, cropTop, IMAGE_EDITOR.cropWidth, IMAGE_EDITOR.cropHeight, 18);
  }
  ctx.fill('evenodd');
  ctx.restore();

  if (IMAGE_EDITOR.mode === 'banner') {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.strokeRect(cropLeft + 0.5, cropTop + 0.5, IMAGE_EDITOR.cropWidth - 1, IMAGE_EDITOR.cropHeight - 1);
  } else if (IMAGE_EDITOR.mode === 'avatar' || IMAGE_EDITOR.mode === 'decoration') {
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cropLeft + IMAGE_EDITOR.cropWidth / 2, cropTop + IMAGE_EDITOR.cropHeight / 2, IMAGE_EDITOR.cropWidth / 2, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cropLeft + 0.5, cropTop + 0.5, IMAGE_EDITOR.cropWidth - 1, IMAGE_EDITOR.cropHeight - 1);
  }

  if (frame) frame.className = 'image-editor-frame ' + IMAGE_EDITOR.mode;
  syncImageEditorZoomLabel();
}

function updateImageEditorZoom(value) {
  const sliderValue = Math.max(0, Math.min(100, Number(value)));
  const ratio = sliderValue / 100;
  IMAGE_EDITOR.zoom = IMAGE_EDITOR.minZoom + (IMAGE_EDITOR.maxActualZoom - IMAGE_EDITOR.minZoom) * ratio;
  clampImageEditorOffsets();
  drawImageEditor();
}

function openImageEditor(dataUrl, mode) {
  const els = getImageEditorElements();
  const metrics = getStageMetrics(mode);
  IMAGE_EDITOR.mode = mode;
  IMAGE_EDITOR.dataUrl = dataUrl;
  IMAGE_EDITOR.cropWidth = metrics.cropWidth;
  IMAGE_EDITOR.cropHeight = metrics.cropHeight;
  IMAGE_EDITOR.outputWidth = metrics.outputWidth;
  IMAGE_EDITOR.outputHeight = metrics.outputHeight;

  const img = new Image();
  img.onload = () => {
    IMAGE_EDITOR.img = img;
    IMAGE_EDITOR.minZoom = Math.min((metrics.width - 40) / img.width, (metrics.height - 40) / img.height, 1);
    IMAGE_EDITOR.coverZoom = Math.max(metrics.cropWidth / img.width, metrics.cropHeight / img.height);
    IMAGE_EDITOR.maxActualZoom = Math.max(IMAGE_EDITOR.coverZoom * 1.9, IMAGE_EDITOR.minZoom * 3, 1);
    IMAGE_EDITOR.zoom = IMAGE_EDITOR.minZoom;
    IMAGE_EDITOR.offsetX = (metrics.width - img.width * IMAGE_EDITOR.zoom) / 2;
    IMAGE_EDITOR.offsetY = (metrics.height - img.height * IMAGE_EDITOR.zoom) / 2;
    clampImageEditorOffsets();

    if (els.zoom) {
      els.zoom.min = 0;
      els.zoom.max = 100;
      els.zoom.value = 0;
    }
    if (els.title) els.title.textContent = mode === 'avatar'
      ? "Ajuster l'avatar"
      : mode === 'decoration'
        ? "Ajuster la décoration"
      : mode === 'token'
        ? "Ajuster l'emoji VIP"
        : 'Ajuster la banniere';
    if (els.sub) els.sub.textContent = mode === 'avatar'
      ? 'Zoomez et deplacez votre avatar avant validation.'
      : mode === 'decoration'
        ? 'Placez votre décoration autour de l avatar avant validation.'
      : mode === 'token'
        ? 'Recadrez votre emoji VIP en 128x128 avant validation.'
        : 'Placez votre banniere exactement comme vous le souhaitez.';
    if (els.bg) {
      els.bg.classList.add('show');
      els.bg.setAttribute('aria-hidden', 'false');
    }
    drawImageEditor();
  };
  img.src = dataUrl;
}

function closeImageEditor() {
  const { bg } = getImageEditorElements();
  if (bg) {
    bg.classList.remove('show');
    bg.setAttribute('aria-hidden', 'true');
  }
  IMAGE_EDITOR.dragging = false;
  IMAGE_EDITOR.file = null;
  IMAGE_EDITOR.img = null;
}

function exportImageEditor() {
  const canvas = document.createElement('canvas');
  canvas.width = IMAGE_EDITOR.outputWidth;
  canvas.height = IMAGE_EDITOR.outputHeight;
  const ctx = canvas.getContext('2d');
  const scale = IMAGE_EDITOR.outputWidth / IMAGE_EDITOR.cropWidth;
  const drawWidth = IMAGE_EDITOR.img.width * IMAGE_EDITOR.zoom * scale;
  const drawHeight = IMAGE_EDITOR.img.height * IMAGE_EDITOR.zoom * scale;
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  const cropLeft = (metrics.width - IMAGE_EDITOR.cropWidth) / 2;
  const cropTop = (metrics.height - IMAGE_EDITOR.cropHeight) / 2;
  const offsetX = (IMAGE_EDITOR.offsetX - cropLeft) * scale;
  const offsetY = (IMAGE_EDITOR.offsetY - cropTop) * scale;

  if (IMAGE_EDITOR.mode === 'avatar' || IMAGE_EDITOR.mode === 'decoration') {
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, 0, Math.PI * 2);
    ctx.clip();
  }
  ctx.drawImage(IMAGE_EDITOR.img, offsetX, offsetY, drawWidth, drawHeight);
  return IMAGE_EDITOR.mode === 'banner'
    ? canvas.toDataURL('image/jpeg', 0.92)
    : canvas.toDataURL('image/png');
}

(function initImageEditor() {
  const { bg, canvas, zoom } = getImageEditorElements();
  if (!bg || !canvas || !zoom) return;

  zoom.addEventListener('input', () => updateImageEditorZoom(zoom.value));

  const getPoint = (event) => {
    const src = event.touches ? event.touches[0] : event;
    return { x: src.clientX, y: src.clientY };
  };

  const startDrag = (event) => {
    if (!IMAGE_EDITOR.img) return;
    const point = getPoint(event);
    IMAGE_EDITOR.dragging = true;
    IMAGE_EDITOR.dragStartX = point.x;
    IMAGE_EDITOR.dragStartY = point.y;
    IMAGE_EDITOR.startOffsetX = IMAGE_EDITOR.offsetX;
    IMAGE_EDITOR.startOffsetY = IMAGE_EDITOR.offsetY;
    canvas.classList.add('dragging');
    event.preventDefault();
  };

  const moveDrag = (event) => {
    if (!IMAGE_EDITOR.dragging) return;
    const point = getPoint(event);
    IMAGE_EDITOR.offsetX = IMAGE_EDITOR.startOffsetX + (point.x - IMAGE_EDITOR.dragStartX);
    IMAGE_EDITOR.offsetY = IMAGE_EDITOR.startOffsetY + (point.y - IMAGE_EDITOR.dragStartY);
    clampImageEditorOffsets();
    drawImageEditor();
    event.preventDefault();
  };

  const stopDrag = () => {
    IMAGE_EDITOR.dragging = false;
    canvas.classList.remove('dragging');
  };

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('touchmove', moveDrag, { passive: false });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('touchend', stopDrag);

  bg.addEventListener('click', (event) => {
    if (event.target === bg) closeImageEditor();
  });

  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && bg.classList.contains('show')) closeImageEditor();
  });
})();

function resizeImage(dataUrl, maxSize) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
      else        { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  });
}

let _acTimer = null;

async function onSearchInput(val) {
  const list = document.getElementById('autocomplete-list');
  _acIndex = -1;
  clearTimeout(_acTimer);
  if (val.length < 3) { list.style.display = 'none'; _acResults = []; return; }
  _acTimer = setTimeout(async () => {
    try {
      const res = await fetch(`/api/players/search?q=${encodeURIComponent(val)}`);

      _acResults = await res.json();

function selectAc(i) {
  const p = _acResults[i];
  if (!p) return;
  document.getElementById('search-input').value = p.pseudo;
  document.getElementById('autocomplete-list').style.display = 'none';
  searchPlayer();
}

function onSearchKey(e) {
  const list = document.getElementById('autocomplete-list');
  const items = list.querySelectorAll('.ac-item');
  if (!items.length) { if (e.key === 'Enter') searchPlayer(); return; }
  if (e.key === 'ArrowDown')  { e.preventDefault(); _acIndex = Math.min(_acIndex+1, items.length-1); highlightAc(items); }
  else if (e.key === 'ArrowUp')   { e.preventDefault(); _acIndex = Math.max(_acIndex-1, -1);             highlightAc(items); }
  else if (e.key === 'Enter')     { e.preventDefault(); _acIndex >= 0 ? selectAc(_acIndex) : searchPlayer(); }
  else if (e.key === 'Escape')    { list.style.display = 'none'; _acIndex = -1; }
}

function highlightAc(items) {
  items.forEach((el, i) => el.style.background = i === _acIndex ? 'rgba(255,255,255,0.08)' : 'transparent');
  if (_acIndex >= 0 && _acResults[_acIndex]) document.getElementById('search-input').value = _acResults[_acIndex].pseudo;
}

    const btn  = document.getElementById('vip-boost-btn');
    const stat = document.getElementById('vip-boost-status');
    const accent = data.tier === 'perso'
      ? getPersoRoleAccent(me).color
      : data.tier === 'vip_plus' ? '#85EBFF' : '#ffd60a';
    const bonusPct = data.tier === 'vip' ? 20 : 30;
    const durationLabel = data.tier === 'perso' ? '2h' : '1h';
    if (data.active) {
      const mins = Math.ceil(data.remainingMs / 60000);
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.textContent = '\u26A1 BOOST ACTIF';
      stat.textContent = `Se termine dans ${mins} min`;
      stat.style.color = accent;
    } else if (data.usedToday) {
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.textContent = 'BOOST UTILISÉ';
      stat.textContent = 'Disponible à minuit (Paris)';
      stat.style.color = accent;
    } else {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.textContent = `\u26A1 ACTIVER BOOST ${data.tier === 'perso' ? 'PERSO' : data.tier === 'vip_plus' ? 'VIP+' : 'VIP'} (+${bonusPct}% ELO · ${durationLabel})`;
      stat.style.color = 'var(--muted)';
    }
  } catch(e) {}
}

async function activateVipBoost() {
  const saved = sessionStorage.getItem('player');
  if (!saved) return;
  const me = JSON.parse(saved);
  const token = localStorage.getItem('token');
  try {
    const res = await fetch('/api/players/' + me.id + '/vip-boost', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert((data.error || 'Erreur'));
      return;
    }
    const btn  = document.getElementById('vip-boost-btn');
    const stat = document.getElementById('vip-boost-status');
    const accent = data.tier === 'perso'
      ? getPersoRoleAccent(me).color
      : data.tier === 'vip_plus' ? '#85EBFF' : '#ffd60a';
    const mins = Math.ceil(((data.expiresAt || Date.now()) - Date.now()) / 60000);
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.textContent = '\u26A1 BOOST ACTIF';
    stat.textContent = `Se termine dans ${mins} min`;
    stat.style.color = accent;
  } catch(e) { alert('Erreur réseau'); }
}

function openOwnedBooster(kind) {
  const counts = getProfileBoosterCounts();
  if (kind === 'elo' && counts.elo <= 0) return;
  if (kind === 'coins' && counts.coins <= 0) return;
  alert(kind === 'elo'
    ? `Tu as ${counts.elo} booster(s) ELO dans ton inventaire.`
    : `Tu as ${counts.coins} booster(s) Coins dans ton inventaire.`);
}

async function searchPlayer() {
  document.getElementById('autocomplete-list').style.display = 'none';
  const pseudo = document.getElementById('search-input').value.trim();
  if (!pseudo) return;

  const btn    = document.getElementById('search-btn');
  const result = document.getElementById('search-result');
  const error  = document.getElementById('search-error');

  btn.disabled = true;
  btn.textContent = '...';
  result.classList.remove('show');
  error.classList.remove('show');

  try {
    const res = await fetch(`/api/players/by-pseudo/${encodeURIComponent(pseudo)}`);
    if (!res.ok) throw new Error();
    const player = await res.json();

    // Afficher le résultat
    const color   = player.color || '#ff2d55';
    const total   = (player.wins||0) + (player.losses||0) + (player.draws||0);
    const wr      = total > 0 ? Math.round(((player.wins||0)/total)*100) : 0;
    const avatar  = document.getElementById('sr-avatar');
    const banner  = document.getElementById('sr-banner');
    const avatarSrc = getRenderableMediaSrc(player.avatar);
    const plaqueSrc = getRenderableMediaSrc(player.profile_banner || '');

    avatar.style.background = color + '22';
    avatar.style.border = `2px solid ${color}`;
    avatar.style.color  = color;
    avatar.innerHTML    = avatarSrc
      ? `<img src="${avatarSrc}" style="width:100%;height:100%;object-fit:cover">`
      : player.pseudo[0].toUpperCase();

    document.getElementById('sr-pseudo').textContent = player.pseudo;
    document.getElementById('sr-stats').textContent  = `${player.wins||0}V · ${player.losses||0}D · ${wr}% WR`;
    document.getElementById('sr-elo').textContent    = player.elo;
    document.getElementById('search-result').href    = `/profil?id=${player.id}`;
    if (banner) {
      if (plaqueSrc) {
        banner.style.display = 'block';
        banner.style.backgroundImage = `url('${plaqueSrc}')`;
      } else {
        banner.style.display = 'none';
        banner.style.backgroundImage = '';
      }
    }
    result.classList.add('show');

  } catch {
    error.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Chercher';
  }
}

// â”€â”€ Color picker (propre profil) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const COLOR_PRESETS = [
  '#ff2d55','#ffd60a','#30d158','#0a84ff','#bf5af2','#ff9f0a','#00c7be','#ff375f',
];
let selectedProfilColor = '#ff2d55';
let selectedProfilSecondaryColor = '';

function initColorPicker(currentColor) {
  selectedProfilColor = currentColor || '#ff2d55';
  const wrap = document.getElementById('color-presets-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  COLOR_PRESETS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-preset' + (c === selectedProfilColor ? ' active' : '');
    dot.style.background = c;
    dot.onclick = () => {
      selectedProfilColor = c;
      document.getElementById('profil-color-input').value = c;
      updateColorDot(c);
      document.querySelectorAll('.color-preset').forEach(d =>
        d.classList.toggle('active', d.style.background === hexToRgb(c))
      );
    };
    wrap.appendChild(dot);
  });
  updateColorDot(selectedProfilColor);
  onProfilSecondaryColorInput(currentPlayer?.color_secondary || '');
}

function onProfilColorInput(c) {
  selectedProfilColor = c;
  updateColorDot(c);
  updateGradientPreview();
  document.querySelectorAll('.color-preset').forEach(d => d.classList.remove('active'));
}

function updateColorDot(c) {
  const dot = document.getElementById('profil-color-dot');
  const hex = document.getElementById('profil-color-hex');
  if (dot) {
    dot.style.background = c;
    dot.style.boxShadow = `0 0 10px ${c}55`;
  }
  if (hex) hex.textContent = c.toUpperCase();
}

function onProfilSecondaryColorInput(c) {
  selectedProfilSecondaryColor = c || '';
  const dot = document.getElementById('profil-color-secondary-dot');
  const hex = document.getElementById('profil-color-secondary-hex');
  if (dot) {
    dot.style.background = selectedProfilSecondaryColor || '#85EBFF';
    dot.style.boxShadow = selectedProfilSecondaryColor ? `0 0 10px ${selectedProfilSecondaryColor}55` : '';
  }
  if (hex) hex.textContent = (selectedProfilSecondaryColor || '#85EBFF').toUpperCase();
  updateGradientPreview();
}

function updateGradientPreview() {
  const dot = document.getElementById('profil-color-gradient-dot');
  const hex = document.getElementById('profil-color-gradient-hex');
  if (!dot) return;
  if (canUseGradient(currentPlayer) && selectedProfilSecondaryColor) {
    dot.style.background = `linear-gradient(135deg, ${selectedProfilColor}, ${selectedProfilSecondaryColor})`;
    dot.style.boxShadow = `0 0 10px ${selectedProfilColor}55, 0 0 16px ${selectedProfilSecondaryColor}33`;
    if (hex) hex.textContent = 'Aperçu';
  } else {
    dot.style.background = selectedProfilColor;
    dot.style.boxShadow = `0 0 10px ${selectedProfilColor}55`;
    if (hex) hex.textContent = 'Simple';
  }
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

// â”€â”€ Shape picker â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const SHAPES = [
  { id: 'circle',   label: '●' },
  { id: 'triangle', label: '▲' },
  { id: 'diamond',  label: '◆' },
  { id: 'star',     label: '★' },
  { id: 'heart',    label: '♥' },
  { id: 'emoji',    label: 'Emoji VIP' },
  { id: 'emoji_image', label: 'Emoji VIP+' },
];
const DEFAULT_PROFILE_EMOJI = String.fromCodePoint(0x2B50);
let selectedShape = 'circle';
let selectedEmoji = DEFAULT_PROFILE_EMOJI;
let selectedTokenEmojiImage = '';
let pendingTokenEmojiImage = '';
let pendingAvatarDecoration = null;
let pendingProfileBanner = null;

function initShapePicker(currentShape, currentEmoji, currentTokenEmojiImage = '') {
  selectedShape = currentShape || 'circle';
  selectedEmoji = currentEmoji || DEFAULT_PROFILE_EMOJI;
  selectedTokenEmojiImage = currentTokenEmojiImage || '';
  pendingTokenEmojiImage = '';
  const row = document.getElementById('shape-row');
  if (!row) return;
  row.innerHTML = '';
  const CLIPS = {
    circle:   { borderRadius: '50%',  clipPath: '' },
    triangle: { borderRadius: '0',    clipPath: 'polygon(50% 8%, 95% 92%, 5% 92%)' },
    diamond:  { borderRadius: '0',    clipPath: 'polygon(50% 5%, 95% 50%, 50% 95%, 5% 50%)' },
    star:     { borderRadius: '0',    clipPath: 'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)' },
    heart:    { borderRadius: '0',    clipPath: 'polygon(50% 85%,15% 45%,5% 30%,15% 10%,35% 8%,50% 25%,65% 8%,85% 10%,95% 30%,85% 45%)' },
    emoji:    { borderRadius: '50%',  clipPath: '' },
    emoji_image: { borderRadius: '12px', clipPath: '' },
  };
  SHAPES.forEach(s => {
    const lockedVip = (s.id === 'emoji' && !isVip(currentPlayer)) || (s.id === 'emoji_image' && !isVipPlus(currentPlayer));
    const btn = document.createElement('div');
    btn.className = 'shape-btn' + (s.id === selectedShape ? ' active' : '') + (lockedVip ? ' disabled' : '');
    btn.dataset.shape = s.id;
    btn.title = lockedVip ? (s.id === 'emoji' ? 'Reserve au role VIP' : 'Reserve au role VIP+') : '';
    btn.onclick = () => {
      if (lockedVip) return;
      selectShape(s.id);
    };

    const preview = document.createElement('div');
    preview.className = 'shape-preview';

    if (s.id === 'emoji') {
      preview.style.borderRadius = '50%';
      preview.style.background   = 'transparent';
      preview.style.fontSize     = '22px';
      preview.style.fontFamily   = 'Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif';
      preview.style.display      = 'flex';
      preview.style.alignItems   = 'center';
      preview.style.justifyContent = 'center';
      preview.textContent = selectedEmoji || DEFAULT_PROFILE_EMOJI;
    } else if (s.id === 'emoji_image') {
      preview.style.borderRadius = '10px';
      preview.style.background = 'rgba(255,214,10,0.08)';
      preview.style.display = 'flex';
      preview.style.alignItems = 'center';
      preview.style.justifyContent = 'center';
      preview.style.overflow = 'hidden';
      const tokenPreviewImage = pendingTokenEmojiImage || selectedTokenEmojiImage;
      if (tokenPreviewImage) {
        preview.innerHTML = `<img src="${getRenderableMediaSrc(tokenPreviewImage)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;
      } else {
        preview.style.color = '#ffd60a';
        preview.style.fontSize = '11px';
        preview.style.fontFamily = 'Barlow Condensed, sans-serif';
        preview.textContent = 'VIP';
      }
    } else {
      const c = CLIPS[s.id];
      preview.style.borderRadius = c.borderRadius;
      preview.style.clipPath     = c.clipPath;
      preview.style.background   = 'var(--red)';
    }
    btn.appendChild(preview);
    row.appendChild(btn);
  });
  updateEmojiWrap();
}

function selectShape(id) {
  selectedShape = id;
  document.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === id));
  updateEmojiWrap();
}

function updateEmojiWrap() {
  const w = document.getElementById('emoji-wrap');
  if (w) w.classList.toggle('visible', selectedShape === 'emoji');

    selectedEmoji = DEFAULT_PROFILE_EMOJI;
    const btn = document.querySelector('.shape-btn[data-shape="emoji"] .shape-preview');

function refreshTokenEmojiPreview() {
  const preview = document.getElementById('token-emoji-preview');
  const meta = document.getElementById('token-emoji-meta');
  const btn = document.getElementById('token-emoji-btn');
  const shapePreview = document.querySelector('.shape-btn[data-shape="emoji_image"] .shape-preview');
  if (!preview) return;
  const isVipPlusTier = isVipPlus(currentPlayer);
  const accent = getVipAccent(currentPlayer);
  const remaining = isVipPlusTier ? getVipMediaRemainingMs() : 0;
  const previewImage = pendingTokenEmojiImage || selectedTokenEmojiImage;
  if (previewImage) {
    preview.innerHTML = `<img src="${getRenderableMediaSrc(previewImage)}" alt="emoji perso">`;
  } else {
    preview.textContent = 'VIP';
  }
  if (shapePreview) {
    if (previewImage) {
      shapePreview.innerHTML = `<img src="${getRenderableMediaSrc(previewImage)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;
      shapePreview.style.background = 'rgba(255,214,10,0.08)';
    } else {
      shapePreview.innerHTML = '';
      shapePreview.textContent = 'VIP';
      shapePreview.style.color = accent.color;
      shapePreview.style.fontSize = '11px';
      shapePreview.style.fontFamily = 'Barlow Condensed, sans-serif';
      shapePreview.style.background = accent.bg;
    }
  }
  if (meta) {
    meta.textContent = !isVipPlusTier
      ? 'Reserve au role VIP+.'
      : pendingTokenEmojiImage
        ? 'Clique sur Enregistrer pour appliquer.'
      : remaining > 0
        ? `Se termine dans ${formatRemainingTime(remaining)}`
        : selectedTokenEmojiImage
          ? 'Emoji image VIP+ prêt. Recadrage 128x128, max 1 Mo, cooldown 12h.'
          : 'Emoji image VIP+ 128x128 conseillé. Max 1 Mo, changement toutes les 12h.';
    meta.style.color = pendingTokenEmojiImage || remaining > 0 ? accent.color : 'var(--muted)';
    meta.style.textAlign = remaining > 0 ? 'center' : 'left';
  }
  if (btn) {
    btn.disabled = !isVipPlusTier || remaining > 0 || !!pendingTokenEmojiImage;
    btn.textContent = !isVipPlusTier
      ? 'Emoji VIP'
      : pendingTokenEmojiImage
        ? 'Emoji pret'
        : remaining > 0
          ? 'Emoji actif'
          : 'Importer un emoji VIP';
    btn.style.background = remaining > 0
      ? accent.bg
      : pendingTokenEmojiImage
        ? accent.bg
        : accent.bg;
    btn.style.borderColor = remaining > 0 || pendingTokenEmojiImage
      ? accent.border
      : accent.border;
    btn.style.color = accent.color;
    btn.title = !isVipPlusTier
      ? 'Reserve au role VIP+'
      : pendingTokenEmojiImage
        ? 'Clique sur Enregistrer pour appliquer'
      : remaining > 0
        ? `Disponible dans ${formatRemainingTime(remaining)}`
        : 'Importer un emoji VIP';
  }
}

function refreshAvatarDecorationPreview(player = currentPlayer) {
  const overlay = document.getElementById('avatar-decoration-overlay');
  const headerOverlay = document.getElementById('avatar-decoration-el');
  const modalOverlay = document.getElementById('avatar-decoration-modal-overlay');
  const meta = document.getElementById('avatar-decoration-meta');
  const modalMeta = document.getElementById('avatar-decoration-modal-meta');
  const btn = document.getElementById('avatar-decoration-btn');
  const applyBtn = document.getElementById('avatar-decoration-apply-btn');
  const effectiveDecoration = pendingAvatarDecoration === null
    ? String(player?.avatar_decoration || '')
    : String(pendingAvatarDecoration || '');
  const src = getRenderableMediaSrc(effectiveDecoration);
  const remaining = getAvatarDecorationRemainingMs(player);
  const isVipPlusTier = Number(player?.is_vip_plus) === 1 || String(player?.role || '') === 'admin';
  const hasPendingChange = pendingAvatarDecoration !== null && String(pendingAvatarDecoration || '') !== String(player?.avatar_decoration || '');
  if (overlay) overlay.innerHTML = src ? `<img src="${src}" alt="décoration">` : '';
  if (headerOverlay) headerOverlay.innerHTML = src ? `<img src="${src}" alt="décoration avatar">` : '';
  if (modalOverlay) modalOverlay.innerHTML = src ? `<img src="${src}" alt="décoration">` : '';
  const message = !isVipPlusTier
    ? 'Reserve au role VIP+.'
    : hasPendingChange
      ? 'Clique sur Appliquer la sélection pour enregistrer cette décoration.'
    : remaining > 0
      ? `Disponible dans ${formatRemainingTime(remaining)}. Changement toutes les 24h.`
      : src
        ? 'Décoration active. Tu peux la modifier toutes les 24h.'
        : 'Choisis une décoration de la collection VIP+. Changement toutes les 24h.';
  const messageColor = remaining > 0 || hasPendingChange ? '#85EBFF' : 'var(--muted)';
  if (meta) {
    meta.textContent = message;
    meta.style.color = messageColor;
  }
  if (modalMeta) {
    modalMeta.textContent = message;
    modalMeta.style.color = messageColor;
  }
  if (btn) {
    btn.disabled = !isVipPlusTier;
    btn.textContent = !isVipPlusTier
      ? 'Reserve VIP+'
      : hasPendingChange
        ? 'Continuer la sélection'
        : src ? 'Changer la décoration' : 'Choisir une décoration';
    btn.title = !isVipPlusTier
      ? 'Reserve au role VIP+'
      : 'Ouvrir la galerie des décorations';
  }
  if (applyBtn) {
    applyBtn.disabled = !isVipPlusTier || remaining > 0 || !hasPendingChange;
    applyBtn.textContent = hasPendingChange ? 'Appliquer la sélection' : (remaining > 0 ? 'Décoration active' : 'Déjà appliquée');
    applyBtn.title = !isVipPlusTier
      ? 'Reserve au role VIP+'
      : remaining > 0
        ? `Disponible dans ${formatRemainingTime(remaining)}`
        : hasPendingChange
          ? 'Enregistrer la décoration choisie'
          : 'Choisis une autre décoration pour appliquer un changement';
  }
  renderAvatarDecorationGallery(player);
}

function openAvatarDecorationPicker() {

  if (!bg) return;
  bg.classList.add('show');
  renderAvatarDecorationGallery(currentPlayer);
  refreshAvatarDecorationPreview(currentPlayer);
}

function closeAvatarDecorationPicker() {
  document.getElementById('avatar-decoration-modal-bg')?.classList.remove('show');

function getProfileBannerRemainingMs(player = currentPlayer) {
  if (String(player?.role || '') === 'admin') return 0;
  const lastChanged = Number(player?.profile_banner_changed_at || 0);
  if (!lastChanged) return 0;
  const remaining = lastChanged + (7 * 24 * 60 * 60 * 1000) - Date.now();
  return remaining > 0 ? remaining : 0;
}

function renderProfileBannerGallery(player = currentPlayer) {
  const gallery = document.getElementById('profile-banner-gallery');
  if (!gallery) return;
  const canEdit = isPerso(player) || String(player?.role || '') === 'admin';
  const currentValue = String(player?.profile_banner || '');
  const selectedValue = pendingProfileBanner === null ? currentValue : String(pendingProfileBanner || '');
  const cards = [
    `<button type="button" class="avatar-decoration-option ${selectedValue === '' ? 'active' : ''} ${!canEdit ? 'locked' : ''}" ${canEdit ? `onclick="selectProfileBanner('')"` : 'disabled'} title="Aucune bannière">
      <span class="avatar-decoration-option-none">Aucune</span>
    </button>`
  ];
  for (const src of profileBannerLibrary) {
    const active = selectedValue === src ? 'active' : '';
    const locked = !canEdit ? 'locked' : '';
    cards.push(`<button type="button" class="avatar-decoration-option ${active} ${locked}" ${canEdit ? `onclick="selectProfileBanner('${src}')"` : 'disabled'} title="Bannière pseudo">
      <img src="${src}" alt="bannière pseudo">
    </button>`);
  }
  gallery.innerHTML = cards.join('');
}

function selectProfileBanner(src) {
  pendingProfileBanner = String(src || '');
  refreshProfileBannerPreview(currentPlayer);
}

async function saveSelectedProfileBanner() {
  const me = JSON.parse(localStorage.getItem('player') || '{}');
  if (!me?.id) return;
  const nextValue = String(pendingProfileBanner === null ? (me.profile_banner || '') : pendingProfileBanner || '');
  const currentValue = String(me.profile_banner || '');
  if (nextValue === currentValue) return;
  const res = await fetch('/api/players/' + me.id + '/profile-banner', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: nextValue, token: localStorage.getItem('token') }),
  });
  if (!res.ok) {
    alert(await readApiError(res, 'Erreur bannière pseudo.'));
    return;
  }
  me.profile_banner = nextValue;
  me.profile_banner_changed_at = Date.now();
  pendingProfileBanner = null;
  if (currentPlayer && Number(currentPlayer.id) === Number(me.id)) {

function refreshProfileBannerPreview(player = currentPlayer) {
  const preview = document.getElementById('profile-banner-preview');
  const modalPreview = document.getElementById('profile-banner-modal-preview');
  const meta = document.getElementById('profile-banner-meta');
  const modalMeta = document.getElementById('profile-banner-modal-meta');
  const btn = document.getElementById('profile-banner-btn');
  const applyBtn = document.getElementById('profile-banner-apply-btn');
  const effectiveBanner = pendingProfileBanner === null ? String(player?.profile_banner || '') : String(pendingProfileBanner || '');
  const src = getRenderableMediaSrc(effectiveBanner);
  const remaining = getProfileBannerRemainingMs(player);
  const canEdit = isPerso(player) || String(player?.role || '') === 'admin';
  const hasPendingChange = pendingProfileBanner !== null && String(pendingProfileBanner || '') !== String(player?.profile_banner || '');
  const previewHtml = src ? `<img src="${src}" alt="bannière pseudo">` : `<div class="profile-banner-choice-empty">Aucune</div>`;
  if (preview) preview.innerHTML = previewHtml;
  if (modalPreview) modalPreview.innerHTML = previewHtml;
  const message = !canEdit
    ? 'Reserve au pack Perso.'
    : hasPendingChange
      ? 'Clique sur Appliquer la sélection pour enregistrer cette bannière pseudo.'
      : remaining > 0
        ? `Disponible dans ${formatRemainingTime(remaining)}. Changement toutes les 1 semaine.`
        : src
          ? 'Bannière pseudo active. Tu peux la modifier toutes les 1 semaine.'
          : 'Choisis une bannière de pseudo Perso. Changement toutes les 1 semaine.';
  if (meta) { meta.textContent = message; meta.style.color = remaining > 0 || hasPendingChange ? '#ff7a45' : 'var(--muted)'; }
  if (modalMeta) { modalMeta.textContent = message; modalMeta.style.color = remaining > 0 || hasPendingChange ? '#ff7a45' : 'var(--muted)'; }
  if (btn) {
    btn.disabled = !canEdit;
    btn.textContent = !canEdit ? 'Reserve Perso' : src ? 'Changer la bannière' : 'Choisir une bannière';
  }
  if (applyBtn) {
    applyBtn.disabled = !canEdit || remaining > 0 || !hasPendingChange;
    applyBtn.textContent = hasPendingChange ? 'Appliquer la sélection' : (remaining > 0 ? 'Bannière active' : 'Déjà appliquée');
  }
  renderProfileBannerGallery(player);
}

// â”€â”€ Statut en ligne â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function formatLastSeen(ts) {
  if (!ts) return 'Jamais connecté';
  const diff = Date.now() - ts;
  const s = Math.floor(diff / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const d = Math.floor(h / 24);
  const mo = Math.floor(d / 30);
  const y = Math.floor(d / 365);
  if (s < 60)  return 'Il y a quelques secondes';
  if (m < 60)  return `Il y a ${m} minute${m>1?'s':''}`;
  if (h < 24)  return `Il y a ${h} heure${h>1?'s':''}`;
  if (d < 30)  return `Il y a ${d} jour${d>1?'s':''}`;
  if (mo < 12) return `Il y a ${mo} mois`;
  return `Il y a ${y} an${y>1?'s':''}`;
}

// â”€â”€ Simulateur ELO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Table des rangs (miroir de rank.js côté client)
const RANKS_SIM = [
  { name:'Malachite', key:'Malachite', color:'#2ecc71', min:100,  max:699  },
  { name:'Quartz',    key:'Quartz',    color:'#b0bec5', min:700,  max:1299 },
  { name:'Ambre',     key:'Ambre',     color:'#cd7f32', min:1300, max:1799 },
  { name:'Jade',      key:'Jade',      color:'#1abc9c', min:1800, max:2299 },
  { name:'Saphir',    key:'Saphir',    color:'#3498db', min:2300, max:2799 },
  { name:'Améthyste', key:'Amethiste', color:'#9b59b6', min:2800, max:3500 },
];
const LEVEL_NAMES = ['I','II','III','IV','V'];

function getSimRank(elo) {
  const r = RANKS_SIM.find(r => elo >= r.min && elo <= r.max)
         || (elo < 100 ? RANKS_SIM[0] : RANKS_SIM[RANKS_SIM.length-1]);
  const span   = r.max - r.min;
  const perLvl = span / 5;
  const level  = Math.min(4, Math.floor((elo - r.min) / perLvl));
  const prog   = Math.round(((elo - r.min - level * perLvl) / perLvl) * 100);
  const next   = r.max < 3500 ? r.max + 1 : null;
  return { ...r, level, levelName: LEVEL_NAMES[level], label: r.name + ' ' + LEVEL_NAMES[level], progress: Math.min(100, prog), next };
}

  const bg = document.getElementById('elo-sim-bg');

function updateEloSim(elo) {
  elo = Number(elo);
  const rank = getSimRank(elo);

  // Valeur ELO affichée
  const valEl = document.getElementById('elo-sim-value');
  if (valEl) { valEl.textContent = elo; valEl.style.color = rank.color; }

  // Couleur du slider
  const slider = document.getElementById('elo-sim-slider');
  if (slider) {
    const pct = ((elo - 100) / (3500 - 100)) * 100;
    slider.style.background = `linear-gradient(to right, ${rank.color} ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;
    slider.style.setProperty('--thumb-color', rank.color);
    slider.style.accentColor = rank.color;
  }

  // Image badge
  const img = document.getElementById('elo-sim-img');
  if (img) {
    img.src   = `/ranks/${rank.key}_${rank.level + 1}.png`;
    img.alt   = rank.label;
    img.style.filter = `drop-shadow(0 0 10px ${rank.color}88)`;
  }

  // Nom rang
  const nameEl = document.getElementById('elo-sim-rank-name');
  if (nameEl) { nameEl.textContent = rank.label; nameEl.style.color = rank.color; }

  // Tranche ELO
  const rangeEl = document.getElementById('elo-sim-range');
  if (rangeEl) rangeEl.textContent = rank.min + ' - ' + rank.max + ' ELO';

  // Barre progression
  const prog = document.getElementById('elo-sim-prog');
  if (prog) { prog.style.width = rank.progress + '%'; prog.style.background = rank.color; }

  // Next
  const nextEl = document.getElementById('elo-sim-next');
  if (nextEl) nextEl.textContent = rank.next
    ? rank.progress + '% · Prochain rang à ' + rank.next + ' ELO'
    : 'Rang maximum atteint';
}

async function refreshDiscordState(player) {
  const token = localStorage.getItem('token');
  if (!token || !player?.id || !player.discord_id) return player;
  try {
    const res = await fetch('/api/players/' + player.id + '/refresh-discord', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if (data?.unlinked) {
      syncStoredPlayerPatch({ role: 'user', is_vip: 0, is_vip_plus: 0, is_perso: 0, discord_id: null });
      return { ...player, role: 'user', is_vip: 0, is_vip_plus: 0, is_perso: 0, discord_id: null };
    }
    if ((data?.role && data.role !== player.role) || typeof data?.is_vip === 'number' || typeof data?.is_vip_plus === 'number' || typeof data?.is_perso === 'number' || 'vip_expires_at' in (data || {})) {
      const patch = {};
      if (data?.role) patch.role = data.role;
      if (typeof data?.is_vip === 'number') patch.is_vip = data.is_vip;
      if (typeof data?.is_vip_plus === 'number') patch.is_vip_plus = data.is_vip_plus;
      if (typeof data?.is_perso === 'number') patch.is_perso = data.is_perso;
      if ('vip_expires_at' in (data || {})) patch.vip_expires_at = data.vip_expires_at;
      syncStoredPlayerPatch(patch);
      return { ...player, ...patch };
    }
  } catch(e) {}
  return player;
}

    if (!res.ok) {
      alert(data.error || 'Pseudo invalide.');
      return;
    }
    me.pseudo = data.pseudo || pseudo;
    if (currentPlayer) currentPlayer.pseudo = me.pseudo;
    localStorage.setItem('player', JSON.stringify(me));
    sessionStorage.setItem('player', JSON.stringify(me));
    const pseudoEl = document.querySelector('.profile-pseudo');
    if (pseudoEl) pseudoEl.textContent = me.pseudo;
    const confirm = document.getElementById('pseudo-confirm');
    if (confirm) {
      confirm.style.opacity = '1';
      setTimeout(() => confirm.style.opacity = '0', 2000);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '✏️ Enregistrer';
  }
}

async function saveProfileCustomRole() {
  const me = JSON.parse(localStorage.getItem('player') || '{}');
  if (!me.id) return;
  const textInput = document.getElementById('perso-role-text-input');
  const emojiInput = document.getElementById('perso-role-emoji-input');
  const colorInput = document.getElementById('perso-role-color-input');
  const btn = document.getElementById('btn-save-perso-role');
  const text = String(textInput?.value || '').trim().slice(0, 6);
  const emoji = [...String(emojiInput?.value || '').trim()][0] || '';
  const color = String(colorInput?.value || '#FF7A45').toUpperCase();
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`/api/players/${me.id}/custom-role`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, emoji, color, token: localStorage.getItem('token') }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(data.error || 'Impossible d enregistrer le badge perso.');
      return;
    }
    const patch = {
      custom_role_text: data.text ?? text,
      custom_role_color: data.color ?? (text ? color : ''),
      custom_role_emoji: data.emoji ?? (text ? emoji : ''),
    };
    if (currentPlayer) Object.assign(currentPlayer, patch);
    Object.assign(me, patch);
    localStorage.setItem('player', JSON.stringify(me));
    sessionStorage.setItem('player', JSON.stringify(me));
    const confirm = document.getElementById('perso-role-confirm');
    if (confirm) {
      confirm.style.opacity = '1';
      setTimeout(() => confirm.style.opacity = '0', 2000);
    }
    await load();
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ Enregistrer';
  }
}

async function removeProfileCustomRole() {
  const me = JSON.parse(localStorage.getItem('player') || '{}');
  if (!me.id) return;
  const btn = document.getElementById('btn-remove-perso-role');
  const textInput = document.getElementById('perso-role-text-input');
  const emojiInput = document.getElementById('perso-role-emoji-input');
  const colorInput = document.getElementById('perso-role-color-input');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`/api/players/${me.id}/custom-role`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: '', emoji: '', color: '', token: localStorage.getItem('token') }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(data.error || 'Impossible de retirer le grade perso.');
      return;
    }
    const patch = { custom_role_text: '', custom_role_color: '', custom_role_emoji: '' };
    if (currentPlayer) Object.assign(currentPlayer, patch);
    Object.assign(me, patch);
    localStorage.setItem('player', JSON.stringify(me));
    sessionStorage.setItem('player', JSON.stringify(me));
    if (textInput) textInput.value = '';
    if (emojiInput) emojiInput.value = '';
    if (colorInput) colorInput.value = '#FF7A45';
    await load();
  } finally {
    btn.disabled = false;
    btn.textContent = '- Retirer';
  }
}

load();
