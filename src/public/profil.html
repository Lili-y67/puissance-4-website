<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — Profil</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/w9nwQxm.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);
  --red:#ff2d55;--red-dim:rgba(255,45,85,0.12);--red-glow:rgba(255,45,85,0.4);
  --yellow:#ffd60a;--yel-dim:rgba(255,214,10,0.1);--yel-glow:rgba(255,214,10,0.4);
  --green:#30d158;--green-dim:rgba(48,209,88,0.1);--green-glow:rgba(48,209,88,0.3);
  --text:#eeeef5;--muted:rgba(238,238,245,0.38);--accent:#4c6ef5;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);}
.page{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:20px;}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo-sm{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;text-decoration:none;color:var(--text);}
.logo-sm span{color:var(--red);}
.nav-btns{display:flex;gap:8px;}
.btn-nav{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;text-decoration:none;transition:all 0.2s;}
.btn-nav:hover{border-color:var(--muted);color:var(--text);}
.btn-nav.danger:hover{border-color:var(--red);color:var(--red);}

@keyframes slide-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Profile header ── */
.profile-header{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;
  display:flex;align-items:center;gap:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.4);
  animation:slide-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
.avatar-wrap{position:relative;flex-shrink:0;cursor:pointer;}
.avatar-wrap:hover .avatar-overlay{opacity:1;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--red-dim);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:var(--red);overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:opacity 0.2s;}
input[type="file"]{display:none;}
.profile-info{flex:1;min-width:0;}
.profile-pseudo{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;line-height:1;}
.profile-since{font-size:12px;color:var(--muted);margin-top:4px;}

/* Follow button */
.btn-follow{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:9px 18px;border-radius:10px;
  border:none;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.btn-follow.not-following{background:var(--green-dim);border:1.5px solid rgba(48,209,88,0.3);color:var(--green);}
.btn-follow.not-following:hover{background:rgba(48,209,88,0.25);box-shadow:0 0 16px var(--green-glow);}
.btn-follow.following{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-follow.following:hover{border-color:var(--red);color:var(--red);}

.profile-elo{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:900;letter-spacing:2px;color:var(--yellow);text-shadow:0 0 20px var(--yel-glow);text-align:right;flex-shrink:0;}
.profile-elo-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-align:right;}

/* ── Social counts ── */
.social-row{
  display:flex;gap:8px;
  animation:slide-in 0.5s 0.05s cubic-bezier(0.22,1,0.36,1) both;
}
.social-card{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;
}
.social-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);}
.social-card.active{border-color:var(--accent);}
.social-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:1px;}
.social-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:2px;}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;animation:slide-in 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:4px;transition:all 0.2s;}
.stat-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;}
.stat-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.stat-card.wins   .stat-val{color:var(--green);}
.stat-card.losses .stat-val{color:var(--red);}
.stat-card.draws  .stat-val{color:var(--muted);}

.winrate-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;animation:slide-in 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both;}
.winrate-header{display:flex;justify-content:space-between;align-items:center;}
.wr-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.wr-pct{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--green);}
.wr-bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.wr-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width 1s cubic-bezier(0.22,1,0.36,1);}

/* ── Tabs ── */
.tabs-row{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;animation:slide-in 0.5s 0.2s cubic-bezier(0.22,1,0.36,1) both;}
.tab{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px;border-radius:7px;background:transparent;border:none;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.3);}

/* ── Tab panels ── */
.tab-panel{display:none;animation:slide-in 0.3s cubic-bezier(0.22,1,0.36,1) both;}
.tab-panel.show{display:flex;flex-direction:column;gap:6px;}

/* ── History rows ── */
.game-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--text);transition:all 0.2s;}
.game-row:hover{border-color:rgba(255,255,255,0.12);transform:translateX(4px);}
.game-result{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
.game-result.win{background:var(--green-dim);}
.game-result.loss{background:var(--red-dim);}
.game-result.draw{background:var(--surface2);}
.game-vs{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.game-vs span{color:var(--muted);}
.game-meta{text-align:right;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:1px;}
.game-elo-change{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;}
.game-elo-change.pos{color:var(--green);}
.game-elo-change.neg{color:var(--red);}
.game-elo-change.neu{color:var(--muted);}
.replay-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);flex-shrink:0;}
.game-row:hover .replay-badge{border-color:var(--accent);color:var(--accent);}

/* ── Player rows (following/followers) ── */
.player-row{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  text-decoration:none;color:var(--text);transition:all 0.2s;
}
.player-row:hover{border-color:rgba(255,255,255,0.12);transform:translateX(4px);}
.player-mini-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;}
.player-mini-avatar img{width:100%;height:100%;object-fit:cover;}
.player-mini-info{flex:1;min-width:0;}
.player-mini-pseudo{font-weight:600;font-size:14px;}
.player-mini-stats{font-size:11px;color:var(--muted);margin-top:1px;}
.player-mini-elo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--yellow);flex-shrink:0;}

/* Badges wins streak */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
.badge.online{background:rgba(48,209,88,0.12);color:var(--green);border:1px solid rgba(48,209,88,0.2);}

.empty-state{text-align:center;padding:32px 20px;color:var(--muted);font-size:14px;}

/* ── Color picker card ── */
.color-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;
  animation:slide-in 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both;
}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.color-preset{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;flex-shrink:0;}
.color-preset:hover{transform:scale(1.2);}
.color-preset.active{border-color:var(--text);transform:scale(1.15);}
.color-custom-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;transition:border-color 0.2s;flex:1;min-width:120px;}
.color-custom-wrap:hover{border-color:rgba(255,255,255,0.15);}
.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;transition:background 0.2s;}
.color-hex{font-size:12px;color:var(--muted);}
input[type="color"]{width:0;height:0;opacity:0;position:absolute;pointer-events:none;}
.btn-save-color{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:10px 20px;border-radius:10px;
  background:var(--green-dim);border:1.5px solid rgba(48,209,88,0.3);color:var(--green);
  cursor:pointer;transition:all 0.2s;align-self:flex-end;
}
.btn-save-color:hover{background:rgba(48,209,88,0.25);}
.btn-save-color:disabled{opacity:0.5;cursor:not-allowed;}
.save-confirm{font-size:12px;color:var(--green);opacity:0;transition:opacity 0.3s;}

/* ── Shape picker ── */
.shape-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;
  animation:slide-in 0.5s 0.12s cubic-bezier(0.22,1,0.36,1) both;
}
.shape-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.shape-btn{
  width:48px;height:48px;border-radius:10px;cursor:pointer;
  border:2px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;position:relative;
}
.shape-btn:hover{border-color:rgba(255,255,255,0.2);transform:scale(1.08);}
.shape-btn.active{border-color:var(--accent);background:rgba(76,110,245,0.1);}
.shape-preview{
  width:28px;height:28px;
  background:var(--red);
  transition:all 0.2s;
}
.shape-preview.s-circle  {border-radius:50%;}
.shape-preview.s-triangle{border-radius:0;clip-path:polygon(50% 8%,95% 92%,5% 92%);}
.shape-preview.s-diamond {border-radius:0;clip-path:polygon(50% 5%,95% 50%,50% 95%,5% 50%);}
.shape-preview.s-star    {border-radius:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.shape-preview.s-heart   {border-radius:0;clip-path:polygon(50% 85%,15% 45%,5% 30%,15% 10%,35% 8%,50% 25%,65% 8%,85% 10%,95% 30%,85% 45%);}
.shape-preview.s-emoji   {border-radius:50%;background:transparent;font-size:22px;display:flex;align-items:center;justify-content:center;}
.shape-label{font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.emoji-input-wrap{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;display:none;}
.emoji-input-wrap.visible{display:flex;}
.emoji-input{background:transparent;border:none;color:var(--text);font-size:22px;width:40px;text-align:center;outline:none;}

/* ── Search bar ── */
.search-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;flex-direction:column;gap:10px;
  animation:slide-in 0.5s 0.05s cubic-bezier(0.22,1,0.36,1) both;
}
.search-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.search-row{display:flex;gap:8px;}
.search-input{
  flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;
  outline:none;transition:border-color 0.2s;
}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--muted);}
.search-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:10px 18px;border-radius:10px;
  background:var(--accent);border:none;color:#fff;cursor:pointer;
  transition:all 0.2s;flex-shrink:0;
}
.search-btn:hover{background:#6b8aff;transform:translateY(-1px);}
.search-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.search-result{
  display:none;align-items:center;gap:12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;text-decoration:none;color:var(--text);
  transition:all 0.2s;cursor:pointer;
}
.search-result:hover{border-color:var(--accent);}
.search-result.show{display:flex;}
.search-error{font-size:12px;color:var(--red);display:none;}
.search-error.show{display:block;}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;}

@media (max-width: 480px) {
  .profile-header { flex-wrap: wrap; gap: 12px; padding: 16px; }
  .profile-pseudo { font-size: 24px; }
  .profile-elo    { font-size: 32px; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat-val { font-size: 24px; }
  .tabs-row .tab { font-size: 11px; padding: 6px; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="scanlines"></div>
<div class="page">

  <nav class="nav">
    <a class="logo-sm" href="/">Puissance <span>4</span></a>
    <div class="nav-btns">
      <a class="btn-nav" href="/">← Jouer</a>
      <button class="btn-nav danger" id="btn-logout" onclick="logout()" style="display:none">Déconnexion</button>
    </div>
  </nav>

  <!-- Recherche de joueur -->
  <div class="search-wrap">
    <div class="search-label">🔍 Rechercher un joueur</div>
    <div class="search-row">
      <input
        class="search-input"
        id="search-input"
        placeholder="Entrez un pseudo..."
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') searchPlayer()"
      />
      <button class="search-btn" id="search-btn" onclick="searchPlayer()">Chercher</button>
    </div>
    <div class="search-error" id="search-error">Joueur introuvable.</div>
    <a class="search-result" id="search-result" href="#">
      <div class="player-mini-avatar" id="sr-avatar" style="width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px" id="sr-pseudo"></div>
        <div style="font-size:11px;color:var(--muted)" id="sr-stats"></div>
      </div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--yellow)" id="sr-elo"></div>
      <div style="font-size:11px;color:var(--accent);letter-spacing:1px">Voir →</div>
    </a>
  </div>

  <div id="content"><div class="loading">Chargement...</div></div>
</div>

<input type="file" id="avatar-input" accept="image/*" onchange="handleAvatarUpload(this)">

<script>
let currentPlayer = null;
let viewerPlayer  = null;
let isOwnProfile  = false;

async function load() {
  const saved    = localStorage.getItem('player') || sessionStorage.getItem('player');
  const urlId    = new URLSearchParams(location.search).get('id');
  viewerPlayer   = saved ? JSON.parse(saved) : null;
  const playerId = urlId || (viewerPlayer?.id ?? null);
  isOwnProfile   = viewerPlayer && (!urlId || String(urlId) === String(viewerPlayer.id));

  if (isOwnProfile) document.getElementById('btn-logout').style.display = 'block';
  if (!playerId) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Aucun joueur. <a href="/" style="color:var(--red)">← Retour</a></div>';
    return;
  }

  try {
    const [profileRes, followRes] = await Promise.all([
      fetch(`/api/players/${playerId}`),
      viewerPlayer ? fetch(`/api/players/${playerId}/follow-status?viewerId=${viewerPlayer.id}`) : Promise.resolve(null),
    ]);
    if (!profileRes.ok) throw new Error();
    const { player, games, following, followers } = await profileRes.json();
    const followStatus = followRes ? await followRes.json() : { isFollowing: false, followers: 0, following: 0 };
    currentPlayer = player;

    render(player, games, following || [], followers || [], followStatus);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Erreur de chargement.</div>';
  }
}

function render(player, games, following, followers, followStatus) {
  const total = player.wins + player.losses + player.draws;
  const wr    = total > 0 ? Math.round((player.wins / total) * 100) : 0;

  const avatarHtml = player.avatar
    ? `<img src="${player.avatar}" alt="avatar">`
    : player.pseudo[0].toUpperCase();

  const avatarSection = isOwnProfile
    ? `<div class="avatar-wrap" onclick="document.getElementById('avatar-input').click()" title="Changer la photo">
         <div class="profile-avatar" id="avatar-el">${avatarHtml}</div>
         <div class="avatar-overlay">📷</div>
       </div>`
    : `<div class="profile-avatar" style="border-color:${player.color||'var(--red)'}">${avatarHtml}</div>`;

  const followBtn = !isOwnProfile && viewerPlayer
    ? `<button id="btn-follow" class="btn-follow ${followStatus.isFollowing ? 'following' : 'not-following'}"
         onclick="toggleFollow(${player.id})">
         ${followStatus.isFollowing ? '✓ Suivi' : '+ Suivre'}
       </button>`
    : '';

  document.getElementById('content').innerHTML = `
    <!-- Header -->
    <div class="profile-header">
      ${avatarSection}
      <div class="profile-info">
        <div class="profile-pseudo">${player.pseudo}</div>
        <div class="profile-since">Membre depuis ${new Date(player.created_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div>
        ${isOwnProfile ? '<div style="font-size:11px;color:var(--muted);margin-top:6px">📷 Clique sur la photo pour la changer</div>' : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div>
          <div class="profile-elo">${player.elo}</div>
          <div class="profile-elo-lbl">ELO</div>
        </div>
        ${followBtn}
      </div>
    </div>

    <!-- Compteurs sociaux -->
    <div class="social-row">
      <div class="social-card" onclick="switchTab('following')">
        <div class="social-val">${following.length}</div>
        <div class="social-lbl">Suivis</div>
      </div>
      <div class="social-card" onclick="switchTab('followers')">
        <div class="social-val">${followers.length}</div>
        <div class="social-lbl">Abonnés</div>
      </div>
      <div class="social-card" onclick="switchTab('history')">
        <div class="social-val">${games.length}</div>
        <div class="social-lbl">Parties</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card wins"><div class="stat-val">${player.wins}</div><div class="stat-lbl">Victoires</div></div>
      <div class="stat-card losses"><div class="stat-val">${player.losses}</div><div class="stat-lbl">Défaites</div></div>
      <div class="stat-card draws"><div class="stat-val">${player.draws}</div><div class="stat-lbl">Nuls</div></div>
    </div>

    <!-- Winrate -->
    <div class="winrate-card">
      <div class="winrate-header">
        <span class="wr-label">Winrate</span>
        <span class="wr-pct">${wr}%</span>
      </div>
      <div class="wr-bar"><div class="wr-fill" id="wr-fill" style="width:0%"></div></div>
    </div>

    <!-- Changement de couleur (propre profil uniquement) -->
    ${isOwnProfile ? `
    <div class="color-card" id="color-card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)">🎨 Couleur de jeton</span>
        <span class="save-confirm" id="save-confirm">✓ Enregistré !</span>
      </div>
      <div class="color-row" id="color-presets-wrap"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="color-custom-wrap" onclick="document.getElementById('profil-color-input').click()">
          <div class="color-dot" id="profil-color-dot"></div>
          <div class="color-hex" id="profil-color-hex">#ff2d55</div>
        </div>
        <input type="color" id="profil-color-input" oninput="onProfilColorInput(this.value)">
        <button class="btn-save-color" id="btn-save-color" onclick="saveColor()">Enregistrer</button>
      </div>
    </div>
    <div class="shape-card" id="shape-card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)">🔷 Forme de pion</span>
        <span class="save-confirm" id="shape-confirm"></span>
      </div>
      <div class="shape-row" id="shape-row"></div>
      <div class="emoji-input-wrap" id="emoji-wrap">
        <span style="font-size:12px;color:var(--muted);">Ton emoji :</span>
        <input class="emoji-input" id="emoji-input" maxlength="2" placeholder="⭐" oninput="onEmojiInput(this.value)">
      </div>
      <button class="btn-save-color" onclick="saveShape()">Enregistrer</button>
    </div>
    ` : ''}

    <!-- Tabs -->
    <div class="tabs-row">
      <button class="tab active" id="tab-history"   onclick="switchTab('history')">🎮 Parties</button>
      <button class="tab"        id="tab-following"  onclick="switchTab('following')">👁 Suivis</button>
      <button class="tab"        id="tab-followers"  onclick="switchTab('followers')">👥 Abonnés</button>
    </div>

    <!-- Panel : Historique -->
    <div class="tab-panel show" id="panel-history">
      ${renderGames(games, player)}
    </div>

    <!-- Panel : Following -->
    <div class="tab-panel" id="panel-following">
      ${renderPlayers(following, 'Aucun joueur suivi pour l\'instant.')}
    </div>

    <!-- Panel : Followers -->
    <div class="tab-panel" id="panel-followers">
      ${renderPlayers(followers, 'Aucun abonné pour l\'instant.')}
    </div>
  `;

  setTimeout(() => { const f = document.getElementById('wr-fill'); if(f) f.style.width = wr+'%'; }, 100);
  if (isOwnProfile) setTimeout(() => initColorPicker(player.color), 50);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name) {
  ['history','following','followers'].forEach(t => {
    document.getElementById('tab-' + t)?.classList.toggle('active', t === name);
    const panel = document.getElementById('panel-' + t);
    if (panel) { panel.classList.toggle('show', t === name); }
  });
}

// ── Follow / Unfollow ─────────────────────────────────────────────────────────
async function toggleFollow(targetId) {
  if (!viewerPlayer) return location.href = '/';
  const btn = document.getElementById('btn-follow');
  const isFollowing = btn.classList.contains('following');
  const method = isFollowing ? 'DELETE' : 'POST';

  btn.disabled = true;
  try {
    const res = await fetch(`/api/players/${targetId}/follow`, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ followerId: viewerPlayer.id }),
    });
    const data = await res.json();
    if (res.ok) {
      btn.classList.toggle('following',     data.following);
      btn.classList.toggle('not-following', !data.following);
      btn.textContent = data.following ? '✓ Suivi' : '+ Suivre';
    }
  } finally {
    btn.disabled = false;
  }
}

// ── Render helpers ────────────────────────────────────────────────────────────
function renderGames(games, me) {
  if (!games.length) return '<div class="empty-state">Aucune partie jouée pour l\'instant.</div>';
  return games.map(g => {
    const isP1      = g.player1_id === me.id;
    const opponent  = isP1 ? g.p2_pseudo : g.p1_pseudo;
    const won       = g.winner_id === me.id;
    const isDraw    = g.winner_id === null;
    const rc        = isDraw ? 'draw' : (won ? 'win' : 'loss');
    const ri        = isDraw ? '⚖️' : (won ? '🏆' : '💀');
    const eloChange = isP1 ? g.elo_p1 : g.elo_p2;
    const eloClass  = isDraw ? 'neu' : (eloChange >= 0 ? 'pos' : 'neg');
    const eloStr    = (eloChange >= 0 ? '+' : '') + eloChange + ' ELO';
    const date      = g.finished_at
      ? new Date(g.finished_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '—';
    return `<a class="game-row" href="/replay/${g.id}">
      <div class="game-result ${rc}">${ri}</div>
      <div class="game-vs">vs <span>${opponent}</span></div>
      <div class="game-meta">
        <div class="game-elo-change ${eloClass}">${eloStr}</div>
        <div>${g.move_count} coups · ${g.duration}s</div>
        <div>${date}</div>
      </div>
      <div class="replay-badge">▶ Replay</div>
    </a>`;
  }).join('');
}

function renderPlayers(players, emptyMsg) {
  if (!players.length) return `<div class="empty-state">${emptyMsg}</div>`;
  return players.map(p => {
    const avatarHtml = p.avatar
      ? `<img src="${p.avatar}" alt="${p.pseudo}">`
      : p.pseudo[0].toUpperCase();
    const color  = p.color || '#ff2d55';
    const total  = (p.wins||0) + (p.losses||0) + (p.draws||0);
    const wr     = total > 0 ? Math.round(((p.wins||0)/total)*100) : 0;
    return `<a class="player-row" href="/profil?id=${p.id}">
      <div class="player-mini-avatar" style="background:${color}22;border:2px solid ${color}">${avatarHtml}</div>
      <div class="player-mini-info">
        <div class="player-mini-pseudo">${p.pseudo}</div>
        <div class="player-mini-stats">${p.wins||0}V · ${p.losses||0}D · ${wr}% WR</div>
      </div>
      <div class="player-mini-elo">${p.elo}</div>
    </a>`;
  }).join('');
}

// ── Avatar upload ─────────────────────────────────────────────────────────────
function handleAvatarUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) return alert('Image trop lourde (max 2MB).');
  const reader = new FileReader();
  reader.onload = async (e) => {
    const resized = await resizeImage(e.target.result, 200);
    const me = JSON.parse(localStorage.getItem('player') || '{}');
    const res = await fetch(`/api/players/${me.id}/avatar`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ avatar: resized, token: localStorage.getItem('token') }),
    });
    if (res.ok) {
      const el = document.getElementById('avatar-el');
      if (el) el.innerHTML = `<img src="${resized}" alt="avatar">`;
      me.avatar = resized;
      localStorage.setItem('player', JSON.stringify(me));
    } else alert('Erreur upload.');
  };
  reader.readAsDataURL(file);
}

function resizeImage(dataUrl, maxSize) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
      else        { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  });
}

// ── Déconnexion ───────────────────────────────────────────────────────────────
function logout() {
  localStorage.removeItem('player');
  sessionStorage.removeItem('player');
  sessionStorage.removeItem('match');
  window.location.href = '/';
}

// ── Recherche joueur ──────────────────────────────────────────────────────────
async function searchPlayer() {
  const pseudo = document.getElementById('search-input').value.trim();
  if (!pseudo) return;

  const btn    = document.getElementById('search-btn');
  const result = document.getElementById('search-result');
  const error  = document.getElementById('search-error');

  btn.disabled = true;
  btn.textContent = '...';
  result.classList.remove('show');
  error.classList.remove('show');

  try {
    const res = await fetch(`/api/players/by-pseudo/${encodeURIComponent(pseudo)}`);
    if (!res.ok) throw new Error();
    const player = await res.json();

    // Afficher le résultat
    const color   = player.color || '#ff2d55';
    const total   = (player.wins||0) + (player.losses||0) + (player.draws||0);
    const wr      = total > 0 ? Math.round(((player.wins||0)/total)*100) : 0;
    const avatar  = document.getElementById('sr-avatar');

    avatar.style.background = color + '22';
    avatar.style.border = `2px solid ${color}`;
    avatar.style.color  = color;
    avatar.innerHTML    = player.avatar
      ? `<img src="${player.avatar}" style="width:100%;height:100%;object-fit:cover">`
      : player.pseudo[0].toUpperCase();

    document.getElementById('sr-pseudo').textContent = player.pseudo;
    document.getElementById('sr-stats').textContent  = `${player.wins||0}V · ${player.losses||0}D · ${wr}% WR`;
    document.getElementById('sr-elo').textContent    = player.elo;
    document.getElementById('search-result').href    = `/profil?id=${player.id}`;
    result.classList.add('show');

  } catch {
    error.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Chercher';
  }
}

// ── Color picker (propre profil) ─────────────────────────────────────────────
const COLOR_PRESETS = [
  '#ff2d55','#ffd60a','#30d158','#0a84ff','#bf5af2','#ff9f0a','#00c7be','#ff375f',
];
let selectedProfilColor = '#ff2d55';

function initColorPicker(currentColor) {
  selectedProfilColor = currentColor || '#ff2d55';
  const wrap = document.getElementById('color-presets-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  COLOR_PRESETS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-preset' + (c === selectedProfilColor ? ' active' : '');
    dot.style.background = c;
    dot.onclick = () => {
      selectedProfilColor = c;
      document.getElementById('profil-color-input').value = c;
      updateColorDot(c);
      document.querySelectorAll('.color-preset').forEach(d =>
        d.classList.toggle('active', d.style.background === hexToRgb(c))
      );
    };
    wrap.appendChild(dot);
  });
  updateColorDot(selectedProfilColor);
}

function onProfilColorInput(c) {
  selectedProfilColor = c;
  updateColorDot(c);
  document.querySelectorAll('.color-preset').forEach(d => d.classList.remove('active'));
}

function updateColorDot(c) {
  const dot = document.getElementById('profil-color-dot');
  const hex = document.getElementById('profil-color-hex');
  if (dot) dot.style.background = c;
  if (hex) hex.textContent = c.toUpperCase();
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

// ── Shape picker ──────────────────────────────────────────────────────────────
const SHAPES = [
  { id: 'circle',   label: '●' },
  { id: 'triangle', label: '▲' },
  { id: 'diamond',  label: '◆' },
  { id: 'star',     label: '★' },
  { id: 'heart',    label: '♥' },
  { id: 'emoji',    label: '😀' },
];
let selectedShape = 'circle';
let selectedEmoji = '⭐';

function initShapePicker(currentShape, currentEmoji) {
  selectedShape = currentShape || 'circle';
  selectedEmoji = currentEmoji || '⭐';
  const row = document.getElementById('shape-row');
  if (!row) return;
  row.innerHTML = '';
  const CLIPS = {
    circle:   { borderRadius: '50%',  clipPath: '' },
    triangle: { borderRadius: '0',    clipPath: 'polygon(50% 8%, 95% 92%, 5% 92%)' },
    diamond:  { borderRadius: '0',    clipPath: 'polygon(50% 5%, 95% 50%, 50% 95%, 5% 50%)' },
    star:     { borderRadius: '0',    clipPath: 'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)' },
    heart:    { borderRadius: '0',    clipPath: 'polygon(50% 85%,15% 45%,5% 30%,15% 10%,35% 8%,50% 25%,65% 8%,85% 10%,95% 30%,85% 45%)' },
    emoji:    { borderRadius: '50%',  clipPath: '' },
  };
  SHAPES.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'shape-btn' + (s.id === selectedShape ? ' active' : '');
    btn.dataset.shape = s.id;
    btn.onclick = () => selectShape(s.id);

    const preview = document.createElement('div');
    preview.className = 'shape-preview';

    if (s.id === 'emoji') {
      preview.style.borderRadius = '50%';
      preview.style.background   = 'transparent';
      preview.style.fontSize     = '22px';
      preview.style.display      = 'flex';
      preview.style.alignItems   = 'center';
      preview.style.justifyContent = 'center';
      preview.textContent = selectedEmoji;
    } else {
      const c = CLIPS[s.id];
      preview.style.borderRadius = c.borderRadius;
      preview.style.clipPath     = c.clipPath;
      preview.style.background   = 'var(--red)';
    }
    btn.appendChild(preview);
    row.appendChild(btn);
  });
  updateEmojiWrap();
}

function selectShape(id) {
  selectedShape = id;
  document.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === id));
  updateEmojiWrap();
}

function updateEmojiWrap() {
  const w = document.getElementById('emoji-wrap');
  if (w) w.classList.toggle('visible', selectedShape === 'emoji');
}

function onEmojiInput(val) {
  // Prendre le premier caractère emoji
  const chars = [...val];
  if (chars.length > 0) {
    selectedEmoji = chars[0];
    document.getElementById('emoji-input').value = selectedEmoji;
    // Mettre à jour la preview
    const btn = document.querySelector('.shape-btn[data-shape="emoji"] .shape-preview');
    if (btn) btn.textContent = selectedEmoji;
  }
}

async function saveShape() {
  const me = JSON.parse(localStorage.getItem('player') || '{}');
  if (!me.id) return;
  const token = localStorage.getItem('token');
  // On stocke shape + emoji dans le localStorage du joueur
  const shapeVal = selectedShape === 'emoji' ? ('emoji:' + selectedEmoji) : selectedShape;
  const res = await fetch(`/api/players/${me.id}/shape`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ shape: selectedShape, token }),
  });
  if (res.ok) {
    me.shape = shapeVal;
    localStorage.setItem('player', JSON.stringify(me));
    sessionStorage.setItem('player', JSON.stringify(me));
    const c = document.getElementById('shape-confirm');
    if (c) { c.textContent = '✓ Enregistré !'; c.style.opacity = 1; setTimeout(() => c.style.opacity = 0, 2000); }
  }
}

async function saveColor() {
  const me = JSON.parse(localStorage.getItem('player') || '{}');
  if (!me.id) return;
  const btn = document.getElementById('btn-save-color');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`/api/players/${me.id}/color`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ color: selectedProfilColor, token: localStorage.getItem('token') }),
    });
    if (res.ok) {
      me.color = selectedProfilColor;
      localStorage.setItem('player', JSON.stringify(me));
      // Feedback visuel
      const confirm = document.getElementById('save-confirm');
      if (confirm) { confirm.style.opacity = '1'; setTimeout(() => confirm.style.opacity = '0', 2000); }
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
  }
}

load();
</script>
