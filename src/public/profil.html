}

function getPersoAccent() {
  return { color: '#ff7a45', bg: 'rgba(255,122,69,0.14)', border: 'rgba(255,122,69,0.36)', label: 'PERSO' };
}

function getPersoRoleAccent(player = currentPlayer) {
  const defaultAccent = getPersoAccent();
  const rawColor = String(player?.custom_role_color || '').trim();
  const color = /^#[0-9a-fA-F]{6}$/.test(rawColor) ? rawColor.toUpperCase() : defaultAccent.color;
  const rawColorSecondary = String(player?.custom_role_color_secondary || '').trim();
  const colorSecondary = /^#[0-9a-fA-F]{6}$/.test(rawColorSecondary) ? rawColorSecondary.toUpperCase() : '';
  const badgeBg = colorSecondary
    ? `linear-gradient(135deg,${color}22,${colorSecondary}22)`
    : `${color}18`;
  return {
    color,
    colorSecondary,
    bg: badgeBg,
    border: `${color}66`,
    glow: colorSecondary ? `${colorSecondary}44` : `${color}44`,
    label: String(player?.custom_role_text || '').trim().toUpperCase() || defaultAccent.label,
    emoji: String(player?.custom_role_emoji || '').trim(),
    rgb: canUsePersoBadgeRgb(player) && Number(player?.custom_role_rgb || 0) === 1,
  };
}

function hasCustomPersoRole(player = currentPlayer) {
  return isPerso(player) && !!String(player?.custom_role_text || '').trim() && !!String(player?.custom_role_color || '').trim();
}

function getVipExpiryLabel(player = currentPlayer) {
  if (!player?.is_vip || player?.is_vip_plus || !player?.vip_expires_at) return '';
  try {
    return `VIP jusqu'au ${new Date(player.vip_expires_at).toLocaleDateString('fr-FR')}`;
  } catch(e) {
    return '';
  }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTournamentDate(ts) {
  if (!ts) return '--';
  return new Date(Number(ts)).toLocaleString('fr-FR', {
    day: '2-digit',
    month: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function getTournamentStatusLabel(status) {
  if (status === 'active') return 'ACTIF';
  if (status === 'pending') return 'BIENTOT';
  if (status === 'paused') return 'PAUSE';
  return 'TERMINE';
}

function getTournamentStatusColor(status) {
  if (status === 'active') return '#30d158';
  if (status === 'pending') return '#ffd60a';
  if (status === 'paused') return '#68d4ff';
  return 'var(--muted)';
}

function tokenStyle(item) {

function openTokenCollection() {
  document.getElementById('token-collection-modal-bg')?.classList.add('show');
}

function closeTokenCollection() {
  document.getElementById('token-collection-modal-bg')?.classList.remove('show');
}

function formatRemainingTime(ms) {
  const totalMinutes = Math.ceil(ms / 60000);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours > 0 && minutes > 0) return `${hours}h ${minutes}m`;
  if (hours > 0) return `${hours}h`;
  return `${minutes}m`;
}

async function load() {
  const saved    = localStorage.getItem('player') || sessionStorage.getItem('player');
  const urlId    = new URLSearchParams(location.search).get('id');
  viewerPlayer   = saved ? JSON.parse(saved) : null;
  const playerId = urlId || (viewerPlayer?.id ?? null);
  isOwnProfile   = viewerPlayer && (!urlId || String(urlId) === String(viewerPlayer.id));
  await loadProfileShopInventory();

  if (isOwnProfile) {
    document.getElementById('btn-logout').style.display = 'block';
    document.getElementById('btn-close-account').style.display = 'block';
  }
  if (!playerId) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Aucun joueur. <a href="/" style="color:var(--red)">← Retour</a></div>';
    return;
  }

  try {
    const [profileRes, followRes, tokenCollectionRes] = await Promise.all([
      fetch(`/api/players/${playerId}`),
      viewerPlayer ? fetch(`/api/players/${playerId}/follow-status?viewerId=${viewerPlayer.id}`) : Promise.resolve(null),
      fetch(`/api/players/${playerId}/token-collection`),
    ]);
    if (profileRes.status === 404) {
      document.getElementById('content').innerHTML = `
        <div style="text-align:center;padding:80px 20px">
          <div style="font-size:48px;margin-bottom:16px">Profil</div>
          <div style="font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color: var(--muted)">Compte supprimé</div>
          <div style="font-size:13px;color: var(--muted);margin-top:8px">Ce joueur a fermé son compte.</div>
        </div>`;
      return;
    }
    if (!profileRes.ok) throw new Error();
    const { player, games, games_total, following, followers } = await profileRes.json();
    const totalGames = Number(games_total ?? player.games_total ?? (games || []).length);
    const tokenCollectionData = tokenCollectionRes.ok ? await tokenCollectionRes.json() : { collection: { items: [], stats: {} } };
    const followStatus = followRes ? await followRes.json() : { isFollowing: false, followers: 0, following: 0 };
    profileTokenCollection = tokenCollectionData.collection || { items: [], stats: {} };
    const freshPlayer = player;
    currentPlayer = freshPlayer;
    applyProfileWallpaperMode();
    if (isOwnProfile) {
      syncStoredPlayerPatch({ custom_cursor: String(freshPlayer.custom_cursor || ''), language: String(freshPlayer.language || 'fr') });
      await window.P4I18n?.setLanguage(String(freshPlayer.language || 'fr'));
      applyProfileCursor(String(freshPlayer.custom_cursor || ''));
    }
    profileRpcOnline = !!freshPlayer.online;
    profileRpcLive = false;
    profileRpcGames = totalGames;
    const rpcContext = {
      details: isOwnProfile ? 'Personnalise son profil' : `Consulte le profil de ${freshPlayer.pseudo}`,
      state: `${Number(freshPlayer.elo || 0)} ELO • ${profileRpcGames} partie${profileRpcGames > 1 ? 's' : ''} • ${profileRpcOnline ? 'En ligne' : 'Hors ligne'}`,
      hideIdentity: true,
      url: location.href,
    };
    window.__p4RpcContext = rpcContext;
    window.P4DiscordPresence?.setContext(rpcContext);
    currentGamesCache = games || [];
    currentFollowingCache = following || [];
    currentFollowersCache = followers || [];
    currentFollowStatusCache = followStatus || { isFollowing: false, followers: 0, following: 0 };
    pendingAvatarDecoration = null;

    render(freshPlayer, currentGamesCache, currentFollowingCache, currentFollowersCache, currentFollowStatusCache, totalGames);
    window.P4I18n?.apply(document.getElementById('content'));
    renderQueueMusicPicker(freshPlayer);
    refreshProfileWallpaperControls();
    loadEloHistory(freshPlayer.id, eloHistoryDays, true);
    if (eloHistoryTimer) clearInterval(eloHistoryTimer);
    eloHistoryTimer = setInterval(() => {
      if (currentPlayer?.id) loadEloHistory(currentPlayer.id, eloHistoryDays, true);
    }, 15000);

    // Charger le statut en ligne (tous les profils)
    // Exposer pour que presence.js rappelle après identified
    window._reloadStatus = () => loadStatus(freshPlayer.id);
    loadStatus(freshPlayer.id);
    startProfileLivePolling(freshPlayer.id);

    // Charger les infos Discord si profil own + discord lié
    if (isOwnProfile && freshPlayer.discord_id) {
      loadDiscordInfo();
    }
    if ((isOwnProfile || isAdminTier(viewerPlayer)) && Number(freshPlayer.is_bot || 0) !== 1) {
      loadReferralInfo();
      loadBotHostPanel();
    }

    // Notif discord_linked
    const params = new URLSearchParams(location.search);
    if (params.get('discord_linked') === '1') {
      history.replaceState({}, '', '/profil');
      setTimeout(() => loadDiscordInfo(), 500);
    }
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Erreur de chargement.</div>';
  }
}

async function checkDiscordRpcStatus(manual = false) {
  const status = document.getElementById('discord-rpc-status');
  const description = document.getElementById('discord-rpc-description');
  const preview = document.getElementById('discord-rpc-preview');
  const previewAvatar = document.getElementById('discord-rpc-preview-avatar');
  const previewDetails = document.getElementById('discord-rpc-preview-details');
  const previewState = document.getElementById('discord-rpc-preview-state');
  const previewAvatarLabel = document.getElementById('discord-rpc-preview-avatar-label');
  if (!status || !description) return;
  status.className = 'discord-rpc-status';
  status.textContent = 'Autorisation';
  if (manual) {
    description.innerHTML = 'Chrome peut demander <strong>Autoriser ce site à accéder aux appareils de votre réseau local</strong>. Clique sur <strong>Autoriser</strong>.';
  }
  try {
    const response = await fetch('http://127.0.0.1:6464/status', {
      cache: 'no-store',
      mode: 'cors',
      signal: AbortSignal.timeout(10000),
    });
    if (!response.ok) throw new Error(`RPC HTTP ${response.status}`);
    const data = await response.json();
    const buttonCount = Array.isArray(data.buttons) ? data.buttons.length : 0;
    status.classList.add(data.discord ? 'online' : 'offline');
    status.textContent = data.discord ? 'RPC actif' : 'Discord absent';
    description.textContent = data.discord
      ? `${data.source === 'site' ? 'Activité du site synchronisée' : 'Présence de secours active'} • ${buttonCount} bouton${buttonCount > 1 ? 's' : ''} • protection anti-rafale ${Math.round(Number(data.rateLimitMs || 5000) / 1000)} s.`
      : 'Le compagnon tourne, mais Discord Desktop doit être ouvert.';
    if (preview && previewDetails && previewState && previewAvatarLabel && previewAvatar) {
      previewDetails.textContent = data.details || 'Puissance 4';
      previewState.textContent = data.state || 'Présence prête';
      previewAvatarLabel.textContent = data.smallImageText || (data.smallImage ? 'Avatar RPC' : 'Aucun petit avatar envoyé');
      previewAvatar.hidden = !data.smallImage;
      if (data.smallImage) {
        previewAvatar.src = data.smallImage;
        previewAvatar.onerror = () => { previewAvatar.hidden = true; };
      } else {
        previewAvatar.removeAttribute('src');
      }
      preview.classList.add('show');
    }
  } catch {
    status.classList.add('offline');
    status.textContent = 'Accès local bloqué';
    description.innerHTML = 'Dans Chrome, ouvre les informations du site à gauche de l’adresse, autorise <strong>Accès au réseau local</strong>, puis reclique sur <strong>Vérifier le RPC</strong>.';
    preview?.classList.remove('show');
  }
  if (manual) PROFIL_SFX.discord();
}

async function loadClanDirectory() {
  const wrap = document.getElementById('clan-directory');
  if (!wrap) return;
  try {
    const res = await fetch('/api/clans');
    const data = await res.json();
    const clans = Array.isArray(data?.clans) ? data.clans : [];
    if (!clans.length) {
      wrap.innerHTML = '<div style="font-size:12px;color:var(--muted)">Aucun clan cree pour le moment.</div>';
      return;
    }
    const canJoin = isOwnProfile && !currentPlayer?.clan;
    wrap.innerHTML = clans.map(clan => `
      <div class="clan-row" style="${clanAccentStyle(clan)}">
        <div class="clan-row-badge">${escapeHtml(clan.blason || '🛡️')}</div>
        <div class="clan-row-main">
          <div class="clan-row-name">${escapeHtml(clan.name)}</div>
          <div class="clan-row-sub">${escapeHtml(clan.tag)} · ${Number(clan.member_count || 0)} membres · ${Number(clan.avg_elo || 0)} Elo moyen</div>
        </div>
        <a class="btn-save-color" href="/clan?id=${Number(clan.id)}" style="padding:8px 10px;min-width:0;text-decoration:none;text-align:center">Voir</a>
        ${canJoin ? `<button class="btn-save-color" style="padding:8px 10px;min-width:0;color:var(--clan-color);border-color:var(--clan-border);background:var(--clan-bg)" onclick="joinClan(${Number(clan.id)})">Rejoindre</button>` : ''}
      </div>
    `).join('');
  } catch {
    wrap.innerHTML = '<div style="font-size:12px;color:#ff6b88">Impossible de charger les clans.</div>';
  }
}

async function createClan() {
  const token = localStorage.getItem('token') || '';
  const body = {
    token,
    name: document.getElementById('clan-name-input')?.value || '',
    tag: document.getElementById('clan-tag-input')?.value || '',
    blason: document.getElementById('clan-blason-input')?.value || '🛡️',
    color: document.getElementById('clan-color-input')?.value || '#85EBFF',
    description: document.getElementById('clan-desc-input')?.value || '',
  };
  try {
    const res = await fetch('/api/clans', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return alert(data.error || 'Impossible de creer le clan.');
    location.reload();
  } catch {
    alert('Erreur reseau clan.');
  }
}

async function joinClan(id) {
  const token = localStorage.getItem('token') || '';
  try {
    const res = await fetch(`/api/clans/${encodeURIComponent(id)}/join`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return alert(data.error || 'Impossible de rejoindre le clan.');
    location.reload();
  } catch {
    alert('Erreur reseau clan.');
  }
}

async function leaveClan() {
  if (!confirm('Quitter ce clan ?')) return;
  const token = localStorage.getItem('token') || '';
  try {
    const res = await fetch('/api/clans/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return alert(data.error || 'Impossible de quitter le clan.');
    location.reload();
  } catch {
    alert('Erreur reseau clan.');
  }
}

function setEloHistoryRange(days) {
  eloHistoryDays = [1, 7, 15].includes(Number(days)) ? Number(days) : 7;
  eloHistoryStartDate = '';
  eloHistoryEndDate = '';
  const startInput = document.getElementById('elo-history-start-date');
  const endInput = document.getElementById('elo-history-end-date');
  if (startInput) startInput.value = '';
  if (endInput) endInput.value = '';
  if (currentPlayer?.id) loadEloHistory(currentPlayer.id, eloHistoryDays);
}

function applyEloHistoryDateRange() {
  const startInput = document.getElementById('elo-history-start-date');
  const endInput = document.getElementById('elo-history-end-date');
  const start = String(startInput?.value || '');
  const end = String(endInput?.value || '');
  if (!start || !end) {
    alert('Choisis une date de debut et une date de fin.');
    return;
  }
  if (new Date(end) < new Date(start)) {
    alert('La date de fin doit etre apres la date de debut.');
    return;
  }
  eloHistoryStartDate = start;
  eloHistoryEndDate = end;
  document.querySelectorAll('[data-elo-days]').forEach(btn => btn.classList.remove('active'));
  if (currentPlayer?.id) loadEloHistory(currentPlayer.id, eloHistoryDays);
}

function setEloHistoryButtonState(days) {
  document.querySelectorAll('[data-elo-days]').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.eloDays) === Number(days));
  });
}

async function loadEloHistory(playerId, days = 7, silent = false) {
  if (!playerId) return;
  if (!eloHistoryStartDate || !eloHistoryEndDate) setEloHistoryButtonState(days);
  try {
    const params = new URLSearchParams({ days: String(days) });
    if (eloHistoryStartDate && eloHistoryEndDate) {
      params.set('start', eloHistoryStartDate);
      params.set('end', eloHistoryEndDate);
    }
    const res = await fetch(`/api/players/${encodeURIComponent(playerId)}/elo-history?${params.toString()}`);
    if (!res.ok) throw new Error('history');
    const data = await res.json();
    lastEloHistoryData = data;
    drawEloHistory(data);
  } catch {
    if (!silent) {
      const stats = document.getElementById('elo-history-stats');
      if (stats) stats.innerHTML = '<div class="elo-history-stat" style="grid-column:1/-1"><strong>--</strong><span>Courbe indisponible</span></div>';
    }
  }
}

function drawEloHistory(data, animationFrameOnly = false) {
  const canvas = document.getElementById('elo-history-canvas');
  if (!canvas) {
    if (eloHistoryRgbFrame) cancelAnimationFrame(eloHistoryRgbFrame);
    eloHistoryRgbFrame = 0;
    return;
  }
  if (eloHistoryRgbFrame) {
    cancelAnimationFrame(eloHistoryRgbFrame);
    eloHistoryRgbFrame = 0;
  }
  const wrap = canvas.parentElement;
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const width = Math.max(320, Math.floor(wrap?.clientWidth || 680));
  const height = Math.max(180, Math.floor(wrap?.clientHeight || 230));
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = '100%';
  canvas.style.height = '100%';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const points = Array.isArray(data?.points) ? data.points : [];
  const stats = data?.stats || {};
  const playerColor = data?.player?.color || currentPlayer?.color || '#ff2d55';
  const curveColor = /^#[0-9a-fA-F]{6}$/.test(String(data?.player?.elo_curve_color || currentPlayer?.elo_curve_color || ''))
    ? String(data?.player?.elo_curve_color || currentPlayer?.elo_curve_color).toUpperCase()
    : playerColor;
  const curveColorSecondary = /^#[0-9a-fA-F]{6}$/.test(String(data?.player?.elo_curve_color_secondary || currentPlayer?.elo_curve_color_secondary || ''))
    ? String(data?.player?.elo_curve_color_secondary || currentPlayer?.elo_curve_color_secondary).toUpperCase()
    : '#85EBFF';
  const rgbEnabled = Number(data?.player?.elo_curve_rgb ?? currentPlayer?.elo_curve_rgb ?? 0) === 1;
  const rgbSpeed = Math.max(0.25, Math.min(4, Number(data?.player?.elo_curve_rgb_speed ?? currentPlayer?.elo_curve_rgb_speed ?? 1) || 1));
  const rgbDirection = String(data?.player?.elo_curve_rgb_direction ?? currentPlayer?.elo_curve_rgb_direction ?? 'forward') === 'reverse' ? -1 : 1;
  const rgbHue = ((Date.now() / 34) * rgbSpeed * rgbDirection) % 360;
  const rgbColor = (offset = 0, alpha = 1) => {
    const hue = ((rgbHue + offset) % 360 + 360) % 360;
    return `hsla(${Math.round(hue)}, 96%, 64%, ${alpha})`;
  };
  const lineColorA = rgbEnabled ? rgbColor(0) : curveColor;
  const lineColorB = rgbEnabled ? rgbColor(126) : curveColorSecondary;
  const lineColorC = rgbEnabled ? rgbColor(252) : '#ffd60a';
  const fillColorA = rgbEnabled ? rgbColor(0, 0.34) : `${curveColor}55`;
  const fillColorB = rgbEnabled ? rgbColor(252, 0.02) : `${curveColor}00`;
  const startTime = Number(stats.startTime || points[0]?.t || (Date.now() - 7 * 86400000));
  const endTime = Number(stats.endTime || Date.now());
  const rawMin = Number(stats.minElo || data?.player?.elo || 1000);
  const rawMax = Number(stats.maxElo || data?.player?.elo || 1000);
  const pad = Math.max(18, Math.round((rawMax - rawMin) * 0.18));
  const minElo = rawMin - pad;
  const maxElo = rawMax + pad;
  const left = 48;
  const right = 18;
  const top = 20;
  const bottom = 34;
  const plotW = width - left - right;
  const plotH = height - top - bottom;
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const xByTime = t => left + ((Number(t || startTime) - startTime) / Math.max(1, endTime - startTime)) * plotW;
  const y = elo => top + (1 - ((Number(elo || minElo) - minElo) / Math.max(1, maxElo - minElo))) * plotH;
  const drawSmoothPath = drawPoints => {
    if (!drawPoints.length) return;
    if (drawPoints.length === 1) {
      ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
      return;
    }
    ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
    for (let i = 0; i < drawPoints.length - 1; i += 1) {
      const p0 = drawPoints[Math.max(0, i - 1)];
      const p1 = drawPoints[i];
      const p2 = drawPoints[i + 1];
      const p3 = drawPoints[Math.min(drawPoints.length - 1, i + 2)];
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
  };

  const bg = ctx.createLinearGradient(0, 0, width, height);
  bg.addColorStop(0, 'rgba(255,255,255,0.035)');
  bg.addColorStop(1, 'rgba(0,0,0,0.10)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);

  ctx.font = "11px Barlow, sans-serif";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i += 1) {
    const gy = top + (plotH / 4) * i;
    const value = Math.round(maxElo - ((maxElo - minElo) / 4) * i);
    ctx.strokeStyle = 'rgba(255,255,255,0.055)';
    ctx.beginPath();
    ctx.moveTo(left, gy);
    ctx.lineTo(width - right, gy);
    ctx.stroke();
    ctx.fillStyle = 'rgba(238,238,245,0.42)';
    ctx.fillText(String(value), 10, gy + 4);
  }
  for (let i = 0; i <= 3; i += 1) {
    const gx = left + (plotW / 3) * i;
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.beginPath();
    ctx.moveTo(gx, top);
    ctx.lineTo(gx, height - bottom);
    ctx.stroke();
  }

  const drawable = points.length
    ? points
    : [{ t: startTime, elo: data?.player?.elo || 1000, label: 'Debut' }, { t: endTime, elo: data?.player?.elo || 1000, label: 'Maintenant' }];
  const gamePointCount = drawable.filter(point => point.gameId).length;
  const useReadableSpacing = gamePointCount >= 1;
  const line = drawable.map((point, index) => {
    let px;
    if (useReadableSpacing) {
      px = left + (plotW * index) / Math.max(1, drawable.length - 1);
    } else {
      px = xByTime(point.t);
    }
    return {
      x: clamp(px, left, width - right),
      y: y(point.elo),
      point,
    };
  });
  eloHistoryHitPoints = line.map(p => ({
    x: p.x,
    y: p.y,
    elo: Number(p.point.elo || 0),
    delta: Number(p.point.delta || 0),
    gameId: p.point.gameId || null,
    label: p.point.label || (p.point.gameId ? `Partie #${p.point.gameId}` : ''),
    result: p.point.result || '',
    moveCount: Number(p.point.moveCount || 0),
    duration: Number(p.point.duration || 0),
    opponent: p.point.opponent || null,
    type: p.point.type || '',
    t: Number(p.point.t || 0),
  }));
  if (!animationFrameOnly) initEloHistoryHover();
  const fillGradient = ctx.createLinearGradient(0, top, 0, height - bottom);
  fillGradient.addColorStop(0, fillColorA);
  fillGradient.addColorStop(1, fillColorB);
  ctx.beginPath();
  drawSmoothPath(line);
  ctx.lineTo(line[line.length - 1].x, height - bottom);
  ctx.lineTo(line[0].x, height - bottom);
  ctx.closePath();
  ctx.fillStyle = fillGradient;
  ctx.fill();

  const strokeGradient = ctx.createLinearGradient(left, 0, width - right, 0);
  strokeGradient.addColorStop(0, lineColorA);
  strokeGradient.addColorStop(0.55, lineColorB);
  strokeGradient.addColorStop(1, lineColorC);
  ctx.beginPath();
  drawSmoothPath(line);
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = strokeGradient;
  ctx.shadowColor = lineColorA;
  ctx.shadowBlur = rgbEnabled ? 18 : 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  line.forEach((p, index) => {
    const isAnchor = !p.point.gameId;
    if (isAnchor && line.length > 3) return;
    if (line.length > 30 && index !== line.length - 1 && index % 2 !== 0) return;
    const delta = Number(p.point.delta || 0);
    ctx.fillStyle = delta > 0 ? '#30d158' : delta < 0 ? '#ff4d6d' : '#85EBFF';
    ctx.beginPath();
    ctx.arc(p.x, p.y, index === line.length - 1 ? 5 : 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.72)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  });

  ctx.font = "700 11px Barlow, sans-serif";
  ctx.fillStyle = 'rgba(238,238,245,0.52)';
  const rangeStart = Number(stats.startTime || startTime);
  const rangeEnd = Number(stats.endTime || endTime);
  const rangeLabel = `${formatHistoryDateOnly(rangeStart)} → ${formatHistoryDateOnly(rangeEnd)}`;
  ctx.fillText(rangeLabel, Math.max(left, width - right - ctx.measureText(rangeLabel).width), height - 12);
  ctx.fillStyle = '#eeeef5';
  ctx.font = "900 20px 'Barlow Condensed', sans-serif";
  ctx.fillText(`${Math.round(stats.endElo || data?.player?.elo || 0)} ELO`, left, 24);
  const sub = document.querySelector('.elo-history-sub');
  if (sub && !animationFrameOnly) sub.textContent = `Plage affichee : ${rangeLabel}. Clique un point de partie pour ouvrir le replay.`;

  const statsEl = document.getElementById('elo-history-stats');
  if (statsEl && !animationFrameOnly) {
    const delta = Number(stats.delta || 0);
    const eloValues = drawable.map(point => Number(point.elo || 0)).filter(Number.isFinite);
    const minHistoryElo = eloValues.length ? Math.min(...eloValues) : Number(stats.minElo || data?.player?.elo || 0);
    const maxHistoryElo = eloValues.length ? Math.max(...eloValues) : Number(stats.maxElo || data?.player?.elo || 0);
    const avgHistoryElo = eloValues.length ? eloValues.reduce((sum, elo) => sum + elo, 0) / eloValues.length : Number(data?.player?.elo || 0);
    const variance = eloValues.length
      ? eloValues.reduce((sum, elo) => sum + Math.pow(elo - avgHistoryElo, 2), 0) / eloValues.length
      : 0;
    const stdDeviation = Math.sqrt(variance);
    const lowestPoint = drawable.reduce((best, point) => Number(point.elo || Infinity) < Number(best?.elo || Infinity) ? point : best, drawable[0] || null);
    const highestPoint = drawable.reduce((best, point) => Number(point.elo || -Infinity) > Number(best?.elo || -Infinity) ? point : best, drawable[0] || null);
    const deltaClass = delta > 0 ? 'color:#30d158' : delta < 0 ? 'color:#ff4d6d' : 'color:var(--muted)';
    const renderReplayStat = (point, value, label) => {
      const gameId = point?.gameId;
      const tag = gameId ? 'a' : 'div';
      const attrs = gameId
        ? `href="/replay/${encodeURIComponent(gameId)}" title="Ouvrir le replay #${escapeHtml(gameId)}"`
        : '';
      const cls = `elo-history-stat${gameId ? ' elo-history-stat-link' : ''}`;
      const suffix = gameId ? ` · Replay #${escapeHtml(gameId)}` : '';
      return `<${tag} class="${cls}" ${attrs}><strong>${Math.round(value)}</strong><span>${label}${suffix}</span></${tag}>`;
    };
    statsEl.innerHTML = `

    playerId: data.player?.id || '',
    pseudo: data.player?.pseudo || '',
    currentElo: data.player?.elo || '',
    eloBefore: Math.round(Number(point.beforeElo ?? point.elo ?? 0)),
    eloAfter: Math.round(Number(point.afterElo ?? point.elo ?? 0)),
    elo: Math.round(Number(point.elo || 0)),
    delta: Math.round(Number(point.delta || 0)),
    gameId: point.gameId || '',
    gameType: point.type || '',

    duration: point.duration || '',

function formatHistoryDateOnly(ms) {
  if (!ms) return '--';
  return new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: 'short', year: '2-digit' }).format(new Date(ms));
}

function formatHistoryDuration(seconds) {
  const total = Math.max(0, Math.round(Number(seconds || 0)));
  const minutes = Math.floor(total / 60);
  const rest = total % 60;
  if (minutes <= 0) return `${rest}s`;
  return `${minutes}m ${String(rest).padStart(2, '0')}s`;
}

function formatHistoryResult(result) {
  if (result === 'win') return 'Victoire';
  if (result === 'loss') return 'Defaite';
  if (result === 'draw') return 'Nul';
  return 'Point';
}

function getEloHistoryExportQuery() {
  const params = new URLSearchParams({ days: String(eloHistoryDays) });
  if (eloHistoryStartDate && eloHistoryEndDate) {
    params.set('start', eloHistoryStartDate);
    params.set('end', eloHistoryEndDate);
  }
  return params;
}

function eloHistoryRowsToCsv(rows) {
  const headers = [
    'index', 'date', 'playerId', 'pseudo', 'currentElo',
    'eloBefore', 'eloAfter', 'elo', 'delta',
    'gameId', 'gameType', 'result', 'moveCount', 'duration',
    'opponentId', 'opponentPseudo', 'opponentEloBefore', 'opponentCurrentElo',
    'label',
  ];
  const escapeCsv = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
  return [
    headers.join(','),
    ...rows.map(row => headers.map(key => escapeCsv(row[key])).join(',')),
  ].join('\n');
}

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function getEloHistoryExportFilename(format) {
  const pseudo = String(lastEloHistoryData?.player?.pseudo || currentPlayer?.pseudo || 'joueur')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9_-]+/gi, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40) || 'joueur';
  const days = lastEloHistoryData?.days || eloHistoryDays || 7;
  return `elo-history-${pseudo}-${days}j.${format === 'json' ? 'json' : 'csv'}`;
}

function getEloHistoryImageFilename() {
  const pseudo = String(lastEloHistoryData?.player?.pseudo || currentPlayer?.pseudo || 'joueur')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9_-]+/gi, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40) || 'joueur';
  const days = lastEloHistoryData?.days || eloHistoryDays || 7;
  return `elo-history-${pseudo}-${days}j.png`;
}

function downloadEloHistoryImage() {
  const canvas = document.getElementById('elo-history-canvas');
  if (!canvas || !lastEloHistoryData) {
    alert('Aucun graphique ELO a telecharger pour le moment.');
    return;
  }
  if (canvas.toBlob) {
    canvas.toBlob(blob => {
      if (!blob) return alert('Export image impossible.');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = getEloHistoryImageFilename();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
    return;
  }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = getEloHistoryImageFilename();
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function downloadEloHistoryExport(format = 'csv') {
  if (!currentPlayer?.id) {
    alert('Aucun joueur charge pour exporter le graphique ELO.');
    return;
  }
  const wantedFormat = format === 'json' ? 'json' : 'csv';
  try {
    const params = getEloHistoryExportQuery();
    params.set('format', wantedFormat);
    const res = await fetch(`/api/players/${encodeURIComponent(currentPlayer.id)}/elo-history/export?${params.toString()}`);
    if (!res.ok) throw new Error('export');
    const content = await res.text();
    downloadBlob(
      getEloHistoryExportFilename(wantedFormat),
      content,
      wantedFormat === 'json' ? 'application/json;charset=utf-8' : 'text/csv;charset=utf-8'
    );
  } catch {
    const rows = buildEloHistoryExportRows();
    if (!rows.length) {
      alert('Aucune donnee ELO a exporter pour le moment.');
      return;
    }
    const payload = wantedFormat === 'json'
      ? JSON.stringify({
          player: lastEloHistoryData?.player || null,
          days: lastEloHistoryData?.days || eloHistoryDays,
          generatedAt: new Date().toISOString(),
          stats: lastEloHistoryData?.stats || {},
          points: rows,
        }, null, 2)
      : eloHistoryRowsToCsv(rows);
    downloadBlob(
      getEloHistoryExportFilename(wantedFormat),
      payload,
      wantedFormat === 'json' ? 'application/json;charset=utf-8' : 'text/csv;charset=utf-8'
    );
  }
}

function handleEloHistoryMove(event) {
  const canvas = document.getElementById('elo-history-canvas');
  if (!canvas || !eloHistoryHitPoints.length) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.clientWidth / Math.max(1, rect.width);
  const scaleY = canvas.clientHeight / Math.max(1, rect.height);
  const mouseX = (event.clientX - rect.left) * scaleX;
  const mouseY = (event.clientY - rect.top) * scaleY;
  let nearest = null;
  let nearestDistance = Infinity;
  for (const point of eloHistoryHitPoints) {
    const distance = Math.hypot(point.x - mouseX, point.y - mouseY);
    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearest = point;
    }
  }
  if (nearest && nearestDistance <= 16) {
    canvas.style.cursor = 'pointer';
    showEloHistoryTooltip(nearest);
  } else {
    canvas.style.cursor = 'default';
    hideEloHistoryTooltip();
  }
}

function initEloHistoryHover() {
  const canvas = document.getElementById('elo-history-canvas');
  if (!canvas) return;
  if (canvas.dataset.eloHoverReady === '1') return;
  canvas.dataset.eloHoverReady = '1';
  eloHistoryHoverReady = true;
  canvas.addEventListener('mousemove', handleEloHistoryMove);
  canvas.addEventListener('mouseleave', () => {
    canvas.style.cursor = 'default';
    hideEloHistoryTooltip();
  });
  canvas.addEventListener('click', () => {
    if (eloHistoryActivePoint?.gameId) location.href = `/replay/${eloHistoryActivePoint.gameId}`;
  });
}

function initProfileSectionMenu() {
  const links = Array.from(document.querySelectorAll('[data-section-link]'));
  const sections = links.map(link => document.getElementById(link.dataset.sectionLink)).filter(Boolean);
  if (!links.length || !sections.length) return;

  const setActive = (id) => {
    links.forEach(link => {
      link.classList.toggle('active', link.dataset.sectionLink === id);
    });
  };

  links.forEach(link => {
    link.addEventListener('click', () => setActive(link.dataset.sectionLink));
  });

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(entry => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible?.target?.id) setActive(visible.target.id);
    }, {
      rootMargin: '-18% 0px -58% 0px',
      threshold: [0.2, 0.45, 0.7]
    });
    sections.forEach(section => observer.observe(section));
  }

  setActive(sections[0].id);
}

const GAMES_PER_PAGE = 10;
let _gamesData = [];
let _gamesPlayer = null;
let _gamesPage = 1;

function initGames(games, me) {
  _gamesData   = games;
  _gamesPlayer = me;
  _gamesPage   = 1;
  renderGamesPage();
}

function renderGamesPage() {
  const container = document.getElementById('games-list-container');
  const pagination = document.getElementById('games-pagination');
  if (!container) return;

  const total = _gamesData.length;
  const totalPages = Math.ceil(total / GAMES_PER_PAGE);
  const start = (_gamesPage - 1) * GAMES_PER_PAGE;
  const slice = _gamesData.slice(start, start + GAMES_PER_PAGE);

  container.innerHTML = total === 0
    ? '<div class="empty-state">Aucune partie jouée pour l\'instant.</div>'
    : slice.map(g => renderGameRow(g, _gamesPlayer)).join('');

  // Pagination
  if (totalPages <= 1) { pagination.style.display = 'none'; return; }
  pagination.style.display = 'flex';

  let html = '';
  // Bouton précédent
  html += `<button class="pg-btn" onclick="gotoPage(${_gamesPage - 1})" ${_gamesPage === 1 ? 'disabled' : ''}><</button>`;

  // Pages
  for (let p = 1; p <= totalPages; p++) {
    if (totalPages > 7 && p > 2 && p < totalPages - 1 && Math.abs(p - _gamesPage) > 1) {
      if (p === 3 || p === totalPages - 2) html += `<span style="color:var(--muted);padding:0 2px">...</span>`;
      continue;
    }
    html += `<button class="pg-btn ${p === _gamesPage ? 'active' : ''}" onclick="gotoPage(${p})">${p}</button>`;
  }

  // Bouton suivant
  html += `<button class="pg-btn" onclick="gotoPage(${_gamesPage + 1})" ${_gamesPage === totalPages ? 'disabled' : ''}>></button>`;

  pagination.innerHTML = html;
}

function gotoPage(p) {
  const totalPages = Math.ceil(_gamesData.length / GAMES_PER_PAGE);
  if (p < 1 || p > totalPages) return;
  _gamesPage = p;
  renderGamesPage();
  document.getElementById('panel-history').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderGameRow(g, me) {
    const isP1      = g.player1_id === me.id;
    const opponent  = isP1 ? g.p2_pseudo : g.p1_pseudo;
    const won       = g.winner_id === me.id;
    const isDraw    = g.winner_id === null;
    const rc        = isDraw ? 'draw' : (won ? 'win' : 'loss');
    const ri        = isDraw ? '<img src="/badges/stat-draw.webp" alt="Nulle">' : (won ? '<img src="/badges/stat-victory.webp" alt="Victoire">' : '<img src="/badges/stat-defeat.webp" alt="Défaite">');
    const eloChange = isP1 ? g.elo_p1 : g.elo_p2;
    const eloClass  = isDraw ? 'neu' : (eloChange >= 0 ? 'pos' : 'neg');
    const eloStr    = (eloChange >= 0 ? '+' : '') + eloChange + ' ELO';
    const typeLabel = String(g.game_type || 'ranked') === 'friendly' ? 'Amical' : 'Ranked';
    const typeBadge = `<div title="Type de partie" style="font-size:10px;letter-spacing:1px;background:${typeLabel === 'Amical' ? 'rgba(133,235,255,0.12)' : 'rgba(255,216,77,0.12)'};border:1px solid ${typeLabel === 'Amical' ? 'rgba(133,235,255,0.28)' : 'rgba(255,216,77,0.24)'};color:${typeLabel === 'Amical' ? '#85EBFF' : '#FFD84D'};padding:2px 7px;border-radius:5px;white-space:nowrap;">${typeLabel}</div>`;
    const reason = String(g.result_reason || '');
    const reasonText = isDraw
      ? (reason === 'agreement_draw' ? 'Nulle par accord' : 'Position nulle')
      : won
        ? (reason === 'resign' ? 'Victoire par abandon' : 'Victoire par alignement')
        : (reason === 'resign' ? 'Défaite par abandon' : 'Défaite par alignement');
    const reasonBadge = `<div title="Resultat detaille" style="font-size:10px;letter-spacing:1px;background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.12);color:rgba(238,238,245,0.74);padding:2px 7px;border-radius:5px;white-space:nowrap;">${reasonText}</div>`;
    const date      = g.finished_at
      ? new Date(g.finished_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '-';
    const suspBadge = g.suspicious ? `<div title="Double compte détecté — ELO non comptabilisé" style="font-size:10px;letter-spacing:1px;background:rgba(255,159,10,0.12);border:1px solid rgba(255,159,10,0.3);color:#ff9f0a;padding:2px 7px;border-radius:5px;white-space:nowrap;">Double compte</div>` : '';
  const archiveBadge = g.archived ? `<div style="font-size:10px;letter-spacing:1px;background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.25);color:#ff2d55;padding:2px 7px;border-radius:5px;white-space:nowrap;">Archivée</div>` : '';
  return `<a class="game-row" href="/replay/${g.id}">
      <div class="game-result ${rc}">${ri}</div>
      <div class="game-vs">vs <span>${opponent}</span></div>
      <div class="game-meta">
        <div class="game-elo-change ${eloClass}">${g.suspicious ? '±0 ELO' : eloStr}</div>
        ${typeBadge}
        ${reasonBadge}
        <div>${g.move_count} coups · ${g.duration}s</div>
        <div>${date}</div>
        ${suspBadge}
        ${archiveBadge}
      </div>
      <div class="replay-badge">Replay</div>
    </a>`;
}


function renderPlayers(players, emptyMsg) {

    canvas: document.getElementById('image-editor-canvas'),
    stage: document.getElementById('image-editor-stage'),
    frame: document.getElementById('image-editor-frame'),
    zoom: document.getElementById('image-editor-zoom'),
    zoomVal: document.getElementById('image-editor-zoom-val'),
  };
}

function getStageMetrics(mode) {
  if (mode === 'avatar') {
    return { width: 640, height: 420, cropWidth: 280, cropHeight: 280, outputWidth: 500, outputHeight: 500 };
  }
  if (mode === 'decoration') {
    return { width: 640, height: 420, cropWidth: 260, cropHeight: 260, outputWidth: 512, outputHeight: 512 };
  }
  if (mode === 'token') {
    return { width: 640, height: 420, cropWidth: 220, cropHeight: 220, outputWidth: 128, outputHeight: 128 };
  }
  return { width: 640, height: 420, cropWidth: 560, cropHeight: 186, outputWidth: 1500, outputHeight: 500 };
}

function getImageEditorCropRect(metrics = getStageMetrics(IMAGE_EDITOR.mode)) {
  return {
    left: (metrics.width - IMAGE_EDITOR.cropWidth) / 2,
    top: (metrics.height - IMAGE_EDITOR.cropHeight) / 2,
    width: IMAGE_EDITOR.cropWidth,
    height: IMAGE_EDITOR.cropHeight,
  };
}

function getImageEditorCanvasScale(canvas, metrics = getStageMetrics(IMAGE_EDITOR.mode)) {
  const rect = canvas?.getBoundingClientRect?.();
  return {
    x: rect?.width ? rect.width / metrics.width : 1,
    y: rect?.height ? rect.height / metrics.height : 1,
  };
}

function syncImageEditorFrame(metrics = getStageMetrics(IMAGE_EDITOR.mode)) {
  const { canvas, frame } = getImageEditorElements();
  if (!canvas || !frame) return;
  const crop = getImageEditorCropRect(metrics);
  const scale = getImageEditorCanvasScale(canvas, metrics);
  frame.className = 'image-editor-frame ' + IMAGE_EDITOR.mode;
  frame.style.left = `${crop.left * scale.x}px`;
  frame.style.top = `${crop.top * scale.y}px`;
  frame.style.width = `${crop.width * scale.x}px`;
  frame.style.height = `${crop.height * scale.y}px`;
}

function clampImageEditorOffsets() {
  if (!IMAGE_EDITOR.img) return;
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  const drawWidth = IMAGE_EDITOR.img.width * IMAGE_EDITOR.zoom;
  const drawHeight = IMAGE_EDITOR.img.height * IMAGE_EDITOR.zoom;
  const crop = getImageEditorCropRect(metrics);
  const cropLeft = crop.left;
  const cropTop = crop.top;
  const cropRight = cropLeft + IMAGE_EDITOR.cropWidth;
  const cropBottom = cropTop + IMAGE_EDITOR.cropHeight;

  if (drawWidth <= IMAGE_EDITOR.cropWidth) {
    IMAGE_EDITOR.offsetX = cropLeft + (IMAGE_EDITOR.cropWidth - drawWidth) / 2;
  } else {
    const minX = cropRight - drawWidth;
    const maxX = cropLeft;
    IMAGE_EDITOR.offsetX = Math.max(minX, Math.min(maxX, IMAGE_EDITOR.offsetX));
  }

  if (drawHeight <= IMAGE_EDITOR.cropHeight) {
    IMAGE_EDITOR.offsetY = cropTop + (IMAGE_EDITOR.cropHeight - drawHeight) / 2;
  } else {
    const minY = cropBottom - drawHeight;
    const maxY = cropTop;
    IMAGE_EDITOR.offsetY = Math.max(minY, Math.min(maxY, IMAGE_EDITOR.offsetY));
  }
}

function syncImageEditorZoomLabel() {
  const { zoom, zoomVal } = getImageEditorElements();
  if (zoomVal && zoom) zoomVal.textContent = `${Math.round(Number(zoom.value || 0))}%`;
}

function drawImageEditor() {
  const { canvas } = getImageEditorElements();
  if (!canvas || !IMAGE_EDITOR.img) return;
  const ctx = canvas.getContext('2d');
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  canvas.width = metrics.width;
  canvas.height = metrics.height;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0b0b18';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const crop = getImageEditorCropRect(metrics);
  const cropLeft = crop.left;
  const cropTop = crop.top;
  const drawWidth = IMAGE_EDITOR.img.width * IMAGE_EDITOR.zoom;
  const drawHeight = IMAGE_EDITOR.img.height * IMAGE_EDITOR.zoom;
  ctx.drawImage(IMAGE_EDITOR.img, IMAGE_EDITOR.offsetX, IMAGE_EDITOR.offsetY, drawWidth, drawHeight);

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.rect(0, 0, canvas.width, canvas.height);
  if (IMAGE_EDITOR.mode === 'avatar' || IMAGE_EDITOR.mode === 'decoration') {
    ctx.moveTo(cropLeft + IMAGE_EDITOR.cropWidth, cropTop + IMAGE_EDITOR.cropHeight / 2);
    ctx.arc(cropLeft + IMAGE_EDITOR.cropWidth / 2, cropTop + IMAGE_EDITOR.cropHeight / 2, IMAGE_EDITOR.cropWidth / 2, 0, Math.PI * 2, true);
  } else {
    ctx.roundRect(cropLeft, cropTop, IMAGE_EDITOR.cropWidth, IMAGE_EDITOR.cropHeight, 18);
  }
  ctx.fill('evenodd');
  ctx.restore();

  requestAnimationFrame(() => syncImageEditorFrame(metrics));
  syncImageEditorZoomLabel();
}

function updateImageEditorZoom(value) {
  const sliderValue = Math.max(0, Math.min(100, Number(value)));
  const ratio = sliderValue / 100;
  const previousZoom = IMAGE_EDITOR.zoom || IMAGE_EDITOR.minZoom || 1;
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  const crop = getImageEditorCropRect(metrics);
  const focusX = crop.left + crop.width / 2;
  const focusY = crop.top + crop.height / 2;
  const imageFocusX = (focusX - IMAGE_EDITOR.offsetX) / previousZoom;
  const imageFocusY = (focusY - IMAGE_EDITOR.offsetY) / previousZoom;
  IMAGE_EDITOR.zoom = IMAGE_EDITOR.minZoom + (IMAGE_EDITOR.maxActualZoom - IMAGE_EDITOR.minZoom) * ratio;
  IMAGE_EDITOR.offsetX = focusX - imageFocusX * IMAGE_EDITOR.zoom;
  IMAGE_EDITOR.offsetY = focusY - imageFocusY * IMAGE_EDITOR.zoom;
  clampImageEditorOffsets();
  drawImageEditor();
}

function openImageEditor(dataUrl, mode) {
  PROFIL_SFX.popupOpen();
  const els = getImageEditorElements();
  const metrics = getStageMetrics(mode);
  IMAGE_EDITOR.mode = mode;
  IMAGE_EDITOR.dataUrl = dataUrl;
  IMAGE_EDITOR.cropWidth = metrics.cropWidth;
  IMAGE_EDITOR.cropHeight = metrics.cropHeight;
  IMAGE_EDITOR.outputWidth = metrics.outputWidth;
  IMAGE_EDITOR.outputHeight = metrics.outputHeight;

  const img = new Image();
  img.onload = () => {
    IMAGE_EDITOR.img = img;
    IMAGE_EDITOR.coverZoom = Math.max(metrics.cropWidth / img.width, metrics.cropHeight / img.height);
    IMAGE_EDITOR.minZoom = IMAGE_EDITOR.coverZoom;
    IMAGE_EDITOR.maxActualZoom = Math.max(IMAGE_EDITOR.coverZoom * 3, IMAGE_EDITOR.coverZoom + 1, 1);
    IMAGE_EDITOR.zoom = IMAGE_EDITOR.coverZoom;
    const crop = getImageEditorCropRect(metrics);
    IMAGE_EDITOR.offsetX = crop.left + (crop.width - img.width * IMAGE_EDITOR.zoom) / 2;
    IMAGE_EDITOR.offsetY = crop.top + (crop.height - img.height * IMAGE_EDITOR.zoom) / 2;
    clampImageEditorOffsets();

    if (els.zoom) {
      els.zoom.min = 0;
      els.zoom.max = 100;
      els.zoom.value = 0;
    }
    if (els.title) els.title.textContent = mode === 'avatar'
      ? "Ajuster l'avatar"
      : mode === 'decoration'
        ? "Ajuster la décoration"
      : mode === 'token'
        ? "Ajuster l'emoji VIP"
        : 'Ajuster la banniere';
    if (els.sub) els.sub.textContent = mode === 'avatar'
      ? 'Zoomez et deplacez votre avatar avant validation.'
      : mode === 'decoration'
        ? 'Placez votre décoration autour de l avatar avant validation.'
      : mode === 'token'
        ? 'Recadrez votre emoji VIP en 128x128 avant validation.'
        : 'Placez votre banniere exactement comme vous le souhaitez.';
    if (els.bg) {
      els.bg.classList.add('show');
      els.bg.setAttribute('aria-hidden', 'false');
    }
    drawImageEditor();
  };
  img.onerror = () => {
    PROFIL_SFX.error();
    alert('Image illisible. Essaie avec un autre fichier.');
  };
  img.src = dataUrl;
}

function closeImageEditor() {
  PROFIL_SFX.popupClose();
  const { bg } = getImageEditorElements();
  if (bg) {
    bg.classList.remove('show');
    bg.setAttribute('aria-hidden', 'true');
  }
  IMAGE_EDITOR.dragging = false;
  IMAGE_EDITOR.file = null;
  IMAGE_EDITOR.img = null;
}

function exportImageEditor() {
  const canvas = document.createElement('canvas');
  canvas.width = IMAGE_EDITOR.outputWidth;
  canvas.height = IMAGE_EDITOR.outputHeight;
  const ctx = canvas.getContext('2d');
  const metrics = getStageMetrics(IMAGE_EDITOR.mode);
  const crop = getImageEditorCropRect(metrics);
  const scaleX = IMAGE_EDITOR.outputWidth / IMAGE_EDITOR.cropWidth;
  const scaleY = IMAGE_EDITOR.outputHeight / IMAGE_EDITOR.cropHeight;
  const drawWidth = IMAGE_EDITOR.img.width * IMAGE_EDITOR.zoom * scaleX;
  const drawHeight = IMAGE_EDITOR.img.height * IMAGE_EDITOR.zoom * scaleY;
  const offsetX = (IMAGE_EDITOR.offsetX - crop.left) * scaleX;
  const offsetY = (IMAGE_EDITOR.offsetY - crop.top) * scaleY;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (IMAGE_EDITOR.mode === 'banner') {
    ctx.fillStyle = '#0b0b18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (IMAGE_EDITOR.mode === 'avatar' || IMAGE_EDITOR.mode === 'decoration') {
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, 0, Math.PI * 2);
    ctx.clip();
  }
  ctx.drawImage(IMAGE_EDITOR.img, offsetX, offsetY, drawWidth, drawHeight);
  return IMAGE_EDITOR.mode === 'banner'
    ? canvas.toDataURL('image/jpeg', 0.92)
    : canvas.toDataURL('image/png');
}

async function refreshDiscordMediaFromChooser() {
  const target = uploadChooserTarget === 'banner' ? 'banner' : 'avatar';
  const token = getStoredSessionToken();
  const btn = document.getElementById('upload-discord-refresh-btn');
  if (!token) return alert('Connecte-toi pour rafraîchir depuis Discord.');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Rafraîchissement...';
  }
  try {
    const res = await fetch(target === 'banner' ? '/api/me/discord-banner/refresh' : '/api/me/discord-avatar/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': token },
      body: JSON.stringify({ token }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Impossible de rafraîchir depuis Discord.');
    const freshPlayer = data.player || {};

    if (target === 'banner') {
      const banner = data.banner || freshPlayer.banner || '';
      const renderSrc = getRenderableMediaSrc(banner);
      const bannerEl = document.querySelector('.profile-banner');
      if (bannerEl && renderSrc) {
        bannerEl.innerHTML = '<img src="' + renderSrc + '" alt="banniere"><div class="profile-banner-overlay">Modifier</div>';
        bannerEl.onclick = () => openUploadChooser('banner');
      }
    } else {
      const avatar = data.avatar || freshPlayer.avatar || '';
      const renderSrc = getRenderableMediaSrc(avatar);
      const avatarHtml = renderSrc
        ? '<img src="' + renderSrc + '" alt="avatar">'
        : (freshPlayer.pseudo || currentPlayer?.pseudo || '?').slice(0, 1).toUpperCase();
      const el = document.getElementById('avatar-el');
      if (el) el.innerHTML = avatarHtml;
      const base = document.getElementById('avatar-decoration-base');
      if (base) base.innerHTML = avatarHtml;
      const modalBase = document.getElementById('avatar-decoration-modal-base');
      if (modalBase) modalBase.innerHTML = avatarHtml;
    }

    if (freshPlayer.id) applyFreshPlayerPatch(freshPlayer);
    else if (target === 'banner') syncStoredPlayerPatch({ banner: data.banner || '' });
    else syncStoredPlayerPatch({ avatar: data.avatar || '' });
    PROFIL_SFX.success();
    loadDiscordInfo();
    closeUploadChooser();
  } catch (e) {
    PROFIL_SFX.error();
    alert(e.message || 'Erreur Discord.');
    if (btn) {
      btn.disabled = false;
      btn.textContent = target === 'banner'
        ? 'Rafraîchir Bannière Discord'
        : 'Rafraîchir Avatar Discord';
    }
  }
}

function resizeCursorImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 32, 32);
      const scale = Math.min(32 / image.width, 32 / image.height);
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(image, (32 - width) / 2, (32 - height) / 2, width, height);
      resolve(canvas.toDataURL('image/png'));
    };
    image.onerror = () => reject(new Error('Image illisible.'));
    image.src = dataUrl;
  });
}

async function handleCustomCursorUpload(input) {
  const file = input?.files?.[0];
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) {
    input.value = '';
    return alert('Choisis une image PNG, JPG ou WEBP.');
  }
  if (file.size > 2 * 1024 * 1024) {
    input.value = '';
    return alert('Image trop lourde (max 2 Mo avant conversion).');
  }
  try {
    const source = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new Error('Lecture impossible.'));
      reader.readAsDataURL(file);
    });
    await saveCustomCursor(await resizeCursorImage(source));
  } catch (error) {
    alert(error.message || 'Impossible de creer le curseur.');
  } finally {
    input.value = '';
  }
}

function renderAvatarDecorationGallery(player = currentPlayer) {
  const gallery = document.getElementById('avatar-decoration-gallery');
  if (!gallery) return;
  const currentValue = String(player?.avatar_decoration || '');
  const selectedValue = pendingAvatarDecoration === null ? currentValue : String(pendingAvatarDecoration || '');
  const tiers = [
    { key: 'common', label: 'Commun', icon: '◆', color: '#8e8e93' },
    { key: 'rare', label: 'Rare', icon: '✦', color: '#5ac8fa' },
    { key: 'epic', label: 'Epique', icon: '✧', color: '#bf5af2' },
    { key: 'legendary', label: 'Legendaire', icon: '✹', color: '#ffd60a' },
    { key: 'mythic', label: 'Mythique', icon: '✺', color: '#ff2d55' },
  ];
  const tierForIndex = index => {
    if (index % 17 === 0) return tiers[4];
    if (index % 9 === 0) return tiers[3];
    if (index % 5 === 0) return tiers[2];
    if (index % 2 === 0) return tiers[1];
    return tiers[0];
  };
  const cards = [
    `<div class="avatar-decoration-tier" style="--tier-color:#8e8e93"><span>◇</span>Aucune</div>`,
    `<button type="button" class="avatar-decoration-option ${selectedValue === '' ? 'active' : ''}" style="${rarityStyle('common')}" onclick="selectAvatarDecoration('')" title="Aucune décoration">
      <span class="avatar-decoration-option-none">Aucune</span>
    </button>`
  ];
  const grouped = new Map(tiers.map(tier => [tier.key, []]));
  avatarDecorationLibrary.forEach((src, index) => grouped.get(tierForIndex(index + 1).key)?.push(src));
  for (const tier of tiers) {
    const items = grouped.get(tier.key) || [];
    if (!items.length) continue;
    cards.push(`<div class="avatar-decoration-tier" style="--tier-color:${tier.color}"><span>${tier.icon}</span>${tier.label}</div>`);
    for (const src of items) {
      const active = selectedValue === src ? 'active' : '';
      const unlocked = ownsProfileCosmetic('decoration', src, player);
      const pack = getProfileCosmeticPack('decoration', src);
      const locked = unlocked ? '' : 'locked';
      cards.push(`<button type="button" class="avatar-decoration-option ${active} ${locked}" style="${rarityStyle(tier.key)}" ${unlocked ? `onclick="selectAvatarDecoration('${src}')"` : 'disabled'} title="${unlocked ? tier.label : `🔒 ${pack?.label || 'Pack boutique requis'}`}">

(function initImageEditor() {
  const { bg, canvas, zoom } = getImageEditorElements();
  if (!bg || !canvas || !zoom) return;

  zoom.addEventListener('input', () => updateImageEditorZoom(zoom.value));

  const getPoint = (event) => {
    const src = event.touches ? event.touches[0] : event;
    return { x: src.clientX, y: src.clientY };
  };

  const startDrag = (event) => {
    if (!IMAGE_EDITOR.img) return;
    const point = getPoint(event);
    IMAGE_EDITOR.dragging = true;
    IMAGE_EDITOR.dragStartX = point.x;
    IMAGE_EDITOR.dragStartY = point.y;
    IMAGE_EDITOR.startOffsetX = IMAGE_EDITOR.offsetX;
    IMAGE_EDITOR.startOffsetY = IMAGE_EDITOR.offsetY;
    canvas.classList.add('dragging');
    event.preventDefault();
  };

  const moveDrag = (event) => {
    if (!IMAGE_EDITOR.dragging) return;
    const point = getPoint(event);
    const metrics = getStageMetrics(IMAGE_EDITOR.mode);
    const scale = getImageEditorCanvasScale(canvas, metrics);
    IMAGE_EDITOR.offsetX = IMAGE_EDITOR.startOffsetX + (point.x - IMAGE_EDITOR.dragStartX) / (scale.x || 1);
    IMAGE_EDITOR.offsetY = IMAGE_EDITOR.startOffsetY + (point.y - IMAGE_EDITOR.dragStartY) / (scale.y || 1);
    clampImageEditorOffsets();
    drawImageEditor();
    event.preventDefault();
  };

  const stopDrag = () => {
    IMAGE_EDITOR.dragging = false;
    canvas.classList.remove('dragging');
  };

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('touchmove', moveDrag, { passive: false });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('touchend', stopDrag);
  window.addEventListener('resize', () => {
    if (IMAGE_EDITOR.img) syncImageEditorFrame();
  });

  bg.addEventListener('click', (event) => {
    if (event.target === bg) closeImageEditor();
  });

  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && bg.classList.contains('show')) closeImageEditor();
  });
})();

let _acTimer = null;
let _acIndex = -1;
let _acResults = [];

function setAutocompleteOpen(open) {
  const list = document.getElementById('autocomplete-list');
  if (list) list.style.display = open ? 'block' : 'none';
  document.body.classList.toggle('search-open', !!open);
}

async function onSearchInput(val) {
  const list = document.getElementById('autocomplete-list');
  _acIndex = -1;
  clearTimeout(_acTimer);
  if (val.length < 3) { setAutocompleteOpen(false); _acResults = []; return; }
  _acTimer = setTimeout(async () => {
    try {
      const includeBots = document.getElementById('search-include-bots')?.checked ? '1' : '0';
      const res = await fetch(`/api/players/search?q=${encodeURIComponent(val)}&includeBots=${includeBots}`);
      if (!res.ok) { setAutocompleteOpen(false); return; }
      _acResults = await res.json();
      renderAcList(_acResults);
    } catch(e) {
      console.error('[autocomplete]', e);
      setAutocompleteOpen(false);
    }
  }, 200);
}

function renderAcList(players) {
  const list = document.getElementById('autocomplete-list');
  if (!players.length) {
    list.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--muted);">Aucun pseudo trouvé</div>';
    setAutocompleteOpen(true);
    return;
  }
  list.innerHTML = players.map((p, i) => {
    const color = p.color || '#ff2d55';
    const av = p.avatar
      ? `<img src="${getRenderableMediaSrc(p.avatar)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">`
      : `<div style="width:28px;height:28px;border-radius:50%;background:${color}22;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:${color};">${p.pseudo[0].toUpperCase()}</div>`;
    return `<div class="ac-item" data-index="${i}" onclick="selectAc(${i})">
      <div style="position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:100%">
        ${av}
        <span style="font-weight:600;font-size:13px;flex:1;">${escapeHtml(p.pseudo)}${Number(p.is_bot || 0) === 1 ? '<span class="mini-bot-badge">BOT</span>' : ''}</span>
        <span style="font-size:11px;color:var(--muted);">${p.elo} ELO</span>
      </div>
    </div>`;
  }).join('');

}

function selectAc(i) {
  const p = _acResults[i];
  if (!p) return;
  document.getElementById('search-input').value = p.pseudo;
  setAutocompleteOpen(false);
  searchPlayer();
}

function onSearchKey(e) {
  const list = document.getElementById('autocomplete-list');
  const items = list.querySelectorAll('.ac-item');
  if (!items.length) { if (e.key === 'Enter') searchPlayer(); return; }
  if (e.key === 'ArrowDown')  { e.preventDefault(); _acIndex = Math.min(_acIndex+1, items.length-1); highlightAc(items); }
  else if (e.key === 'ArrowUp')   { e.preventDefault(); _acIndex = Math.max(_acIndex-1, -1);             highlightAc(items); }
  else if (e.key === 'Enter')     { e.preventDefault(); _acIndex >= 0 ? selectAc(_acIndex) : searchPlayer(); }
  else if (e.key === 'Escape')    { setAutocompleteOpen(false); _acIndex = -1; }
}

function highlightAc(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === _acIndex));
  if (_acIndex >= 0 && _acResults[_acIndex]) document.getElementById('search-input').value = _acResults[_acIndex].pseudo;
}

async function openOwnedBooster(kind) {
  if (isOwnProfile && !Object.keys(profileShopInventory || {}).length) {
    await loadProfileShopInventory();
  }
  const counts = getProfileBoosterCounts();
  if (kind === 'elo' && counts.elo <= 0) return;
  if (kind === 'coins' && counts.coins <= 0) return;
  if (kind === 'global' && counts.global <= 0) return;
  const entries = getProfileBoosterEntries(kind);
  if (!entries.length) return;
  const active = profileActiveBoosters?.[kind];
  const activeText = active
    ? `\n\nActif actuellement : ${active.label || active.itemKey} jusqu'a ${new Date(Number(active.expiresAt || 0)).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}.`
    : '';
  const list = entries
    .map((entry, index) => `${index + 1}. ${entry.meta.label} (${entry.qty} dispo)`)
    .join('\n');
  const title = kind === 'elo' ? 'Booster ELO' : kind === 'coins' ? 'Booster Coins' : 'Booster Global';
  const picked = prompt(`${title} disponible(s) :\n${list}${activeText}\n\nTape le numero du booster a activer pendant 2h :`);
  if (picked === null) return;
  const index = Math.trunc(Number(picked)) - 1;
  const entry = entries[index];
  if (!entry) return alert('Choix invalide.');
  activateOwnedBooster(entry.key, entry.meta);
}

    const player = await res.json();
    if (Number(player.is_bot || 0) === 1 && !document.getElementById('search-include-bots')?.checked) throw new Error();

    // Afficher le résultat
    const color   = player.color || '#ff2d55';
    const total   = (player.wins||0) + (player.losses||0) + (player.draws||0);
    const wr      = total > 0 ? Math.round(((player.wins||0)/total)*100) : 0;
    const avatar  = document.getElementById('sr-avatar');

    avatar.style.background = color + '22';
    avatar.style.border = `2px solid ${color}`;
    avatar.style.color  = color;
    avatar.innerHTML    = avatarSrc
      ? `<img src="${avatarSrc}" style="width:100%;height:100%;object-fit:cover">`
      : player.pseudo[0].toUpperCase();

    document.getElementById('sr-pseudo').innerHTML = `${escapeHtml(player.pseudo)}${Number(player.is_bot || 0) === 1 ? '<span class="mini-bot-badge">BOT</span>' : ''}`;
    document.getElementById('sr-stats').innerHTML    = renderResultMiniStats(player.wins, player.losses, player.draws, wr);
    document.getElementById('sr-elo').textContent    = player.elo;
    document.getElementById('search-result').href    = `/profil?id=${player.id}`;
    result.classList.add('show');

  } catch {
    error.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Chercher';
  }
}

function extractYouTubeId(value) {
  const raw = String(value || '').trim();
  if (/^youtube:[a-zA-Z0-9_-]{6,20}$/.test(raw)) return raw.slice(8);
  const match = raw.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,20})/);
  return match ? match[1] : '';
}

function normalizeCustomQueueMusicValue(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const youtubeId = extractYouTubeId(raw);
  if (youtubeId) return `youtube:${youtubeId}`;
  if (/^https:\/\/[^\s"'<>]+$/i.test(raw)) return `audio:${raw}`;
  if (/^audio:https:\/\/[^\s"'<>]+$/i.test(raw)) return raw;
  return '';
}

function openQueueMusicDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('p4-profile-media', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('files');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveLocalQueueMusicBlob(file) {
  const db = await openQueueMusicDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put({ blob: file, name: file.name, type: file.type, savedAt: Date.now() }, 'queue_music');
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

async function loadLocalQueueMusicObjectUrl() {
  const db = await openQueueMusicDb();
  const entry = await new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readonly');
    const request = tx.objectStore('files').get('queue_music');
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
  });
  db.close();
  return entry?.blob ? URL.createObjectURL(entry.blob) : '';
}

function formatQueueMusicLabel(src) {
  if (!src) return 'Aucune musique personnalisée';
  if (typeof src === 'object' && src !== null) return String(src.label || src.src || '');
  if (String(src).startsWith('youtube:')) return `YouTube (${String(src).slice(8)})`;
  if (String(src).startsWith('audio:')) return `Audio URL - ${formatQueueMusicLabel(String(src).slice(6))}`;
  if (String(src) === 'local:custom') return 'Fichier local du navigateur';
  const file = String(src).split('/').pop() || src;
  return decodeURIComponent(file.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '));
}

function normalizeQueueMusicEntry(entry) {
  if (!entry) return null;
  if (typeof entry === 'string') {
    return {
      src: entry,
      label: formatQueueMusicLabel(entry),
      theme: 'autre',
      themeLabel: 'Autre',
    };
  }
  return {
    src: String(entry.src || ''),
    label: String(entry.label || formatQueueMusicLabel(entry.src || '')),
    theme: String(entry.theme || 'autre'),
    themeLabel: String(entry.themeLabel || 'Autre'),
  };
}

async function renderQueueMusicPicker(player = currentPlayer) {
  const card = document.getElementById('queue-music-card');
  const select = document.getElementById('queue-music-select');
  const themeSelect = document.getElementById('queue-music-theme-select');
  const meta = document.getElementById('queue-music-meta');
  const btn = document.getElementById('queue-music-save-btn');
  if (!card || !select || !themeSelect || !meta || !btn) return;
  const canEdit = isPerso(player) || isAdminTier(player);
  const currentValue = String(player?.queue_music || '');
  card.style.display = canEdit ? 'flex' : 'none';
  if (!canEdit) return;
  if (!queueMusicLibraryLoaded) await loadQueueMusicLibrary();
  const entries = queueMusicLibrary
    .map(normalizeQueueMusicEntry)
    .filter(Boolean);
  const themeOptions = [`<option value="all">Tous les thèmes</option>`]
    .concat(queueMusicThemes.map(theme => `<option value="${escapeHtml(theme.id)}">${escapeHtml(theme.label)} (${Number(theme.count || 0)})</option>`));
  const previousTheme = String(themeSelect.value || 'all');
  themeSelect.innerHTML = themeOptions.join('');
  themeSelect.value = queueMusicThemes.some(theme => theme.id === previousTheme) ? previousTheme : 'all';
  const filteredEntries = themeSelect.value === 'all'
    ? entries
    : entries.filter(entry => entry.theme === themeSelect.value);
  const options = [`<option value="">Musique par défaut du site • Musique Chambre</option>`]
    .concat(filteredEntries.map(entry => `<option value="${entry.src}" ${entry.src === currentValue ? 'selected' : ''}>${escapeHtml(entry.themeLabel)} • ${escapeHtml(entry.label)}</option>`));
  if (currentValue && !entries.some(entry => entry.src === currentValue)) {
    options.push(`<option value="${escapeHtml(currentValue)}" selected>Personnalisée • ${escapeHtml(formatQueueMusicLabel(currentValue))}</option>`);
  }
  select.innerHTML = options.join('');
  meta.textContent = currentValue
    ? `Musique active : ${formatQueueMusicLabel(entries.find(entry => entry.src === currentValue) || currentValue)}`
    : `Musique active : Musique Chambre. ${entries.length} pistes courtes sont disponibles dans ${queueMusicThemes.length || 0} thèmes.`;
  btn.disabled = false;
  const previewBtn = document.getElementById('queue-music-preview-btn');
  if (previewBtn) previewBtn.disabled = !String(select.value || '');
}

  }
  if (select) select.value = value;
  previewQueueMusicChoice(value);
}

function formatQueueMusicDuration(ms) {
  const total = Math.max(0, Math.round(Number(ms || 0) / 1000));
  const minutes = Math.floor(total / 60);
  const seconds = String(total % 60).padStart(2, '0');
  return total ? `${minutes}:${seconds}` : '--:--';
}

function scheduleQueueMusicSearch(value) {
  if (queueMusicSearchTimer) clearTimeout(queueMusicSearchTimer);
  const q = String(value || '').trim();
  if (q.length < 2) {
    renderQueueMusicSearchResults([]);
    return;
  }
  queueMusicSearchTimer = setTimeout(() => searchQueueMusicNow(), 450);
}

function renderQueueMusicSearchResults(tracks, error = '') {
  const box = document.getElementById('queue-music-search-results');
  if (!box) return;
  if (error) {
    box.innerHTML = `<div style="padding:12px 14px;color:#ff6b88;font-size:12px">${escapeHtml(error)}</div>`;
    box.classList.add('show');
    return;
  }
  if (!tracks.length) {
    box.innerHTML = '';
    box.classList.remove('show');
    return;
  }
  box.innerHTML = tracks.map(track => {
    const payload = encodeURIComponent(JSON.stringify({
      value: track.value,
      title: track.title,
      author: track.author,
    }));
    return `
    <button class="queue-music-result" type="button" onclick="selectQueueMusicSearchResult(decodeURIComponent('${payload}'))">
      ${track.artworkUrl ? `<img class="queue-music-thumb" src="${escapeHtml(track.artworkUrl)}" alt="">` : '<div class="queue-music-thumb"></div>'}
      <span style="min-width:0">
        <span class="queue-music-result-title">${escapeHtml(track.title)}</span>
        <span class="queue-music-result-meta">${escapeHtml(track.author)} · ${formatQueueMusicDuration(track.durationMs)}</span>
      </span>
      <span class="queue-music-result-pick">Choisir</span>
    </button>
  `;
  }).join('');
  box.classList.add('show');
}

async function searchQueueMusicNow() {
  if (queueMusicSearchTimer) {
    clearTimeout(queueMusicSearchTimer);
    queueMusicSearchTimer = null;
  }
  const input = document.getElementById('queue-music-search-input');
  const btn = document.getElementById('queue-music-search-btn');
  const q = String(input?.value || '').trim();
  if (q.length < 2) return renderQueueMusicSearchResults([]);
  const token = getStoredSessionToken();
  if (!token) return renderQueueMusicSearchResults([], 'Connecte-toi pour rechercher.');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Recherche...';
  }
  try {
    const res = await fetch(`/api/queue-music/search?q=${encodeURIComponent(q)}`, {
      headers: { 'x-session-token': token },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Recherche indisponible.');
    renderQueueMusicSearchResults(Array.isArray(data.tracks) ? data.tracks : []);
  } catch (e) {
    renderQueueMusicSearchResults([], e.message || 'Recherche impossible.');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Rechercher';
    }
  }
}

function selectQueueMusicSearchResult(payload) {
  let track = {};
  try { track = JSON.parse(String(payload || '{}')); } catch(e) {}
  const value = String(track.value || '');
  const title = String(track.title || 'Musique YouTube');
  const author = String(track.author || '');
  const select = document.getElementById('queue-music-select');
  const label = `YouTube • ${title}${author ? ' - ' + author : ''}`;
  if (select && !Array.from(select.options).some(option => option.value === value)) {
    select.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`);
  }
  if (select) select.value = value;
  renderQueueMusicSearchResults([]);
  previewQueueMusicChoice(value);
  PROFIL_SFX.click();
}

async function useLocalQueueMusicFile(file) {
  if (!file) return;
  if (!/^audio\//i.test(file.type || '')) {
    PROFIL_SFX.error();
    alert('Choisis un fichier audio.');
    return;
  }
  if (file.size > 15 * 1024 * 1024) {
    PROFIL_SFX.error();
    alert('Fichier trop lourd. Vise 15 Mo max pour éviter de saturer le navigateur.');
    return;
  }
  try {
    await saveLocalQueueMusicBlob(file);
    const select = document.getElementById('queue-music-select');
    if (select && !Array.from(select.options).some(option => option.value === 'local:custom')) {
      select.insertAdjacentHTML('beforeend', '<option value="local:custom">Personnalisée • Fichier local</option>');
    }
    if (select) select.value = 'local:custom';
    previewQueueMusicChoice('local:custom');
    PROFIL_SFX.upload();
  } catch (e) {
    PROFIL_SFX.error();
    alert('Impossible de garder ce fichier dans le navigateur.');
  }

function stopQueueMusicPreview() {
  if (queueMusicPreviewTimer) {
    clearTimeout(queueMusicPreviewTimer);
    queueMusicPreviewTimer = null;
  }
  if (queueMusicPreviewFrame) {
    queueMusicPreviewFrame.remove();
    queueMusicPreviewFrame = null;
  }
  if (queueMusicPreviewAudio) {
    queueMusicPreviewAudio.pause();
    queueMusicPreviewAudio.currentTime = 0;
    queueMusicPreviewAudio = null;
  }
  const previewBtn = document.getElementById('queue-music-preview-btn');
  if (previewBtn) previewBtn.textContent = 'Play 15s';
}

async function toggleQueueMusicPreview() {
  const select = document.getElementById('queue-music-select');
  const value = String(select?.value || '');
  if (!value) return;
  const previewBtn = document.getElementById('queue-music-preview-btn');
  if (queueMusicPreviewAudio) {
    stopQueueMusicPreview();
    return;
  }
  if (queueMusicPreviewFrame) {
    stopQueueMusicPreview();
    return;
  }
  let src = value;
  if (value.startsWith('audio:')) src = value.slice(6);
  if (value === 'local:custom') src = await loadLocalQueueMusicObjectUrl().catch(() => '');
  if (value.startsWith('youtube:')) {
    const videoId = value.slice(8);
    queueMusicPreviewAudio = new Audio(`/api/queue-music/lavalink-stream/${encodeURIComponent(videoId)}`);
    queueMusicPreviewAudio.volume = 0.55;
    queueMusicPreviewAudio.currentTime = 0;
    queueMusicPreviewAudio.play().catch(() => {
      stopQueueMusicPreview();
      alert('Lavalink a trouve la musique, mais ne fournit pas de flux audio web lisible pour cette video.');
    });
    queueMusicPreviewTimer = setTimeout(() => stopQueueMusicPreview(), 15000);
    if (previewBtn) previewBtn.textContent = 'Stop';
    return;
  }
  if (!src) return;
  queueMusicPreviewAudio = new Audio(src);
  queueMusicPreviewAudio.volume = 0.55;
  queueMusicPreviewAudio.currentTime = 0;
  queueMusicPreviewAudio.play().catch(() => {
    stopQueueMusicPreview();
  });
  queueMusicPreviewTimer = setTimeout(() => {

  }, 15000);
  if (previewBtn) previewBtn.textContent = 'Stop';
}

function formatLastSeen(ts) {
  if (!ts) return 'Jamais connecté';
  const diff = Date.now() - ts;
  const s = Math.floor(diff / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const d = Math.floor(h / 24);
  const mo = Math.floor(d / 30);
  const y = Math.floor(d / 365);
  if (s < 60)  return 'Il y a quelques secondes';
  if (m < 60)  return `Il y a ${m} minute${m>1?'s':''}`;
  if (h < 24)  return `Il y a ${h} heure${h>1?'s':''}`;
  if (d < 30)  return `Il y a ${d} jour${d>1?'s':''}`;
  if (mo < 12) return `Il y a ${mo} mois`;
  return `Il y a ${y} an${y>1?'s':''}`;
}

// ── Simulateur ELO ───────────────────────────────────────────────────────────
// Table des rangs (miroir de rank.js côté client)
const RANKS_SIM = [
  { name:'Malachite', key:'Malachite', color:'#2ecc71', min:100,  max:699 },
  { name:'Quartz',    key:'Quartz',    color:'#b0bec5', min:700,  max:1299 },
  { name:'Ambre',     key:'Ambre',     color:'#cd7f32', min:1300, max:1799 },
  { name:'Jade',      key:'Jade',      color:'#1abc9c', min:1800, max:2299 },
  { name:'Saphir',    key:'Saphir',    color:'#3498db', min:2300, max:2799 },
  { name:'Améthyste', key:'Amethiste', color:'#9b59b6', min:2800, max:3500 },
];
const LEVEL_NAMES = ['I','II','III','IV','V'];

function getSimRank(elo) {
  const r = RANKS_SIM.find(r => elo >= r.min && elo <= r.max)
         || (elo < 100 ? RANKS_SIM[0] : RANKS_SIM[RANKS_SIM.length-1]);
  const span   = r.max - r.min;
  const perLvl = span / 5;
  const level  = Math.min(4, Math.floor((elo - r.min) / perLvl));
  const prog   = Math.round(((elo - r.min - level * perLvl) / perLvl) * 100);
  const next   = r.max < 3500 ? r.max + 1 : null;
  const label = r.name + ' ' + LEVEL_NAMES[level];
  return { ...r, level, levelName: LEVEL_NAMES[level], label, displayLabel: label, progress: Math.min(100, prog), next };
}

  PROFIL_SFX.popupOpen();

function updateEloSim(elo) {
  elo = Number(elo);
  const rank = getSimRank(elo);

  // Valeur ELO affichée
  const valEl = document.getElementById('elo-sim-value');
  if (valEl) { valEl.textContent = elo; valEl.style.color = rank.color; }

  // Couleur du slider
  const slider = document.getElementById('elo-sim-slider');
  if (slider) {
    const pct = ((elo - 100) / (3500 - 100)) * 100;
    slider.style.background = `linear-gradient(to right, ${rank.color} ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;
    slider.style.setProperty('--thumb-color', rank.color);
    slider.style.accentColor = rank.color;
  }

  // Image badge
  const img = document.getElementById('elo-sim-img');
  if (img) {
    img.src   = `/ranks/${rank.key}_${rank.level + 1}.png`;
    img.alt   = rank.label;
    img.style.filter = `drop-shadow(0 0 10px ${rank.color}88)`;
  }

  // Nom rang
  const nameEl = document.getElementById('elo-sim-rank-name');
  if (nameEl) { nameEl.textContent = rank.displayLabel || rank.label; nameEl.style.color = rank.color; }

  // Tranche ELO
  const rangeEl = document.getElementById('elo-sim-range');
  if (rangeEl) rangeEl.textContent = rank.min + ' - ' + rank.max + ' ELO';

  // Barre progression
  const prog = document.getElementById('elo-sim-prog');
  if (prog) { prog.style.width = rank.progress + '%'; prog.style.background = rank.color; }

  // Next
  const nextEl = document.getElementById('elo-sim-next');
  if (nextEl) nextEl.textContent = rank.next
    ? rank.progress + '% · Prochain rang à ' + rank.next + ' ELO'
    : 'Rang maximum atteint';
}

async function convertProfileToBot() {
  const me = JSON.parse(localStorage.getItem('player') || sessionStorage.getItem('player') || '{}');
  const token = getStoredSessionToken();
  const btn = document.getElementById('btn-convert-bot');
  if (!me.id || !token) return alert('Connecte-toi avant de basculer en mode bot.');
  if (!confirm('Passer ce compte en mode bot ? Le token sera affiche une seule fois et ne pourra pas etre regenere.')) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Creation du token...'; }
  try {
    const ownerValue = (document.getElementById('bot-owner-input')?.value || '').trim();
    const ownerId = /^\d+$/.test(ownerValue) ? Number(ownerValue) : undefined;
    const res = await fetch(`/api/players/${me.id}/convert-bot`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': token },
      body: JSON.stringify({

        skill: currentPlayer?.elo || me.elo || 1000,
