<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 - Profil</title>
<link rel="icon" type="image/png" href="/assets/site-logo-small.png">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Audiowide&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&family=Bebas+Neue&family=Bodoni+Moda:wght@700;900&family=Bungee&family=Chakra+Petch:wght@700&family=Cinzel:wght@700&family=Creepster&family=Eagle+Lake&family=Fredericka+the+Great&family=IM+Fell+English+SC&family=Jacquard+12&family=Lobster&family=Luckiest+Guy&family=MedievalSharp&family=Metal+Mania&family=Orbitron:wght@700;900&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@700;900&family=Prata&family=Press+Start+2P&family=Righteous&family=Rubik+Glitch&family=Silkscreen:wght@700&family=Uncial+Antiqua&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);
  --red:#ff2d55;--red-dim:rgba(255,45,85,0.12);--red-glow:rgba(255,45,85,0.4);
  --yellow:#ffd60a;--yel-dim:rgba(255,214,10,0.1);--yel-glow:rgba(255,214,10,0.4);
  --green:#30d158;--green-dim:rgba(48,209,88,0.1);--green-glow:rgba(48,209,88,0.3);
  --text:#eeeef5;--muted:rgba(238,238,245,0.38);--accent:#4c6ef5;
}
html,body{min-height:100%;background:var(--bg); background-attachment: fixed;color:var(--text);font-family:'Barlow',sans-serif;}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;}
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(14px);opacity:.18;animation:floatOrb linear infinite}
.orb.one{width:180px;height:180px;left:7%;top:10%;background:radial-gradient(circle,#ff2d55,transparent 70%);animation-duration:18s}
.orb.two{width:230px;height:230px;right:7%;top:16%;background:radial-gradient(circle,#4c6ef5,transparent 72%);animation-duration:24s}
.orb.three{width:210px;height:210px;left:14%;bottom:6%;background:radial-gradient(circle,#ffd60a,transparent 72%);animation-duration:22s}
.orb.four{width:190px;height:190px;right:14%;bottom:4%;background:radial-gradient(circle,#30d158,transparent 70%);animation-duration:20s}
@keyframes floatOrb{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-20px,0) scale(1.05)}}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);}
.profile-wallpaper-mode{
  --surface: transparent;
  --surface2: transparent;
  --border: rgba(255,255,255,.20);
  background:#000;
}
.profile-wallpaper-mode::before,
.profile-wallpaper-mode::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
}
.profile-wallpaper-mode::before{
  z-index:0;
  background:var(--profile-wallpaper-image) center/cover no-repeat fixed;
  opacity:var(--profile-wallpaper-opacity,.48);
}
.profile-wallpaper-mode::after{
  z-index:0;
  background:rgba(0,0,0,var(--profile-wallpaper-dim,.28));
}
.profile-wallpaper-mode .bg-grid,
.profile-wallpaper-mode .bg-orbs,
.profile-wallpaper-mode .scanlines{
  display:none;
}
.profile-wallpaper-mode .nav,
.profile-wallpaper-mode .profile-side-card,
.profile-wallpaper-mode .profile-side-link,
.profile-wallpaper-mode .profile-side-stat,
.profile-wallpaper-mode .profile-header,
.profile-wallpaper-mode .social-card,
.profile-wallpaper-mode .elo-history-card,
.profile-wallpaper-mode .stat-card,
.profile-wallpaper-mode .winrate-card,
.profile-wallpaper-mode .tabs-row,
.profile-wallpaper-mode .tab.active,
.profile-wallpaper-mode .game-row,
.profile-wallpaper-mode .player-row,
.profile-wallpaper-mode .color-card,
.profile-wallpaper-mode .shape-card,
.profile-wallpaper-mode .avatar-decoration-card,
.profile-wallpaper-mode .token-collection-card,
.profile-wallpaper-mode .clan-card,
.profile-wallpaper-mode .clan-row,
.profile-wallpaper-mode .clan-meta-box,
.profile-wallpaper-mode .profile-marquee,
.profile-wallpaper-mode .profile-pill,
.profile-wallpaper-mode .color-picker-inline,
.profile-wallpaper-mode .color-custom-wrap,
.profile-wallpaper-mode .color-preview-card,
.profile-wallpaper-mode .emoji-input-wrap,
.profile-wallpaper-mode .token-emoji-wrap,
.profile-wallpaper-mode .token-emoji-preview,
.profile-wallpaper-mode .avatar-decoration-preview,
.profile-wallpaper-mode .cursor-custom-preview,
.profile-wallpaper-mode .avatar-decoration-option,
.profile-wallpaper-mode .pseudo-font-current,
.profile-wallpaper-mode .pseudo-format-option span,
.profile-wallpaper-mode .elo-history-canvas-wrap,
.profile-wallpaper-mode .elo-history-stat,
.profile-wallpaper-mode .elo-history-range,
.profile-wallpaper-mode .replay-badge,
.profile-wallpaper-mode .shape-btn,
.profile-wallpaper-mode .toggle-wrap{
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
}
.profile-wallpaper-mode .profile-header::before,
.profile-wallpaper-mode .profile-header::after,
.profile-wallpaper-mode .profile-banner::after,
.profile-wallpaper-mode .social-card::before,
.profile-wallpaper-mode .stat-card::before,
.profile-wallpaper-mode .token-collection-card::after,
.profile-wallpaper-mode .clan-card::before{
  display:none!important;
}
.profile-wallpaper-mode .profile-banner{
  background:transparent!important;
}
.page{position:relative;z-index:2;max-width:1220px;margin:0 auto;padding:28px 18px 72px;display:flex;flex-direction:column;gap:22px;}
.profile-shell{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:20px;
  align-items:start;
}
.profile-side{
  position:sticky;
  top:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.profile-side-card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018)),var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:16px;
  box-shadow:0 22px 54px rgba(0,0,0,.22);
  backdrop-filter:blur(10px);
}
.profile-side-label{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}
.profile-side-menu{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.profile-side-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.025);
  color:var(--text);
  text-decoration:none;
  transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;
}
.profile-side-link:hover{
  transform:translateX(3px);
  border-color:rgba(133,235,255,.28);
  background:rgba(133,235,255,.06);
  box-shadow:0 0 22px rgba(133,235,255,.08);
}
.profile-side-link.active{
  border-color:rgba(133,235,255,.34);
  background:linear-gradient(180deg,rgba(133,235,255,.10),rgba(133,235,255,.05));
  box-shadow:0 0 28px rgba(133,235,255,.10);
}
.profile-side-link-main{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.profile-side-link-icon{
  width:34px;
  height:34px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.05);
  font-size:15px;
  flex-shrink:0;
}
.profile-side-link-text{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.profile-side-link-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  line-height:1;
}
.profile-side-link-sub{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.profile-side-link-arrow{
  color:var(--muted);
  font-size:13px;
  flex-shrink:0;
}
.profile-side-stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.profile-side-stat{
  padding:12px 10px;
  border-radius:16px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  text-align:center;
}
.profile-side-stat strong{
  display:block;
  font-family:'Barlow Condensed',sans-serif;
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
}
.profile-side-stat span{
  display:block;
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}
.profile-main{
  display:flex;
  flex-direction:column;
  gap:18px;
  min-width:0;
}
.profile-section{
  scroll-margin-top:24px;
}
.profile-section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
  padding:0 4px;
}
.profile-section-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  line-height:1;
}
.profile-section-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.profile-stack{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.28);}
.logo-sm{font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:10px;}
.logo-sm::before{content:"";width:40px;height:40px;border-radius:12px;background:url('/assets/site-logo-small.png') center/cover no-repeat;border:1px solid rgba(255,255,255,.1)}
.logo-sm span{color:var(--red);}
.nav-btns{display:flex;gap:8px;}
.btn-nav{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--muted);cursor:pointer;text-decoration:none;transition:all 0.2s;}
.btn-nav:hover{border-color:var(--muted);color:var(--text);}
.btn-nav.danger:hover{border-color:var(--red);color:var(--red);}

@keyframes slide-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Profile header ── */
.profile-header{
  position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018)),var(--surface);border:1px solid var(--border);border-radius:28px;
  overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,0.34);
  animation:slide-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
.profile-header::before{content:'';position:absolute;inset:auto -80px -90px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.14),transparent 68%);pointer-events:none}
.profile-header::after{content:'';position:absolute;inset:-120px auto auto -110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(76,110,245,.14),transparent 70%);pointer-events:none}
.profile-banner{
  width:100%;height:240px;object-fit:cover;display:block;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  position:relative;cursor:pointer;
}
.profile-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 30%,transparent 65%,rgba(255,255,255,.04));pointer-events:none}
.profile-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-banner-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.2s;font-size:24px;
}
.profile-banner:hover .profile-banner-overlay{opacity:1;}
.profile-header-inner{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px;padding:26px 28px 30px;
}
.avatar-wrap{position:relative;flex-shrink:0;cursor:pointer;}
.avatar-wrap:hover .avatar-overlay{opacity:1;}
.profile-avatar{position:relative;z-index:1;width:72px;height:72px;border-radius:50%;background:var(--player-color-dim,var(--red-dim));border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:900;color:var(--player-color,var(--red));overflow:hidden;transition:border-color 0.4s,background 0.4s,color 0.4s;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-decoration{position:absolute;inset:-16px;pointer-events:none;z-index:4}
.avatar-decoration img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 16px rgba(255,255,255,0.12))}
.avatar-overlay{position:absolute;inset:0;z-index:5;border-radius:50%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:opacity 0.2s;}
/* Cercle statut autour de l'avatar */
.avatar-ring{position:absolute;inset:-4px;z-index:2;border-radius:50%;border:3px solid transparent;pointer-events:none;transition:border-color 0.4s,box-shadow 0.4s;}
.avatar-ring.online{border-color:#30d158;box-shadow:0 0 10px rgba(48,209,88,0.5);}
.avatar-ring.bot-online{border-color:#85EBFF;box-shadow:0 0 12px rgba(133,235,255,0.5);}
.avatar-ring.offline{border-color:#636366;box-shadow:none;}
/* Badges statut */
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;margin-top:5px;}
.status-badge.online{background:rgba(48,209,88,0.12);border:1px solid rgba(48,209,88,0.3);color:#30d158;}
.status-badge.bot-online{background:rgba(133,235,255,0.12);border:1px solid rgba(133,235,255,0.32);color:#85EBFF;}
.status-badge.live{background:rgba(255,45,85,0.12);border:1px solid rgba(255,45,85,0.3);color:#ff4d6d;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;}
.status-badge.live:hover{transform:translateY(-1px);background:rgba(255,45,85,0.18);border-color:rgba(255,45,85,0.42);}
.status-badge.offline{background:rgba(99,99,102,0.15);border:1px solid rgba(99,99,102,0.3);color:#8e8e93;}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status-dot.online{background:#30d158;animation:pulse-online 1.5s ease-in-out infinite;}
.status-dot.bot-online{background:#85EBFF;animation:pulse-online 1.5s ease-in-out infinite;}
.status-dot.live{background:#ff4d6d;animation:pulse-online 1.15s ease-in-out infinite;}
.status-dot.offline{background:#636366;}
.status-lastseen{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:0.3px;}
@keyframes pulse-online{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(48,209,88,0.4);}50%{opacity:0.8;box-shadow:0 0 0 4px rgba(48,209,88,0);}}
/* Toggle auto-rejoin */
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color 0.2s;}
.toggle-wrap:hover{border-color:rgba(255,255,255,0.15);}
.toggle-label{font-size:12px;font-weight:600;color:var(--text);}
.toggle-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.toggle-switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,0.1);border-radius:22px;transition:background 0.25s;}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform 0.25s;}
.toggle-switch input:checked + .toggle-slider{background:var(--green);}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(16px);}
/* Popup simulateur ELO */
.elo-sim-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.elo-sim-bg.show{display:flex;}
.elo-sim-modal{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:28px 24px;width:100%;max-width:420px;position:relative;}
.elo-sim-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.elo-sim-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
.elo-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline:none;cursor:pointer;margin:8px 0 4px;}
.elo-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff;transition:transform 0.15s;}
.elo-slider::-webkit-slider-thumb:hover{transform:scale(1.2);}
.elo-sim-badge{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;background:rgba(255,255,255,0.03);border-radius:16px;border:1px solid rgba(255,255,255,0.06);margin-top:16px;}
.elo-sim-badge img{width:64px;height:64px;object-fit:contain;transition:all 0.3s;}
.elo-sim-rank-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;transition:color 0.3s;}
.elo-sim-progress-wrap{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin-top:4px;}
.elo-sim-progress-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;}
input[type="file"]{display:none;}
.profile-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;}
.profile-pseudo{font-family:Barlow Condensed,sans-serif;font-size:54px;font-weight:900;letter-spacing:1px;line-height:.95;text-align:left;text-transform:uppercase;max-width:100%;white-space:normal;overflow:visible;overflow-wrap:anywhere;text-wrap:balance;}
.profile-pseudo{
  text-shadow:0 0 18px rgba(255,255,255,.08),0 0 30px rgba(133,235,255,.06);
}
.pseudo-rgb-wave{
  background-image:linear-gradient(105deg,#ff8fa8 0%,#ffd86b 14%,#86efac 28%,#7dd3fc 42%,#a78bfa 56%,#f9a8d4 70%,#ff8fa8 84%,#ffd86b 100%)!important;
  background-size:240% 100%!important;
  -webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;
  animation:pseudoRgbWave 7s ease-in-out infinite;text-shadow:none!important;
}
@keyframes pseudoRgbWave{
  0%{background-position:0% 50%;filter:saturate(.86) brightness(1)}
  50%{background-position:100% 50%;filter:saturate(1) brightness(1.08)}
  100%{background-position:200% 50%;filter:saturate(.86) brightness(1)}
}
.profile-badges{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-start;margin-top:12px;min-height:34px}
.profile-badge{
  --badge-color:#eeeef5;--badge-bg:rgba(255,255,255,.06);--badge-border:rgba(255,255,255,.12);--badge-glow:rgba(255,255,255,.12);
  position:relative;display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:5px 10px 5px 7px;
  border-radius:9px;border:1px solid var(--badge-border);background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--badge-bg);
  color:var(--badge-color);font-family:Barlow Condensed,Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif;
  font-size:12px;font-weight:900;letter-spacing:1.15px;text-transform:uppercase;line-height:1;
  box-shadow:0 0 18px var(--badge-glow),inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.16);
  overflow:hidden;isolation:isolate;
}
.profile-badge::before{content:'';position:absolute;inset:-1px;z-index:-1;background:linear-gradient(120deg,transparent 0 22%,rgba(255,255,255,.14) 36%,transparent 52%);opacity:.7;transform:translateX(-58%);animation:profile-badge-sheen 4.6s ease-in-out infinite}
.profile-badge img{width:20px;height:20px;object-fit:contain;display:block;filter:drop-shadow(0 0 7px var(--badge-glow));flex-shrink:0}
.profile-badge .badge-icon{font-size:15px;line-height:1;filter:drop-shadow(0 0 6px var(--badge-glow))}
.profile-badge.vip{--badge-color:#ffe66b;--badge-bg:rgba(255,214,10,.12);--badge-border:rgba(255,214,10,.36);--badge-glow:rgba(255,214,10,.32)}
.profile-badge.vip-plus{--badge-color:#baf5ff;--badge-bg:rgba(133,235,255,.12);--badge-border:rgba(133,235,255,.42);--badge-glow:rgba(133,235,255,.34)}
.profile-badge.crystal{--badge-color:#e9fbff;--badge-bg:rgba(125,190,255,.13);--badge-border:rgba(170,228,255,.46);--badge-glow:rgba(125,190,255,.38);padding-left:6px}
.profile-badge.perso{--badge-color:#ffb28a;--badge-bg:rgba(255,122,69,.12);--badge-border:rgba(255,122,69,.38);--badge-glow:rgba(255,122,69,.28)}
.profile-badge.staff{--badge-color:#ff6b8a;--badge-bg:rgba(255,45,85,.12);--badge-border:rgba(255,45,85,.38);--badge-glow:rgba(255,45,85,.28)}
.profile-badge.modo{--badge-color:#aeb8ff;--badge-bg:rgba(76,110,245,.13);--badge-border:rgba(76,110,245,.36);--badge-glow:rgba(76,110,245,.26)}
.profile-badge.dev{--badge-color:#8fffd3;--badge-bg:rgba(48,209,88,.12);--badge-border:rgba(48,209,88,.38);--badge-glow:rgba(48,209,88,.28);text-decoration:none}
.profile-badge.dev img{width:21px;height:21px;filter:drop-shadow(0 0 6px rgba(39,218,218,.36))}
.profile-badge.bot{--badge-color:#cfd2dd;--badge-bg:rgba(142,142,147,.14);--badge-border:rgba(184,187,199,.36);--badge-glow:rgba(184,187,199,.20)}
.profile-badge.clan{--badge-color:#dffaff;--badge-bg:rgba(133,235,255,.10);--badge-border:rgba(133,235,255,.28);--badge-glow:rgba(133,235,255,.18)}
@keyframes profile-badge-sheen{0%,48%{transform:translateX(-70%);opacity:0}58%{opacity:.7}76%,100%{transform:translateX(95%);opacity:0}}
.profile-since{font-size:13px;color:var(--muted);margin-top:10px;text-align:left;}
.profile-media-note{font-size:12px;color:var(--muted);margin-top:4px;text-align:left;}
.profile-pill-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.profile-pill{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  font-size:12px;color:var(--text);backdrop-filter:blur(8px);
  box-shadow:0 10px 24px rgba(0,0,0,.14);
  animation:profile-pill-float 3.4s ease-in-out infinite;
}
.profile-pill:nth-child(2){animation-delay:.2s}
.profile-pill:nth-child(3){animation-delay:.4s}
.profile-pill:nth-child(4){animation-delay:.6s}
.profile-pill strong{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase}
@keyframes profile-pill-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.clan-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);gap:14px}
.clan-card{
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:22px;
  background:radial-gradient(circle at 10% 0%,var(--clan-glow,rgba(133,235,255,.12)),transparent 36%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018)),var(--surface);
  padding:18px;box-shadow:0 20px 46px rgba(0,0,0,.22)
}
.clan-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--clan-line,rgba(133,235,255,.18)),transparent 38%);opacity:.38;pointer-events:none}
.clan-card>*{position:relative;z-index:1}
.clan-identity{display:flex;align-items:center;gap:14px}
.clan-blason{
  width:66px;height:66px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:34px;
  background:rgba(255,255,255,.05);border:1px solid var(--clan-border,rgba(133,235,255,.28));
  box-shadow:0 0 28px var(--clan-glow,rgba(133,235,255,.18)), inset 0 0 20px rgba(255,255,255,.035)
}
.clan-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;text-transform:uppercase;line-height:1}
.clan-tag{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:4px 9px;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;border:1px solid var(--clan-border,rgba(133,235,255,.28));color:var(--clan-color,#85EBFF);background:var(--clan-bg,rgba(133,235,255,.08))}
.clan-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.clan-meta-box{border:1px solid rgba(255,255,255,.06);border-radius:14px;background:rgba(255,255,255,.035);padding:10px;text-align:center}
.clan-meta-box strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900}
.clan-meta-box span{display:block;margin-top:2px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.clan-form{display:grid;grid-template-columns:1fr 96px;gap:10px}
.clan-form .search-input{max-width:none;margin:0}
.clan-form textarea{grid-column:1/-1;min-height:72px;resize:vertical}
.clan-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.clan-directory{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow:auto;padding-right:4px}
.clan-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.clan-row-badge{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.05);border:1px solid var(--clan-border,rgba(133,235,255,.25))}
.clan-row-main{min-width:0;flex:1}
.clan-row-name{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clan-row-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clan-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-family:'Barlow Condensed','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
@media (max-width:760px){.clan-grid{grid-template-columns:1fr}.clan-form{grid-template-columns:1fr}.clan-meta{grid-template-columns:1fr}}
.profile-marquee{
  position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.025);
}
.profile-marquee-track{
  display:flex;gap:28px;width:max-content;padding:12px 18px;
  animation:profile-marquee-slide 24s linear infinite;
}
.profile-marquee-item{
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  font-size:12px;color:var(--muted)
}
.profile-marquee-dot{
  width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,var(--player-color,var(--red)),#85EBFF);
  box-shadow:0 0 10px rgba(133,235,255,.22)
}
@keyframes profile-marquee-slide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
/* Follow button */
.btn-follow{
  font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:9px 18px;border-radius:10px;
  border:none;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.btn-follow.not-following{background:var(--green-dim);border:1.5px solid rgba(48,209,88,0.3);color:var(--green);}
.btn-follow.not-following:hover{background:rgba(48,209,88,0.25);box-shadow:0 0 16px var(--green-glow);}
.btn-follow.following{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-follow.following:hover{border-color:var(--red);color:var(--red);}

.profile-elo{font-family:Barlow Condensed,sans-serif;font-size:62px;font-weight:900;letter-spacing:2px;color:var(--yellow);text-shadow:0 0 20px var(--yel-glow);text-align:right;flex-shrink:0;line-height:.9;}
.profile-elo-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-align:right;margin-top:4px;}

/* ── Social counts ── */
.social-row{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
  animation:slide-in 0.5s 0.05s cubic-bezier(0.22,1,0.36,1) both;
}
.social-card{
  flex:1;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px 14px;text-align:center;cursor:pointer;transition:all 0.2s;box-shadow:0 16px 36px rgba(0,0,0,.18);
  position:relative;overflow:hidden;
}
.social-card::before{content:'';position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);opacity:.45}
.social-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);}
.social-card.active{border-color:var(--accent);}
.social-card:nth-child(1){border-color:rgba(133,235,255,.14)}
.social-card:nth-child(2){border-color:rgba(255,214,10,.14)}
.social-card:nth-child(3){border-color:rgba(255,45,85,.14)}
.social-card:nth-child(1):hover{border-color:rgba(133,235,255,.34);box-shadow:0 0 24px rgba(133,235,255,.10)}
.social-card:nth-child(2):hover{border-color:rgba(255,214,10,.32);box-shadow:0 0 24px rgba(255,214,10,.10)}
.social-card:nth-child(3):hover{border-color:rgba(255,45,85,.30);box-shadow:0 0 24px rgba(255,45,85,.10)}
.social-val{font-family:Barlow Condensed,sans-serif;font-size:26px;font-weight:900;letter-spacing:1px;}
.social-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:2px;}

/* ELO history */
.elo-history-card{
  position:relative;
  margin-top:14px;
  padding:18px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.07);
  background:
    radial-gradient(circle at 12% 0%,rgba(133,235,255,.12),transparent 30%),
    radial-gradient(circle at 100% 16%,rgba(255,214,10,.10),transparent 34%),
    linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018)),var(--surface);
  box-shadow:0 20px 46px rgba(0,0,0,.22);
  overflow:hidden;
  animation:slide-in .5s .08s cubic-bezier(.22,1,.36,1) both;
}
.elo-history-card::before{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.045),transparent);
  transform:translateX(-100%);
  animation:elo-card-sheen 7s ease-in-out infinite;
}
@keyframes elo-card-sheen{0%,68%{transform:translateX(-100%)}86%,100%{transform:translateX(100%)}}
.elo-history-head{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px;}
.elo-history-kicker{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.elo-history-title{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1;margin-top:3px;}
.elo-history-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.elo-history-actions{display:flex;gap:8px;align-items:flex-start;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0;}
.elo-history-ranges,.elo-history-export{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.elo-history-date-range{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;width:100%;}
.elo-history-date-range input{min-width:126px;padding:7px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:var(--text);font:800 12px Barlow;}
.elo-history-range{
  min-width:42px;
  padding:9px 11px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);
  color:var(--muted);
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform .16s,border-color .16s,color .16s,background .16s,box-shadow .16s;
}
.elo-history-range:hover{transform:translateY(-1px);border-color:rgba(133,235,255,.32);color:#85EBFF;}
.elo-history-range.active{background:rgba(133,235,255,.10);border-color:rgba(133,235,255,.44);color:#85EBFF;box-shadow:0 0 20px rgba(133,235,255,.10);}
.elo-history-copy{
  min-width:54px;
  padding:9px 10px;
  border-radius:12px;
  border:1px solid rgba(255,214,10,.18);
  background:rgba(255,214,10,.055);
  color:#ffd60a;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
}
.elo-history-copy:hover{transform:translateY(-1px);border-color:rgba(255,214,10,.42);background:rgba(255,214,10,.10);box-shadow:0 0 20px rgba(255,214,10,.10);}
.elo-history-canvas-wrap{position:relative;z-index:1;height:230px;border-radius:18px;overflow:visible;border:1px solid rgba(255,255,255,.055);background:rgba(0,0,0,.16);}
#elo-history-canvas{display:block;width:100%;height:100%;}
.elo-history-tooltip{
  position:absolute;
  z-index:30;
  min-width:150px;
  padding:11px 12px;
  border-radius:14px;
  border:1px solid rgba(133,235,255,.48);
  background:linear-gradient(180deg,rgba(12,14,30,.98),rgba(6,7,16,.98));
  box-shadow:0 20px 48px rgba(0,0,0,.62),0 0 26px rgba(133,235,255,.20);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-112%) scale(.96);
  transition:opacity .12s ease,transform .12s ease;
}
.elo-history-tooltip.show{opacity:1;transform:translate(-50%,-118%) scale(1);}
.elo-history-tooltip strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;letter-spacing:1px;line-height:1;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.18);}
.elo-history-tooltip span{display:block;margin-top:4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(238,238,245,.74);}
.elo-history-tooltip .delta{font-weight:800;}
.elo-history-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:12px;}
.elo-history-stat{padding:10px 11px;border-radius:14px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);}
.elo-history-stat-link{display:block;color:inherit;text-decoration:none;cursor:pointer;transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;}
.elo-history-stat-link:hover{transform:translateY(-2px);border-color:rgba(133,235,255,.34);background:rgba(133,235,255,.07);box-shadow:0 0 24px rgba(133,235,255,.10);}
.elo-history-stat strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;}
.elo-history-stat span{display:block;margin-top:2px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;animation:slide-in 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;}
.stat-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;transition:all 0.2s;box-shadow:0 16px 34px rgba(0,0,0,.18);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.05),transparent 42%)}
.stat-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);}
.stat-icon-img{width:54px;height:44px;object-fit:contain;display:block;margin:0 auto 2px;filter:drop-shadow(0 0 12px rgba(255,255,255,.18));position:relative;z-index:1;}
.stat-card.wins .stat-icon-img{filter:drop-shadow(0 0 16px rgba(255,214,10,.28));}
.stat-card.losses .stat-icon-img{filter:drop-shadow(0 0 16px rgba(180,90,255,.24));}
.stat-card.draws .stat-icon-img{filter:drop-shadow(0 0 16px rgba(255,214,10,.22));}
.stat-val{font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;}
.stat-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.stat-card.wins     .stat-val{color:var(--green);}
.stat-card.losses   .stat-val{color:var(--red);}
.stat-card.draws    .stat-val{color:var(--muted);}
.stat-card.accuracy .stat-val{color:#8b9cf4;}
.stat-card.accuracy{background:linear-gradient(135deg,rgba(76,110,245,0.06),rgba(139,156,244,0.04));border-color:rgba(76,110,245,0.2);}

.winrate-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;animation:slide-in 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both;box-shadow:0 18px 38px rgba(0,0,0,.18);}
.winrate-header{display:flex;justify-content:space-between;align-items:center;}
.wr-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.wr-pct{font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:800;color:var(--green);}
.wr-bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.wr-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width 1s cubic-bezier(0.22,1,0.36,1);}

/* ── Tabs ── */
.tabs-row{display:flex;gap:4px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015)),var(--surface2);border-radius:14px;padding:5px;animation:slide-in 0.5s 0.2s cubic-bezier(0.22,1,0.36,1) both;border:1px solid rgba(255,255,255,.06);box-shadow:0 14px 32px rgba(0,0,0,.16);}
.tab{flex:1;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px;border-radius:7px;background:transparent;border:none;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.tab.active{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.3),0 0 20px rgba(76,110,245,.08);}

/* ── Tab panels ── */
.tab-panel{display:none;animation:slide-in 0.3s cubic-bezier(0.22,1,0.36,1) both;}
.tab-panel.show{display:flex;flex-direction:column;gap:6px;}

/* ── History rows ── */
.game-row{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 22px;min-height:74px;display:flex;align-items:center;gap:16px;cursor:pointer;text-decoration:none;color:var(--text);transition:all 0.2s;}
.game-row:hover{border-color:rgba(255,255,255,0.12);transform:translateX(4px);}
.game-result{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.game-result img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,255,255,.18));}
.game-result.win{background:var(--green-dim);}
.game-result.loss{background:var(--red-dim);}
.game-result.draw{background:var(--surface2);}
.game-vs{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.game-vs span{color:var(--muted);}
.game-meta{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
.game-elo-change{font-family:Barlow Condensed,sans-serif;font-size:19px;font-weight:800;letter-spacing:1px;}
.game-elo-change.pos{color:var(--green);}
.game-elo-change.neg{color:var(--red);}
.game-elo-change.neu{color:var(--muted);}
.replay-badge{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:7px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);flex-shrink:0;}
.game-row:hover .replay-badge{border-color:var(--accent);color:var(--accent);}
.pg-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.pg-btn:hover{border-color:var(--accent);color:var(--accent);}
.pg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pg-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* ── Player rows (following/followers) ── */
.player-row{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  text-decoration:none;color:var(--text);transition:all 0.2s;position:relative;overflow:hidden;isolation:isolate;
}
.player-row:hover{border-color:rgba(255,255,255,0.12);transform:translateX(4px);}
.player-row-content,.search-result-content{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%}
.player-mini-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:900;}
.player-mini-avatar img{width:100%;height:100%;object-fit:cover;}
.player-mini-info{flex:1;min-width:0;}
.player-mini-pseudo{font-weight:600;font-size:14px;}
.player-mini-stats{font-size:11px;color:var(--muted);margin-top:1px;}
.mini-result-stats{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mini-result-chip{display:inline-flex;align-items:center;gap:3px;}
.mini-result-chip img{width:15px;height:15px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(255,255,255,.14));}
.player-mini-elo{font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:800;color:var(--yellow);flex-shrink:0;}

/* Badges wins streak */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
.badge.online{background:rgba(48,209,88,0.12);color:var(--green);border:1px solid rgba(48,209,88,0.2);}

.empty-state{text-align:center;padding:32px 20px;color:var(--muted);font-size:14px;}

/* ── Color picker card ── */
.color-card{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:18px 20px;display:flex;flex-direction:column;gap:14px;
  animation:slide-in 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both;
  box-shadow:0 18px 38px rgba(0,0,0,.18);
}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.color-picker-inline{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;min-width:118px}
.color-picker-inline input[type="color"]{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:none;background:transparent;padding:0;cursor:pointer;opacity:1;position:static;pointer-events:auto}
.color-picker-inline input[type="color"]::-webkit-color-swatch-wrapper{padding:0}

.color-picker-inline span{font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase}

.color-custom-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;transition:border-color 0.2s;flex:1;min-width:120px;}
.color-custom-wrap:hover{border-color:rgba(255,255,255,0.15);}
.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;transition:background 0.2s, box-shadow 0.2s;}
.color-hex{font-size:12px;color:var(--muted);}
.color-editor{display:grid;grid-template-columns:minmax(190px,220px) 1fr;gap:12px;align-items:start}
.color-preview-card{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px 14px;min-height:70px}

.color-preview-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.color-preview-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.color-preview-value{font-size:13px;color:var(--text);font-weight:600}
.color-inputs{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.color-inputs .color-custom-wrap{min-width:0}
input[type="color"]{width:0;height:0;opacity:0;position:absolute;pointer-events:none;}
.btn-save-color{
  font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;padding:10px 20px;border-radius:10px;
  background:var(--green-dim);border:1.5px solid rgba(48,209,88,0.3);color:var(--green);
  cursor:pointer;transition:all 0.2s;align-self:flex-end;
}
.btn-save-color:hover{background:rgba(48,209,88,0.25);}
.btn-save-color:disabled{opacity:0.5;cursor:not-allowed;}
.color-editor .btn-save-color{grid-column:1/-1;justify-self:end;min-width:160px}
.save-confirm{font-size:12px;color:var(--green);opacity:0;transition:opacity 0.3s;}

/* ── Shape picker ── */
.shape-card{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:18px 20px;display:flex;flex-direction:column;gap:14px;
  animation:slide-in 0.5s 0.12s cubic-bezier(0.22,1,0.36,1) both;

}

.shape-btn.disabled:hover{transform:none;border-color:var(--border);}
.shape-preview{
  width:28px;height:28px;
  background:var(--red);

}
.profile-badge.perso.badge-rgb-wave{
  --badge-color:#f8f7ff;--badge-border:rgba(255,255,255,.16);--badge-glow:rgba(133,235,255,.14);

    linear-gradient(110deg,rgba(255,56,100,.16),rgba(255,214,10,.13),rgba(48,209,88,.14),rgba(54,215,255,.16),rgba(138,92,255,.16),rgba(255,79,195,.14),rgba(255,56,100,.16)),

  background-size:320% 100%,100% 100%;

  border-color:rgba(255,255,255,.14);

}

  z-index:2;

  border-radius:inherit;

  background:conic-gradient(from 0deg,#ff7f9c,#ffd86b,#86efac,#67e8f9,#a78bfa,#f9a8d4,#ff7f9c);

}

.token-collection-card::after{content:'';position:absolute;width:190px;height:190px;right:-65px;bottom:-90px;border-radius:50%;background:radial-gradient(circle,rgba(133,235,255,.14),transparent 68%);pointer-events:none}

.collection-token{--token-a:#555;--token-b:var(--token-a);position:relative;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.82),transparent 11%),radial-gradient(circle at 50% 54%,var(--token-a) 0 49%,var(--token-b) 72%,#111 100%);border:3px solid rgba(255,255,255,.28);box-shadow:inset 0 0 0 5px rgba(255,255,255,.08),inset 0 -8px 12px rgba(0,0,0,.28),0 8px 18px rgba(0,0,0,.24)}

.collection-token[data-design="pearl"]{filter:saturate(.72);box-shadow:inset 0 0 13px rgba(133,235,255,.45),0 8px 18px rgba(0,0,0,.24)}
.collection-token[data-design="prism"],.collection-token[data-design="cosmos"],.collection-token[data-design="spectral"]{background:conic-gradient(from 25deg,var(--token-a),#fff6a8,var(--token-b),#8b5cf6,var(--token-a));animation:collectionTokenGlow 2.2s ease-in-out infinite alternate}
.collection-token[data-design="sun"]::before{inset:18%;border:0;background:repeating-conic-gradient(rgba(255,255,255,.8) 0 7deg,transparent 7deg 22deg);mask:radial-gradient(circle,transparent 0 38%,#000 40%)}
.collection-token[data-design="scale"]::before{inset:10%;border:0;background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.42) 0 12%,transparent 13%),radial-gradient(circle at 75% 25%,rgba(255,255,255,.28) 0 12%,transparent 13%),radial-gradient(circle at 50% 70%,rgba(255,255,255,.3) 0 15%,transparent 16%)}

.collection-token[data-design="queen"],.collection-token[data-design="queen-dark"]{background:conic-gradient(from 20deg,var(--token-a),var(--token-b),#fff2a8,var(--token-a));box-shadow:0 0 16px #fff,0 0 30px var(--token-b),inset 0 0 0 5px rgba(255,255,255,.18);animation:collectionTokenGlow 1.4s ease-in-out infinite alternate}

.avatar-decoration-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.avatar-decoration-preview .base{position:relative;z-index:1;width:60px;height:60px;border-radius:50%;background:var(--player-color-dim,var(--red-dim));display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:var(--player-color,var(--red));overflow:hidden}
.avatar-decoration-preview .base img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-decoration-preview .overlay{position:absolute;inset:-10px;z-index:3;pointer-events:none}
.avatar-decoration-preview .overlay img{width:100%;height:100%;object-fit:contain;display:block}
.avatar-decoration-meta{font-size:12px;color:var(--muted);line-height:1.5;flex:1;min-width:150px}
.avatar-decoration-btn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 14px;border-radius:10px;background:rgba(133,235,255,0.1);border:1px solid rgba(133,235,255,0.24);color:#85EBFF;cursor:pointer;transition:all .2s}
.avatar-decoration-btn:hover{background:rgba(133,235,255,0.18)}
.avatar-decoration-btn:disabled{opacity:.55;cursor:not-allowed}
.cursor-custom-preview{position:relative;width:92px;height:92px;flex-shrink:0;border-radius:22px;border:1px solid rgba(255,255,255,.10);background:linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25% 75%,rgba(255,255,255,.045) 75%),linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25% 75%,rgba(255,255,255,.045) 75%);background-position:0 0,8px 8px;background-size:16px 16px;display:grid;place-items:center}
.cursor-custom-preview img{width:32px;height:32px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45))}
.cursor-custom-preview::after{content:'32×32';position:absolute;right:7px;bottom:6px;padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.62);color:rgba(255,255,255,.7);font:800 8px 'Barlow Condensed',sans-serif;letter-spacing:.8px}
.wallpaper-preview{position:relative;width:min(360px,100%);aspect-ratio:16/9;flex-shrink:0;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:#05060d center/cover no-repeat;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.wallpaper-preview::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--wallpaper-preview-dim,.28))}
.wallpaper-preview::after{content:"";position:absolute;left:14px;right:14px;bottom:14px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.wallpaper-preview.empty{display:grid;place-items:center;background:rgba(255,255,255,.035)}
.wallpaper-preview.empty::before,.wallpaper-preview.empty::after{display:none}
.wallpaper-preview.empty span{position:relative;z-index:1;color:var(--muted);font:900 12px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase}
.wallpaper-slider-row{display:grid;grid-template-columns:120px minmax(160px,1fr) 42px;gap:10px;align-items:center;width:100%}
.wallpaper-slider-row label,.wallpaper-slider-row output{font:800 11px 'Barlow Condensed',sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.wallpaper-slider-row input{width:100%}
.avatar-decoration-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:10px}
.avatar-decoration-tier{grid-column:1/-1;margin:8px 0 0;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--tier-color,#85EBFF);display:flex;align-items:center;gap:8px}
.avatar-decoration-tier::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--tier-color,#85EBFF),transparent);opacity:.35}
.avatar-decoration-option{
  position:relative;display:flex;align-items:center;justify-content:center;
  aspect-ratio:1/1;border-radius:14px;background:linear-gradient(135deg,var(--rarity-bg,rgba(255,255,255,.03)),rgba(255,255,255,.018));
  border:1px solid var(--rarity-border,rgba(255,255,255,0.08));cursor:pointer;transition:all .18s;
  overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 16px var(--rarity-glow,transparent);
}
.avatar-decoration-option:hover{transform:translateY(-1px);border-color:var(--rarity-color,rgba(133,235,255,0.26));background:linear-gradient(135deg,var(--rarity-bg,rgba(133,235,255,.06)),rgba(255,255,255,.025))}
.avatar-decoration-option img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.avatar-decoration-option.active{border-color:var(--rarity-color,#85EBFF);box-shadow:0 0 0 1px var(--rarity-border,rgba(133,235,255,0.18)),0 0 22px var(--rarity-glow,rgba(133,235,255,0.14))}
.avatar-decoration-option.locked{opacity:.45;cursor:not-allowed;filter:saturate(.7)}
.avatar-decoration-option-none{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);
}
.pseudo-font-picker-row{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.pseudo-font-current{min-width:190px;flex:1;padding:11px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.pseudo-font-current strong{font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pseudo-font-current span{font:800 10px Barlow,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.pseudo-format-row{width:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pseudo-format-option{position:relative;cursor:pointer}
.pseudo-format-option input{position:absolute;opacity:0;pointer-events:none}
.pseudo-format-option span{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);color:var(--muted);font:800 12px Barlow,sans-serif;transition:.18s}
.pseudo-format-option input:checked + span{color:#dffaff;border-color:rgba(133,235,255,.5);background:rgba(133,235,255,.12);box-shadow:0 0 18px rgba(133,235,255,.1)}
.pseudo-format-option.rgb input:checked + span{color:#fff;border-color:rgba(255,255,255,.12);background:linear-gradient(105deg,rgba(255,143,168,.34),rgba(255,216,107,.30),rgba(134,239,172,.30),rgba(125,211,252,.34),rgba(167,139,250,.32),rgba(249,168,212,.30));background-size:240% 100%;animation:pseudoRgbWave 7s ease-in-out infinite}
.pseudo-font-modal-bg{display:none;position:fixed;inset:0;z-index:2300;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);padding:20px;align-items:center;justify-content:center}
.pseudo-font-modal-bg.show{display:flex}
.pseudo-font-modal{width:min(980px,100%);max-height:min(86vh,900px);overflow:auto;border-radius:22px;border:1px solid rgba(133,235,255,.18);background:linear-gradient(180deg,rgba(16,16,28,.99),rgba(8,8,16,.99));box-shadow:0 24px 90px rgba(0,0,0,.76),0 0 42px rgba(133,235,255,.10);padding:22px}
.pseudo-font-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.pseudo-font-modal-title{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.pseudo-font-modal-sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
.pseudo-font-modal-close{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:20px;line-height:1}
.pseudo-font-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pseudo-font-filter{border:1px solid var(--rarity-border,rgba(255,255,255,.08));background:var(--rarity-bg,rgba(255,255,255,.04));color:var(--muted);border-radius:999px;padding:8px 11px;font:900 11px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.16s;box-shadow:0 0 14px var(--rarity-glow,transparent)}
.pseudo-font-filter:hover,.pseudo-font-filter.active{color:var(--rarity-color,#85EBFF);border-color:var(--rarity-color,rgba(133,235,255,.38));background:var(--rarity-bg,rgba(133,235,255,.10))}
.pseudo-font-scroll{min-height:0;overflow:visible;padding-right:0}
.pseudo-font-scroll::-webkit-scrollbar{width:8px}.pseudo-font-scroll::-webkit-scrollbar-thumb{background:rgba(133,235,255,.22);border-radius:999px}.pseudo-font-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:999px}
.pseudo-font-preview-grid{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px;margin-top:2px}
.pseudo-font-modal-actions{position:sticky;bottom:-22px;margin:14px -22px -22px;padding:12px 22px;background:linear-gradient(180deg,rgba(8,8,16,.94),#080810);border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pseudo-font-modal-actions span{font-size:12px;color:var(--muted)}
.pseudo-font-option{min-height:54px;border-radius:13px;border:1px solid var(--rarity-border,rgba(255,255,255,.10));background:linear-gradient(135deg,var(--rarity-bg,#141421),#141421);color:var(--text);cursor:pointer;text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:3px;transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 0 16px var(--rarity-glow,transparent)}
.pseudo-font-option:hover{transform:translateY(-1px);border-color:var(--rarity-color,rgba(133,235,255,.34));background:linear-gradient(135deg,var(--rarity-bg,#172131),#172131)}
.pseudo-font-option.active{border-color:var(--rarity-color,rgba(133,235,255,.70));background:linear-gradient(135deg,var(--rarity-bg,#17293a),#17293a);box-shadow:0 0 0 1px var(--rarity-border,rgba(133,235,255,.20)),0 0 22px var(--rarity-glow,rgba(133,235,255,.14))}
.pseudo-font-option.locked{opacity:.42;cursor:not-allowed;filter:saturate(.55)}
.pseudo-font-option strong{display:block;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pseudo-font-option span{font:700 9px Barlow,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar-decoration-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);z-index:2200;padding:20px;align-items:center;justify-content:center}
.avatar-decoration-modal-bg.show{display:flex}
.avatar-decoration-modal{width:min(960px,100%);max-height:min(86vh,900px);overflow:auto;background:linear-gradient(180deg,rgba(16,16,26,0.98),rgba(12,12,22,0.98));border:1px solid rgba(133,235,255,0.16);border-radius:22px;box-shadow:0 20px 80px rgba(0,0,0,0.45),0 0 40px rgba(133,235,255,0.08);padding:22px}
.avatar-decoration-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.avatar-decoration-modal-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#e6faff}
.avatar-decoration-modal-sub{font-size:12px;color:var(--muted);line-height:1.5;max-width:560px}
.avatar-decoration-modal-close{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;font-size:20px;line-height:1}

.profile-banner-choice-preview{position:relative;width:100%;max-width:360px;height:96px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:14px}

/* ── Search bar ── */
.search-wrap{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:18px 20px;display:flex;flex-direction:column;gap:12px;
  animation:slide-in 0.5s 0.05s cubic-bezier(0.22,1,0.36,1) both;
  box-shadow:0 18px 38px rgba(0,0,0,.18);
  position:relative;overflow:visible;z-index:80;
}
.search-wrap::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(140deg,rgba(133,235,255,.06),transparent 28%,transparent 72%,rgba(255,45,85,.05))}
.card-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.discord-bubbles{display:flex;flex-wrap:wrap;gap:10px}
.discord-bubble{
  display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:var(--text);font-size:12px;line-height:1.2;box-shadow:0 10px 24px rgba(0,0,0,.12)
}
.discord-bubble .icon{font-size:14px;opacity:.9}
.discord-bubble .meta{display:flex;flex-direction:column;gap:2px}
.discord-bubble .label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.discord-bubble .value{font-size:12px;font-weight:600;color:var(--text)}
.discord-role-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.discord-role-chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:.8px;
  text-transform:uppercase
}
.discord-role-chip.rank-role{font-size:10px;padding:4px 8px;letter-spacing:.6px;opacity:.92}
.discord-role-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:currentColor}
.discord-role-chip.connected-role{color:#30d158!important;background:rgba(48,209,88,.12)!important;border-color:rgba(48,209,88,.35)!important}
.discord-role-chip.connected-role .discord-role-dot{background:#30d158;box-shadow:0 0 0 0 rgba(48,209,88,.55);animation:discordConnectedPulse 1.45s ease-in-out infinite}
.discord-badge-chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;
  background:linear-gradient(135deg,rgba(88,101,242,.17),rgba(133,235,255,.07));
  border:1px solid rgba(139,156,244,.32);color:#aeb8ff;
  font-family:'Barlow Condensed',Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif;
  font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  box-shadow:0 0 16px rgba(88,101,242,.16),inset 0 1px 0 rgba(255,255,255,.08)
}
.discord-badge-chip::before{content:'◆';font-size:9px;color:#85EBFF;filter:drop-shadow(0 0 6px rgba(133,235,255,.45))}
@keyframes discordConnectedPulse{
  0%{transform:scale(.92);box-shadow:0 0 0 0 rgba(48,209,88,.48)}
  55%{transform:scale(1.12);box-shadow:0 0 0 6px rgba(48,209,88,0)}
  100%{transform:scale(.92);box-shadow:0 0 0 0 rgba(48,209,88,0)}
}
.discord-link-panel{
  display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)
}
.discord-rpc-card{

.discord-rpc-sub{margin-top:3px;font-size:12px;line-height:1.45;color:var(--muted)}

.discord-rpc-btn{

const PROFIL_SFX = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function play(fn) { try { fn(getCtx()); } catch(e) {} }

  return {
    hover() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(520, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.03, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        o.start(t); o.stop(t + 0.06);
      });
    },
    click() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(360, t);
        o.frequency.exponentialRampToValueAtTime(520, t + 0.08);
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        o.start(t); o.stop(t + 0.09);
      });
    },
    popupOpen() {
      play(ctx => {
        const t = ctx.currentTime;
        [320, 480, 720].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, t + i * 0.03);
          g.gain.setValueAtTime(0.0001, t + i * 0.03);
          g.gain.linearRampToValueAtTime(0.08, t + i * 0.03 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.03 + 0.15);
          o.start(t + i * 0.03); o.stop(t + i * 0.03 + 0.15);
        });
      });
    },
    popupClose() {
      play(ctx => {
        const t = ctx.currentTime;
        [680, 460].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, t + i * 0.04);
          g.gain.setValueAtTime(0.05, t + i * 0.04);

          o.start(t + i * 0.04); o.stop(t + i * 0.04 + 0.1);

      });

    success() {
      play(ctx => {
        const t = ctx.currentTime;
        [523, 659, 784].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t + i*0.08);
          g.gain.linearRampToValueAtTime(0.18, t + i*0.08 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + i*0.08 + 0.25);
          o.start(t + i*0.08); o.stop(t + i*0.08 + 0.25);
        });
      });
    },
    color(hex) {
      play(ctx => {
        const t = ctx.currentTime;
        const hue = parseInt((hex||'#ff0000').slice(1), 16) % 360;
        const freq = 300 + (hue / 360) * 500;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.1);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.start(t); o.stop(t + 0.2);
      });
    },
    shape() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(440, t);
        o.frequency.exponentialRampToValueAtTime(880, t + 0.15);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.3);
      });
    },
    upload() {
      play(ctx => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        o.connect(f); f.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 800;
        o.frequency.setValueAtTime(200, t);

        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.3);
      });
    },
    discord() {

        const t = ctx.currentTime;
        [880, 1109].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = freq;

          g.gain.linearRampToValueAtTime(0.15, t + i*0.1 + 0.01);

          o.start(t + i*0.1); o.stop(t + i*0.1 + 0.4);
        });
      });
    },
    error() {
      play(ctx => {
        const t = ctx.currentTime;

        o.start(t); o.stop(t + 0.15);
      });
    },
  };
})();

function getRenderableMediaSrc(src) {
  if (!src || typeof src !== 'string') return '';
  if (!/^data:image\/gif;base64,/i.test(src)) return src;
  if (GIF_URL_CACHE.has(src)) return GIF_URL_CACHE.get(src);
  try {
    const match = src.match(/^data:([^;]+);base64,(.+)$/i);
    if (!match) return src;
    const mime = match[1] || 'image/gif';
    const binary = atob(match[2]);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    GIF_URL_CACHE.set(src, url);
    return url;
  } catch {
    return src;
  }
}

function getProfileBoosterMeta(key) {
  if (key === 'elo_mini') return { label: 'Mini Boost ELO', multiplier: 1.05, type: 'elo' };
  if (key === 'elo_classic') return { label: 'Classic Boost ELO', multiplier: 1.10, type: 'elo' };
  if (key === 'elo_max') return { label: 'Max Boost ELO', multiplier: 1.25, type: 'elo' };
  if (key === 'elo_princess') return { label: 'Princess Boost ELO', multiplier: 1.50, type: 'elo' };
  if (key === 'coin_boost') return { label: 'Coin Boost', multiplier: 5, type: 'coins' };
  if (key === 'coin_boost_plus') return { label: 'Coin Boost +', multiplier: 10, type: 'coins' };
  if (key === 'global_elo_boost') return { label: 'Boost Global ELO', multiplier: 1.20, type: 'global' };
  if (key === 'global_coin_boost') return { label: 'Boost Global Coins', multiplier: 2, type: 'global' };
  const globalElo = String(key).match(/^global_elo_custom_(\d+)_(\d+)$/);
  if (globalElo) {
    const bonus = Number(`${globalElo[1]}.${globalElo[2]}`);
    return { label: `Boost Global ELO x${(1 + bonus).toFixed(2)}`, multiplier: Number((1 + bonus).toFixed(2)), type: 'global' };
  }
  const globalCoins = String(key).match(/^global_coin_custom_(\d{1,2})$/);
  if (globalCoins) {
    const multiplier = Number(globalCoins[1]);
    return { label: `Boost Global Coins x${multiplier}`, multiplier, type: 'global' };
  }
  const elo = String(key).match(/^elo_custom_(\d+)_(\d+)$/);
  if (elo) {
    const bonus = Number(`${elo[1]}.${elo[2]}`);
    return { label: `Booster ELO x${(1 + bonus).toFixed(2)}`, multiplier: Number((1 + bonus).toFixed(2)), type: 'elo' };
  }
  const coins = String(key).match(/^coin_custom_(\d{1,2})$/);
  if (coins) {
    const multiplier = Number(coins[1]);
    return { label: `Booster Coins x${multiplier}`, multiplier, type: 'coins' };
  }
  return null;
}

  unifraktur: 'mythic', medieval: 'mythic', eaglelake: 'mythic', uncial: 'mythic', jacquard: 'mythic', metalmania: 'mythic', creepster: 'mythic', imfell: 'mythic',
};
const PSEUDO_FONT_RARITY_LABELS = {
  all: 'Toutes',
  common: 'Commun',
  rare: 'Rare',
  epic: 'Epique',
  legendary: 'Legendaire',
  mythic: 'Mythique',
};
const PSEUDO_FONT_RARITY_COLORS = {
  all: '#85EBFF',
  common: '#8e8e93',
  rare: '#5ac8fa',
  epic: '#bf5af2',
  legendary: '#ffd60a',
  mythic: '#ff2d55',
};

function rarityStyle(rarity = 'common') {
  const color = PSEUDO_FONT_RARITY_COLORS[rarity] || PSEUDO_FONT_RARITY_COLORS.common;
  return `--rarity-color:${color};--rarity-border:${color}66;--rarity-bg:${color}18;--rarity-glow:${color}24`;
}

function getPseudoFontLabel(font) {
  const key = String(font || 'barlow');
  for (const group of PSEUDO_FONT_GROUPS) {
    const found = group.fonts.find(([value]) => value === key);
    if (found) return found[1];
  }
  return 'Barlow';
}

function normalizePseudoPickerFont(font) {
  const key = String(font || 'barlow');
  return PSEUDO_FONT_GROUPS.some(group => group.fonts.some(([value]) => value === key)) ? key : 'barlow';
}

function renderPseudoFontPreviewGrid(selected = 'barlow', previewText = 'Pseudo') {
  const current = normalizePseudoPickerFont(selected);
  const sample = escapeHtml(String(previewText || 'Pseudo').slice(0, 16));
  const fonts = PSEUDO_FONT_GROUPS.flatMap(group => group.fonts);
  return `<div class="pseudo-font-filter-row">
      ${Object.entries(PSEUDO_FONT_RARITY_LABELS).map(([key, label], index) => `<button type="button" class="pseudo-font-filter ${index === 0 ? 'active' : ''}" data-font-filter="${key}" onclick="filterPseudoFonts('${key}')" style="${rarityStyle(key)}">${escapeHtml(label)}</button>`).join('')}
    </div>
    <div class="pseudo-font-scroll">
      <div class="pseudo-font-preview-grid">
      ${fonts.map(([value, label]) => {
        const rarity = PSEUDO_FONT_RARITIES[value] || 'common';
        const pack = getProfileCosmeticPack('font', value);
        const unlocked = value === 'barlow' || ownsProfileCosmetic('font', value);
        const title = unlocked ? label : `${label} - ${pack?.label || 'Pack boutique requis'}`;
        return `<button type="button" class="pseudo-font-option ${current === value ? 'active' : ''} ${unlocked ? '' : 'locked'}" data-pseudo-font="${value}" data-font-rarity="${rarity}" ${unlocked ? `onclick="selectPseudoFont('${value}')"` : 'disabled'} title="${escapeHtml(title)}" style="${rarityStyle(rarity)}">
          <strong style="font-family:${getPseudoFontFamily(value)}">${sample}</strong>
          <span>${escapeHtml(label)} · ${unlocked ? escapeHtml(PSEUDO_FONT_RARITY_LABELS[rarity]) : `🔒 ${escapeHtml(pack?.label || 'Boutique')}`}</span>
        </button>`;
      }).join('')}
      </div>
    </div>`;
}

function renderPseudoFontPicker(selected = 'barlow', previewText = 'Pseudo') {
  const current = normalizePseudoPickerFont(selected);
  const sample = escapeHtml(String(previewText || 'Pseudo').slice(0, 16));
  return `<input type="hidden" id="pseudo-style-font-input" value="${escapeHtml(current)}">
    <div class="pseudo-font-picker-row">
      <div class="pseudo-font-current" id="pseudo-font-current">
        <strong style="font-family:${getPseudoFontFamily(current)}">${sample}</strong>
        <span>${escapeHtml(getPseudoFontLabel(current))}</span>
      </div>
      <button class="btn-save-color" type="button" onclick="openPseudoFontPicker()" style="background:rgba(133,235,255,.10);border-color:rgba(133,235,255,.30);color:#85EBFF">🔠 Choisir une police</button>
    </div>
    <div class="pseudo-font-modal-bg" id="pseudo-font-modal-bg" onclick="if(event.target===this)closePseudoFontPicker()">
      <div class="pseudo-font-modal">
        <div class="pseudo-font-modal-head">
          <div>
            <div class="pseudo-font-modal-title">Choisir une police</div>
            <div class="pseudo-font-modal-sub">Apercu direct avec ton pseudo. La selection reste en attente jusqu'au bouton Style.</div>
          </div>
          <button class="pseudo-font-modal-close" type="button" onclick="closePseudoFontPicker()">×</button>
        </div>
        ${renderPseudoFontPreviewGrid(current, previewText)}
        <div class="pseudo-font-modal-actions">
          <span>La police choisie sera sauvegardee avec le bouton Style.</span>
          <button class="btn-save-color" type="button" onclick="closePseudoFontPicker()" style="background:rgba(133,235,255,.10);border-color:rgba(133,235,255,.30);color:#85EBFF">Valider le choix</button>
        </div>
      </div>
    </div>`;
}

function getPseudoDisplayStyle(player = currentPlayer) {
  const color1 = /^#[0-9a-fA-F]{6}$/.test(String(player?.pseudo_color || '')) ? String(player.pseudo_color).toUpperCase() : '';
  const color2 = /^#[0-9a-fA-F]{6}$/.test(String(player?.pseudo_color_secondary || '')) ? String(player.pseudo_color_secondary).toUpperCase() : '';
  const font = getPseudoFontFamily(player?.pseudo_font);
  const formats = new Set(String(player?.pseudo_format || '').split(',').filter(Boolean));
  const styles = [
    `font-family:${font}`,
    `font-weight:${formats.has('bold') ? '900' : '700'}`,
    `font-style:${formats.has('italic') ? 'italic' : 'normal'}`,
    `text-decoration:${formats.has('underline') ? 'underline' : 'none'}`,
    `text-transform:${formats.has('lowercase') ? 'lowercase' : formats.has('uppercase') ? 'uppercase' : 'none'}`,
  ];
  if (color1 && color2) styles.push(`background:linear-gradient(90deg,${color1},${color2})`, '-webkit-background-clip:text', 'background-clip:text', 'color:transparent', 'text-shadow:none');
  else if (color1) styles.push(`color:${color1}`);
  return styles.join(';');
}

function applyPseudoDisplay(element, player = currentPlayer) {
  if (!element) return;
  element.setAttribute('style', getPseudoDisplayStyle(player));
  element.classList.toggle('pseudo-rgb-wave', Number(player?.pseudo_rgb || 0) === 1);
}

function syncPseudoRgbPreviews(enabled) {
  const active = Boolean(enabled);
  document.querySelectorAll('.shape-btn[data-shape="emoji"] .shape-preview, .shape-btn[data-shape="emoji_image"] .shape-preview, #token-emoji-preview')
    .forEach(element => element.classList.toggle('shape-rgb-wave', active));
}

function getPremiumTier(player = currentPlayer) {
  if (Number(player?.is_bot) === 1) return 'bot';
  if (Number(player?.is_crystal) === 1) return 'crystal';
  if (isPerso(player)) return 'perso';
  if (isVipPlus(player)) return 'vip_plus';
  if (Number(player?.is_vip) === 1) return 'vip';
  return null;
}

function getVipAccent(player = currentPlayer) {
  return isVipPlus(player)
    ? { color: '#85EBFF', bg: 'rgba(133,235,255,0.14)', border: 'rgba(133,235,255,0.42)', label: 'VIP+' }
    : { color: '#ffd60a', bg: 'rgba(255,214,10,0.14)', border: 'rgba(255,214,10,0.32)', label: 'VIP' };
}

const VIP_BADGE_TIERS = [
  { minMs: 36 * 30 * 24 * 60 * 60 * 1000, src: '/badges/vip-star-3y.png', glow: 'rgba(47,128,255,.55)', title: 'VIP 3 ans' },
  { minMs: 12 * 30 * 24 * 60 * 60 * 1000, src: '/badges/vip-star-1y.png', glow: 'rgba(67,214,92,.50)', title: 'VIP 1 an' },
  { minMs: 6 * 30 * 24 * 60 * 60 * 1000, src: '/badges/vip-star-6m.png', glow: 'rgba(255,77,170,.50)', title: 'VIP 6 mois' },
  { minMs: 3 * 30 * 24 * 60 * 60 * 1000, src: '/badges/vip-star-3m.png', glow: 'rgba(255,216,77,.55)', title: 'VIP 3 mois' },
  { minMs: 0, src: '/badges/vip-star-1m.png', glow: 'rgba(255,77,109,.50)', title: 'VIP 1 mois' },
];

function getVipBadgeTier(player = currentPlayer) {
  if (isVipPlus(player) || isPerso(player) || String(player?.role || '') === 'admin') return VIP_BADGE_TIERS[0];
  const expiresAt = Number(player?.vip_expires_at || 0);
  const remaining = expiresAt ? Math.max(0, expiresAt - Date.now()) : 0;
  return VIP_BADGE_TIERS.find(tier => remaining >= tier.minMs) || VIP_BADGE_TIERS[VIP_BADGE_TIERS.length - 1];
}

function renderVipBadge(player = currentPlayer) {
  if (Number(player?.is_bot) === 1) return '';
  if (Number(player?.is_crystal) === 1) {
    return `<span class="profile-badge crystal" title="Crystal">
      <img src="/assets/crystal-badge.png" alt="Crystal" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'badge-icon',textContent:'◆'}))">
      Crystal
    </span>`;
  }
  if (!isVip(player)) return '';
  const accent = getVipAccent(player);
  const tier = getVipBadgeTier(player);
  const cls = isVipPlus(player) ? 'vip-plus' : 'vip';
  return `<span class="profile-badge ${cls}" style="--badge-color:${accent.color};--badge-bg:${accent.bg};--badge-border:${accent.border};--badge-glow:${tier.glow}" title="${escapeHtml(tier.title)}">
    <img src="${tier.src}" alt="${escapeHtml(tier.title)}">${accent.label}
  </span>`;
}

function renderBotBadge(player = currentPlayer) {
  if (Number(player?.is_bot) !== 1) return '';
  const enabled = Number(player?.bot_enabled ?? 1) === 1;
  const label = enabled ? 'BOT' : 'BOT SUSPENDU';
  return `<span class="profile-badge bot" title="${escapeHtml(label)}"><span class="badge-icon">🤖</span>${label}</span>`;
}

function renderResultMiniStats(wins = 0, losses = 0, draws = 0, wr = 0) {
  return `<span class="mini-result-stats">
    <span class="mini-result-chip"><img src="/badges/stat-victory.webp" alt="Victoires">${Number(wins || 0)}</span>
    <span class="mini-result-chip"><img src="/badges/stat-defeat.webp" alt="Défaites">${Number(losses || 0)}</span>
    <span class="mini-result-chip"><img src="/badges/stat-draw.webp" alt="Nuls">${Number(draws || 0)}</span>
    <span>${Number(wr || 0)}% WR</span>
