<body>
  <main class="shell">
    <nav class="topbar"><a class="brand" href="/">Puissance <b>4</b></a><a class="back" id="profile-link" href="/">← Accueil</a></nav>
    <header class="hero"><div><div class="eyebrow">Historique non archivé</div><h1 id="history-title">Toutes les parties</h1><p>Filtre les résultats et ouvre chaque partie dans le lecteur de replay.</p><form class="player-switch" id="player-switch"><input class="control" id="player-search" type="search" placeholder="Voir les parties d’un joueur…" autocomplete="off" aria-autocomplete="list" aria-controls="player-autocomplete"><button type="submit">Afficher</button><div class="player-autocomplete" id="player-autocomplete" role="listbox" hidden></div></form><div class="player-switch-error" id="player-switch-error"></div></div><div class="hero-actions"><div class="counter"><span id="total-count">—</span><small>parties trouvées</small></div><a class="archive-download" id="archive-download" href="#" download hidden>↓ Sauvegarder les parties (.zip)</a></div></header>
    <section class="panel">
      <form class="filters" id="filters-form">
        <input class="control" id="opponent" type="search" placeholder="Rechercher un adversaire…" autocomplete="off">
        <select class="control" id="result"><option value="all">Tous les résultats</option><option value="win">Victoires</option><option value="loss">Défaites</option><option value="draw">Nulles</option></select>
        <select class="control" id="type"><option value="all">Tous les modes</option><option value="ranked">Classé</option><option value="friendly">Amical</option></select>
        <select class="control" id="kind"><option value="all">Humains et bots</option><option value="human">Humains</option><option value="bot">Bots</option></select>
        <select class="control" id="variant"><option value="all">Toutes les variantes</option><option value="classic">Classique</option><option value="rotate">Plateau rotatif</option><option value="anti">Anti-P4</option><option value="bomb">Puissance Bombe</option><option value="mission">Mission personnelle</option><option value="simultaneous">Placement simultané</option><option value="fog">Brouillard de Guerre</option><option value="conquest">Conquête</option><option value="naval">Puissance 4 Navale</option><option value="tetris">p4-Tetris</option></select>
        <button class="reset" type="button" id="reset">Réinitialiser</button>
      </form>
      <div class="list" id="games-list"><div class="loading">Chargement des parties…</div></div>
    </section>
    <div class="pager" id="pager"></div><div class="summary" id="summary"></div>
  </main>
  <div class="game-preview" id="game-preview" role="tooltip" aria-hidden="true"></div>
  <script>
    const labels={classic:'Classique',rotate:'Rotatif',anti:'Anti-P4',bomb:'Bombe',mission:'Mission',simultaneous:'Simultané',fog:'Brouillard',conquest:'Conquête',naval:'Naval',tetris:'p4-Tetris'};
    const state={playerId:null,page:1,pages:1,total:0,timer:null,playerTimer:null,suggestions:[],suggestionIndex:-1,previewId:null,previewTimer:null,previewCache:new Map()};
    const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function resolvePlayer(){const direct=Number(new URLSearchParams(location.search).get('player'));return direct||null}
    function query(){const q=new URLSearchParams({page:String(state.page),limit:'30',result:$('result').value,type:$('type').value,kind:$('kind').value,variant:$('variant').value});const opponent=$('opponent').value.trim();if(opponent)q.set('opponent',opponent);return q}
    function syncScopeUi(){const global=!state.playerId,result=$('result'),loss=result.querySelector('option[value="loss"]');result.querySelector('option[value="win"]').textContent=global?'Avec un gagnant':'Victoires';result.querySelector('option[value="draw"]').textContent=global?'Matchs nuls':'Nulles';loss.hidden=global;loss.disabled=global;if(global&&result.value==='loss')result.value='all';$('opponent').placeholder=global?'Rechercher un joueur…':'Rechercher un adversaire…'}
    function parseGameDate(value){if(value==null||value==='')return null;if(typeof value==='number'||/^\d{10,13}$/.test(String(value))){const n=Number(value);return new Date(n<1e12?n*1000:n)}const raw=String(value).trim();return new Date(raw.includes('T')?raw:`${raw.replace(' ','T')}Z`)}
    function gameHtml(g,player){const scoped=Boolean(player),isP1=scoped&&Number(g.player1_id)===Number(player.id),draw=g.winner_id==null,win=scoped&&!draw&&Number(g.winner_id)===Number(player.id),result=draw?'draw':scoped?(win?'win':'loss'):'win',icon=draw?'stat-draw.webp':scoped&&!win?'stat-defeat.webp':'stat-victory.webp',delta=Number(isP1?g.elo_p1:g.elo_p2)||0,date=parseGameDate(g.finished_at||g.created_at),validDate=Boolean(date&&!Number.isNaN(date.getTime())),dateDay=validDate?date.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'Date inconnue',dateTime=validDate?date.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'',badge=isBot=>`<span class="entity-badge${isBot?' bot':''}">${isBot?'BOT':'USER'}</span>`,matchTitle=`<div class="duel-line"><span class="duel-player"><span class="duel-name">${esc(g.p1_pseudo)}</span>${badge(Number(g.p1_is_bot)===1)}</span><span class="duel-vs">VS</span><span class="duel-player"><span class="duel-name">${esc(g.p2_pseudo)}</span>${badge(Number(g.p2_is_bot)===1)}</span></div>`,eloText=scoped?`${delta>=0?'+':''}${delta} ELO`:(draw?'Match nul':`${esc(g.winner_pseudo||'Gagnant')}`),eloClass=scoped?(delta>=0?'up':'down'):'up';return `<a class="game" data-game-id="${Number(g.id)}" href="/replay/${Number(g.id)}" aria-describedby="game-preview"><div class="result ${result}"><img src="/badges/${icon}" alt="${result}"></div><div>${matchTitle}<span class="game-meta">#${Number(g.id)} · ${Number(g.move_count||0)} coups · ${Number(g.duration||0)} s</span></div><div class="chips"><span class="chip variant">${esc(labels[g.variant]||labels.classic)}</span><span class="chip">${g.game_type==='friendly'?'Amical':'Classé'}</span></div><div class="elo ${eloClass}">${eloText}</div><time class="game-date" datetime="${validDate?date.toISOString():''}">${dateDay}<small>${dateTime}</small></time><div class="replay" title="Ouvrir le replay">Replay</div></a>`}
    function previewDimensions(variant){return {rotate:[7,7],anti:[9,9],mission:[7,7]}[variant]||[6,7]}
    function finalBoard(data){const game=data.game||{},[rows,cols]=previewDimensions(String(game.variant||'classic')),board=Array.from({length:rows},()=>Array(cols).fill(0)),moves=[...(data.moves||[])].sort((a,b)=>Number(a.move_number)-Number(b.move_number)),actions=[...(data.actions||[])].sort((a,b)=>Number(a.action_number)-Number(b.action_number));let actionIndex=0,moveIndex=0;const applyAction=action=>{const payload=typeof action.payload==='string'?(()=>{try{return JSON.parse(action.payload)}catch{return {}}})():(action.payload||{}),snapshot=payload.board||payload.grid;if(Array.isArray(snapshot))for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)board[r][c]=Number(snapshot?.[r]?.[c]||0)};while(moveIndex<moves.length){const number=Number(moves[moveIndex].move_number||moveIndex+1);while(moveIndex<moves.length&&Number(moves[moveIndex].move_number||moveIndex+1)===number){const move=moves[moveIndex++],row=Number(move.row),col=Number(move.col);if(row>=0&&row<rows&&col>=0&&col<cols)board[row][col]=Number(move.player_id)===Number(game.player1_id)?1:2}while(actionIndex<actions.length&&Number(actions[actionIndex].action_number||0)<=number)applyAction(actions[actionIndex++])}while(actionIndex<actions.length)applyAction(actions[actionIndex++]);return {board,rows,cols,game}}
    function safePreviewColor(value,fallback){return /^#[0-9a-f]{6}$/i.test(String(value||''))?String(value):fallback}
    function previewHtml(data){const result=finalBoard(data),game=result.game,p1=safePreviewColor(game.p1_color,'#ff2d55'),p2=safePreviewColor(game.p2_color,'#ffd60a'),cells=result.board.flat().map(value=>`<span class="preview-cell${value===1?' p1':value===2?' p2':''}"></span>`).join('');return `<div class="game-preview-title">Grille finale <span>${esc(labels[game.variant]||labels.classic)}</span></div><div class="preview-board" style="--preview-cols:${result.cols};--preview-p1:${p1};--preview-p2:${p2}">${cells}</div>`}
    function positionGamePreview(x,y){const preview=$('game-preview'),gap=14,width=preview.offsetWidth||230,height=preview.offsetHeight||190;let left=x+gap,top=y+gap;if(left+width>innerWidth-10)left=x-width-gap;if(top+height>innerHeight-10)top=y-height-gap;preview.style.left=`${Math.max(10,left)}px`;preview.style.top=`${Math.max(10,top)}px`}
    async function showGamePreview(row,event){clearTimeout(state.previewTimer);const id=String(row.dataset.gameId||'');if(!id)return;state.previewId=id;const preview=$('game-preview');preview.hidden=false;preview.setAttribute('aria-hidden','false');preview.innerHTML='<div class="game-preview-loading">Chargement de la grille…</div>';positionGamePreview(event?.clientX||row.getBoundingClientRect().right,event?.clientY||row.getBoundingClientRect().top);requestAnimationFrame(()=>preview.classList.add('show'));try{let data=state.previewCache.get(id);if(!data){const response=await fetch(`/api/games/${encodeURIComponent(id)}/moves`);data=await response.json();if(!response.ok)throw new Error(data.error||'Aperçu indisponible');state.previewCache.set(id,data)}if(state.previewId!==id)return;preview.innerHTML=previewHtml(data);positionGamePreview(event?.clientX||row.getBoundingClientRect().right,event?.clientY||row.getBoundingClientRect().top)}catch(error){if(state.previewId===id)preview.innerHTML=`<div class="game-preview-error">${esc(error.message||'Aperçu indisponible')}</div>`}}
    function hideGamePreview(){clearTimeout(state.previewTimer);state.previewTimer=setTimeout(()=>{state.previewId=null;const preview=$('game-preview');preview.classList.remove('show');preview.setAttribute('aria-hidden','true');setTimeout(()=>{if(!preview.classList.contains('show'))preview.hidden=true},150)},70)}
    function bindGamePreviews(){document.querySelectorAll('.game[data-game-id]').forEach(row=>{row.addEventListener('mouseenter',event=>showGamePreview(row,event));row.addEventListener('mousemove',event=>positionGamePreview(event.clientX,event.clientY));row.addEventListener('mouseleave',hideGamePreview);row.addEventListener('focus',()=>showGamePreview(row));row.addEventListener('blur',hideGamePreview)})}
    async function load(){hideGamePreview();syncScopeUi();$('games-list').innerHTML='<div class="loading">Chargement des parties…</div>';try{const endpoint=state.playerId?`/api/players/${state.playerId}/games`:'/api/games',res=await fetch(`${endpoint}?${query()}`),data=await res.json();if(!res.ok)throw new Error(data.error||'Historique indisponible');state.page=data.page;state.pages=data.pages;state.total=data.total;const player=data.player||null;$('history-title').innerHTML=player?`Parties de <span>${esc(player.pseudo)}</span>`:'Toutes les parties';$('total-count').textContent=Number(data.total).toLocaleString('fr-FR');$('profile-link').href=player?`/profil?id=${player.id}`:'/';$('profile-link').textContent=player?'← Retour au profil':'← Accueil';$('archive-download').href=player?`/api/players/${player.id}/games/export`:'#';$('archive-download').hidden=!player||Number(data.total)===0;document.title=player?`Parties de ${player.pseudo} — Puissance 4`:'Toutes les parties — Puissance 4';$('games-list').innerHTML=data.games.length?data.games.map(g=>gameHtml(g,player)).join(''):'<div class="empty">Aucune partie ne correspond à ces filtres.</div>';bindGamePreviews();renderPager()}catch(e){$('games-list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    function renderPager(){const box=$('pager');box.innerHTML='';const add=(label,page,disabled=false,active=false)=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.className=active?'active':'';b.onclick=()=>{state.page=page;load();scrollTo({top:0,behavior:'smooth'})};box.appendChild(b)};add('←',state.page-1,state.page===1);for(let p=1;p<=state.pages;p++){if(state.pages>7&&p>2&&p<state.pages-1&&Math.abs(p-state.page)>1)continue;add(String(p),p,false,p===state.page)}add('→',state.page+1,state.page===state.pages);$('summary').textContent=`Page ${state.page} sur ${state.pages} · ${state.total} partie${state.total>1?'s':''} non archivée${state.total>1?'s':''}`}
    async function switchPlayer(event){event.preventDefault();const pseudo=$('player-search').value.trim(),error=$('player-switch-error');error.textContent='';if(!pseudo){state.playerId=null;state.page=1;history.replaceState(null,'','/games.html');return load()}try{const res=await fetch(`/api/players/by-pseudo/${encodeURIComponent(pseudo)}`),player=await res.json().catch(()=>({}));if(!res.ok||!player.id)throw new Error(player.error||'Joueur introuvable');state.playerId=Number(player.id);state.page=1;history.replaceState(null,'',`/games.html?player=${state.playerId}`);$('player-search').value='';await load()}catch(e){error.textContent=e.message||'Joueur introuvable'}}
    function closePlayerAutocomplete(){state.suggestionIndex=-1;$('player-autocomplete').hidden=true}
    function choosePlayerSuggestion(index){const player=state.suggestions[index];if(!player)return;$('player-search').value=player.pseudo;closePlayerAutocomplete();$('player-switch').requestSubmit()}
    function renderPlayerAutocomplete(players){const box=$('player-autocomplete');state.suggestions=players;state.suggestionIndex=-1;if(!players.length){box.innerHTML='<div style="padding:10px;color:rgba(238,238,245,.45);font-size:11px">Aucun joueur trouvé</div>';box.hidden=false;return}box.innerHTML=players.map((player,index)=>`<button class="player-suggestion" type="button" role="option" data-player-index="${index}">${player.avatar?`<img class="player-suggestion-avatar" src="${esc(player.avatar)}" alt="">`:`<span class="player-suggestion-avatar" style="display:grid;place-items:center;color:${esc(player.color||'#ff2d55')}">${esc(player.pseudo[0]||'?')}</span>`}<span class="player-suggestion-copy"><strong>${esc(player.pseudo)}${Number(player.is_bot||0)===1?'<span class="player-bot">BOT</span>':''}</strong><small>${Number(player.elo||0)} ELO</small></span></button>`).join('');box.hidden=false;box.querySelectorAll('[data-player-index]').forEach(button=>button.onclick=()=>choosePlayerSuggestion(Number(button.dataset.playerIndex)))}
    function searchPlayerSuggestions(value){clearTimeout(state.playerTimer);const q=value.trim();if(q.length<3){closePlayerAutocomplete();return}state.playerTimer=setTimeout(async()=>{try{const res=await fetch(`/api/players/search?q=${encodeURIComponent(q)}&includeBots=1`),players=await res.json().catch(()=>[]);renderPlayerAutocomplete(res.ok&&Array.isArray(players)?players:[])}catch{closePlayerAutocomplete()}},180)}
    function onPlayerSearchKey(event){const items=[...$('player-autocomplete').querySelectorAll('.player-suggestion')];if(event.key==='Escape'){closePlayerAutocomplete();return}if(!items.length)return;if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();state.suggestionIndex=event.key==='ArrowDown'?Math.min(state.suggestionIndex+1,items.length-1):Math.max(state.suggestionIndex-1,0);items.forEach((item,index)=>item.classList.toggle('active',index===state.suggestionIndex));items[state.suggestionIndex]?.scrollIntoView({block:'nearest'})}else if(event.key==='Enter'&&state.suggestionIndex>=0){event.preventDefault();choosePlayerSuggestion(state.suggestionIndex)}}
    $('filters-form').addEventListener('change',()=>{state.page=1;load()});$('opponent').addEventListener('input',()=>{clearTimeout(state.timer);state.timer=setTimeout(()=>{state.page=1;load()},250)});$('reset').onclick=()=>{$('filters-form').reset();state.page=1;load()};$('player-switch').addEventListener('submit',switchPlayer);$('player-search').addEventListener('input',event=>searchPlayerSuggestions(event.target.value));$('player-search').addEventListener('keydown',onPlayerSearchKey);document.addEventListener('click',event=>{if(!event.target.closest('.player-switch'))closePlayerAutocomplete()});state.playerId=resolvePlayer();load();
  </script>
