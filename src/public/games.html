<!doctype html>
<html lang="fr">
<head>
  <script src="/performance-bootstrap.js?v=1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Historique des parties — Puissance 4</title>
  <link rel="icon" type="image/png" href="/assets/site-logo-small.png">
  <style>
    @font-face{font-family:Barlow;src:url('/assets/fonts/Barlow-Regular.ttf')}@font-face{font-family:'Barlow Condensed';src:url('/assets/fonts/BarlowCondensed-Bold.ttf');font-weight:800}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06060e;color:#eeeef5;font-family:Barlow,system-ui,sans-serif}body{background-image:radial-gradient(circle at 12% 8%,rgba(255,45,85,.14),transparent 25rem),radial-gradient(circle at 88% 12%,rgba(76,110,245,.16),transparent 30rem),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,auto,48px 48px,48px 48px;background-attachment:fixed}
    button,input,select{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:26px 0 70px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{color:#fff;text-decoration:none;font:800 24px 'Barlow Condensed';letter-spacing:2px;text-transform:uppercase}.brand b{color:#ff2d55}.back{padding:10px 14px;border:1px solid rgba(255,255,255,.11);border-radius:12px;color:#eeeef5;text-decoration:none;background:rgba(255,255,255,.04);font:800 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:42px 0 22px}.eyebrow{color:#85ebff;font:800 11px 'Barlow Condensed';letter-spacing:3px;text-transform:uppercase}.hero h1{margin:6px 0 4px;font:800 clamp(38px,7vw,76px)/.92 'Barlow Condensed';letter-spacing:-1px;text-transform:uppercase}.hero p{margin:0;color:rgba(238,238,245,.5)}.counter{font:800 48px 'Barlow Condensed';color:#ffd60a;text-align:right}.counter small{display:block;font:800 10px Barlow;letter-spacing:2px;color:rgba(238,238,245,.38);text-transform:uppercase}.player-switch{display:flex;align-items:center;gap:8px;width:min(470px,100%);margin-top:17px}.player-switch .control{background:rgba(16,16,32,.86)}.player-switch button{height:44px;padding:0 16px;border:1px solid rgba(133,235,255,.27);border-radius:12px;background:rgba(133,235,255,.09);color:#aaf3ff;cursor:pointer;font:800 12px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}.player-switch-error{min-height:16px;margin-top:5px;color:#ff7892;font-size:11px}
    .panel{border:1px solid rgba(255,255,255,.08);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.016));box-shadow:0 28px 80px rgba(0,0,0,.28);overflow:hidden}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px;padding:16px;border-bottom:1px solid rgba(255,255,255,.07)}.control{width:100%;height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:#101020;color:#eeeef5;outline:none}.control:focus{border-color:rgba(133,235,255,.5);box-shadow:0 0 0 3px rgba(133,235,255,.08)}.reset{padding:0 15px;border:1px solid rgba(255,45,85,.24);border-radius:12px;background:rgba(255,45,85,.08);color:#ff8299;cursor:pointer;font:800 12px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}
    .list{display:grid}.game{display:grid;grid-template-columns:48px minmax(170px,1fr) auto auto 108px auto;align-items:center;gap:16px;padding:17px 18px;color:#eeeef5;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.055);transition:.18s ease}.game:last-child{border-bottom:0}.game:hover{background:rgba(133,235,255,.045);padding-left:22px}.result{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:900}.result img{width:25px;height:25px;object-fit:contain}.result.win{background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.26)}.result.loss{background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.26)}.result.draw{background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.26)}.opponent strong{display:block;font:800 18px 'Barlow Condensed';letter-spacing:.5px}.opponent span,.meta{display:block;margin-top:3px;color:rgba(238,238,245,.42);font-size:11px}.chips{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}.chip{padding:5px 8px;border:1px solid rgba(255,255,255,.09);border-radius:8px;background:rgba(255,255,255,.035);font:800 10px 'Barlow Condensed';letter-spacing:.6px;text-transform:uppercase}.chip.variant{color:#85ebff;border-color:rgba(133,235,255,.2)}.elo{font:800 17px 'Barlow Condensed';min-width:66px;text-align:right}.elo.up{color:#30d158}.elo.down{color:#ff5c78}.game-date{text-align:right;color:rgba(238,238,245,.7);font:800 12px 'Barlow Condensed';letter-spacing:.5px}.game-date small{display:block;margin-top:2px;color:rgba(238,238,245,.35);font:500 10px Barlow}.replay{padding:9px 12px;border-radius:10px;background:rgba(76,110,245,.13);border:1px solid rgba(76,110,245,.28);color:#b9c4ff;font:800 11px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}
    .empty,.loading{padding:64px 18px;text-align:center;color:rgba(238,238,245,.45)}.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px}.pager button{min-width:40px;height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.035);color:#eeeef5;cursor:pointer}.pager button.active{background:#ff2d55;border-color:#ff2d55}.pager button:disabled{opacity:.35;cursor:not-allowed}.summary{text-align:center;margin-top:10px;color:rgba(238,238,245,.36);font-size:11px}
    @media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.reset{height:44px}.game{grid-template-columns:44px 1fr auto}.chips{grid-column:2/-1;justify-content:flex-start}.elo{grid-column:2}.game-date{grid-column:2;text-align:left}.replay{grid-column:3;grid-row:2}.hero{align-items:flex-start;flex-direction:column}.counter{text-align:left}}
    @media(max-width:560px){.shell{width:min(100% - 20px,1180px)}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.player-switch{align-items:stretch;flex-direction:column}.player-switch button{width:100%}.game{gap:10px;padding:14px 12px}.chips{grid-column:1/-1}.replay{font-size:0;padding:9px}.replay::after{content:'↗';font-size:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar"><a class="brand" href="/">Puissance <b>4</b></a><a class="back" id="profile-link" href="/profil-beta">← Retour au profil</a></nav>
    <header class="hero"><div><div class="eyebrow">Historique non archivé</div><h1>Parties de <span id="player-name">…</span></h1><p>Filtre les résultats et ouvre chaque partie dans le lecteur de replay.</p><form class="player-switch" id="player-switch"><input class="control" id="player-search" type="search" placeholder="Voir les parties d’un autre joueur…" autocomplete="off"><button type="submit">Afficher</button></form><div class="player-switch-error" id="player-switch-error"></div></div><div class="counter"><span id="total-count">—</span><small>parties trouvées</small></div></header>
    <section class="panel">
      <form class="filters" id="filters-form">
        <input class="control" id="opponent" type="search" placeholder="Rechercher un adversaire…" autocomplete="off">
        <select class="control" id="result"><option value="all">Tous les résultats</option><option value="win">Victoires</option><option value="loss">Défaites</option><option value="draw">Nulles</option></select>
        <select class="control" id="type"><option value="all">Tous les modes</option><option value="ranked">Classé</option><option value="friendly">Amical</option></select>
        <select class="control" id="kind"><option value="all">Humains et bots</option><option value="human">Humains</option><option value="bot">Bots</option></select>
        <select class="control" id="variant"><option value="all">Toutes les variantes</option><option value="classic">Classique</option><option value="rotate">Plateau rotatif</option><option value="anti">Anti-P4</option><option value="bomb">Puissance Bombe</option><option value="mission">Mission personnelle</option><option value="simultaneous">Placement simultané</option><option value="fog">Brouillard de Guerre</option><option value="conquest">Conquête</option><option value="naval">Puissance 4 Navale</option></select>
        <button class="reset" type="button" id="reset">Réinitialiser</button>
      </form>
      <div class="list" id="games-list"><div class="loading">Chargement des parties…</div></div>
    </section>
    <div class="pager" id="pager"></div><div class="summary" id="summary"></div>
  </main>
  <script>
    const labels={classic:'Classique',rotate:'Rotatif',anti:'Anti-P4',bomb:'Bombe',mission:'Mission',simultaneous:'Simultané',fog:'Brouillard',conquest:'Conquête',naval:'Naval'};
    const state={playerId:null,page:1,pages:1,total:0,timer:null};
    const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function resolvePlayer(){const q=new URLSearchParams(location.search);const direct=Number(q.get('player'));if(direct)return direct;try{const p=JSON.parse(localStorage.getItem('player')||sessionStorage.getItem('player')||'{}');return Number(p.id)||null}catch{return null}}
    function query(){const q=new URLSearchParams({page:String(state.page),limit:'20',result:$('result').value,type:$('type').value,kind:$('kind').value,variant:$('variant').value});const opponent=$('opponent').value.trim();if(opponent)q.set('opponent',opponent);return q}
    function parseGameDate(value){if(value==null||value==='')return null;if(typeof value==='number'||/^\d{10,13}$/.test(String(value))){const n=Number(value);return new Date(n<1e12?n*1000:n)}const raw=String(value).trim();return new Date(raw.includes('T')?raw:`${raw.replace(' ','T')}Z`)}
    function gameHtml(g,player){const isP1=Number(g.player1_id)===Number(player.id),opp=isP1?g.p2_pseudo:g.p1_pseudo,draw=g.winner_id==null,win=!draw&&Number(g.winner_id)===Number(player.id),result=draw?'draw':win?'win':'loss',icon=draw?'stat-draw.webp':win?'stat-victory.webp':'stat-defeat.webp',delta=Number(isP1?g.elo_p1:g.elo_p2)||0,date=parseGameDate(g.finished_at||g.created_at),validDate=Boolean(date&&!Number.isNaN(date.getTime())),dateDay=validDate?date.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'Date inconnue',dateTime=validDate?date.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';return `<a class="game" href="/replay/${Number(g.id)}"><div class="result ${result}"><img src="/badges/${icon}" alt="${result}"></div><div class="opponent"><strong>vs ${esc(opp)}${Number(isP1?g.p2_is_bot:g.p1_is_bot)===1?' <span class="chip">BOT</span>':''}</strong><span>#${Number(g.id)} · ${Number(g.move_count||0)} coups · ${Number(g.duration||0)} s</span></div><div class="chips"><span class="chip variant">${esc(labels[g.variant]||labels.classic)}</span><span class="chip">${g.game_type==='friendly'?'Amical':'Classé'}</span></div><div class="elo ${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta} ELO</div><time class="game-date" datetime="${validDate?date.toISOString():''}">${dateDay}<small>${dateTime}</small></time><div class="replay" title="Ouvrir le replay">Replay</div></a>`}
    async function load(){if(!state.playerId){$('games-list').innerHTML='<div class="empty">Connecte-toi ou ouvre cette page depuis un profil.</div>';return}$('games-list').innerHTML='<div class="loading">Chargement des parties…</div>';try{const res=await fetch(`/api/players/${state.playerId}/games?${query()}`),data=await res.json();if(!res.ok)throw new Error(data.error||'Historique indisponible');state.page=data.page;state.pages=data.pages;state.total=data.total;$('player-name').textContent=data.player.pseudo;$('total-count').textContent=Number(data.total).toLocaleString('fr-FR');$('profile-link').href=`/profil-beta?id=${data.player.id}`;document.title=`Parties de ${data.player.pseudo} — Puissance 4`;$('games-list').innerHTML=data.games.length?data.games.map(g=>gameHtml(g,data.player)).join(''):'<div class="empty">Aucune partie ne correspond à ces filtres.</div>';renderPager()}catch(e){$('games-list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    function renderPager(){const box=$('pager');box.innerHTML='';const add=(label,page,disabled=false,active=false)=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.className=active?'active':'';b.onclick=()=>{state.page=page;load();scrollTo({top:0,behavior:'smooth'})};box.appendChild(b)};add('←',state.page-1,state.page===1);for(let p=1;p<=state.pages;p++){if(state.pages>7&&p>2&&p<state.pages-1&&Math.abs(p-state.page)>1)continue;add(String(p),p,false,p===state.page)}add('→',state.page+1,state.page===state.pages);$('summary').textContent=`Page ${state.page} sur ${state.pages} · ${state.total} partie${state.total>1?'s':''} non archivée${state.total>1?'s':''}`}
    async function switchPlayer(event){event.preventDefault();const pseudo=$('player-search').value.trim(),error=$('player-switch-error');error.textContent='';if(!pseudo)return;try{const res=await fetch(`/api/players/by-pseudo/${encodeURIComponent(pseudo)}`),player=await res.json().catch(()=>({}));if(!res.ok||!player.id)throw new Error(player.error||'Joueur introuvable');state.playerId=Number(player.id);state.page=1;history.replaceState(null,'',`/games.html?player=${state.playerId}`);$('player-search').value='';await load()}catch(e){error.textContent=e.message||'Joueur introuvable'}}
    $('filters-form').addEventListener('change',()=>{state.page=1;load()});$('opponent').addEventListener('input',()=>{clearTimeout(state.timer);state.timer=setTimeout(()=>{state.page=1;load()},250)});$('reset').onclick=()=>{$('filters-form').reset();state.page=1;load()};$('player-switch').addEventListener('submit',switchPlayer);state.playerId=resolvePlayer();load();
  </script>
  <script src="/theme.js?v=eggs-33"></script>
</body>
</html>
