<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puissance 4 — Mot de passe oublié</title>
<link rel="icon" type="image/png" href="/assets/site-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060e;--surface:#0d0d1c;--surface2:#13132a;--border:rgba(255,255,255,0.06);--text:#eeeef5;--muted:rgba(238,238,245,0.38);--red:#ff2d55;--accent:#4c6ef5}
html,body{min-height:100%;background:var(--bg); background-attachment: fixed;color:var(--text);font-family:'Barlow',sans-serif;display:flex;align-items:center;justify-content:center}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}
.card{position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;margin:20px}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:28px;text-decoration:none;color:var(--text);display:flex;align-items:center;justify-content:center;gap:10px}
.logo::before{content:"";width:42px;height:42px;border-radius:13px;background:url('/assets/site-logo.png') center/cover no-repeat;border:1px solid rgba(255,255,255,.1)}
.logo span{color:var(--red)}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color 0.2s}
input:focus{border-color:rgba(255,255,255,0.2)}
.btn-discord{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:#5865f2;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity 0.2s;margin-top:8px}
.btn-discord:hover{opacity:0.85}
.discord-icon{width:22px;height:22px;fill:#fff}
.error{background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.3);color:#ff2d55;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center}
.back{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:1px}
.back:hover{color:var(--text)}
@media (max-width:480px){
  html,body{display:block}
  .card{margin:12px;padding:28px 18px;border-radius:18px}
  h1{font-size:22px}
  .sub{font-size:12px;margin-bottom:22px}
  .btn-discord{padding:13px;font-size:15px}
}
</style>
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('p4_theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}})();</script>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="scanlines"></div>
<div class="card">
  <a class="logo" href="/">Puissance <span>4</span></a>
  <h1>Mot de passe oublié</h1>
  <p class="sub">Entre ton pseudo puis connecte-toi via Discord.<br>Tu recevras un code à 6 chiffres en DM.</p>

  <div id="error-box" class="error" style="display:none"></div>

  <div class="field">
    <label>Pseudo</label>
    <input type="text" id="pseudo" placeholder="Ton pseudo..." autocomplete="off">
  </div>

  <button class="btn-discord" onclick="sendDiscord()">
    <svg class="discord-icon" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    Continuer avec Discord
  </button>

  <a class="back" href="/">← Retour à l'accueil</a>
</div>

<script>
const ERRORS = {
  pseudo_manquant:    'Entre ton pseudo avant de continuer.',
  pseudo_introuvable: 'Aucun compte trouvé avec ce pseudo.',
  discord_annulé:     'Connexion Discord annulée.',
  discord_mismatch:   'Ce compte Discord ne correspond pas à celui lié à ce pseudo.',
  discord_token:      'Erreur Discord. Réessaie.',
  discord_id:         'Impossible de récupérer ton compte Discord.',
  dm_impossible:      'Impossible d\'envoyer le DM. Vérifie que tes DMs sont ouverts.',
  erreur_serveur:     'Erreur serveur. Réessaie plus tard.',
};

const params = new URLSearchParams(location.search);
if (params.get('error')) {
  const box = document.getElementById('error-box');
  box.textContent = ERRORS[params.get('error')] || 'Une erreur est survenue.';
  box.style.display = 'block';
}

function sendDiscord() {
  const pseudo = document.getElementById('pseudo').value.trim();
  if (!pseudo) {
    const box = document.getElementById('error-box');
    box.textContent = 'Entre ton pseudo avant de continuer.';
    box.style.display = 'block';
    return;
  }
  window.location.href = '/auth/discord/reset?pseudo=' + encodeURIComponent(pseudo);
}

document.getElementById('pseudo').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendDiscord();
});
</script>
<script src="/theme.js"></script>
<script src="/presence.js"></script>
</body>
</html>
