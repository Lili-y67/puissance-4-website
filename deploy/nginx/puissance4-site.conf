# Exemple de configuration Nginx pour remplacer le 502 brut par une page Puissance 4.
# A adapter sur le VPS: server_name, certificats SSL et port Node.

server {
    listen 80;
    server_name puissance4.croustygame.fr;

    # En prod HTTPS, gardez votre bloc 443 existant et copiez surtout:
    # error_page + location = /offline.html + proxy_intercept_errors.

    error_page 502 503 504 /offline.html;

    location = /offline.html {
        root /var/www/puissance4-offline;
        internal;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;
    }
}
